<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seatly 3.2</title>

<style>

*{
box-sizing:border-box
}

:root{

--bg:#f5f3ef;
--paper:#fff;
--ink:#1f1f1f;
--muted:#777;
--line:#e6e0d8;
--soft:#f2eee9;
--green:#dff3e4;
--greenBorder:#33764a;
--danger:#a43a32;

}

html,
body{

margin:0;
height:100%;

font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:var(--bg);
color:var(--ink);

}

body{
overflow:hidden
}

button,
input,
select{

font:inherit

}

button{

border:0;
border-radius:10px;
padding:9px 11px;

background:var(--ink);
color:#fff;

font-weight:700;

cursor:pointer;

}

button.secondary{

background:#fff;
color:var(--ink);
border:1px solid var(--line);

}

button.soft{

background:var(--soft);
color:var(--ink);

}

button.danger{

background:var(--danger);

}


/* TOP */

.topbar{

height:58px;

background:#fff;

border-bottom:1px solid var(--line);

display:flex;

align-items:center;
justify-content:space-between;

padding:0 14px;

position:relative;
z-index:100;

}

.logo{

font-size:25px;
font-weight:900;
letter-spacing:-1px;

}

.logo span{

font-weight:400;

}


/* APP */

.app{

height:calc(100vh - 58px);

display:grid;

grid-template-columns:
64px
250px
1fr;

}


/* LEFT TOOLBAR */

.rail{

background:#1f1f1f;

padding:7px 4px;

display:flex;
flex-direction:column;

gap:5px;

z-index:80;

}

.rail button{

height:56px;

background:transparent;

padding:4px;

font-size:9px;

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

gap:3px;

}

.rail button b{

font-size:17px;

}

.rail button.active{

background:#fff;
color:#1f1f1f;

}


/* SIDE PANEL */

.panel{

background:#fff;

border-right:1px solid var(--line);

padding:14px;

overflow:auto;

position:relative;

z-index:70;

}

.panel h2{

font-size:18px;
margin:0 0 4px;

}

.hint{

font-size:12px;
color:var(--muted);

line-height:1.4;

margin-bottom:12px;

}

.grid2{

display:grid;
grid-template-columns:1fr 1fr;
gap:7px;

}

.field{

width:100%;

padding:10px;

border:1px solid #d8d1c9;

border-radius:10px;

background:#fff;

}

.section{

border-top:1px solid #eee8e1;

padding-top:11px;
margin-top:11px;

}

.upload{

display:block;

text-align:center;

padding:18px 10px;

border:1.5px dashed #bbb;

border-radius:13px;

background:#faf9f7;

cursor:pointer;

}

.upload input{

display:none;

}

.panelClose{

display:none;

}


/* WORK */

.work{

padding:8px;

background:#ebe8e3;

min-width:0;

}

.canvas{

width:100%;
height:100%;

background:#fff;

border:1px solid var(--line);

border-radius:16px;

position:relative;

overflow:hidden;

touch-action:none;

box-shadow:
0 10px 28px rgba(0,0,0,.05);

}


/* STAGE */

.stage{

position:absolute;

inset:0;

transform-origin:0 0;

}

.venueBackground{

position:absolute;

inset:0;

background:#fff center/contain no-repeat;

pointer-events:none;

}

.objectLayer{

position:absolute;

inset:0;

}

.empty{

position:absolute;

inset:0;

display:grid;

place-items:center;

text-align:center;

color:#999;

pointer-events:none;

}


/* OBJECTS */

.obj{

position:absolute;

touch-action:none;
user-select:none;

}


/* TABLE */

.table{

width:104px;
height:104px;

display:flex;

align-items:center;
justify-content:center;

cursor:grab;

}

.table.selected{

outline:3px solid rgba(31,31,31,.18);
outline-offset:4px;

}

.tableCore{

width:64px;
height:64px;

border:2px solid #222;

border-radius:50%;

background:#fff;

display:flex;

flex-direction:column;

align-items:center;
justify-content:center;

box-shadow:
0 4px 12px rgba(0,0,0,.14);

z-index:2;

}

.tableCore b{

font-size:10px;

}

.tableCore span{

font-size:9px;
color:#666;

margin-top:2px;

}

.table.complete .tableCore{

background:var(--green);
border-color:var(--greenBorder);

}

.chair{

position:absolute;

width:12px;
height:12px;

border:1.3px solid #555;

background:#fff;

border-radius:3px;

}


/* OTHER OBJECTS */

.venueObj{

border:2px dashed #666;

background:rgba(255,255,255,.9);

border-radius:12px;

display:flex;

align-items:center;
justify-content:center;

font-size:11px;

font-weight:800;

cursor:grab;

}

.venueObj.selected{

outline:3px solid rgba(31,31,31,.18);
outline-offset:4px;

}


/* CONTEXT TOOLBAR */

.context{

position:absolute;

left:50%;
top:10px;

transform:translateX(-50%);

display:none;

align-items:center;

gap:5px;

background:#fff;

border:1px solid var(--line);

border-radius:12px;

padding:6px;

z-index:30;

box-shadow:
0 8px 24px rgba(0,0,0,.14);

}

.context input,
.context select{

width:68px;

padding:6px;

border:1px solid var(--line);

border-radius:8px;

}

.context button{

padding:6px 8px;

}


/* ZOOM */

.zoom{

position:absolute;

right:10px;
bottom:10px;

display:flex;

gap:4px;

background:#fff;

border:1px solid var(--line);

border-radius:11px;

padding:4px;

z-index:25;

}

.zoom button{

padding:6px 9px;

}


/* STATUS */

.status{

position:absolute;

left:10px;
bottom:10px;

background:#fff;

border:1px solid var(--line);

border-radius:999px;

padding:6px 9px;

font-size:10px;

color:#666;

z-index:25;

}


/* TRASH */

.trash{

position:absolute;

left:50%;
bottom:58px;

transform:translateX(-50%);

display:none;

background:#fff;

border:2px solid var(--line);

border-radius:999px;

padding:9px 15px;

z-index:35;

font-size:12px;
font-weight:800;

}

.trash.hot{

background:#ffe7e3;

border-color:#b23b30;

}


/* GUEST PANEL */

.guestPanel{

position:fixed;

top:58px;
right:0;
bottom:0;

width:330px;

background:#fff;

border-left:1px solid var(--line);

box-shadow:
-10px 0 30px rgba(0,0,0,.12);

z-index:95;

display:none;

padding:16px;

overflow:auto;

}

.guestPanel.open{

display:block;

}

.guestHeader{

display:flex;

align-items:flex-start;

justify-content:space-between;

gap:10px;

margin-bottom:14px;

}

.guestTitle{

font-size:20px;
font-weight:850;

}

.guestCount{

font-size:12px;
color:#777;

margin-top:3px;

}


/* ADD GUEST */

.addGuestBox{

background:#faf9f7;

border:1px solid var(--line);

border-radius:14px;

padding:12px;

}

.addGuestBox label{

display:block;

font-size:11px;
font-weight:700;

margin-bottom:6px;

color:#666;

}

.addGuestActions{

display:grid;

grid-template-columns:1fr auto;

gap:6px;

}


/* TABLE GUEST LIST */

.guestListTitle{

font-size:13px;
font-weight:800;

margin:15px 0 5px;

}

.guestRow{

display:grid;

grid-template-columns:1fr auto;

gap:7px;

align-items:center;

padding:9px 0;

border-bottom:1px solid #eee;

}

.guestName{

font-size:13px;
font-weight:700;

}

.guestActions{

display:flex;

gap:4px;

}

.guestActions button{

padding:5px 7px;

font-size:11px;

}


/* LISTS */

.tableListCard{

border:1px solid var(--line);

border-radius:13px;

padding:10px;

margin-bottom:9px;

background:#faf9f7;

}

.tableListHeader{

display:flex;

align-items:center;

justify-content:space-between;

gap:8px;

margin-bottom:7px;

}

.tableListHeader strong{

font-size:14px;

}

.tableListCount{

font-size:11px;

color:#777;

}

.listGuest{

display:grid;

grid-template-columns:1fr auto;

gap:6px;

align-items:center;

padding:7px 0;

border-top:1px solid #eee;

}

.listGuestName{

font-size:12px;
font-weight:650;

}

.listGuestActions{

display:flex;

gap:4px;

}

.listGuestActions button{

padding:5px 6px;

font-size:10px;

}


/* MOBILE */

@media(max-width:800px){

.topbar{

height:54px;

}

.app{

height:calc(100vh - 54px);

grid-template-columns:
56px
1fr;

}

.rail{

padding:5px 3px;

}

.rail button{

height:50px;

}

.work{

grid-column:2;

padding:4px;

}

.panel{

position:fixed;

left:56px;
right:0;
bottom:0;
top:auto;

width:auto;

max-height:48vh;

display:none;

border-right:0;

border-top:1px solid var(--line);

border-radius:18px 18px 0 0;

padding:48px 13px 13px;

box-shadow:
0 -10px 30px rgba(0,0,0,.18);

z-index:90;

}

.panel.open{

display:block;

}

.panelClose{

display:block;

position:absolute;

right:10px;
top:8px;

width:34px;
height:34px;

padding:0;

border-radius:50%;

background:var(--soft);

color:#222;

border:1px solid var(--line);

font-size:20px;

}

.context{

max-width:94%;

overflow:auto;

white-space:nowrap;

}

.guestPanel{

top:54px;

left:56px;
right:0;
bottom:0;

width:auto;

border-left:0;

box-shadow:none;

padding:14px;

}

}

</style>
</head>


<body>


<header class="topbar">

<div class="logo">
seat<span>ly</span>
</div>

<button

Guests at this table

<div
id="toast"
style="
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:#222;
color:white;
padding:9px 13px;
border-radius:10px;
display:none;
z-index:150
">
</div>



<script>


let S={

venue:null,

tables:[],

guests:[],

objects:[],

view:{
scale:1,
x:0,
y:0
}

};


let selected=null;

let activePanel=null;

let activeGuestTable=null;


const $=
id=>document.getElementById(id);


const canvas=
$('canvas');


const stage=
$('stage');


const venueBackground=
$('venueBackground');


const objectLayer=
$('objectLayer');


const context=
$('context');


const trash=
$('trash');


const mobile=
()=>window.innerWidth<=800;


const uid=()=>{

if(
window.crypto &&
crypto.randomUUID
){

return crypto.randomUUID();

}

return String(
Date.now()+Math.random()
);

};



/* ==========================
   SAVE / LOAD
========================== */


function save(){

try{

localStorage.setItem(
'seatly32',
JSON.stringify(S)
);

}catch(e){}

updateStatus();

}


function load(){

try{

const old=

localStorage.getItem('seatly32')

||

localStorage.getItem('seatly31')

||

localStorage.getItem('seatly30')

||

localStorage.getItem('seatly23');


if(old){

const data=
JSON.parse(old);


S.venue=
data.venue||null;


S.tables=
data.tables||[];


S.guests=
data.guests||[];


S.objects=
data.objects||
data.objs||
data.venueObjects||
[];


S.view=
data.view||
{
scale:1,
x:0,
y:0
};

}

}catch(e){}


applyVenue();

render();

}



/* ==========================
   SMART TABLE NUMBER
========================== */


function nextTableNumber(){

const used=

S.tables
.map(
table=>Number(table.number)
)
.filter(
number=>number>0
);


let number=1;


while(
used.includes(number)
){

number++;

}


return number;

}



/* ==========================
   PANELS
========================== */


function setActive(type){

[
'Venue',
'Tables',
'Objects',
'Lists'
]

.forEach(name=>{

$('nav'+name)
.classList
.toggle(

'active',

name.toLowerCase()===type

);

});

}


function closePanel(){

$('panel')
.classList
.remove('open');


activePanel=null;


setActive('');

}


function togglePanel(type){

if(

mobile()

&&

activePanel===type

&&

$('panel')
.classList
.contains('open')

){

closePanel();

return;

}


activePanel=
type;


setActive(type);


$('panel')
.classList
.add('open');


if(type==='venue'){

renderVenuePanel();

}


if(type==='tables'){

renderTablesPanel();

}


if(type==='objects'){

renderObjectsPanel();

}


if(type==='lists'){

renderListsPanel();

}

}


function afterPanelAction(){

if(mobile()){

closePanel();

}

}



/* ==========================
   VENUE
========================== */


function renderVenuePanel(){

$('panelContent')
.innerHTML=`

<h2>
Venue
</h2>


<div class="hint">

Upload your venue.

Zoom only using − / Fit / +.

</div>


<label class="upload">

📷

<br>

<b>

${S.venue
?'Replace venue'
:'Upload venue'}

</b>


<input
id="venueFile"
type="file"
accept="image/*">

</label>


${S.venue

?`

<button
class="secondary"
style="width:100%;margin-top:7px"
onclick="removeVenue()">

Remove venue

</button>

`

:''}

`;


$('venueFile')
.onchange=e=>{

const file=
e.target.files[0];


if(!file)return;


const reader=
new FileReader();


reader.onload=x=>{

S.venue=
x.target.result;


applyVenue();

render();

save();

afterPanelAction();

};


reader.readAsDataURL(file);

};

}


function applyVenue(){

venueBackground
.style
.backgroundImage=

S.venue

?`url("${S.venue}")`

:'none';

}


function removeVenue(){

S.venue=null;

applyVenue();

render();

save();

renderVenuePanel();

}



/* ==========================
   TABLES
========================== */


function renderTablesPanel(){

$('panelContent')
.innerHTML=`

<h2>
Tables
</h2>


<div class="hint">

Add a table.

Deleted table numbers are automatically reused.

</div>


<div class="grid2">


<button
class="soft"
onclick="addTable(8)">

8 seats

</button>


<button
class="soft"
onclick="addTable(10)">

10 seats

</button>


<button
class="soft"
onclick="addTable(12)">

12 seats

</button>


<button
class="soft"
onclick="addTable(16)">

16 seats

</button>


</div>


<div class="section">

<b>
Add multiple
</b>


<input
id="multipleQty"
class="field"
type="number"
min="1"
max="50"
value="5"
style="margin-top:7px">


<select
id="multipleSeats"
class="field"
style="margin-top:7px">

<option>8</option>

<option selected>
10
</option>

<option>12</option>

<option>16</option>

</select>


<button
style="width:100%;margin-top:7px"
onclick="addMultipleTables()">

Add tables

</button>

</div>

`;

}


function addTable(seats){

const number=
nextTableNumber();


const index=
S.tables.length;


S.tables.push({

id:uid(),

number:number,

seats:seats,

x:
70+
(index%5)*115,

y:
85+
Math.floor(index/5)*110,

scale:1

});


render();

save();

afterPanelAction();

}


function addMultipleTables(){

const qty=

Math.max(

1,

Math.min(

50,

+$('multipleQty').value||1

)

);


const seats=
+$('multipleSeats').value;


for(
let i=0;
i<qty;
i++
){

const number=
nextTableNumber();


const index=
S.tables.length;


S.tables.push({

id:uid(),

number:number,

seats:seats,

x:
70+
(index%5)*115,

y:
85+
Math.floor(index/5)*110,

scale:1

});

}


render();

save();

afterPanelAction();

}



/* ==========================
   OBJECTS
========================== */


function renderObjectsPanel(){

$('panelContent')
.innerHTML=`

<h2>
Venue Objects
</h2>


<div class="hint">
Only the essentials.
</div>


<div class="grid2">


<button
class="soft"
onclick="addObject('Dance Floor',160,160)">

Dance Floor

</button>


<button
class="soft"
onclick="addObject('DJ',110,55)">

DJ

</button>


<button
class="soft"
onclick="addObject('Bar',130,55)">

Bar

</button>


<button
class="soft"
onclick="addObject('Stage',150,65)">

Stage

</button>


</div>

`;

}


function addObject(
label,
width,
height
){

const index=
S.objects.length;


S.objects.push({

id:uid(),

label:label,

width:width,

height:height,

x:
180+
index*25,

y:
160+
index*20,

scale:1

});


render();

save();

afterPanelAction();

}



/* ==========================
   LISTS
========================== */


function renderListsPanel(){

const sortedTables=

S.tables
.slice()
.sort(
(a,b)=>a.number-b.number
);


const cards=

sortedTables

.map(table=>{

const guests=

S.guests.filter(
guest=>guest.tableId===table.id
);


const guestRows=

guests.length

?

guests
.slice()
.sort(
(a,b)=>
a.name.localeCompare(b.name)
)

.map(guest=>`

<div class="listGuest">

<div class="listGuestName">

${safe(guest.name)}

</div>


<div class="listGuestActions">

<button
class="secondary"
onclick="editListGuest('${guest.id}')">

Edit

</button>


<button
class="secondary"
onclick="moveListGuest('${guest.id}')">

Move

</button>


<button
class="danger"
onclick="unassignListGuest('${guest.id}')">

×

</button>

</div>

</div>

`).join('')

:

`

<div class="hint" style="margin:4px 0 0">

No guests yet.

</div>

`;


return `

<div
class="tableListCard"
data-search="
table ${table.number}
${guests.map(g=>g.name).join(' ')}
">

<div class="tableListHeader">

<div>

<strong>

Table ${table.number}

</strong>

<div class="tableListCount">

${guests.length}/${table.seats} guests

</div>

</div>


<button
class="secondary"
onclick="openTableGuests('${table.id}')">

Open

</button>

</div>


${guestRows}


</div>

`;

})
.join('');


$('panelContent')
.innerHTML=`

<h2>
Seating Lists
</h2>


<div class="hint">

Every table with its full guest list.

Edit, move or remove guests here.

</div>


<input
id="listSearch"
class="field"
placeholder="Search guest or table..."
oninput="filterLists(this.value)">


<div class="section">

${cards||

'<div class="hint">No tables yet.</div>'}

</div>

`;

}


function filterLists(value){

const query=
value.toLowerCase();


document
.querySelectorAll('.tableListCard')

.forEach(card=>{

card.style.display=

card
.dataset
.search
.toLowerCase()
.includes(query)

?'block'

:'none';

});

}



/* ==========================
   CHAIRS
========================== */


function createChairs(
element,
count
){

const seats=
Math.min(
count,
16
);


const radius=43;


for(
let i=0;
i<seats;
i++
){

const angle=

2*
Math.PI*
i/seats

-

Math.PI/2;


const chair=
document.createElement('div');


chair.className=
'chair';


chair.style.left=

(
52+
Math.cos(angle)*radius-
6
)

+'px';


chair.style.top=

(
52+
Math.sin(angle)*radius-
6
)

+'px';


element.appendChild(
chair
);

}

}



/* ==========================
   RENDER
========================== */


function render(){

objectLayer.innerHTML='';


S.tables.forEach(table=>{

const guestCount=

S.guests.filter(
guest=>guest.tableId===table.id
).length;


const element=
document.createElement('div');


element.className=

'obj table'

+

(
guestCount===table.seats
?' complete'
:''
)

+

(
selected?.id===table.id
?' selected'
:''
);


element.style.left=
table.x+'px';


element.style.top=
table.y+'px';


element.style.transform=

`scale(${table.scale||1})`;


createChairs(
element,
table.seats
);


const core=
document.createElement('div');


core.className=
'tableCore';


core.innerHTML=

`

<b>
TABLE ${table.number}
</b>

<span>
${guestCount}/${table.seats}
</span>

`;


element.appendChild(
core
);


attachDrag(
element,
table,
'table'
);


objectLayer.appendChild(
element
);

});


S.objects.forEach(item=>{

const element=
document.createElement('div');


element.className=

'obj venueObj'

+

(
selected?.id===item.id
?' selected'
:''
);


element.style.left=
item.x+'px';


element.style.top=
item.y+'px';


element.style.width=
item.width+'px';


element.style.height=
item.height+'px';


element.style.transform=

`scale(${item.scale||1})`;


element.textContent=
item.label;


attachDrag(
element,
item,
'object'
);


objectLayer.appendChild(
element
);

});


$('empty')
.style.display=

(
S.venue

||

S.tables.length

||

S.objects.length
)

?'none'

:'grid';


applyView();

renderContext();

updateStatus();

}



/* ==========================
   TAP / DRAG
========================== */


function attachDrag(
element,
item,
kind
){

let startX;
let startY;

let originalX;
let originalY;

let active=false;


element.onpointerdown=e=>{

e.stopPropagation();


selected={

id:item.id,

kind:kind

};


document
.querySelectorAll('.obj')
.forEach(
item=>
item.classList.remove('selected')
);


element
.classList
.add('selected');


renderContext();


startX=
e.clientX;


startY=
e.clientY;


originalX=
item.x;


originalY=
item.y;


active=true;


trash.style.display=
'block';


try{

element.setPointerCapture(
e.pointerId
);

}catch(_){}

};


element.onpointermove=e=>{

if(!active)return;


item.x=

originalX+

(
e.clientX-startX
)

/

S.view.scale;


item.y=

originalY+

(
e.clientY-startY
)

/

S.view.scale;


element.style.left=
item.x+'px';


element.style.top=
item.y+'px';


const rect=
trash.getBoundingClientRect();


const over=

e.clientX>=rect.left

&&

e.clientX<=rect.right

&&

e.clientY>=rect.top

&&

e.clientY<=rect.bottom;


trash
.classList
.toggle(
'hot',
over
);

};


element.onpointerup=()=>{

if(!active)return;


active=false;


const shouldDelete=

trash
.classList
.contains('hot');


trash.style.display=
'none';


trash
.classList
.remove('hot');


if(
shouldDelete
){

deleteCanvasItem(
item.id,
kind
);

return;

}


/*
IMPORTANT:
Tap only selects.
Guest panel DOES NOT open automatically.
*/


save();

};


element.onpointercancel=()=>{

active=false;

trash.style.display=
'none';

trash
.classList
.remove('hot');

};

}



/* ==========================
   DELETE
========================== */


function deleteCanvasItem(
id,
kind
){

if(
kind==='table'
){

S.guests.forEach(
guest=>{

if(
guest.tableId===id
){

guest.tableId=null;

}

});


S.tables=

S.tables.filter(
table=>table.id!==id
);

}

else{

S.objects=

S.objects.filter(
object=>object.id!==id
);

}


if(
activeGuestTable===id
){

closeGuestPanel();

}


selected=null;


render();

save();


if(
activePanel==='lists'
){

renderListsPanel();

}

}



/* ==========================
   TABLE TOOLBAR
========================== */


function renderContext(){

if(!selected){

context.style.display=
'none';

return;

}


const item=

selected.kind==='table'

?

S.tables.find(
table=>table.id===selected.id
)

:

S.objects.find(
object=>object.id===selected.id
);


if(!item){

selected=null;

context.style.display=
'none';

return;

}


if(
selected.kind==='table'
){

const guestCount=

S.guests.filter(
guest=>guest.tableId===item.id
).length;


context.innerHTML=`

<b>
Table
</b>


<input
id="tableNumberInput"
type="number"
min="1"
value="${item.number}">


<select id="tableSeatsInput">

${[8,10,12,16]

.map(
seats=>

`<option ${seats===item.seats?'selected':''}>
${seats}
</option>`

)

.join('')}

</select>


<span>
${guestCount}/${item.seats}
</span>


<button
class="secondary"
onclick="saveTableSettings()">

✓

</button>


<button
onclick="openTableGuests('${item.id}')">

Guests

</button>


<button
class="secondary"
onclick="resizeSelected(.9)">

−

</button>


<button
class="secondary"
onclick="resizeSelected(1.1)">

＋

</button>

`;

}

else{

context.innerHTML=`

<b>
${item.label}
</b>


<button
class="secondary"
onclick="resizeSelected(.9)">

−

</button>


<button
class="secondary"
onclick="resizeSelected(1.1)">

＋

</button>

`;

}


context.style.display=
'flex';

}



/* ==========================
   TABLE SETTINGS
========================== */


function saveTableSettings(){

const table=

S.tables.find(
table=>table.id===selected.id
);


if(!table)return;


const newNumber=

Math.max(

1,

+$('tableNumberInput').value||1

);


const duplicate=

S.tables.find(
other=>

other.id!==table.id

&&

other.number===newNumber

);


if(duplicate){

toast(
'That table number already exists'
);

return;

}


const newSeats=
+$('tableSeatsInput').value;


const currentGuests=

S.guests.filter(
guest=>guest.tableId===table.id
).length;


if(
newSeats<currentGuests
){

toast(

`Table already has ${currentGuests} guests`

);

return;

}


table.number=
newNumber;


table.seats=
newSeats;


render();

save();


if(
activeGuestTable===table.id
){

refreshTableGuests();

}


if(
activePanel==='lists'
){

renderListsPanel();

}

}



/* ==========================
   RESIZE
========================== */


function resizeSelected(multiplier){

if(!selected)return;


const list=

selected.kind==='table'

?S.tables

:S.objects;


const item=

list.find(
item=>item.id===selected.id
);


if(!item)return;


item.scale=

Math.max(

.55,

Math.min(

2,

(item.scale||1)
*
multiplier

)

);


render();

save();

}



/* ==========================
   CANVAS TAP
========================== */


canvas.addEventListener(

'pointerdown',

e=>{

if(mobile()){

closePanel();

}


if(

e.target===canvas

||

e.target===stage

||

e.target===objectLayer

){

selected=null;


renderContext();


document
.querySelectorAll('.obj')
.forEach(
item=>
item.classList.remove('selected')
);

}

}

);



/* ==========================
   SIMPLE ZOOM
========================== */


function applyView(){

stage.style.transform=

`translate(${S.view.x}px,${S.view.y}px) scale(${S.view.scale})`;

}


function fitView(){

S.view={

scale:1,
x:0,
y:0

};


applyView();

save();

}


function zoomIn(){

S.view.scale=

Math.min(

2.5,

S.view.scale*
1.15

);


applyView();

save();

}


function zoomOut(){

S.view.scale=

Math.max(

.5,

S.view.scale*
.87

);


applyView();

save();

}



/* ==========================
   TABLE GUEST PANEL
========================== */


function openTableGuests(tableId){

const table=

S.tables.find(
table=>table.id===tableId
);


if(!table)return;


activeGuestTable=
tableId;


closePanel();


$('guestPanel')
.classList
.add('open');


refreshTableGuests();


setTimeout(
()=>{

$('newGuestName')
.focus();

},
100
);

}


function closeGuestPanel(){

$('guestPanel')
.classList
.remove('open');


activeGuestTable=
null;

}


function refreshTableGuests(){

const table=

S.tables.find(
table=>table.id===activeGuestTable
);


if(!table){

closeGuestPanel();

return;

}


const guests=

S.guests.filter(
guest=>guest.tableId===table.id
);


$('guestPanelTitle')
.textContent=

`Table ${table.number}`;


$('guestPanelCount')
.textContent=

`${guests.length} of ${table.seats} seats filled`;


$('tableGuestsList')
.innerHTML=

guests.length

?

guests

.slice()

.sort(
(a,b)=>
a.name.localeCompare(b.name)
)

.map(
guest=>

`

<div class="guestRow">

<div class="guestName">

${safe(guest.name)}

</div>


<div class="guestActions">

<button
class="secondary"
onclick="renameGuest('${guest.id}')">

Edit

</button>


<button
class="danger"
onclick="removeGuest('${guest.id}')">

×

</button>

</div>

</div>

`

)

.join('')

:

`

<div class="hint">

No guests yet.

</div>

`;

}



/* ==========================
   ADD GUEST
========================== */


function addGuestToCurrentTable(){

const table=

S.tables.find(
table=>table.id===activeGuestTable
);


if(!table)return;


const input=
$('newGuestName');


const name=
input.value.trim();


if(!name)return;


const count=

S.guests.filter(
guest=>guest.tableId===table.id
).length;


if(
count>=table.seats
){

toast(
'Table is full'
);

return;

}


S.guests.push({

id:uid(),

name:name,

tableId:table.id

});


input.value='';


refreshTableGuests();

render();

save();


if(
activePanel==='lists'
){

renderListsPanel();

}


input.focus();

}


$('newGuestName')
.addEventListener(

'keydown',

e=>{

if(
e.key==='Enter'
){

addGuestToCurrentTable();

}

}

);



/* ==========================
   EDIT GUEST
========================== */


function renameGuest(id){

const guest=

S.guests.find(
guest=>guest.id===id
);


if(!guest)return;


const name=

prompt(
'Surname & Name',
guest.name
);


if(
name===null

||

!name.trim()
){

return;

}


guest.name=
name.trim();


refreshTableGuests();

render();

save();

}



/* ==========================
   REMOVE FROM TABLE
========================== */


function removeGuest(id){

const guest=

S.guests.find(
guest=>guest.id===id
);


if(!guest)return;


guest.tableId=
null;


refreshTableGuests();

render();

save();

}



/* ==========================
   LIST EDIT
========================== */


function editListGuest(id){

const guest=

S.guests.find(
guest=>guest.id===id
);


if(!guest)return;


const name=

prompt(
'Surname & Name',
guest.name
);


if(
name===null

||

!name.trim()
){

return;

}


guest.name=
name.trim();


render();

save();

renderListsPanel();

}



/* ==========================
   MOVE GUEST
========================== */


function moveListGuest(id){

const guest=

S.guests.find(
guest=>guest.id===id
);


if(!guest)return;


const currentTable=

S.tables.find(
table=>table.id===guest.tableId
);


const answer=

prompt(

'Move to table number',

currentTable
?currentTable.number
:''

);


if(
answer===null
){

return;

}


if(
!answer.trim()
){

guest.tableId=null;

render();

save();

renderListsPanel();

return;

}


const table=

S.tables.find(
table=>
String(table.number)
===answer.trim()
);


if(!table){

toast(
'Table not found'
);

return;

}


const currentCount=

S.guests.filter(
other=>

other.tableId===table.id

&&

other.id!==guest.id

).length;


if(
currentCount>=table.seats
){

toast(
'Table is full'
);

return;

}


guest.tableId=
table.id;


render();

save();

renderListsPanel();

}



/* ==========================
   UNASSIGN
========================== */


function unassignListGuest(id){

const guest=

S.guests.find(
guest=>guest.id===id
);


if(!guest)return;


guest.tableId=
null;


render();

save();

renderListsPanel();

}



/* ==========================
   STATUS
========================== */


function updateStatus(){

const seated=

S.guests.filter(
guest=>guest.tableId
).length;


const fullTables=

S.tables.filter(

table=>

S.guests.filter(
guest=>guest.tableId===table.id
).length

===

table.seats

).length;


$('status')
.textContent=

`${S.tables.length} tables · ${seated}/${S.guests.length} seated · ${fullTables} complete`;

}



/* ==========================
   HELPERS
========================== */


function toast(message){

const element=
$('toast');


element.textContent=
message;


element.style.display=
'block';


clearTimeout(
window.toastTimer
);


window.toastTimer=

setTimeout(

()=>{

element.style.display=
'none';

},

1700

);

}


function safe(text){

const div=
document.createElement('div');


div.textContent=
text||'';


return div.innerHTML;

}



/* ==========================
   START
========================== */


load();


</script>
