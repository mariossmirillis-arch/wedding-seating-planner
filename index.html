<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seatly V4.2</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui,-apple-system,sans-serif;
background:#f6f3ef;
color:#222
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
position:sticky;
top:0;
z-index:30
}

.logo{
font-size:24px;
font-weight:800
}

.logo span{
font-weight:400
}

button{
border:0;
border-radius:10px;
padding:10px 12px;
background:#222;
color:#fff;
font-weight:700;
cursor:pointer
}

.sec{
background:#fff;
color:#222;
border:1px solid #ddd
}

.soft{
background:#eee;
color:#222
}

.app{
display:grid;
grid-template-columns:340px 1fr;
min-height:calc(100vh - 64px)
}

aside{
background:#fff;
border-right:1px solid #ddd;
padding:16px;
overflow:auto
}

main{
padding:12px;
min-width:0
}

.section{
padding-bottom:15px;
margin-bottom:15px;
border-bottom:1px solid #eee
}

h2{
font-size:16px;
margin:0 0 9px
}

.small{
font-size:12px;
color:#777
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.row{
display:flex;
gap:7px;
align-items:center;
flex-wrap:wrap
}

input{
border:1px solid #ccc;
border-radius:9px;
padding:10px;
font:inherit
}

.upload{
display:block;
border:1.5px dashed #bbb;
border-radius:12px;
padding:16px;
text-align:center;
background:#faf9f7;
cursor:pointer
}

.upload input{
display:none
}

/* WORK AREA */

.shell{
height:calc(100vh - 135px);
min-height:520px;
background:#fff;
border:1px solid #ccc;
border-radius:15px;
position:relative;
overflow:hidden;
touch-action:none
}

/* BACKGROUND NEVER ZOOMS */

.fixedBackground{
position:absolute;
inset:0;
background:#fff center/contain no-repeat;
z-index:0;
pointer-events:none
}

.overlay{
position:absolute;
inset:0;
z-index:2
}

.empty{
position:absolute;
inset:0;
display:grid;
place-items:center;
color:#999;
text-align:center;
pointer-events:none
}

/* OBJECTS */

.obj{
position:absolute;
user-select:none;
touch-action:none;
cursor:pointer
}

/* default = locked */

.obj:not(.selected){
cursor:pointer
}

/* selected object */

.obj.selected{
outline:3px solid rgba(40,40,40,.35);
outline-offset:5px
}

/* TABLE */

.tableWrap{
width:110px;
height:110px;
display:flex;
align-items:center;
justify-content:center
}

.tableCore{
width:70px;
height:70px;
border:2px solid #222;
border-radius:50%;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
box-shadow:0 4px 12px #0002;
z-index:2
}

.tableCore strong{
font-size:11px
}

.tableCore span{
font-size:10px;
color:#666
}

.tableWrap.complete .tableCore{
background:#dff3e4;
border-color:#2f7d47
}

.tableWrap.over .tableCore{
background:#ffe6e3;
border-color:#b53a2d
}

/* CHAIRS */

.chair{
position:absolute;
width:14px;
height:14px;
border:1.5px solid #555;
background:#fff;
border-radius:3px
}

.tableWrap.complete .chair{
border-color:#2f7d47
}

.tableWrap.over .chair{
border-color:#b53a2d
}

/* VENUE ITEMS */

.vobj{
border:2px dashed #555;
background:#fff9;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:12px
}

/* SELECTED TOOLBAR */

.selectionTools{
position:absolute;
display:none;
z-index:20;
background:#fff;
border:1px solid #ddd;
border-radius:10px;
padding:5px;
gap:5px;
box-shadow:0 5px 16px #0002
}

.selectionTools button{
padding:6px 9px
}

.guest{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #eee;
font-size:13px;
cursor:pointer
}

.guest.sel{
font-weight:800
}

.badge{
font-size:11px;
background:#eee;
border-radius:999px;
padding:3px 7px
}

.modal{
position:fixed;
inset:0;
background:#0005;
display:none;
align-items:center;
justify-content:center;
z-index:100;
padding:15px
}

.card{
background:#fff;
border-radius:15px;
padding:20px;
width:min(430px,100%)
}

.card label{
display:block;
font-size:12px;
color:#666;
margin-top:8px
}

.card input{
width:100%;
margin-top:5px
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:12px
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#222;
color:#fff;
padding:10px 14px;
border-radius:10px;
display:none;
z-index:150
}

@media(max-width:860px){

.app{
grid-template-columns:1fr
}

aside{
border-right:0;
border-bottom:1px solid #ddd
}

.shell{
height:65vh;
min-height:470px
}

}
</style>

</head>

<body>

<header>

<div class="logo">
seat<span>ly</span>
</div>

<button>
Finish / Export
</button>

</header>

<div class="app">

<aside>

<div class="section">

<h2>1. Venue</h2>

<label class="upload">

📷 Upload screenshot / photo

<input
id="venueFile"
type="file"
accept="image/*">

</label>

<button
class="sec"
style="margin-top:7px"
onclick="removeVenue()">

Remove image

</button>

<div class="small" style="margin-top:6px">
Το background μένει πάντα κλειδωμένο.
</div>

</div>

<div class="section">

<h2>2. Tables</h2>

<div class="grid">

<button
class="soft"
onclick="addTable(8)">
+ 8 seats
</button>

<button
class="soft"
onclick="addTable(10)">
+ 10 seats
</button>

<button
class="soft"
onclick="addTable(12)">
+ 12 seats
</button>

<button
class="soft"
onclick="addTable(16)">
+ 16 seats
</button>

</div>

</div>

<div class="section">

<h2>3. Venue items</h2>

<div class="grid">

<button
class="soft"
onclick="addObj('Dance Floor')">
Dance Floor
</button>

<button
class="soft"
onclick="addObj('DJ')">
DJ
</button>

<button
class="soft"
onclick="addObj('Bar')">
Bar
</button>

<button
class="soft"
onclick="addObj('Stage')">
Stage
</button>

</div>

</div>

<div class="section">

<h2>4. Guests</h2>

<div class="row">

<input
id="guestName"
style="flex:1;min-width:0"
placeholder="Guest name">

<button onclick="addGuest()">
Add
</button>

</div>

<div id="guestList"></div>

</div>

</aside>

<main>

<div
class="row"
style="justify-content:space-between;margin-bottom:10px">

<div>

<b>Your venue</b>

<div
class="small"
id="status">
</div>

</div>

<button
class="sec"
onclick="deselectAll()">

Lock all

</button>

</div>

<div
class="shell"
id="shell">

<div
class="fixedBackground"
id="background">
</div>

<div
class="empty"
id="empty">

White canvas — upload venue or add tables.

</div>

<div
class="overlay"
id="overlay">
</div>

<div
class="selectionTools"
id="selectionTools">

<button
onclick="resizeSelected(1.1)">
＋
</button>

<button
onclick="resizeSelected(.9)">
−
</button>

<button
onclick="rotateSelected(15)">
↻
</button>

<button
class="sec"
onclick="deselectAll()">
Lock
</button>

</div>

</div>

</main>

</div>


<div
class="modal"
id="tableModal">

<div class="card">

<h2>Table settings</h2>

<label>Table number</label>

<input
id="tNum"
type="number"
min="1">

<label>Seats</label>

<input
id="tSeats"
type="number"
min="1">

<div class="actions">

<button onclick="saveTable()">
Save
</button>

<button
class="sec"
onclick="hide('tableModal')">
Cancel
</button>

</div>

</div>

</div>


<div
class="toast"
id="toast">
</div>


<script>

let S={

tables:[],

objects:[],

guests:[],

counter:0,

venue:null

};

let selected=null;

let selectedGuest=null;

let editingTable=null;


const shell=
document.getElementById(
'shell'
);

const overlay=
document.getElementById(
'overlay'
);

const bg=
document.getElementById(
'background'
);

const tools=
document.getElementById(
'selectionTools'
);


const uid=()=>{

if(
window.crypto &&
crypto.randomUUID
){

return crypto.randomUUID();

}

return String(
Date.now()+
Math.random()
);

};


function save(){

try{

localStorage.setItem(
'seatly_v42',
JSON.stringify(S)
);

}catch(e){}

updateStatus();

}


function load(){

try{

let x=
localStorage.getItem(
'seatly_v42'
);

if(x){

S=
Object.assign(
S,
JSON.parse(x)
);

}

}catch(e){}

applyVenue();

render();

}


function applyVenue(){

bg.style.backgroundImage=

S.venue

?

`url("${S.venue}")`

:

'none';

}


venueFile.onchange=e=>{

let file=
e.target.files[0];

if(!file)return;

let reader=
new FileReader();

reader.onload=x=>{

S.venue=
x.target.result;

applyVenue();

render();

save();

};

reader.readAsDataURL(
file
);

};


function removeVenue(){

S.venue=null;

applyVenue();

save();

}


/* TABLES */

function addTable(seats){

S.counter++;

let i=
S.tables.length;

S.tables.push({

id:uid(),

type:'table',

number:S.counter,

seats:seats,

scale:1,

rotation:0,

x:
60+
(i%5)*125,

y:
70+
Math.floor(i/5)*120

});

render();

save();

}


function openTable(id){

editingTable=id;

let table=
S.tables.find(
x=>x.id===id
);

tNum.value=
table.number;

tSeats.value=
table.seats;

show(
'tableModal'
);

}


function saveTable(){

let table=
S.tables.find(
x=>x.id===editingTable
);

table.number=
Math.max(
1,
+tNum.value||1
);

table.seats=
Math.max(
1,
+tSeats.value||1
);

hide(
'tableModal'
);

render();

save();

}


/* VENUE ITEMS */

function addObj(type){

let width=130;

let height=70;

if(
type==='Dance Floor'
){

width=170;

height=170;

}

S.objects.push({

id:uid(),

type:'object',

label:type,

w:width,

h:height,

scale:1,

rotation:0,

x:
220+
S.objects.length*30,

y:
180+
S.objects.length*25

});

render();

save();

}


/* GUESTS */

function addGuest(){

let name=
guestName.value.trim();

if(!name)return;

S.guests.push({

id:uid(),

name:name,

tableId:null

});

guestName.value='';

renderGuests();

save();

}


function renderGuests(){

guestList.innerHTML='';

S.guests.forEach(
guest=>{

let row=
document.createElement(
'div'
);

row.className=

'guest'

+

(
selectedGuest===guest.id
?
' sel'
:
''
);


let table=
S.tables.find(
x=>x.id===guest.tableId
);


row.innerHTML=

`<span>
${safe(guest.name)}
</span>

<span class="badge">
${table?'T'+table.number:'Unassigned'}
</span>`;


row.onclick=()=>{

selectedGuest=

selectedGuest===guest.id

?

null

:

guest.id;


renderGuests();

};


guestList.appendChild(
row
);

}
);

}


function assignGuest(tableId){

let guest=
S.guests.find(
x=>x.id===selectedGuest
);

let table=
S.tables.find(
x=>x.id===tableId
);

if(
!guest ||
!table
)return;


let count=
S.guests.filter(
x=>x.tableId===tableId
).length;


if(
count>=table.seats

&&

guest.tableId!==tableId
){

toast(
'Table is full'
);

return;

}


guest.tableId=
tableId;

selectedGuest=null;

render();

save();

}


/* CHAIRS */

function chairs(
wrap,
seats
){

let n=
Math.min(
seats,
16
);

let radius=47;


for(
let i=0;
i<n;
i++
){

let angle=

2*
Math.PI*
i/n

-

Math.PI/2;


let chair=
document.createElement(
'div'
);


chair.className=
'chair';


chair.style.left=

(
55+
Math.cos(angle)*radius
-
7
)
+'px';


chair.style.top=

(
55+
Math.sin(angle)*radius
-
7
)
+'px';


chair.style.transform=

`rotate(${
angle*180/Math.PI+90
}deg)`;


wrap.appendChild(
chair
);

}

}


/* SELECTION */

function selectItem(
type,
id,
element
){

selected={
type:type,
id:id
};


document

.querySelectorAll(
'.obj'
)

.forEach(
x=>
x.classList.remove(
'selected'
)
);


element.classList.add(
'selected'
);


positionTools(
element
);

}


function deselectAll(){

selected=null;

document

.querySelectorAll(
'.obj'
)

.forEach(
x=>
x.classList.remove(
'selected'
)
);


tools.style.display=
'none';

}


function positionTools(element){

let shellRect=
shell.getBoundingClientRect();
