<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seatly V4.1</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui,-apple-system,sans-serif;
background:#f6f3ef;
color:#222
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
position:sticky;
top:0;
z-index:30
}

.logo{
font-size:24px;
font-weight:800
}

.logo span{
font-weight:400
}

button{
border:0;
border-radius:10px;
padding:10px 12px;
background:#222;
color:#fff;
font-weight:700;
cursor:pointer
}

.sec{
background:#fff;
color:#222;
border:1px solid #ddd
}

.soft{
background:#eee;
color:#222
}

.app{
display:grid;
grid-template-columns:340px 1fr;
min-height:calc(100vh - 64px)
}

aside{
background:#fff;
border-right:1px solid #ddd;
padding:16px;
overflow:auto
}

main{
padding:12px;
min-width:0
}

.section{
padding-bottom:15px;
margin-bottom:15px;
border-bottom:1px solid #eee
}

h2{
font-size:16px;
margin:0 0 9px
}

.small{
font-size:12px;
color:#777
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.row{
display:flex;
gap:7px;
align-items:center;
flex-wrap:wrap
}

input,select,textarea{
border:1px solid #ccc;
border-radius:9px;
padding:10px;
font:inherit
}

textarea{
width:100%;
min-height:110px
}

.upload{
display:block;
border:1.5px dashed #bbb;
border-radius:12px;
padding:16px;
text-align:center;
background:#faf9f7;
cursor:pointer
}

.upload input{
display:none
}

/* WHITE WORK AREA */

.shell{
height:calc(100vh - 135px);
min-height:520px;
background:#fff;
border:1px solid #ccc;
border-radius:15px;
position:relative;
overflow:hidden;
touch-action:none
}

/* FIXED VENUE IMAGE */

.fixedBackground{
position:absolute;
inset:0;
background:#fff center/contain no-repeat;
z-index:0;
pointer-events:none
}

/* ONLY TABLES + OBJECTS ZOOM */

.overlayLayer{
position:absolute;
inset:0;
z-index:2;
transform-origin:0 0;
touch-action:none
}

.empty{
position:absolute;
inset:0;
display:grid;
place-items:center;
color:#999;
text-align:center;
z-index:1;
pointer-events:none
}

.obj{
position:absolute;
touch-action:none;
user-select:none;
cursor:grab
}

/* TABLE */

.tableWrap{
width:110px;
height:110px;
display:flex;
align-items:center;
justify-content:center
}

.tableCore{
width:70px;
height:70px;
border:2px solid #222;
border-radius:50%;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
box-shadow:0 4px 12px #0002;
z-index:2
}

.tableCore strong{
font-size:11px
}

.tableCore span{
font-size:10px;
color:#666
}

/* FULL TABLE */

.tableWrap.complete .tableCore{
background:#dff3e4;
border-color:#2f7d47
}

/* OVER CAPACITY */

.tableWrap.over .tableCore{
background:#ffe6e3;
border-color:#b53a2d
}

/* CHAIRS */

.chair{
position:absolute;
width:14px;
height:14px;
border:1.5px solid #555;
background:#fff;
border-radius:3px
}

.tableWrap.complete .chair{
border-color:#2f7d47
}

.tableWrap.over .chair{
border-color:#b53a2d
}

/* VENUE OBJECTS */

.vobj{
border:2px dashed #555;
background:#fff9;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:12px
}

.vobj.round{
border-radius:50%
}

.tools{
position:absolute;
right:10px;
top:10px;
z-index:10;
background:#fff;
border:1px solid #ddd;
border-radius:11px;
padding:6px;
display:flex;
gap:5px
}

.tools button{
padding:7px 9px
}

.guest{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #eee;
font-size:13px;
cursor:pointer
}

.guest.sel{
font-weight:800
}

.badge{
font-size:11px;
background:#eee;
border-radius:999px;
padding:3px 7px
}

.modal{
position:fixed;
inset:0;
background:#0005;
display:none;
align-items:center;
justify-content:center;
z-index:100;
padding:15px
}

.card{
background:#fff;
border-radius:15px;
padding:20px;
width:min(470px,100%);
max-height:90vh;
overflow:auto
}

.card label{
display:block;
font-size:12px;
color:#666;
margin-top:8px
}

.card input,
.card select{
width:100%;
margin-top:5px
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:12px
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#222;
color:#fff;
padding:10px 14px;
border-radius:10px;
display:none;
z-index:150
}

@media(max-width:860px){

.app{
grid-template-columns:1fr
}

aside{
border-right:0;
border-bottom:1px solid #ddd
}

.shell{
height:65vh;
min-height:470px
}

.tools{
display:none
}

}
</style>
</head>

<body>

<header>

<div class="logo">
seat<span>ly</span>
</div>

<button>
Finish / Export
</button>

</header>

<div class="app">

<aside>

<div class="section">

<h2>1. Venue</h2>

<label class="upload">

📷 Upload screenshot / photo

<input
id="venueFile"
type="file"
accept="image/*">

</label>

<button
class="sec"
style="margin-top:7px"
onclick="removeVenue()">

Remove image

</button>

<div
class="small"
style="margin-top:6px">

Χωρίς εικόνα το φόντο παραμένει λευκό.

</div>

</div>

<div class="section">

<h2>2. Tables</h2>

<div class="grid">

<button
class="soft"
onclick="addTable(8)">

+ 8 seats

</button>

<button
class="soft"
onclick="addTable(10)">

+ 10 seats

</button>

<button
class="soft"
onclick="addTable(12)">

+ 12 seats

</button>

<button
class="soft"
onclick="addTable(16)">

+ 16 seats

</button>

</div>

</div>

<div class="section">

<h2>3. Venue items</h2>

<div class="grid">

<button
class="soft"
onclick="addObj('Dance Floor')">

Dance Floor

</button>

<button
class="soft"
onclick="addObj('DJ')">

DJ

</button>

<button
class="soft"
onclick="addObj('Bar')">

Bar

</button>

<button
class="soft"
onclick="addObj('Stage')">

Stage

</button>

</div>

</div>

<div class="section">

<h2>4. Guests</h2>

<div class="row">

<input
id="guestName"
style="flex:1;min-width:0"
placeholder="Guest name">

<button onclick="addGuest()">
Add
</button>

</div>

<div id="guestList"></div>

</div>

</aside>

<main>

<div
class="row"
style="justify-content:space-between;margin-bottom:10px">

<div>

<b>Your venue</b>

<div
class="small"
id="status">
</div>

</div>

<div class="row">

<button
class="sec"
onclick="fit()">

Fit

</button>

<button
class="sec"
onclick="resetItems()">

Reset items

</button>

</div>

</div>

<div
class="shell"
id="shell">

<div
class="fixedBackground"
id="fixedBackground">
</div>

<div
class="empty"
id="empty">

White canvas — upload venue or start placing tables.

</div>

<div
class="overlayLayer"
id="overlayLayer">
</div>

<div class="tools">

<button
class="sec"
onclick="zoomCenter(.1)">

＋

</button>

<button
class="sec"
onclick="zoomCenter(-.1)">

−

</button>

</div>

</div>

</main>

</div>


<div
class="modal"
id="tableModal">

<div class="card">

<h2>Table settings</h2>

<label>Table number</label>

<input
id="tNum"
type="number"
min="1">

<label>Seats</label>

<input
id="tSeats"
type="number"
min="1">

<label>Size</label>

<input
id="tScale"
type="range"
min="50"
max="180">

<div class="actions">

<button onclick="saveTable()">
Save
</button>

<button
class="sec"
onclick="hide('tableModal')">

Cancel
</button>

</div>

</div>

</div>


<div
class="toast"
id="toast">
</div>


<script>

let S={

tables:[],

objects:[],

guests:[],

counter:0,

zoom:1,

panX:0,

panY:0,

venue:null

};

let selectedGuest=null;

let editingTable=null;


const shell=
document.getElementById(
'shell'
);

const overlay=
document.getElementById(
'overlayLayer'
);

const fixedBackground=
document.getElementById(
'fixedBackground'
);


const uid=()=>{

if(
window.crypto &&
crypto.randomUUID
){

return crypto.randomUUID();

}

return String(
Date.now()+
Math.random()
);

};


function save(){

try{

localStorage.setItem(
'seatly_v41',
JSON.stringify(S)
);

}catch(e){}

updateStatus();

}


function load(){

try{

let x=
localStorage.getItem(
'seatly_v41'
);

if(x){

S=
Object.assign(
S,
JSON.parse(x)
);

}

}catch(e){}

applyVenue();

render();

applyOverlayTransform();

}


function applyVenue(){

fixedBackground.style.backgroundImage=

S.venue

?

`url("${S.venue}")`

:

'none';

}


venueFile.onchange=e=>{

let file=
e.target.files[0];

if(!file)return;

let reader=
new FileReader();

reader.onload=x=>{

S.venue=
x.target.result;

applyVenue();

empty.style.display=
'none';

save();

};

reader.readAsDataURL(
file
);

};


function removeVenue(){

S.venue=null;

applyVenue();

empty.style.display=

(
S.tables.length
||
S.objects.length
)

?

'none'

:

'grid';

save();

}


/* TABLES */

function addTable(seats){

S.counter++;

let i=
S.tables.length;

S.tables.push({

id:uid(),

number:S.counter,

seats:seats,

scale:1,

x:
60+
(i%5)*125,

y:
70+
Math.floor(i/5)*120

});

render();

save();

}


function openTable(id){

editingTable=id;

let table=
S.tables.find(
x=>x.id===id
);

tNum.value=
table.number;

tSeats.value=
table.seats;

tScale.value=
Math.round(
(table.scale||1)*100
);

show(
'tableModal'
);

}


function saveTable(){

let table=
S.tables.find(
x=>x.id===editingTable
);

table.number=
Math.max(
1,
+tNum.value||1
);

table.seats=
Math.max(
1,
+tSeats.value||1
);

table.scale=
(+tScale.value||100)
/100;

hide(
'tableModal'
);

render();

save();

}


/* VENUE OBJECTS */

function addObj(type){

let width=130;

let height=70;

if(
type==='Dance Floor'
){

width=170;

height=170;

}

S.objects.push({

id:uid(),

type:type,

w:width,

h:height,

x:
220+
S.objects.length*30,

y:
180+
S.objects.length*25

});

render();

save();

}


/* GUESTS */

function addGuest(){

let name=
guestName.value.trim();

if(!name)return;

S.guests.push({

id:uid(),

name:name,

tableId:null

});

guestName.value='';

renderGuests();

save();

}


function renderGuests(){

guestList.innerHTML='';

S.guests.forEach(
guest=>{

let row=
document.createElement(
'div'
);

row.className=

'guest'

+

(
selectedGuest===guest.id
?
' sel'
:
''
);

let table=
S.tables.find(
x=>x.id===guest.tableId
);

row.innerHTML=

`<span>
${safe(guest.name)}
</span>

<span class="badge">
${table?'T'+table.number:'Unassigned'}
</span>`;

row.onclick=()=>{

selectedGuest=

selectedGuest===guest.id

?

null

:

guest.id;

renderGuests();

};

guestList.appendChild(
row
);

}
);

}


function assignGuest(tableId){

let guest=
S.guests.find(
x=>x.id===selectedGuest
);

let table=
S.tables.find(
x=>x.id===tableId
);

if(
!guest ||
!table
)return;

let count=
S.guests.filter(
x=>x.tableId===tableId
).length;

if(
count>=table.seats

&&

guest.tableId!==tableId
){

return toast(
'Table is full'
);

}

guest.tableId=
tableId;

selectedGuest=null;

render();

save();

}


/* CHAIRS */

function chairs(
wrap,
seats
){

let n=
Math.min(
seats,
16
);

let radius=47;

for(
let i=0;
i<n;
i++
){

let angle=

2*
Math.PI*
i/n

-

Math.PI/2;

let chair=
document.createElement(
'div'
);

chair.className=
'chair';

chair.style.left=

(
55+
Math.cos(angle)*radius
-
7
)
+'px';

chair.style.top=

(
55+
Math.sin(angle)*radius
-
7
)
+'px';

chair.style.transform=

`rotate(${
angle*180/Math.PI+90
}deg)`;

wrap.appendChild(
chair
);

}

}


/* DRAG OBJECTS */

function makeDraggable(
element,
item,
type
){

let startX;

let startY;

let originalX;

let originalY;

let active=false;

let moved=false;


element.onpointerdown=e=>{

active=true;

moved=false;

element.setPointerCapture(
e.pointerId
);

startX=
e.clientX;

startY=
e.clientY;

originalX=
item.x;

originalY=
item.y;

};


element.onpointermove=e=>{

if(!active)return;

let dx=
(e.clientX-startX)
/S.zoom;

let dy=
(e.clientY-startY)
/S.zoom;

if(
Math.abs(dx)+
Math.abs(dy)>4
){

moved=true;

}

item.x=
originalX+dx;

item.y=
originalY+dy;

element.style.left=
item.x+'px';

element.style.top=
item.y+'px';

};


element.onpointerup=()=>{

active=false;

if(moved){

save();

}

element.dataset.moved=

moved

?

'1'

:

'';

setTimeout(
()=>element.dataset.moved='',
70
);

};


element.onclick=()=>{

if(
element.dataset.moved==='1'
)return;

if(
type==='table'
){

if(selectedGuest){

assignGuest(
item.id
);

}else{

openTable(
item.id
);

}

}

};

}


/* RENDER */

function render(){

overlay.innerHTML='';


S.tables.forEach(
table=>{

let wrap=
document.createElement(
'div'
);

wrap.className=
'obj tableWrap';


let count=
S.guests.filter(
g=>g.tableId===table.id
).length;


if(
count===table.seats
){

wrap.classList.add(
'complete'
);

}


if(
count>table.seats
){

wrap.classList.add(
'over'
);

}


wrap.style.left=
table.x+'px';

wrap.style.top=
table.y+'px';

wrap.style.transform=

`scale(${table.scale||1})`;


chairs(
wrap,
table.seats
);


let core=
document.createElement(
'div'
);

core.className=
'tableCore';

core.innerHTML=

`<strong>
TABLE ${table.number}
</strong>

<span>
${count}/${table.seats}
</span>`;


wrap.appendChild(
core
);


makeDraggable(
wrap,
table,
'table'
);


overlay.appendChild(
wrap
);

}
);


S.objects.forEach(
obj=>{

let element=
document.createElement(
'div'
);

element.className=
'obj vobj';

element.style.left=
obj.x+'px';

element.style.top=
obj.y+'px';

element.style.width=
obj.w+'px';

element.style.height=
obj.h+'px';

element.textContent=
obj.type;


makeDraggable(
element,
obj,
'object'
);


overlay.appendChild(
element
);

}
);


empty.style.display=

(
S.venue
||
S.tables.length
||
S.objects.length
)

?

'none'

:

'grid';


renderGuests();

updateStatus();

applyOverlayTransform();

}


/* STATUS */

function updateStatus(){

let assigned=
S.guests.filter(
g=>g.tableId
).length;

status.textContent=

`${S.tables.length} tables · ${assigned}/${S.guests.length} guests assigned`;

}


/* ZOOM ONLY TABLES + OBJECTS */

function applyOverlayTransform(){

overlay.style.transform=

`translate(
${S.panX}px,
${S.panY}px
)
scale(${S.zoom})`;

}


function zoomAround(
clientX,
clientY,
newZoom
){

let rect=
shell.getBoundingClientRect();

let x=
clientX-
rect.left;

let y=
clientY-
rect.top;


let worldX=
(x-S.panX)
/S.zoom;

let worldY=
(y-S.panY)
/S.zoom;


S.zoom=
Math.max(
.4,
Math.min(
3,
newZoom
)
);


S.panX=
x-
worldX*
S.zoom;

S.panY=
y-
worldY*
S.zoom;


applyOverlayTransform();

}


function zoomCenter(delta){

let rect=
shell.getBoundingClientRect();

zoomAround(

rect.left+
rect.width/2,

rect.top+
rect.height/2,

S.zoom+
delta

);

save();

}


function fit(){

S.zoom=1;

S.panX=0;

S.panY=0;

applyOverlayTransform();

save();

}


function resetItems(){

S.zoom=1;

S.panX=0;

S.panY=0;

render();

save();

}


/* DESKTOP WHEEL */

shell.addEventListener(

'wheel',

e=>{

e.preventDefault();


let factor=

Math.exp(
-e.deltaY*
.0015
);


zoomAround(

e.clientX,

e.clientY,

S.zoom*
factor

);


clearTimeout(
window.zoomSave
);


window.zoomSave=
setTimeout(
save,
120
);

},

{
passive:false
}

);


/* MOBILE PINCH */

const pointers=
new Map();

let gesture=null;


shell.addEventListener(

'pointerdown',

e=>{

if(
e.target.closest(
'.obj'
)
)return;


pointers.set(

e.pointerId,

{
x:e.clientX,
y:e.clientY
}

);


if(
pointers.size===1
){

gesture={

type:'pan',

x:e.clientX,

y:e.clientY,

px:S.panX,

py:S.panY

};

}


if(
pointers.size===2
){

let points=
[
...pointers.values()
];


let distance=
Math.hypot(

points[0].x-points[1].x,

points[0].y-points[1].y

);


let centerX=
(
points[0].x+
points[1].x
)
/2;


let centerY=
(
points[0].y+
points[1].y
)
/2;


let rect=
shell.getBoundingClientRect();


let localX=
centerX-
rect.left;


let localY=
centerY-
rect.top;


gesture={

type:'pinch',

distance:distance,

zoom:S.zoom,

worldX:
(localX-S.panX)
/S.zoom,

worldY:
(localY-S.panY)
/S.zoom

};

}


try{

shell.setPointerCapture(
e.pointerId
);

}catch(_){}

}
);


shell.addEventListener(

'pointermove',

e=>{

if(
!pointers.has(
e.pointerId
)
)return;


pointers.set(

e.pointerId,

{
x:e.clientX,
y:e.clientY
}

);


if(
pointers.size===1

&&

gesture?.type==='pan'
){

S.panX=

gesture.px

+

e.clientX

-

gesture.x;


S.panY=

gesture.py

+

e.clientY

-

gesture.y;


applyOverlayTransform();

}


if(
pointers.size===2
){

let points=
[
...pointers.values()
];


let distance=
Math.hypot(

points[0].x-points[1].x,

points[0].y-points[1].y

);


let centerX=
(
points[0].x+
points[1].x
)
/2;


let centerY=
(
points[0].y+
points[1].y
)
/2;


let rect=
shell.getBoundingClientRect();


let localX=
centerX-
rect.left;


let localY=
centerY-
rect.top;


if(
gesture?.type!=='pinch'
){

gesture={

type:'pinch',

distance:distance,

zoom:S.zoom,

worldX:
(localX-S.panX)
/S.zoom,

worldY:
(localY-S.panY)
/S.zoom

};

}


S.zoom=

Math.max(

.4,

Math.min(

3,

gesture.zoom

*

(
distance/
gesture.distance
)

)

);


S.panX=

localX

-

gesture.worldX*
S.zoom;


S.panY=

localY

-

gesture.worldY*
S.zoom;


applyOverlayTransform();

}

}
);


function endPointer(e){

pointers.delete(
e.pointerId
);


if(
pointers.size===1
){

let point=
[
...pointers.values()
][0];


gesture={

type:'pan',

x:point.x,

y:point.y,

px:S.panX,

py:S.panY

};

}


else if(
pointers.size===0
){

gesture=null;

save();

}

}


shell.addEventListener(
'pointerup',
endPointer
);

shell.addEventListener(
'pointercancel',
endPointer
);


/* HELPERS */

function show(id){

document
.getElementById(id)
.style.display=
'flex';

}


function hide(id){

document
.getElementById(id)
.style.display=
'none';

}


function toast(message){

let t=
document.getElementById(
'toast'
);

t.textContent=
message;

t.style.display=
'block';


clearTimeout(
window.toastTimer
);


window.toastTimer=
setTimeout(

()=>t.style.display='none',

1600

);

}


function safe(text){

let div=
document.createElement(
'div'
);

div.textContent=
text||'';

return div.innerHTML;

}


load();

</script>
