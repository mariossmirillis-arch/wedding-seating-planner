<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seatly 2.3</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
height:100%;
font-family:system-ui,-apple-system,sans-serif;
background:#f4f2ee;
color:#202020
}

body{overflow:hidden}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:9px 11px;
background:#202020;
color:white;
font-weight:700
}

.sec{
background:white;
color:#202020;
border:1px solid #ddd
}

.soft{
background:#efebe6;
color:#202020
}

.top{
height:56px;
background:white;
border-bottom:1px solid #e6e0d8;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
position:relative;
z-index:100
}

.logo{
font-size:24px;
font-weight:900
}

.logo span{
font-weight:400
}

.app{
height:calc(100vh - 56px);
display:grid;
grid-template-columns:62px 270px 1fr
}

.rail{
background:#202020;
padding:6px 4px;
display:flex;
flex-direction:column;
gap:5px;
z-index:80
}

.rail button{
height:54px;
background:transparent;
padding:4px;
font-size:9px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px
}

.rail button b{
font-size:17px
}

.rail button.active{
background:white;
color:#202020
}

.panel{
background:white;
border-right:1px solid #e5dfd7;
padding:14px;
overflow:auto;
position:relative;
z-index:70
}

.panel h2{
margin:0 0 5px
}

.hint{
font-size:12px;
color:#777;
line-height:1.4;
margin-bottom:12px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.field{
width:100%;
padding:9px;
border:1px solid #d7d0c8;
border-radius:9px;
background:white
}

.upload{
display:block;
text-align:center;
padding:18px;
border:1.5px dashed #bbb;
border-radius:13px;
background:#faf9f7
}

.upload input{
display:none
}

.close{
display:none
}

.work{
padding:7px;
background:#ebe8e3;
min-width:0
}

.canvas{
width:100%;
height:100%;
background:white;
border-radius:14px;
position:relative;
overflow:hidden;
touch-action:none
}

.stage{
position:absolute;
inset:0;
transform-origin:0 0
}

.venue{
position:absolute;
inset:0;
background:white center/contain no-repeat;
pointer-events:none
}

.layer{
position:absolute;
inset:0
}

.empty{
position:absolute;
inset:0;
display:grid;
place-items:center;
text-align:center;
color:#999;
pointer-events:none
}

.obj{
position:absolute;
touch-action:none;
user-select:none
}

.table{
width:100px;
height:100px;
display:flex;
align-items:center;
justify-content:center
}

.table.selected,
.vobj.selected{
outline:3px solid #2224;
outline-offset:3px
}

.core{
width:62px;
height:62px;
border:2px solid #222;
border-radius:50%;
background:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-shadow:0 3px 10px #0002;
z-index:2
}

.core b{
font-size:10px
}

.core span{
font-size:9px;
color:#666
}

.complete .core{
background:#dff3e4;
border-color:#34784a
}

.chair{
position:absolute;
width:12px;
height:12px;
border:1.3px solid #555;
background:white;
border-radius:3px
}

.vobj{
border:2px dashed #666;
background:#ffffffe8;
border-radius:11px;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:800
}

.ctx{
position:absolute;
top:8px;
left:50%;
transform:translateX(-50%);
display:none;
gap:4px;
align-items:center;
background:white;
border:1px solid #ddd;
border-radius:11px;
padding:5px;
z-index:40
}

.ctx input,
.ctx select{
width:68px;
padding:6px;
border:1px solid #ddd;
border-radius:7px
}

.ctx button{
padding:6px 8px
}

.trash{
position:absolute;
left:50%;
bottom:55px;
transform:translateX(-50%);
display:none;
background:white;
border:2px solid #ddd;
border-radius:999px;
padding:9px 15px;
z-index:45;
font-size:12px;
font-weight:800
}

.trash.hot{
background:#ffe5e2;
border-color:#b23b30
}

.zoom{
position:absolute;
right:8px;
bottom:8px;
display:flex;
gap:4px;
background:white;
border:1px solid #ddd;
border-radius:10px;
padding:4px;
z-index:35
}

.zoom button{
padding:6px 8px
}

.status{
position:absolute;
left:8px;
bottom:8px;
background:white;
border:1px solid #ddd;
border-radius:999px;
padding:6px 9px;
font-size:10px;
color:#666;
z-index:35
}

.guest{
display:flex;
justify-content:space-between;
gap:6px;
padding:8px 0;
border-bottom:1px solid #eee;
font-size:12px
}

.section{
border-top:1px solid #eee;
padding-top:10px;
margin-top:10px
}

@media(max-width:800px){

.app{
grid-template-columns:56px 1fr
}

.rail{
padding:5px 3px
}

.rail button{
height:50px
}

.work{
grid-column:2;
padding:4px
}

.panel{
position:fixed;
left:56px;
right:0;
bottom:0;
top:auto;
width:auto;
max-height:48vh;
display:none;
border-right:0;
border-top:1px solid #ddd;
border-radius:18px 18px 0 0;
padding:48px 13px 13px;
box-shadow:0 -10px 30px #0003;
z-index:90
}

.panel.open{
display:block
}

.close{
display:block;
position:absolute;
right:10px;
top:8px;
width:34px;
height:34px;
padding:0;
border-radius:50%;
background:#efebe6;
color:#222;
border:1px solid #ddd;
font-size:20px
}

.ctx{
max-width:94%;
overflow:auto;
white-space:nowrap
}

}
</style>
</head>

<body>

<header class="top">
<div class="logo">seat<span>ly</span></div>
<button onclick="toast('Finish / Export αργότερα')">Finish</button>
</header>

<div class="app">

<nav class="rail">

<button id="bVenue" onclick="togglePanel('venue')">
<b>▧</b>
Venue
</button>

<button id="bTables" onclick="togglePanel('tables')">
<b>◉</b>
Tables
</button>

<button id="bGuests" onclick="togglePanel('guests')">
<b>♙</b>
Guests
</button>

<button id="bObjects" onclick="togglePanel('objects')">
<b>◇</b>
Objects
</button>

</nav>

<aside class="panel" id="panel">

<button class="close" onclick="closePanel()">×</button>

<div id="panelContent"></div>

</aside>

<main class="work">

<div class="canvas" id="canvas">

<div class="stage" id="stage">

<div class="venue" id="venue"></div>

<div class="empty" id="empty">
Upload a venue or add a table
</div>

<div class="layer" id="layer"></div>

</div>

<div class="ctx" id="ctx"></div>

<div class="trash" id="trash">
🗑 Drop to delete
</div>

<div class="status" id="status"></div>

<div class="zoom">

<button class="sec" onclick="zoom(.9)">
−
</button>

<button class="sec" onclick="fit()">
Fit
</button>

<button class="sec" onclick="zoom(1.1)">
＋
</button>

</div>

</div>

</main>

</div>

<div
id="toast"
style="
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:#222;
color:#fff;
padding:9px 13px;
border-radius:10px;
display:none;
z-index:120
">
</div>

<script>

let S={
venue:null,
tables:[],
guests:[],
objs:[],
counter:0,
view:{
scale:1,
x:0,
y:0
}
};

let selected=null;
let activePanel=null;

const $=x=>
document.getElementById(x);

const canvas=$('canvas');
const stage=$('stage');
const layer=$('layer');
const venue=$('venue');
const ctx=$('ctx');
const trash=$('trash');

const uid=()=>
crypto.randomUUID
?crypto.randomUUID()
:String(Date.now()+Math.random());


function mobile(){

return innerWidth<=800;

}


function save(){

try{

localStorage.setItem(
'seatly23',
JSON.stringify(S)
);

}catch(e){}

status();

}


function load(){

try{

let s=
localStorage.getItem('seatly23') ||
localStorage.getItem('seatly_2_2') ||
localStorage.getItem('seatly2');

if(s){

S=Object.assign(
S,
JSON.parse(s)
);

}

}catch(e){}

applyVenue();

render();

}


/* PANEL */

function setActive(t){

['Venue','Tables','Guests','Objects']
.forEach(x=>{

$('b'+x)
.classList
.toggle(
'active',
x.toLowerCase()===t
);

});

}


function closePanel(){

$('panel')
.classList
.remove('open');

activePanel=null;

setActive('');

}


function togglePanel(t){

if(
mobile() &&
activePanel===t &&
$('panel').classList.contains('open')
){

closePanel();

return;

}

activePanel=t;

setActive(t);

$('panel')
.classList
.add('open');

if(t==='venue'){
venuePanel();
}

if(t==='tables'){
tablesPanel();
}

if(t==='guests'){
guestsPanel();
}

if(t==='objects'){
objectsPanel();
}

}


function afterAction(){

if(mobile()){

closePanel();

}

}


/* VENUE */

function venuePanel(){

panelContent.innerHTML=`

<h2>Venue</h2>

<div class="hint">
Upload your plan. It stays aligned with the tables.
</div>

<label class="upload">

📷

<br>

<b>
${S.venue
?'Replace venue'
:'Upload venue'}
</b>

<input
id="file"
type="file"
accept="image/*">

</label>

${S.venue
?`
<button
class="sec"
style="width:100%;margin-top:7px"
onclick="removeVenue()">
Remove
</button>
`
:''}

`;

$('file').onchange=e=>{

let f=
e.target.files[0];

if(!f)return;

let r=
new FileReader();

r.onload=x=>{

S.venue=
x.target.result;

applyVenue();

render();

save();

afterAction();

};

r.readAsDataURL(f);

};

}


function applyVenue(){

venue.style.backgroundImage=

S.venue
?`url("${S.venue}")`
:'none';

}


function removeVenue(){

S.venue=null;

applyVenue();

render();

save();

venuePanel();

}


/* TABLE PANEL */

function tablesPanel(){

panelContent.innerHTML=`

<h2>Tables</h2>

<div class="hint">
Choose seats. The menu closes automatically.
</div>

<div class="grid">

<button
class="soft"
onclick="addTable(8)">
8 seats
</button>

<button
class="soft"
onclick="addTable(10)">
10 seats
</button>

<button
class="soft"
onclick="addTable(12)">
12 seats
</button>

<button
class="soft"
onclick="addTable(16)">
16 seats
</button>

</div>

<div class="section">

<input
id="qty"
class="field"
type="number"
value="5"
min="1"
max="50">

<select
id="bulkSeats"
class="field"
style="margin-top:6px">

<option>8</option>
<option selected>10</option>
<option>12</option>
<option>16</option>

</select>

<button
style="width:100%;margin-top:6px"
onclick="addMany()">

Add multiple

</button>

</div>

`;

}


/* GUESTS */

function guestsPanel(){

let rows=

S.guests
.map(g=>{

let t=
S.tables.find(
x=>x.id===g.tableId
);

return `

<div class="guest">

<span>

${esc(g.name)}

<br>

<small>
${t
?'Table '+t.number
:'Unassigned'}
</small>

</span>

<span>

<button
class="sec"
style="padding:5px"
onclick="editGuest('${g.id}')">
Edit
</button>

<button
style="padding:5px;background:#a83b32"
onclick="delGuest('${g.id}')">
×
</button>

</span>

</div>

`;

})
.join('');


panelContent.innerHTML=`

<h2>Guests</h2>

<div class="hint">
Simple guest list.
</div>

<input
id="gName"
class="field"
placeholder="Name / Όνομα">

<select
id="gTable"
class="field"
style="margin-top:6px">

${tableOpts()}

</select>

<button
style="width:100%;margin-top:6px"
onclick="addGuest()">

Add guest

</button>

<div class="section">

${rows||
'<div class="hint">No guests yet</div>'}

</div>

`;

}


/* OBJECTS */

function objectsPanel(){

panelContent.innerHTML=`

<h2>Objects</h2>

<div class="grid">

<button
class="soft"
onclick="addObj('Dance Floor',160,160)">
Dance Floor
</button>

<button
class="soft"
onclick="addObj('DJ',110,55)">
DJ
</button>

<button
class="soft"
onclick="addObj('Bar',130,55)">
Bar
</button>

<button
class="soft"
onclick="addObj('Stage',150,65)">
Stage
</button>

</div>

`;

}


/* ADD TABLE */

function addTable(seats){

S.counter++;

let i=
S.tables.length;

S.tables.push({

id:uid(),

number:S.counter,

seats:seats,

x:
70+
(i%5)*115,

y:
85+
Math.floor(i/5)*110,

scale:1,

rotation:0

});

render();

save();

afterAction();

}


/* ADD MANY */

function addMany(){

let n=
Math.max(
1,
Math.min(
50,
+$('qty').value||1
)
);

let s=
+$('bulkSeats').value;

for(
let k=0;
k<n;
k++
){

addTableNoClose(s);

}

render();

save();

afterAction();

}


function addTableNoClose(seats){

S.counter++;

let i=
S.tables.length;

S.tables.push({

id:uid(),

number:S.counter,

seats:seats,

x:
70+
(i%5)*115,

y:
85+
Math.floor(i/5)*110,

scale:1,

rotation:0

});

}


/* ADD OBJECT */

function addObj(label,w,h){

let i=
S.objs.length;

S.objs.push({

id:uid(),

label:label,

w:w,

h:h,

x:
180+
i*25,

y:
160+
i*20,

scale:1,

rotation:0

});

render();

save();

afterAction();

}


/* CHAIRS */

function chairs(el,n){

n=
Math.min(
n,
16
);

let r=42;

for(
let i=0;
i<n;
i++
){

let a=

2*
Math.PI*
i/n

-

Math.PI/2;

let c=
document.createElement(
'div'
);

c.className='chair';

c.style.left=

(
50+
Math.cos(a)*r-
6
)
+'px';

c.style.top=

(
50+
Math.sin(a)*r-
6
)
+'px';

el.appendChild(c);

}

}


/* RENDER */

function render(){

layer.innerHTML='';

S.tables.forEach(t=>{

let count=

S.guests.filter(
g=>g.tableId===t.id
).length;

let e=
document.createElement(
'div'
);

e.className=

'obj table'

+

(
count===t.seats
?' complete'
:''
)

+

(
selected?.id===t.id
?' selected'
:''
);

e.style.left=
t.x+'px';

e.style.top=
t.y+'px';

e.style.transform=

`scale(${t.scale}) rotate(${t.rotation}deg)`;

chairs(
e,
t.seats
);

let c=
document.createElement(
'div'
);

c.className='core';

c.innerHTML=

`<b>TABLE ${t.number}</b><span>${count}/${t.seats}</span>`;

e.appendChild(c);

drag(
e,
t,
'table'
);

layer.appendChild(e);

});


S.objs.forEach(o=>{

let e=
document.createElement(
'div'
);

e.className=

'obj vobj'

+

(
selected?.id===o.id
?' selected'
:''
);

e.style.left=
o.x+'px';

e.style.top=
o.y+'px';

e.style.width=
o.w+'px';

e.style.height=
o.h+'px';

e.style.transform=

`scale(${o.scale}) rotate(${o.rotation}deg)`;

e.textContent=
o.label;

drag(
e,
o,
'obj'
);

layer.appendChild(e);

});


$('empty').style.display=

(
S.venue ||
S.tables.length ||
S.objs.length
)

?'none'
:'grid';

applyView();

renderCtx();

status();

}


/* DRAG */

function drag(
el,
item,
kind
){

let sx;
let sy;
let ox;
let oy;
let on=false;


el.onpointerdown=e=>{

e.stopPropagation();

selected={
id:item.id,
kind:kind
};

renderCtx();

document
.querySelectorAll('.obj')
.forEach(
x=>x.classList.remove('selected')
);

el.classList.add(
'selected'
);

sx=e.clientX;
sy=e.clientY;
ox=item.x;
oy=item.y;

on=true;

trash.style.display=
'block';

try{

el.setPointerCapture(
e.pointerId
);

}catch(_){}

};


el.onpointermove=e=>{

if(!on)return;

item.x=

ox+
(e.clientX-sx)/
S.view.scale;

item.y=

oy+
(e.clientY-sy)/
S.view.scale;

el.style.left=
item.x+'px';

el.style.top=
item.y+'px';

let r=
trash.getBoundingClientRect();

let hot=

e.clientX>=r.left &&

e.clientX<=r.right &&

e.clientY>=r.top &&

e.clientY<=r.bottom;

trash.classList.toggle(
'hot',
hot
);

};


el.onpointerup=e=>{

if(!on)return;

on=false;

let hot=

trash
.classList
.contains('hot');

trash.style.display=
'none';

trash
.classList
.remove('hot');

if(hot){

if(kind==='table'){

S.guests.forEach(g=>{

if(
g.tableId===item.id
){

g.tableId=null;

}

});

S.tables=

S.tables.filter(
x=>x.id!==item.id
);

}else{

S.objs=

S.objs.filter(
x=>x.id!==item.id
);

}

selected=null;

render();

}

save();

};


el.onpointercancel=()=>{

on=false;

trash.style.display=
'none';

};

}


/* CONTEXT TOOLBAR */

function renderCtx(){

if(!selected){

ctx.style.display=
'none';

return;

}

let item=

selected.kind==='table'

?S.tables.find(
x=>x.id===selected.id
)

:S.objs.find(
x=>x.id===selected.id
);


if(!item){

ctx.style.display=
'none';

selected=null;

return;

}


if(
selected.kind==='table'
){

let n=

S.guests.filter(
g=>g.tableId===item.id
).length;

ctx.innerHTML=`

<b>T</b>

<input
id="num"
type="number"
value="${item.number}">

<select id="seatSel">

${[8,10,12,16]
.map(
x=>
`<option ${x===item.seats?'selected':''}>${x}</option>`
)
.join('')}

</select>

<span>
${n}/${item.seats}
</span>

<button
class="sec"
onclick="saveCtx()">
✓
</button>

<button
class="sec"
onclick="resize(.9)">
−
</button>

<button
class="sec"
onclick="resize(1.1)">
＋
</button>

<button
class="sec"
onclick="rotate()">
↻
</button>

`;

}else{

ctx.innerHTML=`

<b>${item.label}</b>

<button
class="sec"
onclick="resize(.9)">
−
</button>

<button
class="sec"
onclick="resize(1.1)">
＋
</button>

<button
class="sec"
onclick="rotate()">
↻
</button>

`;

}

ctx.style.display=
'flex';

}


function saveCtx(){

let t=

S.tables.find(
x=>x.id===selected.id
);

let s=
+$('seatSel').value;

let c=

S.guests.filter(
g=>g.tableId===t.id
).length;

if(s<c){

return toast(
'Table already has '+
c+
' guests'
);

}

t.number=

Math.max(
1,
+$('num').value||1
);

t.seats=
s;

render();

save();

}


function resize(m){

let a=

selected.kind==='table'
?S.tables
:S.objs;

let o=

a.find(
x=>x.id===selected.id
);

o.scale=

Math.max(
.5,
Math.min(
2.2,
o.scale*m
)
);

render();

save();

}


function rotate(){

let a=

selected.kind==='table'
?S.tables
:S.objs;

let o=

a.find(
x=>x.id===selected.id
);

o.rotation=

(
o.rotation+
15
)
%
360;

render();

save();

}


/* CANVAS TAP */

canvas.addEventListener(
'pointerdown',
e=>{

if(mobile()){

closePanel();

}

if(

e.target===canvas ||

e.target===stage ||

e.target===layer

){

selected=null;

renderCtx();

document
.querySelectorAll('.obj')
.forEach(
x=>x.classList.remove('selected')
);

}

}
);


/* VIEW */

function applyView(){

stage.style.transform=

`translate(${S.view.x}px,${S.view.y}px) scale(${S.view.scale})`;

}


function fit(){

S.view={
scale:1,
x:0,
y:0
};

applyView();

save();

}


function zoom(m){

let r=
canvas.getBoundingClientRect();

let cx=
r.width/2;

let cy=
r.height/2;

let wx=

(cx-S.view.x)/
S.view.scale;

let wy=

(cy-S.view.y)/
S.view.scale;

S.view.scale=

Math.max(
.4,
Math.min(
3,
S.view.scale*m
)
);

S.view.x=

cx-
wx*S.view.scale;

S.view.y=

cy-
wy*S.view.scale;

applyView();

save();

}


/* PINCH */

let P=
new Map();

let pin=null;


canvas.addEventListener(
'pointerdown',
e=>{

if(
e.target.closest('.obj')
)
return;

P.set(
e.pointerId,
{
x:e.clientX,
y:e.clientY
}
);

if(P.size===2){

let p=
[...P.values()];

let d=
Math.hypot(

p[0].x-p[1].x,

p[0].y-p[1].y

);

let r=
canvas.getBoundingClientRect();

let cx=

(
p[0].x+
p[1].x
)/2

-

r.left;

let cy=

(
p[0].y+
p[1].y
)/2

-

r.top;

pin={

d:d,

s:S.view.scale,

wx:
(cx-S.view.x)/
S.view.scale,

wy:
(cy-S.view.y)/
S.view.scale

};

}

}
);


canvas.addEventListener(
'pointermove',
e=>{

if(
!P.has(
e.pointerId
)
)
return;

P.set(
e.pointerId,
{
x:e.clientX,
y:e.clientY
}
);

if(
P.size===2 &&
pin
){

let p=
[...P.values()];

let d=
Math.hypot(

p[0].x-p[1].x,

p[0].y-p[1].y

);

let r=
canvas.getBoundingClientRect();

let cx=

(
p[0].x+
p[1].x
)/2

-

r.left;

let cy=

(
p[0].y+
p[1].y
)/2

-

r.top;

S.view.scale=

Math.max(
.4,
Math.min(
3,
pin.s*d/pin.d
)
);

S.view.x=

cx-
pin.wx*S.view.scale;

S.view.y=

cy-
pin.wy*S.view.scale;

applyView();

}

}
);


function pend(e){

P.delete(
e.pointerId
);

if(
P.size<2
){

pin=null;

save();

}

}

canvas.addEventListener(
'pointerup',
pend
);

canvas.addEventListener(
'pointercancel',
pend
);


/* GUESTS */

function tableOpts(){

return

'<option value="">Unassigned</option>'

+

S.tables

.slice()

.sort(
(a,b)=>
a.number-b.number
)

.map(
t=>
`<option value="${t.id}">Table ${t.number}</option>`
)

.join('');

}


function addGuest(){

let n=
$('gName')
.value
.trim();

let id=
$('gTable').value||
null;

if(!n)return;

S.guests.push({

id:uid(),

name:n,

tableId:id

});

render();

save();

afterAction();

}


function editGuest(id){

let g=

S.guests.find(
x=>x.id===id
);

let n=

prompt(
'Guest name',
g.name
);

if(
n===null ||
!n.trim()
)
return;

let cur=

g.tableId

?(
S.tables.find(
t=>t.id===g.tableId
)?.number||
''
)

:'';

let ans=

prompt(

'Table number (empty = unassigned)',

cur

);

if(ans===null)return;

let tid=null;

if(ans.trim()){

let t=

S.tables.find(
x=>
String(x.number)
===ans.trim()
);

if(!t){

return toast(
'Table not found'
);

}

tid=
t.id;

}

g.name=
n.trim();

g.tableId=
tid;

render();

save();

guestsPanel();

}


function delGuest(id){

S.guests=

S.guests.filter(
x=>x.id!==id
);

render();

save();

guestsPanel();

}


/* STATUS */

function status(){

let seated=

S.guests.filter(
g=>g.tableId
).length;

let full=

S.tables.filter(

t=>

S.guests.filter(
g=>g.tableId===t.id
).length

===t.seats

).length;

$('status').textContent=

`${S.tables.length} tables · ${seated}/${S.guests.length} seated · ${full} complete`;

}


/* TOAST */

function toast(m){

let t=
$('toast');

t.textContent=
m;

t.style.display=
'block';

clearTimeout(
window.tt
);

window.tt=
setTimeout(

()=>t.style.display='none',

1600

);

}


/* SAFE TEXT */

function esc(s){

let d=
document.createElement(
'div'
);

d.textContent=
s||'';

return d.innerHTML;

}


/* START */

load();

</script>

</body>
</html>
