<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seatly 4.5</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f3f1ed;
  --paper:#fff;
  --ink:#202020;
  --muted:#777;
  --line:#e5dfd7;
  --soft:#f2eee9;
  --green:#dff3e4;
  --greenB:#34784a;
  --danger:#a43a32;
  --dangerSoft:#fff0ee;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
}

body{overflow:hidden}

button,input,select{font:inherit}

button{
  border:0;
  border-radius:10px;
  padding:9px 11px;
  background:var(--ink);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

button.secondary{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
}

button.soft{
  background:var(--soft);
  color:var(--ink);
}

button.danger{
  background:var(--danger);
  color:#fff;
}

button.dangerSoft{
  background:var(--dangerSoft);
  color:var(--danger);
  border:1px solid #efc8c3;
}

button:disabled{
  opacity:.38;
  cursor:default;
}

/* TOP */

.topbar{
  height:58px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  position:relative;
  z-index:120;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{font-weight:400}

.topActions{
  display:flex;
  align-items:center;
  gap:5px;
}

.saved{
  font-size:11px;
  color:#777;
}

/* APP */

.app{
  height:calc(100vh - 58px);
  display:grid;
  grid-template-columns:64px 280px 1fr;
}

/* LEFT TOOLBAR */

.rail{
  background:#202020;
  padding:6px 4px;
  display:flex;
  flex-direction:column;
  gap:5px;
  z-index:90;
}

.rail button{
  height:54px;
  background:transparent;
  padding:4px;
  font-size:9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.rail button b{font-size:17px}

.rail button.active{
  background:#fff;
  color:#202020;
}

/* PANEL */

.panel{
  background:#fff;
  border-right:1px solid var(--line);
  padding:14px;
  overflow:auto;
  position:relative;
  z-index:80;
}

.panel h2{
  font-size:18px;
  margin:0 0 5px;
}

.panel h3{
  font-size:14px;
  margin:0 0 8px;
}

.hint{
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
  margin-bottom:12px;
}

.section{
  border-top:1px solid #eee8e1;
  padding-top:11px;
  margin-top:11px;
}

.field{
  width:100%;
  padding:9px;
  border:1px solid #d8d1c9;
  border-radius:9px;
  background:#fff;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.panelClose{display:none}

/* QUICK SETUP */

.quickButton{
  background:#f5f2ed;
  color:#222;
  border:1px solid #e1dbd3;
  padding:12px 4px;
}

.setupCard{
  border:1px solid var(--line);
  border-radius:14px;
  background:#faf9f7;
  padding:11px;
  margin-top:10px;
}

.setupTitle{
  font-size:17px;
  font-weight:850;
}

.setupOption{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  padding:10px 0;
  border-top:1px solid #ece7e1;
}

.setupMeta{
  font-size:11px;
  color:#777;
  margin-top:2px;
}

/* WORKSPACE */

.work{
  background:#eae7e2;
  padding:8px;
  min-width:0;
  min-height:0;
  overflow:hidden;
  display:flex;
  align-items:stretch;
  justify-content:center;
}

.canvasWrap{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:center;
}

.canvas{
  position:relative;
  width:min(100%,1300px);
  height:100%;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  touch-action:none;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.venueBg{
  position:absolute;
  inset:0;
  background:#fff center/contain no-repeat;
  pointer-events:none;
}

.layer{
  position:absolute;
  inset:0;
}

.empty{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  color:#999;
  pointer-events:none;
}

/* TABLES */

.obj{
  position:absolute;
  touch-action:none;
  user-select:none;
}

.table{
  width:82px;
  height:82px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
}

.table.selected{
  outline:3px solid rgba(32,32,32,.17);
  outline-offset:3px;
}

.core{
  width:48px;
  height:48px;
  border:2px solid #222;
  border-radius:50%;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.13);
  z-index:2;
}

.core b{
  font-size:8px;
}

.core span{
  font-size:8px;
  color:#666;
  margin-top:2px;
}

.table.complete .core{
  background:var(--green);
  border-color:var(--greenB);
}

.chair{
  position:absolute;
  width:9px;
  height:9px;
  border:1.1px solid #555;
  background:#fff;
  border-radius:3px;
}

/* CONTEXT */

.context{
  position:absolute;
  left:50%;
  top:8px;
  transform:translateX(-50%);
  display:none;
  align-items:center;
  gap:5px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:5px;
  z-index:40;
  box-shadow:0 8px 22px rgba(0,0,0,.14);
}

.context input,
.context select{
  width:62px;
  padding:6px;
  border:1px solid var(--line);
  border-radius:8px;
}

.context button{
  padding:6px 7px;
  font-size:11px;
}

/* TRASH */

.trash{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  display:none;
  background:#fff;
  border:2px solid var(--line);
  border-radius:999px;
  padding:8px 15px;
  font-size:11px;
  font-weight:800;
  z-index:45;
}

.trash.hot{
  background:#ffe7e3;
  border-color:#b23b30;
}

/* STATUS */

.status{
  position:absolute;
  left:8px;
  bottom:8px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
  color:#666;
  z-index:30;
}

/* GUEST PANEL */

.guestPanel{
  position:fixed;
  top:58px;
  right:0;
  bottom:0;
  width:370px;
  background:#fff;
  border-left:1px solid var(--line);
  box-shadow:-10px 0 30px rgba(0,0,0,.12);
  z-index:110;
  display:none;
  padding:15px;
  overflow:auto;
}

.guestPanel.open{display:block}

.guestHeader{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.guestTitle{
  font-size:21px;
  font-weight:850;
}

.guestCount{
  font-size:12px;
  color:#777;
}

.guestBox{
  background:#faf9f7;
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
}

.formLabel{
  font-size:11px;
  font-weight:750;
  color:#666;
  margin:8px 0 4px;
}

.guestRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:6px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.guestName{
  font-size:13px;
  font-weight:700;
}

.guestMeta{
  font-size:11px;
  color:#777;
}

.actions{
  display:flex;
  gap:4px;
}

.actions button{
  font-size:10px;
  padding:5px 6px;
}

/* DIRECTORY */

.directoryLetter{
  font-size:20px;
  font-weight:900;
  border-bottom:2px solid #222;
  margin:15px 0 5px;
}

.directoryRow{
  display:grid;
  grid-template-columns:1fr auto auto auto;
  gap:8px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #eee;
  font-size:12px;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:220;
}

.overlay.open{display:flex}

.modal{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
}

.modalTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

/* MOBILE */

@media(max-width:800px){

  .topbar{
    height:56px;
    padding:0 7px;
  }

  .logo{
    font-size:21px;
  }

  .saved{
    display:none;
  }

  .topActions{
    gap:3px;
  }

  .topActions button{
    font-size:11px;
    padding:7px 8px;
  }

  .app{
    height:calc(100vh - 56px);
    grid-template-columns:54px 1fr;
  }

  .rail{
    padding:4px 2px;
  }

  .rail button{
    height:48px;
    font-size:8px;
  }

  .work{
    grid-column:2;
    padding:4px;
    align-items:stretch;
  }

  /*
  BIGGER MOBILE WORKSPACE:
  almost full available screen height.
  */

  .canvasWrap{
    align-items:stretch;
  }

  .canvas{
    width:100%;
    height:100%;
    max-height:none;
    border-radius:12px;
  }

  .panel{
    position:fixed;
    left:54px;
    right:0;
    bottom:0;
    top:auto;
    width:auto;
    max-height:55vh;
    display:none;
    border-right:0;
    border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    padding:46px 12px 12px;
    box-shadow:0 -10px 30px rgba(0,0,0,.18);
    z-index:100;
  }

  .panel.open{
    display:block;
  }

  .panelClose{
    display:block;
    position:absolute;
    right:9px;
    top:7px;
    width:34px;
    height:34px;
    padding:0;
    border-radius:50%;
    background:var(--soft);
    color:#222;
    border:1px solid var(--line);
    font-size:20px;
  }

  .guestPanel{
    top:56px;
    left:54px;
    right:0;
    bottom:0;
    width:auto;
    border-left:0;
    box-shadow:none;
  }

  .grid4{
    grid-template-columns:repeat(2,1fr);
  }

  .context{
    max-width:95%;
    overflow:auto;
    white-space:nowrap;
  }

  .directoryRow{
    grid-template-columns:1fr auto;
  }

  .table{
    width:72px;
    height:72px;
  }

  .core{
    width:42px;
    height:42px;
  }

  .core b{
    font-size:7px;
  }

  .core span{
    font-size:7px;
  }

  .chair{
    width:8px;
    height:8px;
  }
}

</style>
</head>

<body>

<header class="topbar">

<div class="logo">
seat<span>ly</span>
</div>

<div class="topActions">

<span class="saved" id="savedIndicator">
Saved ✓
</span>

<button
class="secondary"
id="undoBtn"
onclick="undo()">
↶
</button>

<button
class="secondary"
id="redoBtn"
onclick="redo()">
↷
</button>

<button onclick="toast('PDF / PNG export will be added next')">
Finish
</button>

</div>

</header>


<div class="app">

<nav class="rail">

<button
id="navSetup"
onclick="togglePanel('setup')">
<b>⚡</b>
Setup

<button
id="navTables"
onclick="togglePanel('tables')">

Tables

<button
id="navGuests"
onclick="togglePanel('guests')">
<b>♙</b>
Guests
</button>

<button
id="navLists"
onclick="togglePanel('lists')">
<b>☷</b>
Lists
</button>

<button
id="navVenue"
onclick="togglePanel('venue')">

Venue

id="navMore"
onclick="togglePanel('more')">

<aside class="panel" id="panel">

class="panelClose"
onclick="closePanel()">

<div class="canvasWrap">

<div>

<div style="font-size:34px">
♡
</div>

<b>
Your wedding plan

<div style="font-size:12px;margin-top:5px">
Start with Quick Setup
</div>

</div>

</div>

</div>


<!-- TABLE GUEST PANEL -->

<!-- DIRECTORY -->

Delete Entire Guest List

<div
id="toast"
style="
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:#222;
color:white;
padding:9px 13px;
border-radius:10px;
display:none;
z-index:300">
</div>


<script>

/* STATE */

let S={
  venue:null,
  tables:[],
  guests:[]
};

let selected=null;
let activePanel=null;
let activeGuestTable=null;

let undoStack=[];
let redoStack=[];

const $=id=>document.getElementById(id);

const canvas=$('canvas');
const layer=$('layer');
const venueBg=$('venueBg');
const context=$('context');
const trash=$('trash');

const mobile=()=>window.innerWidth<=800;

function uid(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){
    return crypto.randomUUID();
  }

  return String(
    Date.now()+Math.random()
  );
}


/* HISTORY */

function state(){
  return JSON.stringify(S);
}

function pushHistory(){

  undoStack.push(
    state()
  );

  if(
    undoStack.length>60
  ){
    undoStack.shift();
  }

  redoStack=[];

  updateHistory();
}

function updateHistory(){

  $('undoBtn').disabled=
  !undoStack.length;

  $('redoBtn').disabled=
  !redoStack.length;
}

function undo(){

  if(
    !undoStack.length
  )return;

  redoStack.push(
    state()
  );

  S=
  JSON.parse(
    undoStack.pop()
  );

  selected=null;

  closeGuestPanel();

  applyVenue();

  render();

  saveOnly();

  updateHistory();
}

function redo(){

  if(
    !redoStack.length
  )return;

  undoStack.push(
    state()
  );

  S=
  JSON.parse(
    redoStack.pop()
  );

  selected=null;

  closeGuestPanel();

  applyVenue();

  render();

  saveOnly();

  updateHistory();
}


/* SAVE */

function saveOnly(){

  try{

    localStorage.setItem(
      'seatly45',
      JSON.stringify(S)
    );

  }catch(e){}

  $('savedIndicator')
  .textContent=
  'Saved ✓';

  updateStatus();
}


/* LOAD */

function load(){

  try{

    const old=

    localStorage.getItem('seatly45')

    ||

    localStorage.getItem('seatly44')

    ||

    localStorage.getItem('seatly43');


    if(old){

      const data=
      JSON.parse(old);

      S.venue=
      data.venue||null;

      S.tables=
      data.tables||[];

      S.guests=

      (data.guests||[])

      .map(guest=>{

        if(
          guest.surname!==undefined
        ){

          return{

            id:
            guest.id||uid(),

            surname:
            guest.surname||'',

            firstName:
            guest.firstName||'',

            partySize:
            Math.max(
              1,
              Number(
                guest.partySize||1
              )
            ),

            tableId:
            guest.tableId||null

          };
        }

        const parts=

        String(
          guest.name||''
        )

        .trim()
        .split(/\s+/);

        return{

          id:
          guest.id||uid(),

          surname:
          parts.length>1
          ?parts[parts.length-1]
          :parts[0]||'',

          firstName:
          parts.length>1
          ?parts.slice(0,-1).join(' ')
          :'',

          partySize:1,

          tableId:
          guest.tableId||null

        };

      });

    }

  }catch(e){}

  applyVenue();

  render();

  updateHistory();
}


/* NAV */

function setActive(type){

  [
    'Setup',
    'Tables',
    'Guests',
    'Lists',
    'Venue',
    'More'
  ]

  .forEach(name=>{

    $('nav'+name)
    .classList
    .toggle(
      'active',
      name.toLowerCase()===type
    );

  });
}

function closePanel(){

  $('panel')
  .classList
  .remove('open');

  activePanel=null;

  setActive('');
}

function togglePanel(type){

  if(

    mobile()

    &&

    activePanel===type

    &&

    $('panel')
    .classList
    .contains('open')

  ){

    closePanel();

    return;
  }

  activePanel=
  type;

  setActive(type);

  $('panel')
  .classList
  .add('open');


  if(type==='setup'){
    renderSetup();
  }

  if(type==='tables'){
    renderTablesPanel();
  }

  if(type==='guests'){
    renderGuestManager();
  }

  if(type==='lists'){
    renderLists();
  }

  if(type==='venue'){
    renderVenuePanel();
  }

  if(type==='more'){
    renderMore();
  }
}

function closeAfterAction(){

  if(
    mobile()
  ){
    closePanel();
  }
}


/* HELPERS */

function nextTableNumber(){

  const numbers=

  S.tables
  .map(
    table=>
    Number(table.number)
  );

  let number=1;

  while(
    numbers.includes(number)
  ){
    number++;
  }

  return number;
}

function tableUsedSeats(
tableId,
excludeGuestId=null
){

  return S.guests

  .filter(
    guest=>

    guest.tableId===tableId

    &&

    guest.id!==excludeGuestId
  )

  .reduce(
    (
      total,
      guest
    )=>

    total+
    Number(
      guest.partySize||1
    ),
    0
  );
}


/* QUICK SETUP */

function renderSetup(){

  $('panelContent')
  .innerHTML=`

  <h2>
  Quick Setup
  </h2>

  <div class="hint">
  Choose the number of guests.
  Seatly calculates the tables.
  </div>

  <div class="grid4">

  ${[
    50,
    100,
    150,
    200,
    250,
    300,
    350,
    400
  ]

  .map(
    guestCount=>

    `

/* RESPONSIVE GRID */

function createGrid(
qty,
seats
){

  const rect=
  canvas.getBoundingClientRect();

  const width=
  rect.width;

  const height=
  rect.height;

  /*
  Tables start smaller now.
  */

  let scale=.72;

  if(qty>=10){
    scale=.62;
  }

  if(qty>=18){
    scale=.54;
  }

  if(qty>=28){
    scale=.46;
  }

  if(qty>=38){
    scale=.40;
  }

  const itemSize=
  82*
  scale;

  const gapX=
  12;

  const gapY=
  12;

  const usableWidth=
  Math.max(
    100,
    width-
    18
  );

  const usableHeight=
  Math.max(
    100,
    height-
    60
  );

  let columns=

  Math.max(

    1,

    Math.floor(

      usableWidth/

      (
        itemSize+
        gapX
      )

    )

  );

  columns=

  Math.min(
    columns,
    qty
  );

  let rows=

  Math.ceil(
    qty/
    columns
  );

  while(

    rows*
    (
      itemSize+
      gapY
    )
    >
    usableHeight

    &&

    columns<
    qty

  ){

    columns++;

    rows=

    Math.ceil(
      qty/
      columns
    );

  }

  let finalScale=
  scale;

  const requiredHeight=

  rows*
  (
    82*
    finalScale+
    gapY
  );

  if(
    requiredHeight>
    usableHeight
  ){

    finalScale=

    Math.max(

      .30,

      finalScale*
      usableHeight/
      requiredHeight

    );

  }

  const stepX=

  82*
  finalScale+
  gapX;

  const stepY=

  82*
  finalScale+
  gapY;

  const gridWidth=

  (
    columns-1
  )
  *
  stepX;

  const gridHeight=

  (
    rows-1
  )
  *
  stepY;

  const startX=

  Math.max(

    5,

    width/2
    -
    gridWidth/2
    -
    41*
    finalScale

  );

  const startY=

  Math.max(

    35,

    height/2
    -
    gridHeight/2
    -
    41*
    finalScale

  );

  for(
    let i=0;
    i<qty;
    i++
  ){

    const column=
    i%
    columns;

    const row=

    Math.floor(
      i/
      columns
    );

    S.tables.push({

      id:uid(),

      number:
      nextTableNumber(),

      seats:
      seats,

      x:
      startX+
      column*
      stepX,

      y:
      startY+
      row*
      stepY,

      scale:
      finalScale

    });

  }
}

/* CHAIRS */

function createChairs(
element,
seats
){

  const count=

  Math.min(
    seats,
    16
  );

  const radius=34;

  for(
    let i=0;
    i<count;
    i++
  ){

    const angle=

    2*
    Math.PI*
    i/count

    -

    Math.PI/2;

    const chair=
    document.createElement(
      'div'
    );

    chair.className=
    'chair';

    chair.style.left=

    (
      41+
      Math.cos(angle)*
      radius
      -
      4.5
    )

    +'px';

    chair.style.top=

    (
      41+
      Math.sin(angle)*
      radius
      -
      4.5
    )

    +'px';

    element.appendChild(
      chair
    );
  }
}

/* DRAG */

function attachDrag(
element,
table
){

  let startX;
  let startY;
  let originalX;
  let originalY;
  let active=false;
  let beforeState=null;

  element.onpointerdown=e=>{

    e.stopPropagation();

    selected={
      id:table.id,
      kind:'table'
    };

    document
    .querySelectorAll('.table')
    .forEach(
      item=>
      item.classList.remove(
        'selected'
      )
    );

    element.classList.add(
      'selected'
    );

    renderContext();

    startX=
    e.clientX;

    startY=
    e.clientY;

    originalX=
    table.x;

    originalY=
    table.y;

    beforeState=
    state();

    active=true;

    trash.style.display=
    'block';

    try{

      element.setPointerCapture(
        e.pointerId
      );

    }catch(error){}
  };


  element.onpointermove=e=>{

    if(!active)return;

    table.x=

    originalX+
    e.clientX-
    startX;

    table.y=

    originalY+
    e.clientY-
    startY;

    const rect=
    canvas.getBoundingClientRect();

    table.x=

    Math.max(

      -5,

      Math.min(
        rect.width-
        30,
        table.x
      )

    );

    table.y=

    Math.max(

      28,

      Math.min(
        rect.height-
        30,
        table.y
      )

    );

    element.style.left=
    table.x+'px';

    element.style.top=
    table.y+'px';

    const bin=
    trash.getBoundingClientRect();

    const isOverTrash=

    e.clientX>=bin.left

    &&

    e.clientX<=bin.right

    &&

    e.clientY>=bin.top

    &&

    e.clientY<=bin.bottom;

    trash.classList.toggle(
      'hot',
      isOverTrash
    );
  };


  element.onpointerup=()=>{

    if(!active)return;

    active=false;

    const deleteIt=

    trash
    .classList
    .contains(
      'hot'
    );

    trash.style.display=
    'none';

    trash.classList.remove(
      'hot'
    );

    if(deleteIt){

      undoStack.push(
        beforeState
      );

      redoStack=[];

      deleteTable(
        table.id,
        false
      );

      updateHistory();

      return;
    }

    if(
      beforeState!==state()
    ){

      undoStack.push(
        beforeState
      );

      redoStack=[];

      saveOnly();

      updateHistory();
    }
  };

  element.onpointercancel=()=>{

    active=false;

    trash.style.display=
    'none';

    trash.classList.remove(
      'hot'
    );
  };
}

function saveTableSettings(){

  const table=

  S.tables.find(
    table=>
    table.id===selected.id
  );

  if(!table)return;

  const number=

  Math.max(
    1,
    +$('tableNumber').value||1
  );

  const duplicate=

  S.tables.find(
    other=>

    other.id!==table.id

    &&

    Number(other.number)===
    number
  );

  if(duplicate){

    toast(
      'This table number already exists'
    );

    return;
  }

  const seats=
  +$('tableSeats').value;

  const used=

  tableUsedSeats(
    table.id
  );

  if(
    seats<used
  ){

    toast(
      `This table already has ${used} people`
    );

    return;
  }

  pushHistory();

  table.number=
  number;

  table.seats=
  seats;

  render();

  saveOnly();
}

function duplicateTable(){

  if(!selected)return;

  const table=

  S.tables.find(
    table=>
    table.id===selected.id
  );

  if(!table)return;

  pushHistory();

  const rect=
  canvas.getBoundingClientRect();

  S.tables.push({

    id:uid(),

    number:
    nextTableNumber(),

    seats:
    table.seats,

    x:
    Math.min(
      rect.width-
      55,
      table.x+
      25
    ),

    y:
    Math.min(
      rect.height-
      55,
      table.y+
      25
    ),

    scale:
    table.scale||1

  });

  render();

  saveOnly();
}

function resizeSelected(
multiplier
){

  if(!selected)return;

  const table=

  S.tables.find(
    table=>
    table.id===selected.id
  );

  if(!table)return;

  pushHistory();

  table.scale=

  Math.max(

    .30,

    Math.min(

      1.8,

      (table.scale||1)
      *
      multiplier

    )

  );

  render();

  saveOnly();
}

function deleteTable(
id,
history=true
){

  if(history){

    pushHistory();
  }

  S.guests
  .forEach(
    guest=>{

      if(
        guest.tableId===id
      ){

        guest.tableId=null;
      }
    }
  );

  S.tables=

  S.tables.filter(
    table=>
    table.id!==id
  );

  selected=null;

  closeGuestPanel();

  render();

  saveOnly();
}

function addGuestToTable(){

  const table=

  S.tables.find(
    table=>
    table.id===activeGuestTable
  );

  if(!table)return;

  const surname=

  $('gSurname')
  .value
  .trim();

  const firstName=

  $('gFirst')
  .value
  .trim();

  const partySize=

  Math.max(

    1,

    Math.min(

      20,

      +$('gParty').value||1

    )

  );

  if(!surname){

    toast(
      'Add a surname'
    );

    return;
  }

  const available=

  table.seats-
  tableUsedSeats(
    table.id
  );

  if(
    partySize>
    available
  ){

    toast(
      `Only ${available} seats available`
    );

    return;
  }

  pushHistory();

  S.guests.push({

    id:uid(),

    surname:surname,

    firstName:firstName,

    partySize:partySize,

    tableId:
    table.id

  });

  $('gSurname').value='';

  $('gFirst').value='';

  $('gParty').value=1;

  refreshTableGuests();

  render();

  saveOnly();
}

function clearCurrentTableGuests(){

  const table=

  S.tables.find(
    table=>
    table.id===activeGuestTable
  );

  if(!table)return;

  const ids=

  S.guests

  .filter(
    guest=>
    guest.tableId===table.id
  )

  .map(
    guest=>
    guest.id
  );

  if(!ids.length){

    toast(
      'No guests at this table'
    );

    return;
  }

  if(
    !confirm(
      `Delete all guests from Table ${table.number}?`
    )
  ){
    return;
  }

  pushHistory();

  S.guests=

  S.guests.filter(
    guest=>
    !ids.includes(
      guest.id
    )
  );

  refreshTableGuests();

  render();

  saveOnly();
}

  value="1"
  placeholder="People">

  <input
  id="manualTable"
  class="field"
  style="margin-top:6px"
  type="number"
  min="1"
  placeholder="Table number">

  <button
  style="width:100%;margin-top:7px"
  onclick="addManualGuest()">

  Add Guest

  </button>

  </div>


  <div class="section">

  <button
  class="dangerSoft"
  style="width:100%"
  onclick="clearGuestList()">

  Delete Entire Guest List

  </button>

  </div>

  `;
}

function addManualGuest(){

  const surname=

  $('manualSurname')
  .value
  .trim();

  const firstName=

  $('manualFirst')
  .value
  .trim();

  const partySize=

  Math.max(
    1,
    +$('manualParty').value||1
  );

  const tableNumber=

  +$('manualTable').value;

  const table=

  S.tables.find(
    table=>

    Number(table.number)===
    tableNumber
  );

  if(!surname){

    toast(
      'Add surname'
    );

    return;
  }

  if(!table){

    toast(
      'Table not found'
    );

    return;
  }

  const available=

  table.seats-
  tableUsedSeats(
    table.id
  );

  if(
    partySize>
    available
  ){

    toast(
      `Only ${available} seats available`
    );

    return;
  }

  pushHistory();

  S.guests.push({

    id:uid(),

    surname:surname,

    firstName:firstName,

    partySize:partySize,

    tableId:
    table.id

  });

  render();

  saveOnly();

  renderGuestManager();

  toast(
    'Guest added'
  );
}


/* EDIT GUEST */

function editGuest(id){

  const guest=

  S.guests.find(
    guest=>
    guest.id===id
  );

  if(!guest)return;

  const surname=

  prompt(
    'Surname',
    guest.surname||''
  );

  if(
    surname===null
    ||
    !surname.trim()
  ){
    return;
  }

  const firstName=

  prompt(
    'First name',
    guest.firstName||''
  );

  if(
    firstName===null
  ){
    return;
  }

  const people=

  prompt(
    'Number of people',
    guest.partySize||1
  );

  if(
    people===null
  ){
    return;
  }

  const partySize=

  Math.max(
    1,
    +people||1
  );

  const currentTable=

  S.tables.find(
    table=>
    table.id===guest.tableId
  );

  const tableNumber=

  prompt(

    'Table number',

    currentTable
    ?currentTable.number
    :''

  );

  if(
    tableNumber===null
  ){
    return;
  }

  let targetTable=null;

  if(
    tableNumber.trim()
  ){

    targetTable=

    S.tables.find(
      table=>

      Number(table.number)===
      Number(tableNumber)
    );

    if(!targetTable){

      toast(
        'Table not found'
      );

      return;
    }

    const available=

    targetTable.seats-

    tableUsedSeats(
      targetTable.id,
      guest.id
    );

    if(
      partySize>
      available
    ){

      toast(
        'Not enough seats at that table'
      );

      return;
    }
  }

  pushHistory();

  guest.surname=
  surname.trim();

  guest.firstName=
  firstName.trim();

  guest.partySize=
  partySize;

  guest.tableId=

  targetTable
  ?targetTable.id
  :null;

  render();

  saveOnly();

  if(
    activeGuestTable
  ){
    refreshTableGuests();
  }

  if(
    activePanel==='lists'
  ){
    renderLists();
  }
}


/* DELETE GUEST */

function deleteGuestConfirm(id){

  const guest=

  S.guests.find(
    guest=>
    guest.id===id
  );

  if(!guest)return;

  if(
    !confirm(
      `Delete ${guestFullName(guest)}?`
    )
  ){
    return;
  }

  pushHistory();

  S.guests=

  S.guests.filter(
    guest=>
    guest.id!==id
  );

  render();

  saveOnly();

  if(
    activeGuestTable
  ){
    refreshTableGuests();
  }

  if(
    activePanel==='lists'
  ){
    renderLists();
  }

  if(
    $('directoryOverlay')
    .classList
    .contains('open')
  ){
    openDirectory();
  }
}

function clearGuestList(){

  if(
    !S.guests.length
  ){

    toast(
      'Guest list is empty'
    );

    return;
  }

  if(
    !confirm(
      `Delete all ${S.guests.length} guest entries?`
    )
  ){
    return;
  }

  pushHistory();

  S.guests=[];

  render();

  saveOnly();

  if(
    activeGuestTable
  ){
    refreshTableGuests();
  }

  if(
    activePanel==='guests'
  ){
    renderGuestManager();
  }

  if(
    activePanel==='lists'
  ){
    renderLists();
  }

  if(
    $('directoryOverlay')
    .classList
    .contains('open')
  ){
    openDirectory();
  }

  toast(
    'Guest list deleted — Undo available'
  );
}


/* LISTS */

function renderLists(){

  const cards=

  S.tables

  .slice()

  .sort(
    (a,b)=>
    a.number-b.number
  )

  .map(table=>{

    const guests=

    S.guests

    .filter(
      guest=>
      guest.tableId===table.id
    )

    .sort(
      compareGuests
    );

    const guestHtml=

    guests.length

    ?

    guests

    .map(
      guest=>

      `

      <div class="guestRow">

      <div>

      <div class="guestName">

      ${safe(
        guestFullName(
          guest
        )
      )}

      </div>

      <div class="guestMeta">

      ${guest.partySize}
      people

      </div>

      </div>

      <div class="actions">

      <button
      class="secondary"
      onclick="editGuest('${guest.id}')">

      Edit

      </button>

      <button
      class="danger"
      onclick="deleteGuestConfirm('${guest.id}')">

      Delete

      </button>

      </div>

      </div>

      `
    )

    .join('')

    :

    `

    <div
    class="hint"
    style="margin-top:7px">

    No guests

    </div>

    `;

    return`

    <div class="setupCard">

    <div
    style="
    display:flex;
    justify-content:space-between;
    align-items:center">

    <div>

    <strong>
    Table ${table.number}
    </strong>

    <div class="setupMeta">

    ${tableUsedSeats(table.id)}/${table.seats}
    people

    </div>

    </div>

    <button
    class="secondary"
    onclick="openTableGuests('${table.id}')">

    Open

    </button>

    </div>

    ${guestHtml}

    </div>

    `;
  })

  .join('');


  $('panelContent')
  .innerHTML=`

  <h2>
  Seating Lists
  </h2>

  <div class="hint">
  Every table with its guests.
  </div>

  <button
  style="width:100%"
  onclick="openDirectory()">

  Alphabetical Directory

  </button>

  <button
  class="dangerSoft"
  style="width:100%;margin-top:7px"
  onclick="clearGuestList()">

  Delete Entire Guest List

  </button>

  <div class="section">

  ${cards||

  '<div class="hint">No tables yet.</div>'}

  </div>

  `;
}


/* DIRECTORY */

function openDirectory(){

  const guests=

  S.guests

  .slice()

  .sort(
    compareGuests
  );

  const groups={};

  guests
  .forEach(
    guest=>{

      const surname=

      (guest.surname||'')
      .trim();

      const letter=

      surname

      ?surname
      .charAt(0)
      .toLocaleUpperCase(
        'el-GR'
      )

      :'#';

      if(
        !groups[letter]
      ){
        groups[letter]=[];
      }

      groups[letter]
      .push(
        guest
      );
    }
  );

  const letters=

  Object
  .keys(
    groups
  )

  .sort(
    (a,b)=>

    a.localeCompare(
      b,
      'el'
    )
  );

  $('directoryContent')
  .innerHTML=

  letters.length

  ?

  letters

  .map(
    letter=>{

      return`

      <div class="directoryLetter">

      ${safe(
        letter
      )}

      </div>

      ${groups[letter]

      .map(
        guest=>{

          const table=

          S.tables.find(
            table=>
            table.id===guest.tableId
          );

          return`

          <div class="directoryRow">

          <strong>

          ${safe(
            guestFullName(
              guest
            )
          )}

          </strong>

          <span>

          ${guest.partySize}
          people

          </span>

          <span>

          Table
          ${table
          ?table.number
          :'—'}

          </span>

          <button
          class="danger"
          style="font-size:10px;padding:5px"
          onclick="deleteGuestConfirm('${guest.id}')">

          Delete

          </button>

          </div>

          `;
        }
      )

      .join('')}

      `;
    }
  )

  .join('')

  :

  `

  <div class="hint">

  No guests yet.

  </div>

  `;

  $('directoryOverlay')
  .classList
  .add('open');
}

function closeDirectory(){

  $('directoryOverlay')
  .classList
  .remove('open');
}


/* MORE */

function renderMore(){

  $('panelContent')
  .innerHTML=`

  <h2>
  More
  </h2>

  <button
  class="secondary"
  style="width:100%"
  onclick="undo()">

  ↶ Undo

  </button>

  <button
  class="secondary"
  style="width:100%;margin-top:7px"
  onclick="redo()">

  ↷ Redo

  </button>

  <div class="section">

  <button
  class="dangerSoft"
  style="width:100%"
  onclick="clearGuestList()">

  Delete Guest List

  </button>

  </div>

  <div class="section">

  <button
  class="danger"
  style="width:100%"
  onclick="clearTables()">

  Clear Tables

  </button>

  </div>

  <div class="section">

  <button
  class="danger"
  style="width:100%"
  onclick="resetEverything()">

  Reset Everything

  </button>

  </div>

  `;
}

function clearTables(){

  if(
    !S.tables.length
  ){

    toast(
      'No tables to delete'
    );

    return;
  }

  if(
    !confirm(
      'Delete all tables? Guests will stay saved but become unassigned.'
    )
  ){
    return;
  }

  pushHistory();

  S.tables=[];

  S.guests
  .forEach(
    guest=>{
      guest.tableId=null;
    }
  );

  selected=null;

  closeGuestPanel();

  render();

  saveOnly();
}

function resetEverything(){

  if(
    !confirm(
      'Delete the entire seating plan?'
    )
  ){
    return;
  }

  pushHistory();

  S={
    venue:null,
    tables:[],
    guests:[]
  };

  selected=null;

  closeGuestPanel();

  applyVenue();

  render();

  saveOnly();
}


/* CANVAS TAP */

canvas.addEventListener(
'pointerdown',
e=>{

  if(
    mobile()
  ){
    closePanel();
  }

  if(
    e.target===canvas
    ||
    e.target===layer
  ){

    selected=null;

    context.style.display=
    'none';

    document
    .querySelectorAll('.table')
    .forEach(
      table=>
      table.classList.remove(
        'selected'
      )
    );
  }
}
);


/* STATUS */

function updateStatus(){

  const totalPeople=

  S.guests

  .reduce(
    (
      total,
      guest
    )=>

    total+
    Number(
      guest.partySize||1
    ),
    0
  );

  const seatedPeople=

  S.guests

  .filter(
    guest=>
    guest.tableId
  )

  .reduce(
    (
      total,
      guest
    )=>

    total+
    Number(
      guest.partySize||1
    ),
    0
  );

  $('status')
  .textContent=

  `${S.tables.length} tables · ${seatedPeople}/${totalPeople} people seated`;
}


/* HELPERS */

function guestFullName(
guest
){

  return[
    guest.surname||'',
    guest.firstName||''
  ]

  .filter(Boolean)

  .join(' ');
}

function compareGuests(
a,
b
){

  const surname=

  (a.surname||'')

  .localeCompare(
    b.surname||'',
    'el',
    {
      sensitivity:'base'
    }
  );

  if(
    surname!==0
  ){
    return surname;
  }

  return(
    a.firstName||''
  )

  .localeCompare(
    b.firstName||'',
    'el',
    {
      sensitivity:'base'
    }
  );
}

function safe(text){

  const div=

  document.createElement(
    'div'
  );

  div.textContent=
  text||'';

  return div.innerHTML;
}

function toast(message){

  const element=
  $('toast');

  element.textContent=
  message;

  element.style.display=
  'block';

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer=

  setTimeout(
    ()=>{

      element.style.display=
      'none';

    },
    1800
  );
}


/* START */

load();

</script>
