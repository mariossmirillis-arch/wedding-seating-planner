<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seatly V4.4</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f6f3ef;--card:#ffffff;--text:#222;--muted:#777;--line:#e5dfd8;
  --soft:#f2eee9;--accent:#222;--green:#dff3e4;--greenB:#2f7d47;
  --danger:#9b332b;--shadow:0 10px 30px rgba(30,24,18,.07)
}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:30}
.logo{font-size:26px;font-weight:900;letter-spacing:-1px}.logo span{font-weight:400}
button{border:0;border-radius:11px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:750;cursor:pointer;font:inherit}
button.sec{background:#fff;color:#222;border:1px solid var(--line)}
button.soft{background:var(--soft);color:#222}
button.danger{background:var(--danger)}
button.icon{padding:7px 9px;min-width:36px}
.app{display:grid;grid-template-columns:350px 1fr;min-height:calc(100vh - 68px)}
aside{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto}
main{padding:14px;min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.025)}
.panel h2{font-size:15px;margin:0 0 10px}
.small{font-size:12px;color:var(--muted);line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
input,select,textarea{border:1px solid #d8d1c9;border-radius:10px;padding:10px;font:inherit;background:#fff;color:#222}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(34,34,34,.12);border-color:#aaa}
.upload{display:block;border:1.5px dashed #bbb2a8;border-radius:13px;padding:18px;text-align:center;background:#fbfaf8;cursor:pointer}
.upload input{display:none}
.shell{height:calc(100vh - 155px);min-height:520px;background:#fff;border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;touch-action:none;box-shadow:var(--shadow)}
.fixedBg{position:absolute;inset:0;background:#fff center/contain no-repeat;pointer-events:none;z-index:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#999;pointer-events:none;z-index:1;padding:24px}
.overlay{position:absolute;inset:0;z-index:2}
.obj{position:absolute;touch-action:none;user-select:none;cursor:pointer}
.obj.selected{outline:3px solid rgba(34,34,34,.30);outline-offset:4px}
.table{width:112px;height:112px;display:flex;align-items:center;justify-content:center}
.core{width:72px;height:72px;border:2px solid #222;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 5px 14px rgba(0,0,0,.14);z-index:2}
.core strong{font-size:11px;letter-spacing:.2px}.core span{font-size:10px;color:#666;margin-top:2px}
.table.complete .core{background:var(--green);border-color:var(--greenB)}
.table.over .core{background:#ffe5e2;border-color:#b23b30}
.chair{position:absolute;width:14px;height:14px;border:1.5px solid #555;background:#fff;border-radius:3px}
.table.complete .chair{border-color:var(--greenB)}
.vobj{border:2px dashed #6b645e;background:rgba(255,255,255,.88);border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.selTools{position:absolute;display:none;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;gap:5px;box-shadow:0 8px 25px rgba(0,0,0,.14)}
.selTools button{padding:7px 9px}
.guestCard{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #f0ece7}
.guestCard:last-child{border-bottom:0}
.guestName{font-size:13px;font-weight:650;cursor:pointer}
.guestMeta{font-size:11px;color:#777;margin-top:2px}
.guestActions{display:flex;gap:5px}
.badge{font-size:10px;background:#eee8e1;border-radius:999px;padding:3px 7px;color:#555}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:15px}
.card{background:#fff;border-radius:18px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 70px rgba(0,0,0,.28)}
.card h2{font-size:18px;margin:0 0 12px}
.card label{display:block;font-size:12px;color:#666;margin-top:9px}
.card input,.card select,.card textarea{width:100%;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.tableGuests{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px}
.tableGuestRow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #eee}
.tableGuestRow:last-child{border-bottom:0}
.tableGuestRow .name{font-size:13px;font-weight:650}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:150}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  .shell{height:65vh;min-height:470px}
  main{padding:10px}
}
</style>
</head>
<body>

<header>
  <div class="logo">seat<span>ly</span></div>
  <button onclick="toast('Export θα το ξαναβάλουμε αφού κλειδώσουμε πρώτα το editor')">Finish / Export</button>
</header>

<div class="app">
<aside>

  <div class="panel">
    <h2>1. Venue</h2>
    <label class="upload">📷 Upload screenshot / photo
      <input id="venueFile" type="file" accept="image/*">
    </label>
    <button class="sec" style="margin-top:8px" onclick="removeVenue()">Remove image</button>
    <div class="small" style="margin-top:7px">Το background παραμένει πάντα κλειδωμένο.</div>
  </div>

  <div class="panel">
    <h2>2. Tables</h2>
    <div class="grid">
      <button class="soft" onclick="addTable(8)">+ 8 seats</button>
      <button class="soft" onclick="addTable(10)">+ 10 seats</button>
      <button class="soft" onclick="addTable(12)">+ 12 seats</button>
      <button class="soft" onclick="addTable(16)">+ 16 seats</button>
    </div>
  </div>

  <div class="panel">
    <h2>3. Venue items</h2>
    <div class="grid">
      <button class="soft" onclick="addObj('Dance Floor')">Dance Floor</button>
      <button class="soft" onclick="addObj('DJ')">DJ</button>
      <button class="soft" onclick="addObj('Bar')">Bar</button>
      <button class="soft" onclick="addObj('Stage')">Stage</button>
    </div>
  </div>

  <div class="panel">
    <h2>4. Guests</h2>
    <div class="row">
      <input id="guestNameInput" style="flex:1;min-width:0" placeholder="Guest name / Όνομα">
      <button onclick="addGuest()">Add</button>
    </div>
    <input id="guestSearch" style="width:100%;margin-top:8px" placeholder="Search guest..." oninput="renderGuests()">
    <div id="guestList"></div>
  </div>

</aside>

<main>
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <div>
      <b>Your venue</b>
      <div class="small" id="status"></div>
    </div>
    <button class="sec" onclick="deselect()">Lock all</button>
  </div>

  <div class="shell" id="shell">
    <div class="fixedBg" id="bg"></div>
    <div class="empty" id="empty">
      <div>
        <div style="font-size:30px;margin-bottom:8px">🪑</div>
        <b>Start your seating plan</b>
        <div class="small" style="margin-top:5px">Upload a venue plan or start with a clean white canvas.</div>
      </div>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="selTools" id="selTools">
      <button onclick="resizeSelected(1.1)">＋</button>
      <button onclick="resizeSelected(.9)">−</button>
      <button onclick="rotateSelected(15)">↻</button>
      <button class="sec" onclick="openSelectedSettings()">Edit</button>
      <button class="sec" onclick="deselect()">Lock</button>
    </div>
  </div>
</main>
</div>

<!-- TABLE SETTINGS -->
<div class="modal" id="tableModal">
  <div class="card">
    <h2 id="tableModalTitle">Table settings</h2>
    <label>Table number</label><input id="tNum" type="number" min="1">
    <label>Seats</label><input id="tSeats" type="number" min="1">

    <div class="small" id="tableSummary" style="margin-top:10px"></div>

    <h2 style="font-size:15px;margin-top:16px">Guests at this table</h2>
    <div class="tableGuests" id="tableGuestsList"></div>

    <div class="actions">
      <button onclick="saveTableSettings()">Save table</button>
      <button class="danger" onclick="deleteSelected()">Delete table</button>
      <button class="sec" onclick="hide('tableModal')">Close</button>
      <button class="sec" onclick="deselect();hide('tableModal')">Lock</button>
    </div>
  </div>
</div>

<!-- OBJECT SETTINGS -->
<div class="modal" id="objModal">
  <div class="card">
    <h2 id="objTitle">Object settings</h2>
    <label>Width</label><input id="oW" type="range" min="60" max="360">
    <label>Height</label><input id="oH" type="range" min="40" max="300">
    <div class="actions">
      <button onclick="saveObjSettings()">Save</button>
      <button class="danger" onclick="deleteSelected()">Delete</button>
      <button class="sec" onclick="hide('objModal')">Close</button>
      <button class="sec" onclick="deselect();hide('objModal')">Lock</button>
    </div>
  </div>
</div>

<!-- GUEST EDIT -->
<div class="modal" id="guestEditModal">
  <div class="card">
    <h2>Edit guest</h2>
    <label>Name</label>
    <input id="editGuestName">
    <label>Table</label>
    <select id="editGuestTable"></select>

    <div class="actions">
      <button onclick="saveGuestEdit()">Save changes</button>
      <button class="danger" onclick="deleteEditingGuest()">Delete guest</button>
      <button class="sec" onclick="hide('guestEditModal')">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let S={tables:[],objects:[],guests:[],counter:0,venue:null};
let selected=null;
let editingGuestId=null;

const shell=document.getElementById('shell');
const overlay=document.getElementById('overlay');
const bg=document.getElementById('bg');
const tools=document.getElementById('selTools');
const uid=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());

function save(){
  try{localStorage.setItem('seatly_v44',JSON.stringify(S))}catch(e){}
  updateStatus();
}
function load(){
  try{
    let x=localStorage.getItem('seatly_v44')||localStorage.getItem('seatly_v43');
    if(x)S=Object.assign(S,JSON.parse(x));
  }catch(e){}
  applyVenue();render();
}
function applyVenue(){bg.style.backgroundImage=S.venue?`url("${S.venue}")`:'none'}

venueFile.onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=x=>{S.venue=x.target.result;applyVenue();render();save()};
  r.readAsDataURL(file);
};
function removeVenue(){S.venue=null;applyVenue();render();save()}

/* TABLES */
function addTable(seats){
  S.counter++;
  const i=S.tables.length;
  S.tables.push({
    id:uid(),kind:'table',number:S.counter,seats,scale:1,rotation:0,
    x:60+(i%5)*125,y:70+Math.floor(i/5)*120
  });
  render();save();
}

/* OBJECTS */
function addObj(label){
  const i=S.objects.length;
  let w=140,h=70;
  if(label==='Dance Floor'){w=170;h=170}
  S.objects.push({
    id:uid(),kind:'object',label,w,h,scale:1,rotation:0,
    x:220+i*30,y:180+i*25
  });
  render();save();
}

/* GUESTS */
function addGuest(){
  const n=guestNameInput.value.trim(); if(!n)return;
  S.guests.push({id:uid(),name:n,tableId:null});
  guestNameInput.value='';
  renderGuests();save();
}
guestNameInput.addEventListener('keydown',e=>{if(e.key==='Enter')addGuest()});

function renderGuests(){
  const q=(guestSearch.value||'').trim().toLowerCase();
  guestList.innerHTML='';

  S.guests
    .filter(g=>!q||g.name.toLowerCase().includes(q))
    .forEach(g=>{
      const t=S.tables.find(x=>x.id===g.tableId);

      const row=document.createElement('div');
      row.className='guestCard';

      const info=document.createElement('div');
      info.innerHTML=`<div class="guestName">${safe(g.name)}</div>
                      <div class="guestMeta">${t?'Table '+t.number:'Unassigned'}</div>`;
      info.onclick=()=>openGuestEdit(g.id);

      const actions=document.createElement('div');
      actions.className='guestActions';

      const edit=document.createElement('button');
      edit.className='sec icon';
      edit.textContent='✎';
      edit.title='Edit';
      edit.onclick=()=>openGuestEdit(g.id);

      const del=document.createElement('button');
      del.className='danger icon';
      del.textContent='×';
      del.title='Delete';
      del.onclick=()=>deleteGuest(g.id);

      actions.append(edit,del);
      row.append(info,actions);
      guestList.appendChild(row);
    });
}

function openGuestEdit(id){
  editingGuestId=id;
  const g=S.guests.find(x=>x.id===id); if(!g)return;

  editGuestName.value=g.name;

  editGuestTable.innerHTML='<option value="">Unassigned</option>';
  S.tables
    .slice()
    .sort((a,b)=>a.number-b.number)
    .forEach(t=>{
      const count=S.guests.filter(x=>x.tableId===t.id).length;
      const op=document.createElement('option');
      op.value=t.id;
      op.textContent=`Table ${t.number} (${count}/${t.seats})`;
      editGuestTable.appendChild(op);
    });

  editGuestTable.value=g.tableId||'';
  show('guestEditModal');
}

function saveGuestEdit(){
  const g=S.guests.find(x=>x.id===editingGuestId); if(!g)return;

  const newName=editGuestName.value.trim();
  const newTable=editGuestTable.value||null;

  if(!newName)return toast('Guest name is required');

  if(newTable){
    const t=S.tables.find(x=>x.id===newTable);
    const count=S.guests.filter(x=>x.tableId===newTable&&x.id!==g.id).length;
    if(t && count>=t.seats)return toast('That table is full');
  }

  g.name=newName;
  g.tableId=newTable;

  hide('guestEditModal');
  render();save();
}

function deleteGuest(id){
  if(!confirm('Delete this guest?'))return;
  S.guests=S.guests.filter(x=>x.id!==id);
  render();save();
}
function deleteEditingGuest(){
  if(!editingGuestId)return;
  if(!confirm('Delete this guest?'))return;
  S.guests=S.guests.filter(x=>x.id!==editingGuestId);
  editingGuestId=null;
  hide('guestEditModal');
  render();save();
}

/* SELECT */
function getSelected(){
  if(!selected)return null;
  return selected.kind==='table'
    ? S.tables.find(x=>x.id===selected.id)
    : S.objects.find(x=>x.id===selected.id);
}
function selectItem(kind,id){selected={kind,id};render()}
function deselect(){selected=null;tools.style.display='none';render()}
function positionTools(el){
  const sr=shell.getBoundingClientRect(),er=el.getBoundingClientRect();
  tools.style.left=Math.max(6,Math.min(sr.width-260,er.left-sr.left))+'px';
  tools.style.top=Math.max(6,Math.min(sr.height-50,er.bottom-sr.top+7))+'px';
  tools.style.display='flex';
}
function resizeSelected(mult){
  const item=getSelected(); if(!item)return;
  item.scale=Math.max(.5,Math.min(2.2,(item.scale||1)*mult));
  render();save();
}
function rotateSelected(deg){
  const item=getSelected(); if(!item)return;
  item.rotation=((item.rotation||0)+deg)%360;
  render();save();
}

/* TABLE MANAGER */
function openSelectedSettings(){
  const item=getSelected(); if(!item)return;

  if(selected.kind==='table'){
    tNum.value=item.number;
    tSeats.value=item.seats;
    refreshTableGuestManager();
    show('tableModal');
  }else{
    objTitle.textContent=item.label+' settings';
    oW.value=item.w;oH.value=item.h;
    show('objModal');
  }
}

function refreshTableGuestManager(){
  const t=getSelected(); if(!t||selected.kind!=='table')return;

  const guests=S.guests.filter(g=>g.tableId===t.id);
  tableModalTitle.textContent=`Table ${t.number}`;
  tableSummary.textContent=`${guests.length}/${t.seats} seats filled`;
  tableGuestsList.innerHTML='';

  if(!guests.length){
    tableGuestsList.innerHTML='<div class="small" style="padding:8px">No guests assigned yet.</div>';
    return;
  }

  guests.forEach(g=>{
    const row=document.createElement('div');
    row.className='tableGuestRow';

    const name=document.createElement('div');
    name.className='name';
    name.textContent=g.name;
    name.onclick=()=>openGuestEdit(g.id);

    const actions=document.createElement('div');
    actions.className='guestActions';

    const edit=document.createElement('button');
    edit.className='sec icon';
    edit.textContent='✎';
    edit.onclick=()=>openGuestEdit(g.id);

    const remove=document.createElement('button');
    remove.className='sec icon';
    remove.textContent='↗';
    remove.title='Remove from table';
    remove.onclick=()=>{
      g.tableId=null;
      refreshTableGuestManager();
      renderGuests();
      render();
      save();
    };

    actions.append(edit,remove);
    row.append(name,actions);
    tableGuestsList.appendChild(row);
  });
}

function saveTableSettings(){
  const t=getSelected(); if(!t||selected.kind!=='table')return;

  const seats=Math.max(1,+tSeats.value||1);
  const current=S.guests.filter(g=>g.tableId===t.id).length;
  if(seats<current)return toast(`This table already has ${current} guests`);

  t.number=Math.max(1,+tNum.value||1);
  t.seats=seats;

  refreshTableGuestManager();
  render();save();
}
function saveObjSettings(){
  const o=getSelected(); if(!o)return;
  o.w=+oW.value||o.w;
  o.h=+oH.value||o.h;
  hide('objModal');render();save();
}
function deleteSelected(){
  if(!selected)return;

  if(selected.kind==='table'){
    if(!confirm('Delete this table? Guests will become unassigned.'))return;
    S.guests.forEach(g=>{if(g.tableId===selected.id)g.tableId=null});
    S.tables=S.tables.filter(x=>x.id!==selected.id);
    hide('tableModal');
  }else{
    if(!confirm('Delete this venue item?'))return;
    S.objects=S.objects.filter(x=>x.id!==selected.id);
    hide('objModal');
  }

  selected=null;
  tools.style.display='none';
  render();save();
}

/* CHAIRS */
function chairs(wrap,seats){
  const n=Math.min(seats,16),radius=47;
  for(let i=0;i<n;i++){
    const a=2*Math.PI*i/n-Math.PI/2;
    const c=document.createElement('div');
    c.className='chair';
    c.style.left=(56+Math.cos(a)*radius-7)+'px';
    c.style.top=(56+Math.sin(a)*radius-7)+'px';
    c.style.transform=`rotate(${a*180/Math.PI+90}deg)`;
    wrap.appendChild(c);
  }
}

/* TOUCH / DRAG / PINCH */
function attachInteraction(el,item,kind){
  const pointers=new Map();
  let dragStart=null;
  let pinchStart=null;

  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();

    if(!selected||selected.id!==item.id){
      selectItem(kind,item.id);
      return;
    }

    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{el.setPointerCapture(e.pointerId)}catch(_){}

    if(pointers.size===1){
      dragStart={x:e.clientX,y:e.clientY,ox:item.x,oy:item.y};
    }else if(pointers.size===2){
      const p=[...pointers.values()];
      pinchStart={
        dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),
        scale:item.scale||1
      };
    }
  });

  el.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

    if(pointers.size===1&&dragStart){
      item.x=dragStart.ox+(e.clientX-dragStart.x);
      item.y=dragStart.oy+(e.clientY-dragStart.y);
      el.style.left=item.x+'px';
      el.style.top=item.y+'px';
      positionTools(el);
    }

    if(pointers.size===2){
      const p=[...pointers.values()];
      if(!pinchStart){
        pinchStart={
          dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),
          scale:item.scale||1
        };
      }
      const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      item.scale=Math.max(.5,Math.min(2.2,pinchStart.scale*(dist/pinchStart.dist)));
      el.style.transform=`scale(${item.scale}) rotate(${item.rotation||0}deg)`;
      positionTools(el);
    }
  });

  const end=e=>{
    pointers.delete(e.pointerId);
    if(!pointers.size){
      dragStart=null;pinchStart=null;save();
    }else if(pointers.size===1){
      const p=[...pointers.values()][0];
      dragStart={x:p.x,y:p.y,ox:item.x,oy:item.y};
      pinchStart=null;
    }
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);

  el.addEventListener('wheel',e=>{
    if(!selected||selected.id!==item.id)return;
    e.preventDefault();
    item.scale=Math.max(.5,Math.min(2.2,(item.scale||1)*(e.deltaY<0?1.08:.92)));
    el.style.transform=`scale(${item.scale}) rotate(${item.rotation||0}deg)`;
    positionTools(el);save();
  },{passive:false});
}

/* RENDER */
function render(){
  overlay.innerHTML='';

  S.tables.forEach(t=>{
    const el=document.createElement('div');
    el.className='obj table'+(selected&&selected.id===t.id?' selected':'');

    const count=S.guests.filter(g=>g.tableId===t.id).length;
    if(count===t.seats)el.classList.add('complete');
    if(count>t.seats)el.classList.add('over');

    el.style.left=t.x+'px';
    el.style.top=t.y+'px';
    el.style.transform=`scale(${t.scale||1}) rotate(${t.rotation||0}deg)`;

    chairs(el,t.seats);

    const core=document.createElement('div');
    core.className='core';
    core.innerHTML=`<strong>TABLE ${t.number}</strong><span>${count}/${t.seats} seats</span>`;
    el.appendChild(core);

    attachInteraction(el,t,'table');
    overlay.appendChild(el);

    if(selected&&selected.id===t.id)setTimeout(()=>positionTools(el),0);
  });

  S.objects.forEach(o=>{
    const el=document.createElement('div');
    el.className='obj vobj'+(selected&&selected.id===o.id?' selected':'');
    el.style.left=o.x+'px';
    el.style.top=o.y+'px';
    el.style.width=o.w+'px';
    el.style.height=o.h+'px';
    el.style.transform=`scale(${o.scale||1}) rotate(${o.rotation||0}deg)`;
    el.textContent=o.label;

    attachInteraction(el,o,'object');
    overlay.appendChild(el);

    if(selected&&selected.id===o.id)setTimeout(()=>positionTools(el),0);
  });

  empty.style.display=(S.venue||S.tables.length||S.objects.length)?'none':'grid';
  renderGuests();
  updateStatus();
}

shell.addEventListener('pointerdown',e=>{
  if(e.target===shell||e.target===overlay)deselect();
});

function updateStatus(){
  const assigned=S.guests.filter(g=>g.tableId).length;
  const complete=S.tables.filter(t=>S.guests.filter(g=>g.tableId===t.id).length===t.seats).length;
  status.textContent=`${S.tables.length} tables · ${complete} complete · ${assigned}/${S.guests.length} guests assigned`;
}
function show(id){document.getElementById(id).style.display='flex'}
function hide(id){document.getElementById(id).style.display='none'}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(window.tt);
  window.tt=setTimeout(()=>t.style.display='none',1600);
}
function safe(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

load();
</script>
</body>
