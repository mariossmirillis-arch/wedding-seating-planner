<!doctype html>
<html lang="el">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seatly 4.7</title>

<style>

*{
box-sizing:border-box
}

:root{
--bg:#f3f1ed;
--paper:#fff;
--ink:#202020;
--muted:#777;
--line:#e4ded6;
--soft:#f3efe9;
--green:#dff3e4;
--greenBorder:#34784a;
--danger:#a43a32;
--dangerSoft:#fff0ee;
--accent:#222;
}

html,
body{
margin:0;
width:100%;
height:100%;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--ink)
}

body{
overflow:hidden
}

button,
input,
select{
font:inherit
}

button{
border:0;
border-radius:10px;
padding:9px 11px;
background:var(--ink);
color:#fff;
font-weight:700;
cursor:pointer
}

button.secondary{
background:#fff;
color:var(--ink);
border:1px solid var(--line)
}

button.soft{
background:var(--soft);
color:var(--ink)
}

button.danger{
background:var(--danger);
color:#fff
}

button.dangerSoft{
background:var(--dangerSoft);
color:var(--danger);
border:1px solid #efc8c3
}

button:disabled{
opacity:.35;
cursor:default
}


/* =========================
TOP
========================= */

.topbar{
height:58px;
background:#fff;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
position:relative;
z-index:130
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:-1px
}

.logo span{
font-weight:400
}

.topActions{
display:flex;
align-items:center;
gap:5px
}

.saved{
font-size:11px;
color:#777;
min-width:55px;
text-align:right
}

.saved.error{
color:var(--danger);
font-weight:800
}


/* =========================
STEP BAR
========================= */

.stepBar{
height:46px;
background:#fff;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:center;
gap:6px;
padding:5px 10px;
position:relative;
z-index:125;
overflow:auto
}

.stepButton{
background:#f5f2ed;
color:#666;
border:1px solid #e5ded5;
padding:7px 12px;
border-radius:999px;
font-size:11px;
white-space:nowrap
}

.stepButton.active{
background:#222;
color:#fff;
border-color:#222
}

.stepButton.done{
background:#e7f4ea;
color:#28663c;
border-color:#bedbc6
}


/* =========================
APP
========================= */

.app{
height:calc(100vh - 104px);
display:grid;
grid-template-columns:58px 282px 1fr
}


/* =========================
RAIL
========================= */

.rail{
background:#202020;
padding:6px 4px;
display:flex;
flex-direction:column;
gap:6px;
z-index:100
}

.rail button{
height:56px;
background:transparent;
padding:4px;
font-size:8px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px
}

.rail button b{
font-size:17px
}

.rail button.active{
background:#fff;
color:#222
}


/* =========================
PANEL
========================= */

.panel{
background:#fff;
border-right:1px solid var(--line);
padding:14px;
overflow:auto;
position:relative;
z-index:90
}

.panel h2{
font-size:19px;
margin:0 0 4px
}

.panel h3{
font-size:14px;
margin:0 0 7px
}

.hint{
font-size:12px;
color:var(--muted);
line-height:1.45;
margin-bottom:12px
}

.section{
border-top:1px solid #eee8e1;
padding-top:12px;
margin-top:12px
}

.field{
width:100%;
padding:10px;
border:1px solid #d8d1c9;
border-radius:10px;
background:#fff
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.grid4{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px
}

.panelClose{
display:none
}

.stepTitle{
display:flex;
align-items:center;
gap:8px;
margin-bottom:3px
}

.stepNumber{
width:28px;
height:28px;
border-radius:50%;
background:#222;
color:#fff;
display:grid;
place-items:center;
font-size:12px;
font-weight:900
}

.primaryWide{
width:100%;
margin-top:9px;
padding:12px
}


/* =========================
CARDS
========================= */

.card{
border:1px solid var(--line);
border-radius:14px;
padding:11px;
background:#faf9f7;
margin-top:8px
}

.cardTitle{
font-size:14px;
font-weight:850
}

.meta{
font-size:11px;
color:#777;
margin-top:2px
}

.quickButton{
background:#f5f2ed;
color:#222;
border:1px solid #e0dad1;
padding:12px 5px
}

.quickOption{
display:grid;
grid-template-columns:1fr auto;
align-items:center;
gap:7px;
padding:9px 0;
border-top:1px solid #ece7e1
}


/* =========================
WORKSPACE
========================= */

.work{
background:#eae7e2;
padding:7px;
min-width:0;
min-height:0;
overflow:hidden;
display:flex;
align-items:stretch;
justify-content:center
}

.canvasWrap{
width:100%;
height:100%;
display:flex;
align-items:stretch;
justify-content:center
}

.canvas{
position:relative;
width:min(100%,1400px);
height:100%;
background:#fff;
border:1px solid var(--line);
border-radius:16px;
overflow:hidden;
touch-action:none;
box-shadow:0 12px 30px rgba(0,0,0,.08)
}

.venueBg{
position:absolute;
inset:0;
background:#fff center/contain no-repeat;
pointer-events:none;
z-index:1
}

.objectLayer{
position:absolute;
inset:0;
z-index:5
}

.tableLayer{
position:absolute;
inset:0;
z-index:10
}

.empty{
position:absolute;
inset:0;
display:grid;
place-items:center;
text-align:center;
color:#999;
pointer-events:none;
z-index:2
}

.obj{
position:absolute;
touch-action:none;
user-select:none;
transform-origin:top left
}


/* =========================
VENUE OBJECTS
========================= */

.venueObject{
border:2px dashed #555;
background:rgba(255,255,255,.92);
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:10px;
font-weight:850;
cursor:grab;
box-shadow:0 3px 10px rgba(0,0,0,.08)
}

.venueObject.locked{
cursor:default;
pointer-events:none
}

.venueObject.selected{
outline:3px solid rgba(32,32,32,.18);
outline-offset:3px
}

.dancefloor{
border-style:solid;
background:
linear-gradient(
45deg,
#fafafa 25%,
#ececec 25%,
#ececec 50%,
#fafafa 50%,
#fafafa 75%,
#ececec 75%
);
background-size:24px 24px
}

.djbox{
background:#292929;
color:#fff;
border-color:#111
}

.bar{
background:#f3ece4;
border-radius:7px
}

.entrance{
background:#fff;
border-style:double
}


/* =========================
TABLES
========================= */

.table{
width:82px;
height:82px;
display:flex;
align-items:center;
justify-content:center;
cursor:grab
}

.table.locked{
cursor:pointer
}

.table.selected{
outline:3px solid rgba(32,32,32,.17);
outline-offset:3px
}

.core{
width:48px;
height:48px;
border:2px solid #222;
border-radius:50%;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-shadow:0 4px 12px rgba(0,0,0,.13);
z-index:2
}

.core b{
font-size:8px
}

.core span{
font-size:8px;
color:#666;
margin-top:2px
}

.table.complete .core{
background:var(--green);
border-color:var(--greenBorder)
}

.chair{
position:absolute;
width:9px;
height:9px;
border:1.1px solid #555;
background:#fff;
border-radius:3px
}


/* =========================
CONTEXT
========================= */

.context{
position:absolute;
left:50%;
top:8px;
transform:translateX(-50%);
display:none;
align-items:center;
gap:5px;
background:#fff;
border:1px solid var(--line);
border-radius:12px;
padding:5px;
z-index:50;
box-shadow:0 8px 22px rgba(0,0,0,.14);
max-width:96%;
overflow:auto
}

.context input,
.context select{
width:62px;
padding:6px;
border:1px solid var(--line);
border-radius:8px
}

.context button{
padding:6px 7px;
font-size:11px
}


/* =========================
GUIDES
========================= */

.guide{
position:absolute;
pointer-events:none;
background:#333;
opacity:.2;
display:none;
z-index:20
}

.guide.v{
top:0;
bottom:0;
width:1px
}

.guide.h{
left:0;
right:0;
height:1px
}


/* =========================
TRASH
========================= */

.trash{
position:absolute;
left:50%;
bottom:12px;
transform:translateX(-50%);
display:none;
background:#fff;
border:2px solid var(--line);
border-radius:999px;
padding:8px 15px;
font-size:11px;
font-weight:850;
z-index:55
}

.trash.hot{
background:#ffe7e3;
border-color:#b23b30
}


/* =========================
STATUS
========================= */

.status{
position:absolute;
left:8px;
bottom:8px;
background:#fff;
border:1px solid var(--line);
border-radius:999px;
padding:6px 9px;
font-size:10px;
color:#666;
z-index:30
}


/* =========================
GUEST PANEL
========================= */

.guestPanel{
position:fixed;
top:104px;
right:0;
bottom:0;
width:380px;
background:#fff;
border-left:1px solid var(--line);
box-shadow:-10px 0 30px rgba(0,0,0,.12);
z-index:120;
display:none;
padding:15px;
overflow:auto
}

.guestPanel.open{
display:block
}

.guestHeader{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:8px;
margin-bottom:12px
}

.guestTitle{
font-size:21px;
font-weight:850
}

.guestCount{
font-size:12px;
color:#777
}

.guestBox{
background:#faf9f7;
border:1px solid var(--line);
border-radius:13px;
padding:11px
}

.formLabel{
font-size:11px;
font-weight:750;
color:#666;
margin:8px 0 4px
}

.guestRow{
display:grid;
grid-template-columns:1fr auto;
gap:7px;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee
}

.guestName{
font-size:13px;
font-weight:700
}

.guestMeta{
font-size:11px;
color:#777
}

.actions{
display:flex;
gap:4px
}

.actions button{
font-size:10px;
padding:5px 6px
}


/* =========================
SUMMARY
========================= */

.summaryGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.summaryCard{
border:1px solid var(--line);
border-radius:13px;
background:#faf9f7;
padding:11px
}

.summaryNumber{
font-size:23px;
font-weight:900
}

.summaryLabel{
font-size:10px;
color:#777;
margin-top:2px
}


/* =========================
PRINT
========================= */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:center;
justify-content:center;
padding:18px;
z-index:250
}

.overlay.open{
display:flex
}

.modal{
width:min(920px,100%);
max-height:94vh;
overflow:auto;
background:#fff;
border-radius:18px;
padding:20px
}

.modalTop{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px
}

.printSettings{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin:12px 0
}

.printSheet{
background:#fff;
color:#111;
width:100%;
min-height:900px;
padding:44px;
border:1px solid #ddd;
margin-top:15px
}

.chartWelcome{
text-align:center;
font-family:Georgia,serif;
font-size:62px;
font-style:italic;
line-height:1
}

.chartSmall{
text-align:center;
font-size:10px;
letter-spacing:4px;
margin-top:24px
}

.chartNames{
text-align:center;
font-family:Georgia,serif;
font-size:28px;
letter-spacing:4px;
margin-top:6px
}

.chartDate{
text-align:center;
font-size:10px;
letter-spacing:3px;
margin-top:8px
}

.chartFind{
text-align:center;
font-family:Georgia,serif;
font-size:26px;
font-style:italic;
margin:26px 0 32px
}

.chartColumns{
columns:4;
column-gap:32px
}

.chartGroup{
break-inside:avoid;
margin-bottom:18px
}

.chartLetter{
font-family:Georgia,serif;
font-size:24px;
margin-bottom:6px
}

.chartPerson{
display:flex;
align-items:flex-end;
gap:4px;
font-family:Georgia,serif;
font-size:10px;
line-height:1.6
}

.chartPersonName{
white-space:nowrap
}

.chartDots{
border-bottom:1px dotted #777;
flex:1;
height:10px
}

.chartTable{
min-width:18px;
text-align:right
}


/* =========================
MOBILE
========================= */

@media(max-width:800px){

.topbar{
height:56px;
padding:0 7px
}

.logo{
font-size:21px
}

.saved{
display:none
}

.stepBar{
height:42px;
justify-content:flex-start;
padding:4px 7px
}

.stepButton{
font-size:9px;
padding:6px 9px
}

.app{
height:calc(100vh - 98px);
grid-template-columns:54px 1fr
}

.rail{
padding:4px 2px
}

.rail button{
height:52px;
font-size:7px
}

.work{
grid-column:2;
padding:4px
}

.canvas{
width:100%;
height:100%;
border-radius:12px
}

.panel{
position:fixed;
left:54px;
right:0;
bottom:0;
top:auto;
width:auto;
max-height:58vh;
display:none;
border-right:0;
border-top:1px solid var(--line);
border-radius:18px 18px 0 0;
padding:46px 12px 12px;
box-shadow:0 -10px 30px rgba(0,0,0,.18);
z-index:110
}

.panel.open{
display:block
}

.panelClose{
display:block;
position:absolute;
right:9px;
top:7px;
width:34px;
height:34px;
padding:0;
border-radius:50%;
background:var(--soft);
color:#222;
border:1px solid var(--line);
font-size:20px
}

.guestPanel{
top:98px;
left:54px;
right:0;
bottom:0;
width:auto;
border-left:0;
box-shadow:none
}

.context{
white-space:nowrap
}

.table{
width:72px;
height:72px
}

.core{
width:42px;
height:42px
}

.core b,
.core span{
font-size:7px
}

.printSettings{
grid-template-columns:1fr
}

.printSheet{
padding:22px;
min-height:700px
}

.chartWelcome{
font-size:44px
}

.chartColumns{
columns:2;
column-gap:20px
}

}


/* =========================
PRINT
========================= */

@media print{

body *{
visibility:hidden!important
}

#printSheet,
#printSheet *{
visibility:visible!important
}

#printSheet{
position:absolute;
left:0;
top:0;
width:100%;
min-height:auto;
margin:0;
padding:15mm;
border:0
}

}

</style>

</head>

seat<span>ly</span>

id="stepBtn3"

<div>

<div style="font-size:34px">
♡

<b>

</b>

Start with Step 1 — Venue

</div>

class="objectLayer"

</div>

<div

<script>

/* ==================================================
STATE
================================================== */

const STORAGE_KEY='seatly47';

let currentStep=1;

let selected=null;

function migrateLegacyCoordinates(){

const w=
canvas.clientWidth||1;


const h=
canvas.clientHeight||1;


S.tables
.forEach(table=>{

if(
table.xPct===undefined
){

table.xPct=
clamp(
Number(table.x||0)/
w*
100,
0,
95
);

}


if(
table.yPct===undefined
){

table.yPct=
clamp(
Number(table.y||0)/
h*
100,
0,
95
);

}


delete table.x;

delete table.y;

});


S.objects
.forEach(object=>{

if(
object.xPct===undefined
){

object.xPct=
clamp(
Number(object.x||0)/
w*
100,
0,
95
);

}


if(
object.yPct===undefined
){

object.yPct=
clamp(
Number(object.y||0)/
h*
100,
0,
95
);

}


if(
object.widthPct===undefined
){

object.widthPct=
clamp(
Number(object.width||120)/
w*
100,
4,
60
);

}


if(
object.heightPct===undefined
){

object.heightPct=
clamp(
Number(object.height||60)/
h*
100,
3,
60
);

}


delete object.x;

delete object.y;

delete object.width;

delete object.height;

});

}

function handleVenueUpload(event){

const file=
event.target.files[0];


if(!file)
return;


compressImage(
file,
1800,
.82
)

.then(dataUrl=>{

const previous=
S.venueImage;


pushHistory();


S.venueImage=
dataUrl;


applyVenue();


if(
!saveOnly()
){

S.venueImage=
previous;


applyVenue();


toast(
'Image is too large to save'

return;

}


render();


toast(
'Venue image added'
);

})

.catch(
()=>{

toast(
'Could not open this image'
);

}
);

}


function compressImage(
file,
maxDimension,
quality
){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();


reader.onload=
event=>{

const img=
new Image();


img.onload=
()=>{

let width=
img.width;


let height=
img.height;


const maxSide=
Math.max(
width,
height
);


if(
maxSide>
maxDimension
){

const ratio=
maxDimension/
maxSide;


width=
Math.round(
width*
ratio
);


height=
Math.round(
height*
ratio
);

}


const c=
document.createElement(
'canvas'
);


c.width=
width;


c.height=
height;


const ctx=
c.getContext('2d');


ctx.drawImage(
img,
0,
0,
width,
height
);


resolve(
c.toDataURL(
'image/jpeg',
quality
)
);

};


img.onerror=
reject;


img.src=
event.target.result;

};


reader.onerror=
reject;


reader.readAsDataURL(
file
);

}
);

}

function createGrid(
qty,
seats
){

const rect=
canvas.getBoundingClientRect();


let scale=.75;


if(
qty>=10
)
scale=.65;


if(
qty>=18
)
scale=.56;


if(
qty>=28
)
scale=.48;


if(
qty>=38
)
scale=.42;


const baseSize=

mobile()
?72
:82;


const item=

baseSize*
scale;


const gap=12;


let columns=

Math.max(
1,
Math.floor(
(rect.width-20)/
(item+gap)
)
);


columns=

Math.min(
columns,
qty
);


let rows=

Math.ceil(
qty/
columns
);


while(

rows*
(item+gap)
>
rect.height-70

&&

columns<qty

){

columns++;


rows=

Math.ceil(
qty/
columns
);

}


const gridWidth=

(columns-1)
*
(item+gap);


const gridHeight=

(rows-1)
*
(item+gap);


const startX=

Math.max(
6,
rect.width/2
-
gridWidth/2
-
item/2
);


const startY=

Math.max(
38,
rect.height/2
-
gridHeight/2
-
item/2
);


for(
let i=0;
i<qty;
i++
){

const col=
i%
columns;


const row=

Math.floor(
i/
columns
);


S.tables.push({

id:uid(),

number:
nextTableNumber(),

seats,

xPct:
pctX(
startX+
col*
(item+gap)
),

yPct:
pctY(
startY+
row*
(item+gap)
),

scale

});

}

}


function nextTableNumber(){

const numbers=

S.tables
.map(
table=>
Number(table.number)
);


let number=1;


while(
numbers.includes(number)
){

number++;

}


return number;

}


function findFreeTablePosition(){

const rect=
canvas.getBoundingClientRect();


const base=

mobile()
?72
:82;


const step=
base*.8+13;


for(
let y=45;
y<rect.height-base;
y+=step
){

for(
let x=12;
x<rect.width-base;
x+=step
){

const collision=

S.tables.some(table=>{

const tx=
pxX(
table.xPct
);


const ty=
pxY(
table.yPct
);


return(

Math.abs(
tx-x
)
<
base*.65

&&

Math.abs(
ty-y
)
<
base*.65

);

});


if(
!collision
){

return{

xPct:
pctX(x),

yPct:
pctY(y)

};

}

}

}


return{

xPct:45,

yPct:45

};

}

/* ==================================================
CHAIRS
================================================== */

function createChairs(
element,
seats
){

const count=

Math.min(
16,
Number(seats)
);


const base=

mobile()
?36
:41;


const radius=

mobile()
?29
:34;


for(
let i=0;
i<count;
i++
){

const angle=

2*
Math.PI*
i/count

-

Math.PI/2;


const chair=

document.createElement(
'div'
);


chair.className=
'chair';


chair.style.left=

(
base
+
Math.cos(angle)*
radius
-
4.5
)

+'px';


chair.style.top=

(
base
+
Math.sin(angle)*
radius
-
4.5
)

+'px';


element.appendChild(
chair
);

}

}


/* ==================================================
DRAG + BOUNDARY + SNAP
================================================== */

function attachDrag(
element,
item,
kind
){

let startX;

let startY;

let originalLeft;

let originalTop;

let active=false;

let beforeState=null;


element.onpointerdown=
event=>{

event.stopPropagation();


selected={

id:item.id,

kind

};


document
.querySelectorAll('.obj')

.forEach(
object=>
object.classList.remove(
'selected'
)
);


element.classList.add(
'selected'
);


renderContext();


const rect=
canvas.getBoundingClientRect();


startX=
event.clientX;


startY=
event.clientY;


originalLeft=
pxX(
item.xPct
);


originalTop=
pxY(
item.yPct
);


beforeState=
stateString();


active=true;


trash.style.display=
'block';


try{

element.setPointerCapture(
event.pointerId
);

}
catch(error){}

};


element.onpointermove=
event=>{

if(
!active
)
return;


const canvasRect=
canvas.getBoundingClientRect();


const scale=
Number(
item.scale||1
);


const visualWidth=

element.offsetWidth*
scale;


const visualHeight=

element.offsetHeight*
scale;


let left=

originalLeft
+
event.clientX
-
startX;


let top=

originalTop
+
event.clientY
-
startY;


left=

clamp(
left,
0,
Math.max(
0,
canvasRect.width-
visualWidth
)
);


top=

clamp(
top,
0,
Math.max(
0,
canvasRect.height-
visualHeight
)
);


if(
kind==='table'
){

const snapped=

snapTable(
item,
left,
top
);


left=
snapped.left;


top=
snapped.top;

}


item.xPct=
pctX(left);


item.yPct=
pctY(top);


element.style.left=
item.xPct+'%';


element.style.top=
item.yPct+'%';


const bin=
trash.getBoundingClientRect();


const over=

event.clientX>=bin.left

&&

event.clientX<=bin.right

&&

event.clientY>=bin.top

&&

event.clientY<=bin.bottom;


trash
.classList
.toggle(
'hot',
over
);

};


element.onpointerup=
()=>{

if(
!active
)
return;


active=false;


hideGuides();


const shouldDelete=

trash
.classList
.contains('hot');


trash.style.display=
'none';


trash
.classList
.remove('hot');


if(
shouldDelete
){

undoStack.push(
beforeState
);


redoStack=[];


deleteCanvasItem(
item.id,
kind,
false
);


updateHistory();


return;

}


if(
beforeState!==stateString()
){

undoStack.push(
beforeState
);


redoStack=[];


saveOnly();

updateHistory();

}

};


element.onpointercancel=
()=>{

active=false;


hideGuides();


trash.style.display=
'none';

};

}


function snapTable(
moving,
left,
top
){

const threshold=8;


let snapLeft=
left;


let snapTop=
top;


let vertical=
null;


let horizontal=
null;


S.tables

.filter(
table=>
table.id!==moving.id
)

.forEach(table=>{

const otherLeft=

pxX(
table.xPct
);


const otherTop=

pxY(
table.yPct
);


if(
Math.abs(
otherLeft-left
)
<=
threshold
){

snapLeft=
otherLeft;


vertical=
otherLeft;

}


if(
Math.abs(
otherTop-top
)
<=
threshold
){

snapTop=
otherTop;


horizontal=
otherTop;

}

});


if(
vertical!==null
){

guideV.style.left=

vertical+'px';


guideV.style.display=
'block';

}

else{

guideV.style.display=
'none';

}


if(
horizontal!==null
){

guideH.style.top=

horizontal+'px';


guideH.style.display=
'block';

}

else{

guideH.style.display=
'none';

}


return{

left:snapLeft,

top:snapTop

};

}


function hideGuides(){

guideV.style.display=
'none';


guideH.style.display=
'none';

}

function saveTableSettings(){

const table=

S.tables.find(
table=>
table.id===selected?.id
);


if(
!table
)
return;


const number=

Math.max(
1,
Number(
$('ctxTableNumber').value||1
)
);


const duplicate=

S.tables.find(
other=>

other.id!==table.id

&&

Number(other.number)===
number
);


if(
duplicate
){

toast(
'Table number already exists'
);

return;

}


const seats=

Number(
$('ctxSeats').value
);


const used=

tableUsedSeats(
table.id
);


if(
seats<used
){

toast(
`Table already has ${used} people`
);

return;

}


pushHistory();


table.number=
number;


table.seats=
seats;


render();

saveOnly();

}


function duplicateSelectedTable(){

const original=

S.tables.find(
table=>
table.id===selected?.id
);


if(
!original
)
return;


pushHistory();


const position=
findFreeTablePosition();


S.tables.push({

id:uid(),

number:
nextTableNumber(),

seats:
original.seats,

xPct:
position.xPct,

yPct:
position.yPct,

scale:
original.scale||.8

});


render();

saveOnly();

}


function resizeSelected(
multiplier
){

if(
!selected
)
return;


const item=

selected.kind==='table'

?
S.tables.find(
table=>
table.id===selected.id
)

:
S.objects.find(
object=>
object.id===selected.id
);


if(
!item
)
return;


pushHistory();


item.scale=

clamp(
Number(
item.scale||1
)
*
multiplier,
.3,
2
);


render();

saveOnly();

}


function deleteCanvasItem(
id,
kind,
history=true
){

if(
history
){

pushHistory();

}


if(
kind==='table'
){

S.guests
.forEach(
guest=>{

if(
guest.tableId===id
){

guest.tableId=null;

}

}
);


S.tables=

S.tables.filter(
table=>
table.id!==id
);

}

else{

S.objects=

S.objects.filter(
object=>
object.id!==id
);

}


selected=null;


context.style.display=
'none';


render();

saveOnly();

renderStepPanel();

}


/* ==================================================
TABLE CAPACITY
================================================== */

function tableUsedSeats(
tableId,
excludeGuestId=null
){

return S.guests

.filter(
guest=>

guest.tableId===tableId

&&

guest.id!==excludeGuestId
)

.reduce(
(sum,guest)=>

sum+
Number(
guest.partySize||1
),

0
);

}


/* ==================================================
GREEK ALPHABET
================================================== */

function normalizeText(
text
){

return String(
text||''
)

.normalize('NFD')

.replace(
/[\u0300-\u036f]/g,
''
)

.toLocaleUpperCase(
'el-GR'
)

.replace(
/Σ$/g,
'Σ'
)

.trim();

}


function firstGreekLetter(
text
){

const value=

normalizeText(
text
);


if(
!value
)
return'#';


let letter=

value.charAt(0);


if(
letter==='Ά'
)
letter='Α';


if(
letter==='Έ'
)
letter='Ε';


if(
letter==='Ή'
)
letter='Η';


if(
letter==='Ί'
||
letter==='Ϊ'
)
letter='Ι';


if(
letter==='Ό'
)
letter='Ο';


if(
letter==='Ύ'
||
letter==='Ϋ'
)
letter='Υ';


if(
letter==='Ώ'
)
letter='Ω';


return letter;

}


const greekOrder=

[
'Α','Β','Γ','Δ','Ε','Ζ','Η',
'Θ','Ι','Κ','Λ','Μ','Ν','Ξ',
'Ο','Π','Ρ','Σ','Τ','Υ','Φ',
'Χ','Ψ','Ω'
];


function compareGreekLetters(
a,
b
){

const ai=

greekOrder.indexOf(a);


const bi=

greekOrder.indexOf(b);


if(
ai>=0
&&
bi>=0
)
return ai-bi;


if(
ai>=0
)
return-1;


if(
bi>=0
)
return 1;


return a.localeCompare(
b,
'el'
);

}


function compareGuests(
a,
b
){

const surname=

normalizeText(
a.surname
)

.localeCompare(

normalizeText(
b.surname
),

'el'

);


if(
surname!==0
)
return surname;


return normalizeText(
a.firstName
)

.localeCompare(

normalizeText(
b.firstName
),

'el'

);

}

.join(' ');

function safe(
text
){

document.createElement(

);

){

);

);

}
