<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seatly 5.1.2 Stable</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
box-sizing:border-box;
}

:root{

--bg:#ece9e4;
--paper:#fff;
--ink:#202020;
--muted:#777;
--line:#e3ddd5;
--soft:#f5f2ed;

--green:#e4f3e8;
--greenText:#28663c;

--danger:#a43b34;
--dangerSoft:#fff0ee;

--warning:#fff7e8;

}

html,
body{

width:100%;
height:100%;

margin:0;

font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:var(--bg);

color:var(--ink);

}

body{

overflow:hidden;

overscroll-behavior:none;

}

button,
input,
select{

font:inherit;

}

button{

border:0;

border-radius:10px;

background:#222;

color:#fff;

padding:9px 11px;

font-weight:750;

cursor:pointer;

}

button.secondary{

background:#fff;

color:#222;

border:1px solid var(--line);

}

button.soft{

background:var(--soft);

color:#222;

border:1px solid #e6dfd7;

}

button.danger{

background:var(--danger);

}

button.dangerSoft{

background:var(--dangerSoft);

color:var(--danger);

border:1px solid #efc8c4;

}

button:disabled{

opacity:.4;

}


/* =====================================================
TOP
===================================================== */

.topbar{

height:55px;

background:#fff;

border-bottom:1px solid var(--line);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 10px;

z-index:500;

position:relative;

}

.logo{

font-size:24px;

font-weight:900;

letter-spacing:-1px;

}

.logo span{

font-weight:400;

}

.topRight{

display:flex;

align-items:center;

gap:5px;

}

.saveState{

font-size:10px;

color:#777;

}

.buildTag{

font-size:9px;

font-weight:850;

background:#f1eee9;

border:1px solid #ddd5cd;

color:#555;

padding:5px 7px;

border-radius:999px;

}


/* =====================================================
PROGRESS
===================================================== */

.progress{

height:43px;

background:#fff;

border-bottom:1px solid var(--line);

display:flex;

align-items:center;

justify-content:center;

gap:5px;

padding:4px 7px;

overflow-x:auto;

scrollbar-width:none;

}

.progress::-webkit-scrollbar{

display:none;

}

.progress button{

flex:0 0 auto;

background:#f5f2ed;

color:#666;

border:1px solid #e4ddd5;

border-radius:999px;

padding:6px 10px;

font-size:10px;

white-space:nowrap;

}

.progress button.active{

background:#222;

color:#fff;

border-color:#222;

}

.progress button.done{

background:var(--green);

color:var(--greenText);

border-color:#bfdcc8;

}


/* =====================================================
APP
===================================================== */

.app{

height:calc(100vh - 98px);

display:grid;

grid-template-columns:54px 1fr;

}

.rail{

background:#202020;

padding:4px 2px;

display:flex;

flex-direction:column;

gap:3px;

z-index:300;

}

.rail button{

height:49px;

padding:3px;

background:transparent;

font-size:7px;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:2px;

}

.rail button b{

font-size:16px;

}

.rail button.active{

background:#fff;

color:#222;

}


/* =====================================================
WORKSPACE
===================================================== */

.workspace{

min-width:0;

min-height:0;

display:flex;

flex-direction:column;

overflow:hidden;

}


/* =====================================================
TOOLBAR
===================================================== */

.toolbar{

min-height:57px;

background:#fff;

border-bottom:1px solid var(--line);

display:none;

align-items:center;

overflow-x:auto;

overflow-y:hidden;

gap:5px;

padding:6px;

scrollbar-width:none;

z-index:250;

}

.toolbar::-webkit-scrollbar{

display:none;

}

.toolbar.show{

display:flex;

}

.toolbar button{

flex:0 0 auto;

height:43px;

font-size:10px;

white-space:nowrap;

}

.toolObject{

min-width:72px;

background:#f5f2ed!important;

color:#222!important;

border:1px solid #e4ddd5!important;

}

.toolObject span{

display:block;

font-size:14px;

}

.toolObject small{

display:block;

font-size:8px;

font-weight:800;

}

.toolName{

flex:0 0 auto;

padding:7px 10px;

border:1px solid #ddd6ce;

border-radius:10px;

background:#fff;

min-width:100px;

}

.toolName b{

display:block;

font-size:10px;

}

.toolName small{

font-size:8px;

color:#777;

}

.divider{

flex:0 0 auto;

width:1px;

height:32px;

background:#ddd5cd;

margin:0 2px;

}


/* =====================================================
CANVAS
===================================================== */

.canvasArea{

flex:1;

min-height:0;

background:#e8e5e0;

padding:5px;

display:flex;

align-items:stretch;

justify-content:center;

overflow:hidden;

}

.canvas{

position:relative;

width:min(100%,1500px);

height:100%;

background:#fff;

border:1px solid var(--line);

border-radius:13px;

overflow:hidden;

touch-action:none;

box-shadow:
0 7px 25px rgba(0,0,0,.07);

}

.venueBg{

position:absolute;

inset:0;

z-index:1;

background:#fff center/contain no-repeat;

pointer-events:none;

}


/* =====================================================
LAYER CONTROL
===================================================== */

.objectLayer,
.tableLayer{

position:absolute;

inset:0;

pointer-events:none;

}

.objectLayer{

z-index:5;

}

.tableLayer{

z-index:10;

}

.objectLayer.active,
.tableLayer.active{

pointer-events:auto;

}

.objectLayer.active .canvasObject,
.tableLayer.active .canvasObject{

pointer-events:auto;

}


/* =====================================================
EMPTY
===================================================== */

.empty{

position:absolute;

inset:0;

display:grid;

place-items:center;

text-align:center;

pointer-events:none;

color:#999;

z-index:2;

}


/* =====================================================
OBJECTS
===================================================== */

.canvasObject{

position:absolute;

touch-action:none;

user-select:none;

-webkit-user-select:none;

transform-origin:center center;

}

.venueObject{

display:flex;

align-items:center;

justify-content:center;

text-align:center;

background:rgba(255,255,255,.96);

border:1px solid #777;

border-radius:9px;

font-size:10px;

font-weight:850;

box-shadow:
0 3px 10px rgba(0,0,0,.07);

}

.venueObject.editing{

border:2px dashed #222;

box-shadow:
0 0 0 3px rgba(0,0,0,.08);

}

.dancefloor{

background:

linear-gradient(
45deg,
#fafafa 25%,
#ececec 25%,
#ececec 50%,
#fafafa 50%,
#fafafa 75%,
#ececec 75%
);

background-size:24px 24px;

}

.djbox{

background:#262626;

color:#fff;

}

.bar{

background:#f3ece4;

}

.entrance{

background:#fff;

border-style:double;

}


/* =====================================================
FLOATING EDIT
===================================================== */

.objectControls{

position:absolute;

top:-39px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:4px;

align-items:center;

z-index:150;

white-space:nowrap;

}

.objectControls button{

height:auto;

padding:5px 7px;

font-size:9px;

border-radius:999px;

box-shadow:
0 4px 12px rgba(0,0,0,.15);

}

.resizeHandle{

position:absolute;

width:22px;

height:22px;

right:-11px;

bottom:-11px;

border-radius:50%;

background:#fff;

border:2px solid #222;

z-index:151;

box-shadow:
0 3px 10px rgba(0,0,0,.2);

touch-action:none;

}

.resizeHandle:after{

content:"";

position:absolute;

width:7px;

height:7px;

border-radius:50%;

background:#222;

left:5.5px;

top:5.5px;

}


/* =====================================================
TABLE
===================================================== */

.table{

width:82px;

height:82px;

display:flex;

align-items:center;

justify-content:center;

}

.table.editing{

outline:2px dashed #222;

outline-offset:3px;

}

.tableCore{

width:48px;

height:48px;

border:2px solid #222;

border-radius:50%;

background:#fff;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

z-index:2;

box-shadow:
0 4px 12px rgba(0,0,0,.12);

}

.tableCore b{

font-size:8px;

}

.tableCore span{

font-size:8px;

color:#666;

margin-top:2px;

}

.table.full .tableCore{

background:#e2f3e6;

border-color:#39794d;

}

.chair{

position:absolute;

width:9px;

height:9px;

background:#fff;

border:1px solid #555;

border-radius:3px;

}


/* =====================================================
STATUS
===================================================== */

.status{

position:absolute;

left:8px;

bottom:8px;

z-index:50;

background:#fff;

border:1px solid var(--line);

border-radius:999px;

padding:6px 9px;

font-size:9px;

color:#666;

pointer-events:none;

}


/* =====================================================
SHEET
===================================================== */

.sheet{

position:fixed;

top:98px;

right:0;

bottom:0;

width:390px;

background:#fff;

z-index:600;

border-left:1px solid var(--line);

box-shadow:
-10px 0 30px rgba(0,0,0,.13);

padding:15px;

overflow:auto;

display:none;

}

.sheet.open{

display:block;

}

.sheetTop{

display:flex;

justify-content:space-between;

align-items:flex-start;

gap:8px;

margin-bottom:12px;

}

.sheetTop h2{

margin:0;

font-size:20px;

}

.sheetClose{

width:34px;

height:34px;

padding:0;

border-radius:50%;

}

.hint{

font-size:12px;

color:#777;

line-height:1.45;

margin:5px 0 12px;

}

.section{

border-top:1px solid #eee7df;

margin-top:12px;

padding-top:12px;

}

.card{

border:1px solid var(--line);

border-radius:13px;

background:#faf9f7;

padding:11px;

margin-top:8px;

}

.card.warning{

background:var(--warning);

}

.cardTitle{

font-size:14px;

font-weight:850;

}

.meta{

font-size:10px;

color:#777;

margin-top:3px;

}

.field{

width:100%;

padding:10px;

border:1px solid #d8d1c9;

border-radius:10px;

background:#fff;

}

.grid2{

display:grid;

grid-template-columns:1fr 1fr;

gap:7px;

}

.wide{

width:100%;

margin-top:8px;

}


/* =====================================================
GUESTS
===================================================== */

.guestRow{

display:grid;

grid-template-columns:1fr auto;

gap:7px;

align-items:center;

padding:8px 0;

border-bottom:1px solid #eee;

}

.guestName{

font-size:13px;

font-weight:750;

}

.guestMeta{

font-size:10px;

color:#777;

}

.rowActions{

display:flex;

gap:4px;

}

.rowActions button{

font-size:9px;

padding:5px 6px;

}


/* =====================================================
VOICE
===================================================== */

.voiceBox{

border:1px solid var(--line);

border-radius:13px;

background:#faf9f7;

padding:11px;

margin-top:10px;

}

.voiceBox.listening{

background:#fff0ee;

}

.voicePreviewRow{

display:grid;

grid-template-columns:
1fr 1fr 50px 56px auto;

gap:4px;

margin-top:5px;

}

.voicePreviewRow input{

width:100%;

padding:6px;

border:1px solid var(--line);

border-radius:7px;

font-size:10px;

}


/* =====================================================
QUICK SETUP
===================================================== */

.popover{

position:fixed;

top:105px;

left:62px;

width:min(
340px,
calc(100vw - 75px)
);

max-height:70vh;

overflow:auto;

z-index:700;

background:#fff;

border:1px solid var(--line);

border-radius:14px;

box-shadow:
0 12px 35px rgba(0,0,0,.18);

padding:12px;

display:none;

}

.popover.open{

display:block;

}


/* =====================================================
SUMMARY
===================================================== */

.summary{

display:grid;

grid-template-columns:1fr 1fr;

gap:8px;

}

.summaryCard{

border:1px solid var(--line);

border-radius:12px;

background:#faf9f7;

padding:10px;

}

.summaryNumber{

font-size:23px;

font-weight:900;

}

.summaryLabel{

font-size:9px;

color:#777;

}


/* =====================================================
DOWNLOAD
===================================================== */

.downloadChoice{

border:1px solid var(--line);

border-radius:15px;

background:#faf9f7;

padding:14px;

margin-top:10px;

}

.downloadIcon{

font-size:28px;

}


/* =====================================================
OVERLAY
===================================================== */

.overlay{

position:fixed;

inset:0;

z-index:900;

background:rgba(0,0,0,.5);

display:none;

align-items:center;

justify-content:center;

padding:15px;

}

.overlay.open{

display:flex;

}

.modal{

width:min(1000px,100%);

max-height:94vh;

overflow:auto;

background:#fff;

border-radius:18px;

padding:18px;

}

.modalTop{

display:flex;

justify-content:space-between;

align-items:flex-start;

gap:8px;

}


/* =====================================================
CHART
===================================================== */

.chartControls{

display:grid;

grid-template-columns:1fr 1fr;

gap:7px;

margin:12px 0;

}

.chart{

background:#fff;

color:#111;

width:100%;

min-height:900px;

padding:44px;

border:1px solid #ddd;

margin-top:14px;

}

.chartWelcome{

text-align:center;

font-family:Georgia,serif;

font-style:italic;

font-size:64px;

}

.chartSmall{

text-align:center;

font-size:10px;

letter-spacing:4px;

margin-top:24px;

}

.chartNames{

text-align:center;

font-family:Georgia,serif;

font-size:29px;

letter-spacing:4px;

margin-top:7px;

}

.chartDate{

text-align:center;

font-size:10px;

letter-spacing:3px;

margin-top:8px;

}

.chartFind{

text-align:center;

font-family:Georgia,serif;

font-style:italic;

font-size:26px;

margin:26px 0 32px;

}

.chartColumns{

columns:4;

column-gap:34px;

}

.chartGroup{

break-inside:avoid;

margin-bottom:18px;

}

.chartLetter{

font-family:Georgia,serif;

font-size:24px;

margin-bottom:6px;

}

.chartPerson{

display:flex;

align-items:flex-end;

gap:4px;

font-family:Georgia,serif;

font-size:10px;

line-height:1.65;

}

.chartDots{

flex:1;

height:10px;

border-bottom:1px dotted #777;

}

.chartTable{

min-width:18px;

text-align:right;

}


/* =====================================================
EXPORT
===================================================== */

.venueExport{

position:relative;

width:1600px;

height:1000px;

background:#fff;

overflow:hidden;

}

.venueExportBg{

position:absolute;

inset:0;

background:#fff center/contain no-repeat;

}

.exportObject{

position:absolute;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

border:2px solid #444;

background:#fff;

font-weight:800;

transform-origin:center center;

}

.exportObject.djbox{

background:#222;

color:#fff;

}

.exportTable{

position:absolute;

width:75px;

height:75px;

border:2px solid #222;

border-radius:50%;

background:#fff;

display:flex;

align-items:center;

justify-content:center;

font-weight:850;

transform-origin:center center;

}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:800px){

.saveState{

display:none;

}

.progress{

justify-content:flex-start;

}

.sheet{

left:54px;

right:0;

width:auto;

border-left:0;

}

.table{

width:72px;

height:72px;

}

.tableCore{

width:42px;

height:42px;

}

.tableCore b,
.tableCore span{

font-size:7px;

}

.chartControls{

grid-template-columns:1fr;

}

.chartColumns{

columns:2;

}

.voicePreviewRow{

grid-template-columns:1fr 1fr;

}

}

</style>
</head>

padding:9px 13px;
border-radius:10px;

z-index:9999;
font-size:11px">
</div>



<script>

/* =====================================================
STATE
===================================================== */

const STORAGE_KEY=
'seatly512stable';


let S={

version:512,

venueImage:null,

venueLocked:false,

tablesLocked:false,

objects:[],

tables:[],

guests:[],

chart:{

couple:'',

date:'',

welcome:'Welcome',

find:
'Please find your seat',

columns:4

}

};


let currentStep=1;


let selected=null;


let currentGuestTable=null;


let undoStack=[];

let redoStack=[];


let voiceRecognition=null;

let voiceDraft=[];



const $=
id=>document.getElementById(id);


const canvas=
$('canvas');


const objectLayer=
$('objectLayer');


const tableLayer=
$('tableLayer');



/* =====================================================
UTIL
===================================================== */

function uid(){

if(
window.crypto
&&
crypto.randomUUID
){

return crypto.randomUUID();

}


return String(
Date.now()
+
Math.random()
);

}



function clamp(
value,
min,
max
){

return Math.max(
min,
Math.min(
max,
value
)
);

}



function pctX(px){

return(
px/
Math.max(
canvas.clientWidth,
1
)
)
*100;

}



function pctY(px){

return(
px/
Math.max(
canvas.clientHeight,
1
)
)
*100;

}



function pxX(percent){

return(
Number(percent||0)
/
100
)
*
canvas.clientWidth;

}



function pxY(percent){

return(
Number(percent||0)
/
100
)
*
canvas.clientHeight;

}



/* =====================================================
SAVE
===================================================== */

function save(){

try{

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(S)
);


$('saveState')
.textContent=
'Saved ✓';


return true;

}
catch(error){

$('saveState')
.textContent=
'Save failed';


return false;

}

}



/* =====================================================
HISTORY
===================================================== */

function snapshot(){

return JSON.stringify(S);

}



function remember(){

undoStack.push(
snapshot()
);


if(
undoStack.length>80
){

undoStack.shift();

}


redoStack=[];


updateUndoButtons();

}



function undo(){

if(
!undoStack.length
)
return;


redoStack.push(
snapshot()
);


S=
JSON.parse(
undoStack.pop()
);


selected=null;


applyVenue();

renderAll();

save();

refreshUI();

updateUndoButtons();

}



function redo(){

if(
!redoStack.length
)
return;


undoStack.push(
snapshot()
);


S=
JSON.parse(
redoStack.pop()
);


selected=null;


applyVenue();

renderAll();

save();

refreshUI();

updateUndoButtons();

}



function updateUndoButtons(){

$('undoBtn').disabled=
!undoStack.length;


$('redoBtn').disabled=
!redoStack.length;

}



/* =====================================================
LOAD
===================================================== */

function load(){

try{

const old=

localStorage.getItem(
STORAGE_KEY
)

||

localStorage.getItem(
'seatly511stable'
)

||

localStorage.getItem(
'seatly51'
)

||

localStorage.getItem(
'seatly50'
)

||

localStorage.getItem(
'seatly481'
)

||

localStorage.getItem(
'seatly48'
);


if(old){

S={
...S,
...JSON.parse(old),
version:512
};

}

}
catch(error){}



if(
!Array.isArray(
S.objects
)
){

S.objects=[];

}


if(
!Array.isArray(
S.tables
)
){

S.tables=[];

}


if(
!Array.isArray(
S.guests
)
){

S.guests=[];

}



if(
!S.chart
){

S.chart={

couple:'',

date:'',

welcome:'Welcome',

find:
'Please find your seat',

columns:4

};

}



S.objects.forEach(
object=>{

if(
object.rotation===undefined
){

object.rotation=0;

}


if(
object.widthPct===undefined
){

object.widthPct=16;

}


if(
object.heightPct===undefined
){

object.heightPct=8;

}

}
);



S.tables.forEach(
table=>{

if(
table.rotation===undefined
){

table.rotation=0;

}


if(
table.scale===undefined
){

table.scale=.8;

}

}
);



requestAnimationFrame(
()=>{

applyVenue();


currentStep=

S.tablesLocked

?3

:S.venueLocked

?2

:1;


selected=null;


renderAll();

renderToolbar();

updateNavigation();

updateLayerAccess();

save();

updateUndoButtons();

}
);

}



/* =====================================================
NAVIGATION
===================================================== */

function goStep(step){

closeSheet();

closeQuickSetup();


currentStep=
clamp(
Number(step),
1,
5
);


selected=null;

currentGuestTable=null;


/*
IMPORTANT:
Update state before rendering anything.
*/

updateNavigation();

updateLayerAccess();


renderAll();

renderToolbar();


if(
currentStep>=3
){

openStepSheet();

}

}



function openMore(){

closeQuickSetup();


selected=null;

currentGuestTable=null;


currentStep=0;


renderAll();

updateNavigation();

updateLayerAccess();


renderMoreSheet();

openSheet();

}



function updateNavigation(){

for(
let i=1;
i<=5;
i++
){

$('progress'+i)
.classList
.toggle(
'active',
currentStep===i
);


$('rail'+i)
.classList
.toggle(
'active',
currentStep===i
);

}


$('railMore')
.classList
.toggle(
'active',
currentStep===0
);


$('progress1')
.classList
.toggle(
'done',
S.venueLocked
);


$('progress2')
.classList
.toggle(
'done',
S.tablesLocked
);


$('progress3')
.classList
.toggle(
'done',
S.guests.length>0
);

}



function refreshUI(){

updateNavigation();

updateLayerAccess();

renderToolbar();

}



/* =====================================================
LAYER ACCESS
===================================================== */

function updateLayerAccess(){

objectLayer
.classList
.remove(
'active'
);


tableLayer
.classList
.remove(
'active'
);


if(
currentStep===1
){

objectLayer
.classList
.add(
'active'
);

}


if(
currentStep===2
||
currentStep===3
){

tableLayer
.classList
.add(
'active'
);

}

}



/* =====================================================
TOOLBAR
===================================================== */

function renderToolbar(){

const toolbar=
$('toolbar');


if(
currentStep!==1
&&
currentStep!==2
){

toolbar
.classList
.remove(
'show'
);


toolbar.innerHTML='';


return;

}


toolbar
.classList
.add(
'show'
);


if(
currentStep===1
){

renderVenueToolbar();

return;

}


if(
currentStep===2
){

renderTableToolbar();

return;

}

}

/* =====================================================
ADD VENUE
===================================================== */

function addVenue(type){

if(
S.venueLocked
){

toast(
'Tap Edit Venue first'
);

return;

}


const configs={

dancefloor:{

label:'Dance Floor',

widthPct:28,

heightPct:20

},

djbox:{

label:'DJ Box',

widthPct:16,

heightPct:8

},

bar:{

label:'Bar',

widthPct:20,

heightPct:8

},

entrance:{

label:'Entrance',

widthPct:16,

heightPct:8

}

};


const config=
configs[type];


if(!config)
return;


remember();


const object={

id:uid(),

type,

label:
config.label,

widthPct:
config.widthPct,

heightPct:
config.heightPct,

xPct:
50-
config.widthPct/2,

yPct:
50-
config.heightPct/2,

rotation:0

};


S.objects.push(
object
);


selected={

kind:'object',

id:object.id

};


renderAll();

renderToolbar();

}



/* =====================================================
VENUE HELPERS
===================================================== */

function getSelectedObject(){

if(
selected?.kind!=='object'
)
return null;


return S.objects.find(
object=>
object.id===selected.id
);

}



function resizeVenue(multiplier){

const object=
getSelectedObject();


if(!object)
return;


remember();


object.widthPct=

clamp(
object.widthPct*
multiplier,
5,
70
);


object.heightPct=

clamp(
object.heightPct*
multiplier,
4,
65
);


object.xPct=

clamp(
object.xPct,
0,
100-
object.widthPct
);


object.yPct=

clamp(
object.yPct,
0,
100-
object.heightPct
);


renderAll();

save();

renderToolbar();

}



function rotateVenue(delta){

const object=
getSelectedObject();


if(!object)
return;


remember();


object.rotation=

(
Number(
object.rotation||0
)
+
delta
+
360
)
%360;


renderAll();

save();

renderToolbar();

}



function deleteSelectedVenue(){

const object=
getSelectedObject();


if(!object)
return;


if(
!confirm(
`Delete ${object.label}?`
)
)
return;


remember();


S.objects=

S.objects.filter(
item=>
item.id!==object.id
);


selected=null;


renderAll();

save();

renderToolbar();

}



/* =====================================================
SAVE VENUE — FIXED
===================================================== */

function saveVenue(){

remember();


S.venueLocked=true;


selected=null;

currentGuestTable=null;


/*
Save first.
*/

save();


/*
IMPORTANT:
Move directly into Step 2.
No timeout.
No second navigation call.
*/

currentStep=2;


/*
Force the complete Step 2 UI state
before the toolbar renders.
*/

updateNavigation();

updateLayerAccess();


renderAll();

renderToolbar();


toast(
'Venue saved ✓'
);

}



/* =====================================================
EDIT / CLEAR VENUE
===================================================== */

function editVenue(){

remember();


S.venueLocked=false;


currentStep=1;


selected=null;

currentGuestTable=null;


save();


updateNavigation();

updateLayerAccess();

renderAll();

renderToolbar();

}



function clearVenue(){

if(
!S.objects.length
&&
!S.venueImage
){

toast(
'Venue is already empty'
);

return;

}


if(
!confirm(
'Clear the entire Venue?'
)
)
return;


remember();


S.objects=[];

S.venueImage=null;

S.venueLocked=false;


selected=null;


applyVenue();

renderAll();

save();

renderToolbar();

}



/* =====================================================
BACKGROUND
===================================================== */

$('venueUpload')
.addEventListener(
'change',
event=>{

const file=
event.target.files[0];


if(!file)
return;


compressImage(
file,
1800,
.82
)

.then(
image=>{

remember();


S.venueImage=
image;


applyVenue();

renderAll();

save();

}
)

.catch(
()=>{

toast(
'Could not open image'
);

}
);


event.target.value='';

}
);



function compressImage(
file,
maxDimension,
quality
){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();


reader.onload=
event=>{

const image=
new Image();


image.onload=
()=>{

let width=
image.width;


let height=
image.height;


const largest=
Math.max(
width,
height
);


if(
largest>
maxDimension
){

const ratio=
maxDimension/
largest;


width=
Math.round(
width*
ratio
);


height=
Math.round(
height*
ratio
);

}


const temp=
document.createElement(
'canvas'
);


temp.width=
width;


temp.height=
height;


temp
.getContext('2d')
.drawImage(
image,
0,
0,
width,
height
);


resolve(
temp.toDataURL(
'image/jpeg',
quality
)
);

};


image.onerror=
reject;


image.src=
event.target.result;

};


reader.onerror=
reject;


reader.readAsDataURL(
file
);

}
);

}



function applyVenue(){

$('venueBg')
.style
.backgroundImage=

S.venueImage

?`url("${S.venueImage}")`

:'none';

}



/* =====================================================
TABLES
===================================================== */

function addTable(seats){

if(
S.tablesLocked
){

toast(
'Tap Edit Tables first'
);

return;

}


remember();


const position=
findFreeTablePosition();


const table={

id:uid(),

number:
nextTableNumber(),

seats,

scale:.8,

xPct:
position.x,

yPct:
position.y,

rotation:0

};


S.tables.push(
table
);


selected={

kind:'table',

id:table.id

};


renderAll();

save();

renderToolbar();

}



function nextTableNumber(){

const numbers=

S.tables.map(
table=>
Number(
table.number
)
);


let number=1;


while(
numbers.includes(
number
)
){

number++;

}


return number;

}



function findFreeTablePosition(){

const count=
S.tables.length;


const columns=5;


const col=
count%
columns;


const row=
Math.floor(
count/
columns
);


return{

x:
clamp(
8+
col*17,
2,
90
),

y:
clamp(
15+
row*15,
4,
88
)

};

}



function getSelectedTable(){

if(
selected?.kind!=='table'
)
return null;


return S.tables.find(
table=>
table.id===selected.id
);

}



function resizeTable(multiplier){

const table=
getSelectedTable();


if(!table)
return;


remember();


table.scale=

clamp(
Number(
table.scale||1
)
*
multiplier,
.35,
1.8
);


renderAll();

save();

renderToolbar();

}



function rotateTable(delta){

const table=
getSelectedTable();


if(!table)
return;


remember();


table.rotation=

(
Number(
table.rotation||0
)
+
delta
+
360
)
%360;


renderAll();

save();

renderToolbar();

}



function changeTableNumber(){

const table=
getSelectedTable();


if(!table)
return;


const answer=
prompt(
'Table number',
table.number
);


if(
answer===null
)
return;


const number=

Math.max(
1,
Number(answer)||1
);


const exists=

S.tables.some(
other=>

other.id!==table.id

&&

Number(other.number)===
number
);


if(exists){

toast(
'Table number already exists'
);

return;

}


remember();


table.number=
number;


renderAll();

save();

renderToolbar();

}



function changeTableSeats(){

const table=
getSelectedTable();


if(!table)
return;


const answer=
prompt(
'Seats: 8, 10, 12 or 16',
table.seats
);


if(
answer===null
)
return;


const seats=
Number(answer);


if(
![8,10,12,16]
.includes(seats)
){

toast(
'Use 8, 10, 12 or 16'
);

return;

}


const used=
tableUsedSeats(
table.id
);


if(
seats<
used
){

toast(
`Table already has ${used} people`
);

return;

}


remember();


table.seats=
seats;


renderAll();

save();

renderToolbar();

}



function duplicateTable(){

const table=
getSelectedTable();


if(!table)
return;


remember();


const copy={

...table,

id:uid(),

number:
nextTableNumber(),

xPct:
clamp(
table.xPct+5,
0,
92
),

yPct:
clamp(
table.yPct+5,
0,
92
)

};


S.tables.push(
copy
);


selected={

kind:'table',

id:copy.id

};


renderAll();

save();

renderToolbar();

}



function deleteSelectedTable(){

const table=
getSelectedTable();


if(!table)
return;


if(
!confirm(
`Delete Table ${table.number}?`
)
)
return;


remember();


S.tables=

S.tables.filter(
item=>
item.id!==table.id
);


S.guests.forEach(
guest=>{

if(
guest.tableId===table.id
){

guest.tableId=null;

}

}
);


selected=null;


renderAll();

save();

renderToolbar();

}



function saveTables(){

if(
!S.tables.length
){

toast(
'Add at least one table'
);

return;

}


remember();


S.tablesLocked=true;


selected=null;


save();


currentStep=3;


updateNavigation();

updateLayerAccess();


renderAll();

renderToolbar();


toast(
'Tables saved ✓'
);


openStepSheet();

}



function editTables(){

remember();


S.tablesLocked=false;


currentStep=2;


selected=null;

currentGuestTable=null;


save();


updateNavigation();

updateLayerAccess();

renderAll();

renderToolbar();

}



function clearTables(){

if(
!S.tables.length

toast(
'No tables to delete'
);

}

!confirm(
'Delete all tables? Guests remain saved as Unassigned.'
)
)
return;


remember();


S.tables=[];

S.guests.forEach(
guest=>{

guest.tableId=null;

}
);


selected=null;


renderAll();

save();

renderToolbar();

function showQuickOptions(
guests
){

const options=

[8,10,12,16]

.map(
seats=>{

const count=
Math.ceil(
guests/
seats
);


return{

seats,

count,

capacity:

function applyQuickSetup(
quantity,
seats
){

if(
S.tables.length
&&
!confirm(
'Replace current tables with this layout?'
)
)
return;


remember();


S.tables=[];


S.guests.forEach(
guest=>{

function createGrid(
quantity,
seats
){

const rect=
canvas.getBoundingClientRect();


let scale=.74;


if(
quantity>=10
)
scale=.64;


if(
quantity>=18
)
scale=.55;


if(
quantity>=28
)
scale=.46;


if(
quantity>=38
)
scale=.39;


const base=
82*
scale;


const gap=12;


let columns=

Math.max(
1,
Math.floor(
(rect.width-20)
/
(base+gap)
)
);


columns=
Math.min(
columns,
quantity
);


let rows=
Math.ceil(
quantity/
columns
);


while(

rows*
(base+gap)
>
rect.height-60

&&

columns<quantity

){

columns++;


rows=
Math.ceil(
quantity/
columns
);

}


const totalWidth=

(columns-1)
*
(base+gap);


const totalHeight=

(rows-1)
*
(base+gap);


const startX=

Math.max(
8,
rect.width/2
-
totalWidth/2
-
base/2
);


const startY=

Math.max(
30,
rect.height/2
-
totalHeight/2
-
base/2
);


for(
let i=0;
i<quantity;
i++
){

const col=
i%
columns;


const row=
Math.floor(
i/
columns
);


S.tables.push({

id:uid(),

number:
nextTableNumber(),

seats,

scale,

rotation:0,

xPct:
pctX(
startX+
col*
(base+gap)
),

yPct:
pctY(
startY+
row*
(base+gap)
)

});

}

}

/* =====================================================
TAP / DRAG
===================================================== */

function attachEditInteraction(
element,
item,
kind
){

let startX=0;

let startY=0;

let originalX=0;

let originalY=0;

let pointerId=null;

let dragging=false;

let before='';



element.addEventListener(
'pointerdown',
event=>{

if(
event.target.closest(
'.objectControls'
)

||

event.target.closest(
'.resizeHandle'
)
)
return;


event.preventDefault();

event.stopPropagation();


const alreadySelected=

selected?.kind===kind

&&

selected.id===item.id;


if(
!alreadySelected
){

selected={

kind,

id:item.id

};


renderAll();

renderToolbar();


return;

}


pointerId=
event.pointerId;


startX=
event.clientX;


startY=
event.clientY;


originalX=
pxX(
item.xPct
);


originalY=
pxY(
item.yPct
);


before=
snapshot();


dragging=false;


try{

element.setPointerCapture(
event.pointerId
);

}
catch(error){}

}
);



element.addEventListener(
'pointermove',
event=>{

if(
pointerId!==event.pointerId
)
return;


const distance=

Math.hypot(
event.clientX-startX,
event.clientY-startY
);


if(
distance<5
&&
!dragging
)
return;


dragging=true;


event.preventDefault();


const rect=
canvas.getBoundingClientRect();


let visualWidth=
element.offsetWidth;


let visualHeight=
element.offsetHeight;


if(
kind==='table'
){

visualWidth*=

Number(
item.scale||1
);


visualHeight*=

Number(
item.scale||1
);

}



let x=

originalX

+

event.clientX

-

startX;



let y=

originalY

+

event.clientY

-

startY;



x=

clamp(
x,
0,
Math.max(
0,
rect.width-
visualWidth
)
);



y=

clamp(
y,
0,
Math.max(
0,
rect.height-
visualHeight
)
);



item.xPct=
pctX(x);


item.yPct=
pctY(y);


element.style.left=
item.xPct+'%';


element.style.top=
item.yPct+'%';

}
);



element.addEventListener(
'pointerup',
event=>{

if(
pointerId!==event.pointerId
)
return;


try{

element.releasePointerCapture(
event.pointerId
);

}
catch(error){}


if(
dragging
&&
before!==snapshot()
){

undoStack.push(
before
);


redoStack=[];


save();

updateUndoButtons();

}


pointerId=null;

dragging=false;

before='';


renderToolbar();

}
);



element.addEventListener(
'pointercancel',
()=>{

pointerId=null;

dragging=false;

before='';

}
);

}

/* =====================================================
RESIZE
===================================================== */

function startResize(
event,
item,
kind,
element
){

const before=
snapshot();


const startX=
event.clientX;


const startWidth=
element.getBoundingClientRect().width;


const baseWidth=
element.offsetWidth;


const startObjectWidth=
item.widthPct;


const startObjectHeight=
item.heightPct;


const objectRatio=

startObjectHeight/
startObjectWidth;



const move=
moveEvent=>{

moveEvent.preventDefault();


const dx=

moveEvent.clientX
-
startX;


if(
kind==='object'
){

const ratio=

Math.max(
.35,
(
startWidth+
dx
)
/
startWidth
);


item.widthPct=

clamp(
startObjectWidth*
ratio,
5,
70
);


item.heightPct=

clamp(
item.widthPct*
objectRatio,
4,
65
);


item.xPct=

clamp(
item.xPct,
0,
100-
item.widthPct
);


item.yPct=

clamp(
item.yPct,
0,
100-
item.heightPct
);


element.style.width=
item.widthPct+'%';


element.style.height=
item.heightPct+'%';

}



if(
kind==='table'
){

const newVisualWidth=

Math.max(
30,
startWidth+
dx
);


item.scale=

clamp(
newVisualWidth/
baseWidth,
.35,
1.8
);


element.style.transform=

`scale(${item.scale}) rotate(${item.rotation||0}deg)`;

}

};



const up=
()=>{

document.removeEventListener(
'pointermove',
move
);


if(
before!==snapshot()
){

undoStack.push(
before
);


redoStack=[];


save();

updateUndoButtons();

}


renderAll();

renderToolbar();

};



document.addEventListener(
'pointermove',
move,
{
passive:false
}
);


document.addEventListener(
'pointerup',
up,
{
once:true
}
);

}

function parseVoice(text){

const tableMatch=

text.match(
/(?:τραπέζι|τραπεζι|table)\s*(\d+)/i
);


const peopleMatch=

text.match(
/(\d+)\s*(?:άτομα|ατομα|people)/i
);


const tableNumber=

tableMatch
?Number(tableMatch[1])
:1;


const partySize=

peopleMatch
?Number(peopleMatch[1])
:1;


const clean=

text

.replace(
/(?:τραπέζι|τραπεζι|table)\s*\d+/ig,
''
)

.replace(
/\d+\s*(?:άτομα|ατομα|people)/ig,
''
)

.replace(
/[,.;]+/g,
' '
)

.trim();


const names=

clean
.split(/\s+/)
.filter(Boolean);


if(
!names.length
)
return;


voiceDraft.push({

surname:
names[0],

firstName:
names
.slice(1)
.join(' '),

partySize,

tableNumber

});

}

/* =====================================================
SORTING
===================================================== */

function normalizeBasic(text){

return String(
text||''
)

.normalize(
'NFD'
)

.replace(
/[\u0300-\u036f]/g,
''
)

.toLocaleLowerCase(
'el-GR'
)

.trim();

}



function normalizeText(text){

return normalizeBasic(
text
)

.toLocaleUpperCase(
'el-GR'
);

}



const greekAlphabet=[

'Α','Β','Γ','Δ',
'Ε','Ζ','Η','Θ',
'Ι','Κ','Λ','Μ',
'Ν','Ξ','Ο','Π',
'Ρ','Σ','Τ','Υ',
'Φ','Χ','Ψ','Ω'

];



function alphabetLetter(
surname
){

const value=
normalizeText(
surname
);


return value
?value.charAt(0)
:'#';

}



function compareLetters(
a,
b
){

const ai=
greekAlphabet
.indexOf(a);


const bi=
greekAlphabet
.indexOf(b);


if(
ai>=0
&&
bi>=0
)
return ai-bi;


if(ai>=0)
return-1;


if(bi>=0)
return 1;


return a.localeCompare(
b,
'el'
);

}



function compareGuests(
a,
b
){

const surname=

normalizeText(
a.surname
)

.localeCompare(
normalizeText(
b.surname
),
'el'
);


if(
surname!==0
)
return surname;


return normalizeText(
a.firstName
)

.localeCompare(
normalizeText(
b.firstName
),
'el'
);

}

);


div.textContent=

function safeAttribute(text){

return String(
text||''
)

.replace(
/&/g,
'&amp;'
)

.replace(
/"/g,
'&quot;'
)

.replace(
/</g,
'&lt;'
)

.replace(
/>/g,
'&gt;'
);

}



function downloadBlob(
blob,
name
){

const url=
URL.createObjectURL(
blob
);


const a=
document.createElement(
'a'
);


a.href=
url;


a.download=
name;


a.click();


setTimeout(
()=>{

URL.revokeObjectURL(
url
);

},
1000
);

}



/* =====================================================
TOAST
===================================================== */

function toast(message){

const el=
$('toast');


el.textContent=
message;


el.style.display=
'block';


clearTimeout(
window.toastTimer
);


window.toastTimer=

setTimeout(
()=>{

el.style.display=
'none';

},
1800
);

}
