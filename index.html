<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seatly 4.6</title>

<style>
*{box-sizing:border-box}
:root{
--bg:#f3f1ed;--paper:#fff;--ink:#202020;--muted:#777;
--line:#e5dfd7;--soft:#f2eee9;--green:#dff3e4;
--greenB:#34784a;--danger:#a43a32;--dangerSoft:#fff0ee
}
html,body{
margin:0;width:100%;height:100%;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);color:var(--ink)
}
body{overflow:hidden}
button,input,select{font:inherit}
button{
border:0;border-radius:10px;padding:9px 11px;
background:var(--ink);color:#fff;font-weight:700;cursor:pointer
}
button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.soft{background:var(--soft);color:var(--ink)}
button.danger{background:var(--danger);color:#fff}
button.dangerSoft{background:var(--dangerSoft);color:var(--danger);border:1px solid #efc8c3}
button:disabled{opacity:.38;cursor:default}

.topbar{
height:58px;background:#fff;border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;
padding:0 12px;position:relative;z-index:120
}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}
.logo span{font-weight:400}
.topActions{display:flex;align-items:center;gap:5px}
.saved{font-size:11px;color:#777}

.app{
height:calc(100vh - 58px);
display:grid;grid-template-columns:64px 280px 1fr
}

.rail{
background:#202020;padding:6px 4px;
display:flex;flex-direction:column;gap:5px;z-index:90
}
.rail button{
height:52px;background:transparent;padding:4px;font-size:8px;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px
}
.rail button b{font-size:16px}
.rail button.active{background:#fff;color:#202020}

.panel{
background:#fff;border-right:1px solid var(--line);
padding:14px;overflow:auto;position:relative;z-index:80
}
.panel h2{font-size:18px;margin:0 0 5px}
.panel h3{font-size:14px;margin:0 0 8px}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:12px}
.section{border-top:1px solid #eee8e1;padding-top:11px;margin-top:11px}
.field{
width:100%;padding:9px;border:1px solid #d8d1c9;
border-radius:9px;background:#fff
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.panelClose{display:none}

.quickButton{
background:#f5f2ed;color:#222;border:1px solid #e1dbd3;padding:12px 4px
}
.setupCard{
border:1px solid var(--line);border-radius:14px;
background:#faf9f7;padding:11px;margin-top:10px
}
.setupTitle{font-size:17px;font-weight:850}
.setupOption{
display:grid;grid-template-columns:1fr auto;gap:8px;
align-items:center;padding:10px 0;border-top:1px solid #ece7e1
}
.setupMeta{font-size:11px;color:#777;margin-top:2px}

.work{
background:#eae7e2;padding:8px;min-width:0;min-height:0;
overflow:hidden;display:flex;align-items:stretch;justify-content:center
}
.canvasWrap{
width:100%;height:100%;display:flex;align-items:stretch;justify-content:center
}
.canvas{
position:relative;width:min(100%,1300px);height:100%;
background:#fff;border:1px solid var(--line);border-radius:16px;
overflow:hidden;touch-action:none;box-shadow:0 12px 30px rgba(0,0,0,.08)
}
.venueBg{
position:absolute;inset:0;background:#fff center/contain no-repeat;
pointer-events:none
}
.layer{position:absolute;inset:0}
.empty{
position:absolute;inset:0;display:grid;place-items:center;
text-align:center;color:#999;pointer-events:none
}

.obj{position:absolute;touch-action:none;user-select:none}
.table{
width:82px;height:82px;display:flex;align-items:center;
justify-content:center;cursor:grab
}
.table.selected,.venueObject.selected{
outline:3px solid rgba(32,32,32,.17);outline-offset:3px
}
.core{
width:48px;height:48px;border:2px solid #222;border-radius:50%;
background:#fff;display:flex;flex-direction:column;
align-items:center;justify-content:center;
box-shadow:0 4px 12px rgba(0,0,0,.13);z-index:2
}
.core b{font-size:8px}
.core span{font-size:8px;color:#666;margin-top:2px}
.table.complete .core{background:var(--green);border-color:var(--greenB)}
.chair{
position:absolute;width:9px;height:9px;border:1.1px solid #555;
background:#fff;border-radius:3px
}

.venueObject{
border:2px dashed #555;background:rgba(255,255,255,.91);
border-radius:11px;display:flex;align-items:center;justify-content:center;
text-align:center;font-size:10px;font-weight:800;cursor:grab;
box-shadow:0 3px 10px rgba(0,0,0,.08)
}
.dancefloor{
border-style:solid;
background:linear-gradient(45deg,#fafafa 25%,#eee 25%,#eee 50%,#fafafa 50%,#fafafa 75%,#eee 75%);
background-size:24px 24px
}
.djbox{background:#292929;color:#fff;border-color:#111}
.bar{border-radius:7px;background:#f4eee8}
.entrance{background:#fff;border-style:double}

.context{
position:absolute;left:50%;top:8px;transform:translateX(-50%);
display:none;align-items:center;gap:5px;background:#fff;
border:1px solid var(--line);border-radius:12px;padding:5px;
z-index:40;box-shadow:0 8px 22px rgba(0,0,0,.14)
}
.context input,.context select{
width:62px;padding:6px;border:1px solid var(--line);border-radius:8px
}
.context button{padding:6px 7px;font-size:11px}

.trash{
position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
display:none;background:#fff;border:2px solid var(--line);
border-radius:999px;padding:8px 15px;font-size:11px;font-weight:800;z-index:45
}
.trash.hot{background:#ffe7e3;border-color:#b23b30}

.status{
position:absolute;left:8px;bottom:8px;background:#fff;
border:1px solid var(--line);border-radius:999px;
padding:6px 9px;font-size:10px;color:#666;z-index:30
}

.guestPanel{
position:fixed;top:58px;right:0;bottom:0;width:370px;
background:#fff;border-left:1px solid var(--line);
box-shadow:-10px 0 30px rgba(0,0,0,.12);
z-index:110;display:none;padding:15px;overflow:auto
}
.guestPanel.open{display:block}
.guestHeader{
display:flex;align-items:flex-start;justify-content:space-between;
gap:8px;margin-bottom:12px
}
.guestTitle{font-size:21px;font-weight:850}
.guestCount{font-size:12px;color:#777}
.guestBox{
background:#faf9f7;border:1px solid var(--line);
border-radius:13px;padding:11px
}
.formLabel{font-size:11px;font-weight:750;color:#666;margin:8px 0 4px}
.guestRow{
display:grid;grid-template-columns:1fr auto;gap:6px;
align-items:center;padding:8px 0;border-bottom:1px solid #eee
}
.guestName{font-size:13px;font-weight:700}
.guestMeta{font-size:11px;color:#777}
.actions{display:flex;gap:4px}
.actions button{font-size:10px;padding:5px 6px}

.overlay{
position:fixed;inset:0;background:rgba(0,0,0,.45);
display:none;align-items:center;justify-content:center;
padding:18px;z-index:220
}
.overlay.open{display:flex}
.modal{
width:min(900px,100%);max-height:92vh;overflow:auto;
background:#fff;border-radius:18px;padding:20px
}
.modalTop{
display:flex;align-items:center;justify-content:space-between;gap:8px
}

.printSettings{
display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0
}
.printSheet{
background:#fff;color:#111;width:100%;min-height:900px;
padding:44px;border:1px solid #ddd;margin-top:15px
}
.chartWelcome{
text-align:center;font-family:Georgia,serif;font-size:66px;
font-style:italic;line-height:1;margin-top:10px
}
.chartSmall{
text-align:center;font-size:11px;letter-spacing:4px;
text-transform:uppercase;margin-top:24px
}
.chartNames{
text-align:center;font-family:Georgia,serif;font-size:28px;
letter-spacing:4px;margin-top:6px
}
.chartDate{text-align:center;font-size:11px;letter-spacing:3px;margin-top:8px}
.chartFind{
text-align:center;font-family:Georgia,serif;font-style:italic;
font-size:27px;margin:26px 0 34px
}
.chartColumns{columns:4;column-gap:34px}
.chartGroup{break-inside:avoid;margin-bottom:18px}
.chartLetter{font-family:Georgia,serif;font-size:24px;margin-bottom:7px}
.chartPerson{
display:flex;align-items:flex-end;gap:4px;
font-family:Georgia,serif;font-size:10px;line-height:1.55
}
.chartPersonName{white-space:nowrap}
.chartDots{border-bottom:1px dotted #777;flex:1;height:10px}
.chartTable{min-width:18px;text-align:right}

@media(max-width:800px){
.topbar{height:56px;padding:0 7px}
.logo{font-size:21px}
.saved{display:none}
.topActions{gap:3px}
.topActions button{font-size:11px;padding:7px 8px}
.app{height:calc(100vh - 56px);grid-template-columns:54px 1fr}
.rail{padding:4px 2px}
.rail button{height:46px;font-size:7px}
.work{grid-column:2;padding:4px}
.canvas{width:100%;height:100%;border-radius:12px}
.panel{
position:fixed;left:54px;right:0;bottom:0;top:auto;width:auto;
max-height:56vh;display:none;border-right:0;border-top:1px solid var(--line);
border-radius:18px 18px 0 0;padding:46px 12px 12px;
box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:100
}
.panel.open{display:block}
.panelClose{
display:block;position:absolute;right:9px;top:7px;width:34px;height:34px;
padding:0;border-radius:50%;background:var(--soft);color:#222;
border:1px solid var(--line);font-size:20px
}
.guestPanel{
top:56px;left:54px;right:0;bottom:0;width:auto;
border-left:0;box-shadow:none
}
.grid4{grid-template-columns:repeat(2,1fr)}
.context{max-width:95%;overflow:auto;white-space:nowrap}
.table{width:72px;height:72px}
.core{width:42px;height:42px}
.core b,.core span{font-size:7px}
.printSettings{grid-template-columns:1fr}
.printSheet{padding:24px;min-height:700px}
.chartWelcome{font-size:44px}
.chartColumns{columns:2;column-gap:20px}
}

@media print{
@page{size:A1 portrait;margin:12mm}
body *{visibility:hidden!important}
#printSheet,#printSheet *{visibility:visible!important}
#printSheet{
position:absolute;left:0;top:0;width:100%;min-height:auto;
border:0;margin:0;padding:15mm;box-shadow:none
}
.chartColumns{columns:4}
}
</style>
</head>

<body>

<header class="topbar">
<div class="logo">seat<span>ly</span></div>
<div class="topActions">
<span class="saved" id="savedIndicator">Saved ✓</span>
<button class="secondary" id="undoBtn" onclick="undo()">↶</button>
<button class="secondary" id="redoBtn" onclick="redo()">↷</button>
<button onclick="openPrintableChart()">Finish</button>
</div>
</header>

<div class="app">

<nav class="rail">
<button id="navSetup" onclick="togglePanel('setup')"><b>⚡</b>Setup</button>
<button id="navTables" onclick="togglePanel('tables')"><b>◉</b>Tables</button>
<button id="navObjects" onclick="togglePanel('objects')"><b>◇</b>Objects</button>
<button id="navGuests" onclick="togglePanel('guests')"><b>♙</b>Guests</button>
<button id="navLists" onclick="togglePanel('lists')"><b>☷</b>Lists</button>
<button id="navVenue" onclick="togglePanel('venue')"><b>▧</b>Venue</button>
<button id="navMore" onclick="togglePanel('more')"><b>•••</b>More</button>
</nav>

<aside class="panel" id="panel">
<button class="panelClose" onclick="closePanel()">×</button>
<div id="panelContent"></div>
</aside>

<main class="work">
<div class="canvasWrap">
<div class="canvas" id="canvas">

<div class="venueBg" id="venueBg"></div>

<div class="empty" id="empty">
<div>
<div style="font-size:34px">♡</div>
<b>Your wedding plan</b>
<div style="font-size:12px;margin-top:5px">Start with Quick Setup</div>
</div>
</div>

<div class="layer" id="layer"></div>
<div class="context" id="context"></div>
<div class="trash" id="trash">🗑 Drop to delete</div>
<div class="status" id="status"></div>

</div>
</div>
</main>

</div>

<aside class="guestPanel" id="guestPanel">

<div class="guestHeader">
<div>
<div class="guestTitle" id="guestTitle">Table</div>
<div class="guestCount" id="guestCount"></div>
</div>
<button class="secondary" onclick="closeGuestPanel()">×</button>
</div>

<div class="guestBox">

<div class="formLabel">Επώνυμο / Surname</div>
<input id="gSurname" class="field" placeholder="Γεωργίου">

<div class="formLabel">Όνομα / First name</div>
<input id="gFirst" class="field" placeholder="Γιώργος">

<div class="formLabel">Αριθμός ατόμων / Party size</div>
<input id="gParty" class="field" type="number" min="1" max="20" value="1">

<button style="width:100%;margin-top:8px" onclick="addGuestToTable()">+ Add Guest</button>

</div>

<div style="display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:14px">
<strong style="font-size:13px">Guests at this table</strong>
<button class="dangerSoft" style="font-size:10px;padding:6px" onclick="clearCurrentTableGuests()">Clear</button>
</div>

<div id="tableGuestList"></div>
</aside>

<div class="overlay" id="printOverlay">
<div class="modal">

<div class="modalTop">
<div>
<h2 style="margin:0">Printable Seating Chart</h2>
<div class="hint" style="margin:3px 0 0">Alphabetical A–Ω · Name · Table</div>
</div>
<button class="secondary" onclick="closePrintableChart()">×</button>
</div>

<div class="printSettings">
<input id="chartCouple" class="field" placeholder="MARIOS & MARIA" oninput="renderPrintableChart()">
<input id="chartDateInput" class="field" placeholder="19.09.2026" oninput="renderPrintableChart()">
<input id="chartWelcomeInput" class="field" value="Welcome" placeholder="Welcome" oninput="renderPrintableChart()">
<input id="chartFindInput" class="field" value="Please find your seat" placeholder="Please find your seat" oninput="renderPrintableChart()">
</div>

<div style="display:flex;gap:7px;justify-content:flex-end">
<button class="secondary" onclick="renderPrintableChart()">Refresh</button>
<button onclick="window.print()">🖨 Print / Save PDF</button>
</div>

<div class="printSheet" id="printSheet"></div>

</div>
</div>

<div id="toast" style="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:white;padding:9px 13px;border-radius:10px;display:none;z-index:300"></div>

<script>
let S={
venue:null,
tables:[],
guests:[],
objects:[],
print:{couple:'',date:'',welcome:'Welcome',find:'Please find your seat'}
};

let selected=null;
let activePanel=null;
let activeGuestTable=null;
let undoStack=[];
let redoStack=[];

const $=id=>document.getElementById(id);
const canvas=$('canvas');
const layer=$('layer');
const venueBg=$('venueBg');
const context=$('context');
const trash=$('trash');
const mobile=()=>window.innerWidth<=800;

function uid(){
if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
return String(Date.now()+Math.random());
}

function state(){return JSON.stringify(S)}

function pushHistory(){
undoStack.push(state());
if(undoStack.length>60)undoStack.shift();
redoStack=[];
updateHistory();
}

function updateHistory(){
$('undoBtn').disabled=!undoStack.length;
$('redoBtn').disabled=!redoStack.length;
}

function undo(){
if(!undoStack.length)return;
redoStack.push(state());
S=JSON.parse(undoStack.pop());
selected=null;
closeGuestPanel();
applyVenue();
render();
saveOnly();
updateHistory();
}

function redo(){
if(!redoStack.length)return;
undoStack.push(state());
S=JSON.parse(redoStack.pop());
selected=null;
closeGuestPanel();
applyVenue();
render();
saveOnly();
updateHistory();
}

function saveOnly(){
try{localStorage.setItem('seatly46',JSON.stringify(S))}catch(e){}
$('savedIndicator').textContent='Saved ✓';
updateStatus();
}

function load(){
try{
const old=
localStorage.getItem('seatly46')||
localStorage.getItem('seatly45')||
localStorage.getItem('seatly44');

if(old){
const data=JSON.parse(old);
S.venue=data.venue||null;
S.tables=data.tables||[];
S.objects=data.objects||[];
S.print=data.print||{couple:'',date:'',welcome:'Welcome',find:'Please find your seat'};

S.guests=(data.guests||[]).map(guest=>{
if(guest.surname!==undefined){
return{
id:guest.id||uid(),
surname:guest.surname||'',
firstName:guest.firstName||'',
partySize:Math.max(1,Number(guest.partySize||1)),
tableId:guest.tableId||null
};
}

const parts=String(guest.name||'').trim().split(/\s+/);

return{
id:guest.id||uid(),
surname:parts.length>1?parts[parts.length-1]:parts[0]||'',
firstName:parts.length>1?parts.slice(0,-1).join(' '):'',
partySize:1,
tableId:guest.tableId||null
};
});
}
}catch(e){}
applyVenue();
render();
updateHistory();
}

function setActive(type){
['Setup','Tables','Objects','Guests','Lists','Venue','More'].forEach(name=>{
$('nav'+name).classList.toggle('active',name.toLowerCase()===type);
});
}

function closePanel(){
$('panel').classList.remove('open');
activePanel=null;
setActive('');
}

function togglePanel(type){
if(mobile()&&activePanel===type&&$('panel').classList.contains('open')){
closePanel();
return;
}

activePanel=type;
setActive(type);
$('panel').classList.add('open');

if(type==='setup')renderSetup();
if(type==='tables')renderTablesPanel();
if(type==='objects')renderObjectsPanel();
if(type==='guests')renderGuestManager();
if(type==='lists')renderLists();
if(type==='venue')renderVenuePanel();
if(type==='more')renderMore();
}

function closeAfterAction(){if(mobile())closePanel()}

function nextTableNumber(){
const numbers=S.tables.map(t=>Number(t.number));
let number=1;
while(numbers.includes(number))number++;
return number;
}

function tableUsedSeats(tableId,excludeGuestId=null){
return S.guests
.filter(g=>g.tableId===tableId&&g.id!==excludeGuestId)
.reduce((total,g)=>total+Number(g.partySize||1),0);
}

function renderSetup(){
$('panelContent').innerHTML=`
<h2>Quick Setup</h2>
<div class="hint">Choose the number of guests and Seatly calculates the tables.</div>

<div class="grid4">
${[50,100,150,200,250,300,350,400].map(n=>`
<button class="quickButton" onclick="showQuickOptions(${n})">
${n}<br><span style="font-size:9px">Guests</span>
</button>`).join('')}
</div>

<div class="section">
<h3>Custom guest count</h3>
<input id="customGuestCount" class="field" type="number" min="1" max="1000" placeholder="e.g. 186">
<button style="width:100%;margin-top:7px" onclick="customQuickSetup()">Calculate Tables</button>
</div>

<div id="quickResults"></div>`;
}

function customQuickSetup(){
const n=Math.max(1,+$('customGuestCount').value||1);
showQuickOptions(n);
}

function showQuickOptions(guestCount){
const choices=[8,10,12,16].map(seats=>{
const tableCount=Math.ceil(guestCount/seats);
const capacity=tableCount*seats;
return{seats,tableCount,capacity,spare:capacity-guestCount};
});

$('quickResults').innerHTML=`
<div class="setupCard">
<div class="setupTitle">${guestCount} Guests</div>
<div class="hint" style="margin:3px 0 6px">Choose seats per table.</div>

${choices.map(c=>`
<div class="setupOption">
<div>
<strong>${c.tableCount} Tables × ${c.seats} Seats</strong>
<div class="setupMeta">
${c.capacity} total seats ${c.spare===0?'· Exact':`· ${c.spare} spare`}
</div>
</div>
<button onclick="createQuickSetup(${c.tableCount},${c.seats},${guestCount})">Create Layout</button>
</div>`).join('')}

</div>`;
}

function createQuickSetup(tableCount,seats){
let proceed=true;
if(S.tables.length)proceed=confirm(`Replace the current layout with ${tableCount} tables?`);
if(!proceed)return;

pushHistory();
S.guests.forEach(g=>g.tableId=null);
S.tables=[];
createGrid(tableCount,seats);
render();
saveOnly();
closeAfterAction();
toast(`${tableCount} tables created`);
}

function createGrid(qty,seats){
const rect=canvas.getBoundingClientRect();
const width=rect.width;
const height=rect.height;

let scale=.72;
if(qty>=10)scale=.62;
if(qty>=18)scale=.54;
if(qty>=28)scale=.46;
if(qty>=38)scale=.40;

const itemSize=82*scale;
const gapX=12;
const gapY=12;
const usableWidth=Math.max(100,width-18);
const usableHeight=Math.max(100,height-60);

let columns=Math.max(1,Math.floor(usableWidth/(itemSize+gapX)));
columns=Math.min(columns,qty);

let rows=Math.ceil(qty/columns);

while(rows*(itemSize+gapY)>usableHeight&&columns<qty){
columns++;
rows=Math.ceil(qty/columns);
}

let finalScale=scale;
const requiredHeight=rows*(82*finalScale+gapY);

if(requiredHeight>usableHeight){
finalScale=Math.max(.30,finalScale*usableHeight/requiredHeight);
}

const stepX=82*finalScale+gapX;
const stepY=82*finalScale+gapY;
const gridWidth=(columns-1)*stepX;
const gridHeight=(rows-1)*stepY;

const startX=Math.max(5,width/2-gridWidth/2-41*finalScale);
const startY=Math.max(35,height/2-gridHeight/2-41*finalScale);

for(let i=0;i<qty;i++){
const column=i%columns;
const row=Math.floor(i/columns);

S.tables.push({
id:uid(),
number:nextTableNumber(),
seats,
x:startX+column*stepX,
y:startY+row*stepY,
scale:finalScale
});
}
}

function renderTablesPanel(){
$('panelContent').innerHTML=`
<h2>Tables</h2>
<div class="hint">Add one table or multiple tables manually.</div>

<div class="grid2">
<button class="soft" onclick="addSingleTable(8)">8 seats</button>
<button class="soft" onclick="addSingleTable(10)">10 seats</button>
<button class="soft" onclick="addSingleTable(12)">12 seats</button>

function createChairs(element,seats){
const count=Math.min(seats,16);
const radius=34;

for(let i=0;i<count;i++){
const angle=2*Math.PI*i/count-Math.PI/2;
const chair=document.createElement('div');
chair.className='chair';
chair.style.left=(41+Math.cos(angle)*radius-4.5)+'px';
chair.style.top=(41+Math.sin(angle)*radius-4.5)+'px';
element.appendChild(chair);
}
}

function render(){
layer.innerHTML='';

S.tables.forEach(table=>{
const used=tableUsedSeats(table.id);
const element=document.createElement('div');

element.className=
'obj table'+
(used===table.seats?' complete':'')+
(selected?.id===table.id?' selected':'');

element.style.left=table.x+'px';
element.style.top=table.y+'px';
element.style.transform=`scale(${table.scale||1})`;

createChairs(element,table.seats);

const core=document.createElement('div');
core.className='core';
core.innerHTML=`<b>TABLE ${table.number}</b><span>${used}/${table.seats}</span>`;

element.appendChild(core);
attachDrag(element,table,'table');
layer.appendChild(element);
});

S.objects.forEach(object=>{
const element=document.createElement('div');

element.className=
`obj venueObject ${object.type||'custom'}`+
(selected?.id===object.id?' selected':'');

element.style.left=object.x+'px';
element.style.top=object.y+'px';
element.style.width=object.width+'px';
element.style.height=object.height+'px';
element.style.transform=`scale(${object.scale||1})`;
element.textContent=object.label;

attachDrag(element,object,'object');
layer.appendChild(element);
});

$('empty').style.display=
(S.venue||S.tables.length||S.objects.length)?'none':'grid';

renderContext();
updateStatus();
}

function attachDrag(element,item,kind){
let startX,startY,originalX,originalY;
let active=false;
let beforeState=null;

element.onpointerdown=e=>{
e.stopPropagation();

selected={id:item.id,kind};

document.querySelectorAll('.obj').forEach(o=>o.classList.remove('selected'));
element.classList.add('selected');
renderContext();

startX=e.clientX;
startY=e.clientY;
originalX=item.x;
originalY=item.y;
beforeState=state();
active=true;
trash.style.display='block';

try{element.setPointerCapture(e.pointerId)}catch(error){}
};

element.onpointermove=e=>{
if(!active)return;

item.x=originalX+e.clientX-startX;
item.y=originalY+e.clientY-startY;

const rect=canvas.getBoundingClientRect();

item.x=Math.max(-5,Math.min(rect.width-30,item.x));
item.y=Math.max(28,Math.min(rect.height-30,item.y));

element.style.left=item.x+'px';
element.style.top=item.y+'px';

const bin=trash.getBoundingClientRect();

const isOverTrash=
e.clientX>=bin.left&&e.clientX<=bin.right&&
e.clientY>=bin.top&&e.clientY<=bin.bottom;

trash.classList.toggle('hot',isOverTrash);
};

element.onpointerup=()=>{
if(!active)return;
active=false;

const deleteIt=trash.classList.contains('hot');

trash.style.display='none';
trash.classList.remove('hot');

if(deleteIt){
undoStack.push(beforeState);
redoStack=[];
deleteCanvasObject(item.id,kind,false);
updateHistory();
return;
}

if(beforeState!==state()){
undoStack.push(beforeState);
redoStack=[];
saveOnly();
updateHistory();
}
};

element.onpointercancel=()=>{
active=false;
trash.style.display='none';
trash.classList.remove('hot');
};
}

${[8,10,12,16].map(seats=>`

else{

function saveTableSettings(){
const table=S.tables.find(t=>t.id===selected.id);
if(!table)return;

const number=Math.max(1,+$('tableNumber').value||1);

const duplicate=S.tables.find(
other=>other.id!==table.id&&Number(other.number)===number
);

if(duplicate){
toast('This table number already exists');
return;
}

const seats=+$('tableSeats').value;
const used=tableUsedSeats(table.id);

if(seats<used){
toast(`This table already has ${used} people`);
return;
}

pushHistory();
table.number=number;
table.seats=seats;
render();
saveOnly();
}

function duplicateTable(){
if(!selected||selected.kind!=='table')return;

const table=S.tables.find(t=>t.id===selected.id);
if(!table)return;

pushHistory();

const rect=canvas.getBoundingClientRect();

S.tables.push({
id:uid(),
number:nextTableNumber(),
seats:table.seats,
x:Math.min(rect.width-55,table.x+25),
y:Math.min(rect.height-55,table.y+25),
scale:table.scale||1
});

render();
saveOnly();
}

function resizeSelected(multiplier){
if(!selected)return;

const item=
selected.kind==='table'
?S.tables.find(t=>t.id===selected.id)
:S.objects.find(o=>o.id===selected.id);

if(!item)return;

pushHistory();

item.scale=Math.max(.30,Math.min(2,(item.scale||1)*multiplier));

render();
saveOnly();
}

function deleteCanvasObject(id,kind,history=true){
if(history)pushHistory();

if(kind==='table'){
S.guests.forEach(g=>{
if(g.tableId===id)g.tableId=null;
});
S.tables=S.tables.filter(t=>t.id!==id);
}else{
S.objects=S.objects.filter(o=>o.id!==id);
}

selected=null;
closeGuestPanel();
render();
saveOnly();
}

}

closeGuestPanel();
return;

.filter(g=>g.tableId===table.id)
.sort(compareGuests);

guests.length
?guests.map(guest=>`

function addGuestToTable(){
const table=S.tables.find(t=>t.id===activeGuestTable);
if(!table)return;

const surname=$('gSurname').value.trim();
const firstName=$('gFirst').value.trim();
const partySize=Math.max(1,Math.min(20,+$('gParty').value||1));

if(!surname){
toast('Add a surname');
return;
}

const available=table.seats-tableUsedSeats(table.id);

if(partySize>available){
toast(`Only ${available} seats available`);
return;
}

pushHistory();

S.guests.push({
id:uid(),
surname,
firstName,
partySize,
tableId:table.id
});

$('gSurname').value='';
$('gFirst').value='';
$('gParty').value=1;

render();
saveOnly();
}

function clearCurrentTableGuests(){
const table=S.tables.find(t=>t.id===activeGuestTable);
if(!table)return;

const ids=S.guests
.filter(g=>g.tableId===table.id)
.map(g=>g.id);

if(!ids.length){
toast('No guests at this table');
return;
}

if(!confirm(`Delete all guests from Table ${table.number}?`))return;

pushHistory();
S.guests=S.guests.filter(g=>!ids.includes(g.id));

refreshTableGuests();
render();
saveOnly();
}

function addManualGuest(){
const surname=$('manualSurname').value.trim();
const firstName=$('manualFirst').value.trim();
const partySize=Math.max(1,+$('manualParty').value||1);
const tableNumber=+$('manualTable').value;

const table=S.tables.find(t=>Number(t.number)===tableNumber);

if(!surname){
toast('Add surname');
return;
}

if(!table){
toast('Table not found');
return;
}

const available=table.seats-tableUsedSeats(table.id);

if(partySize>available){
toast(`Only ${available} seats available`);
return;
}

pushHistory();

S.guests.push({
id:uid(),
surname,
firstName,
partySize,
tableId:table.id
});

render();
saveOnly();
renderGuestManager();
toast('Guest added');
}

function editGuest(id){
const guest=S.guests.find(g=>g.id===id);
if(!guest)return;

const surname=prompt('Surname',guest.surname||'');
if(surname===null||!surname.trim())return;

const firstName=prompt('First name',guest.firstName||'');
if(firstName===null)return;

const people=prompt('Number of people',guest.partySize||1);
if(people===null)return;

const partySize=Math.max(1,+people||1);

const currentTable=S.tables.find(t=>t.id===guest.tableId);

const tableNumber=prompt(
'Table number',
currentTable?currentTable.number:''
);

if(tableNumber===null)return;

let targetTable=null;

if(tableNumber.trim()){
targetTable=S.tables.find(t=>Number(t.number)===Number(tableNumber));

if(!targetTable){
toast('Table not found');
return;
}

const available=
targetTable.seats-tableUsedSeats(targetTable.id,guest.id);

if(partySize>available){
toast('Not enough seats at that table');
return;
}
}

pushHistory();

guest.surname=surname.trim();
guest.firstName=firstName.trim();
guest.partySize=partySize;
guest.tableId=targetTable?targetTable.id:null;

render();
saveOnly();

if(activeGuestTable)refreshTableGuests();
if(activePanel==='lists')renderLists();
}

function deleteGuestConfirm(id){
const guest=S.guests.find(g=>g.id===id);
if(!guest)return;

if(!confirm(`Delete ${guestFullName(guest)}?`))return;

pushHistory();
S.guests=S.guests.filter(g=>g.id!==id);

render();
saveOnly();

if(activeGuestTable)refreshTableGuests();
if(activePanel==='lists')renderLists();

if($('printOverlay').classList.contains('open')){
renderPrintableChart();
}
}

function clearGuestList(){
if(!S.guests.length){
toast('Guest list is empty');
return;
}

if(!confirm(`Delete all ${S.guests.length} guest entries?`))return;

pushHistory();
S.guests=[];

render();
saveOnly();

if(activeGuestTable)refreshTableGuests();
if(activePanel==='guests')renderGuestManager();
if(activePanel==='lists')renderLists();

if($('printOverlay').classList.contains('open')){
renderPrintableChart();
}

toast('Guest list deleted — Undo available');
}

$('printOverlay').classList.add('open');

$('chartDateInput').value=S.print?.date||'';

function renderPrintableChart(){
S.print={
couple:$('chartCouple')?.value||'',
date:$('chartDateInput')?.value||'',
welcome:$('chartWelcomeInput')?.value||'Welcome',
find:$('chartFindInput')?.value||'Please find your seat'
};

saveOnly();

const guests=S.guests
.filter(g=>g.tableId)
.slice()
.sort(compareGuests);

const groups={};

guests.forEach(guest=>{
const letter=firstLetter(guest.surname);
if(!groups[letter])groups[letter]=[];
groups[letter].push(guest);
});

const letters=Object.keys(groups).sort(
(a,b)=>a.localeCompare(b,'el',{sensitivity:'base'})
);

const groupsHtml=
letters.length
?letters.map(letter=>{

const peopleHtml=groups[letter].map(guest=>{
const table=S.tables.find(t=>t.id===guest.tableId);

return`
<div class="chartPerson">
<span class="chartPersonName">
${safe(guestFullName(guest))}
${guest.partySize>1?` (${guest.partySize})`:''}
</span>
<span class="chartDots"></span>
<span class="chartTable">${table?table.number:'—'}</span>
</div>`;
}).join('');

return`
<div class="chartGroup">
<div class="chartLetter">${safe(letter)}</div>
${peopleHtml}
</div>`;
}).join('')
:`<div style="text-align:center;margin-top:80px">No assigned guests yet.</div>`;

$('printSheet').innerHTML=`
<div class="chartWelcome">${safe(S.print.welcome)}</div>
<div class="chartSmall">TO THE WEDDING OF</div>
<div class="chartNames">${safe(S.print.couple||'YOUR NAMES')}</div>
<div class="chartDate">${safe(S.print.date)}</div>
<div class="chartFind">${safe(S.print.find)}</div>
<div class="chartColumns">${groupsHtml}</div>`;
}

<button class="secondary" style="width:100%" onclick="undo()">↶ Undo</button>

function clearTables(){
if(!S.tables.length){
toast('No tables to delete');
return;
}

if(!confirm('Delete all tables? Guests stay saved but become unassigned.'))return;

pushHistory();
S.tables=[];
S.guests.forEach(g=>g.tableId=null);
selected=null;
closeGuestPanel();
render();
saveOnly();
}

function resetEverything(){
if(!confirm('Delete the entire seating plan?'))return;

pushHistory();

S={
venue:null,
tables:[],
guests:[],
objects:[],
print:{couple:'',date:'',welcome:'Welcome',find:'Please find your seat'}
};

selected=null;
closeGuestPanel();
applyVenue();
render();
saveOnly();
}

canvas.addEventListener('pointerdown',e=>{
if(mobile())closePanel();

if(e.target===canvas||e.target===layer){
selected=null;
context.style.display='none';
document.querySelectorAll('.obj').forEach(o=>o.classList.remove('selected'));
}
});

function updateStatus(){
const totalPeople=S.guests.reduce(
(total,g)=>total+Number(g.partySize||1),0
);

const seatedPeople=S.guests
.filter(g=>g.tableId)
.reduce((total,g)=>total+Number(g.partySize||1),0);

$('status').textContent=
`${S.tables.length} tables · ${seatedPeople}/${totalPeople} people seated`;
}

function guestFullName(guest){
return [guest.surname||'',guest.firstName||''].filter(Boolean).join(' ');
}

function compareGuests(a,b){
const surname=(a.surname||'').localeCompare(
b.surname||'','el',{sensitivity:'base'}
);

if(surname!==0)return surname;

return (a.firstName||'').localeCompare(
b.firstName||'','el',{sensitivity:'base'}
);
}

function firstLetter(text){
const clean=(text||'').trim();
if(!clean)return '#';
return clean.charAt(0).toLocaleUpperCase('el-GR');
}

function safe(text){
const div=document.createElement('div');
div.textContent=text||'';
return div.innerHTML;
}

function toast(message){
const element=$('toast');
element.textContent=message;
element.style.display='block';

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{
element.style.display='none';
},1800);
}

load();
</script>
