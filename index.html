<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seatly 4.2</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f3f1ed;
  --paper:#fff;
  --ink:#202020;
  --muted:#777;
  --line:#e5dfd7;
  --soft:#f1ede8;
  --green:#dff3e4;
  --greenB:#34784a;
  --danger:#a43a32;
}

html,body{
  margin:0;
  height:100%;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
}

body{overflow:hidden}

button,input,select{
  font:inherit
}

button{
  border:0;
  border-radius:10px;
  padding:9px 11px;
  background:var(--ink);
  color:#fff;
  font-weight:700;
  cursor:pointer
}

button.secondary{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line)
}

button.soft{
  background:var(--soft);
  color:var(--ink)
}

button.danger{
  background:var(--danger)
}

button:disabled{
  opacity:.4
}

/* TOP */

.topbar{
  height:58px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  position:relative;
  z-index:120
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px
}

.logo span{font-weight:400}

.topActions{
  display:flex;
  gap:5px;
  align-items:center
}

.saved{
  font-size:11px;
  color:#777
}

/* APP */

.app{
  height:calc(100vh - 58px);
  display:grid;
  grid-template-columns:64px 280px 1fr
}

/* LEFT TOOLBAR */

.rail{
  background:#202020;
  padding:6px 4px;
  display:flex;
  flex-direction:column;
  gap:5px;
  z-index:90
}

.rail button{
  height:54px;
  background:transparent;
  padding:4px;
  font-size:9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px
}

.rail button b{
  font-size:17px
}

.rail button.active{
  background:#fff;
  color:#202020
}

/* PANEL */

.panel{
  background:#fff;
  border-right:1px solid var(--line);
  padding:14px;
  overflow:auto;
  position:relative;
  z-index:80
}

.panel h2{
  margin:0 0 5px;
  font-size:18px
}

.panel h3{
  margin:0 0 8px;
  font-size:14px
}

.hint{
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
  margin-bottom:12px
}

.section{
  border-top:1px solid #eee8e1;
  padding-top:11px;
  margin-top:11px
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px
}

.field{
  width:100%;
  padding:9px;
  border:1px solid #d8d1c9;
  border-radius:9px;
  background:#fff
}

.upload{
  display:block;
  text-align:center;
  padding:18px;
  border:1.5px dashed #bbb;
  border-radius:13px;
  background:#faf9f7
}

.upload input{display:none}

.panelClose{display:none}

/* QUICK SETUP */

.presetBtn{
  background:#f4f1ec;
  color:#222;
  border:1px solid #e1dbd3
}

.setupCard{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin-top:8px;
  background:#faf9f7
}

.setupOption{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:8px 0;
  border-top:1px solid #eee
}

.setupOption:first-child{
  border-top:0
}

/* WORKSPACE */

.work{
  padding:8px;
  background:#ebe8e3;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center
}

.canvas{
  width:min(100%,1200px);
  aspect-ratio:16/10;
  max-height:100%;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  position:relative;
  overflow:hidden;
  touch-action:none;
  box-shadow:0 12px 30px rgba(0,0,0,.08)
}

.venueBg{
  position:absolute;
  inset:0;
  background:#fff center/contain no-repeat;
  pointer-events:none
}

.layer{
  position:absolute;
  inset:0
}

.empty{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  color:#999;
  pointer-events:none
}

/* TABLES */

.obj{
  position:absolute;
  touch-action:none;
  user-select:none
}

.table{
  width:102px;
  height:102px;
  display:flex;
  align-items:center;
  justify-content:center
}

.table.selected{
  outline:3px solid rgba(32,32,32,.18);
  outline-offset:4px
}

.core{
  width:62px;
  height:62px;
  border:2px solid #222;
  border-radius:50%;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.14);
  z-index:2
}

.core b{font-size:10px}

.core span{
  font-size:9px;
  color:#666
}

.complete .core{
  background:var(--green);
  border-color:var(--greenB)
}

.chair{
  position:absolute;
  width:12px;
  height:12px;
  border:1.3px solid #555;
  background:#fff;
  border-radius:3px
}

.venueObj{
  border:2px dashed #666;
  background:rgba(255,255,255,.9);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:800
}

.venueObj.selected{
  outline:3px solid rgba(32,32,32,.18);
  outline-offset:4px
}

/* CONTEXT */

.context{
  position:absolute;
  left:50%;
  top:10px;
  transform:translateX(-50%);
  display:none;
  align-items:center;
  gap:5px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:6px;
  z-index:35;
  box-shadow:0 8px 24px rgba(0,0,0,.14)
}

.context input,
.context select{
  width:66px;
  padding:6px;
  border:1px solid var(--line);
  border-radius:8px
}

.context button{
  padding:6px 8px
}

/* TRASH */

.trash{
  position:absolute;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  display:none;
  background:#fff;
  border:2px solid var(--line);
  border-radius:999px;
  padding:9px 15px;
  z-index:40;
  font-size:12px;
  font-weight:800
}

.trash.hot{
  background:#ffe7e3;
  border-color:#b23b30
}

/* STATUS */

.status{
  position:absolute;
  left:10px;
  bottom:10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
  color:#666;
  z-index:25
}

/* GUEST PANEL */

.guestPanel{
  position:fixed;
  top:58px;
  right:0;
  bottom:0;
  width:370px;
  background:#fff;
  border-left:1px solid var(--line);
  box-shadow:-10px 0 30px rgba(0,0,0,.12);
  z-index:110;
  display:none;
  padding:15px;
  overflow:auto
}

.guestPanel.open{
  display:block
}

.guestHeader{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  margin-bottom:12px
}

.guestTitle{
  font-size:21px;
  font-weight:850
}

.guestCount{
  font-size:12px;
  color:#777
}

.guestBox{
  background:#faf9f7;
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px
}

.formLabel{
  font-size:11px;
  font-weight:750;
  color:#666;
  margin:8px 0 4px
}

.guestRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #eee
}

.guestName{
  font-size:13px;
  font-weight:700
}

.guestMeta{
  font-size:11px;
  color:#777
}

.actions{
  display:flex;
  gap:4px
}

.actions button{
  padding:5px 6px;
  font-size:10px
}

/* VOICE IMPORT */

.voiceBox{
  border:1px solid var(--line);
  border-radius:13px;
  background:#faf9f7;
  padding:10px;
  margin-top:9px
}

.voicePreviewRow{
  display:grid;
  grid-template-columns:1fr 1fr 60px 70px auto;
  gap:5px;
  align-items:center;
  padding:6px 0;
  border-bottom:1px solid #eee
}

.voicePreviewRow input{
  width:100%;
  padding:6px;
  border:1px solid #ddd;
  border-radius:7px
}

/* DIRECTORY */

.directoryRow{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:8px;
  padding:7px 0;
  border-bottom:1px solid #eee;
  align-items:center
}

.letter{
  font-size:20px;
  font-weight:900;
  margin:14px 0 4px;
  border-bottom:2px solid #222
}

/* PREVIEW */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:220;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px
}

.overlay.open{
  display:flex
}

.modal{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:20px
}

.modalTop{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center
}

/* MOBILE */

@media(max-width:800px){

  .topbar{
    height:56px;
    padding:0 7px
  }

  .logo{
    font-size:21px
  }

  .saved{
    display:none
  }

  .topActions{
    gap:3px
  }

  .topActions button{
    padding:7px 8px;
    font-size:11px
  }

  .app{
    height:calc(100vh - 56px);
    grid-template-columns:54px 1fr
  }

  .rail{
    padding:4px 2px
  }

  .rail button{
    height:48px;
    font-size:8px
  }

  .work{
    grid-column:2;
    padding:5px
  }

  .canvas{
    width:100%;
    aspect-ratio:16/10;
    max-height:100%;
    border-radius:12px
  }

  .panel{
    position:fixed;
    left:54px;
    right:0;
    bottom:0;
    top:auto;
    width:auto;
    max-height:52vh;
    display:none;
    border-right:0;
    border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    padding:46px 12px 12px;
    box-shadow:0 -10px 30px rgba(0,0,0,.18);
    z-index:100
  }

  .panel.open{
    display:block
  }

  .panelClose{
    display:block;
    position:absolute;
    right:9px;
    top:7px;
    width:34px;
    height:34px;
    padding:0;
    border-radius:50%;
    background:var(--soft);
    color:#222;
    border:1px solid var(--line);
    font-size:20px
  }

  .context{
    max-width:94%;
    overflow:auto;
    white-space:nowrap
  }

  .guestPanel{
    top:56px;
    left:54px;
    right:0;
    bottom:0;
    width:auto;
    border-left:0;
    box-shadow:none
  }

  .voicePreviewRow{
    grid-template-columns:1fr 1fr;
    background:#fff;
    padding:8px;
    margin-bottom:6px;
    border:1px solid #eee;
    border-radius:9px
  }

  .grid4{
    grid-template-columns:repeat(2,1fr)
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="logo">
    seat<span>ly</span>
  </div>

  <div class="topActions">

    <span
    class="saved"
    id="savedIndicator">
      Saved ✓
    </span>

    <button
    class="secondary"
    id="undoBtn"
    onclick="undo()">
      ↶
    </button>

    <button
    class="secondary"
    id="redoBtn"
    onclick="redo()">
      ↷
    </button>

    <button onclick="toast('Export will be added next')">
      Finish
    </button>

  </div>

</header>


<div class="app">

<nav class="rail">

  <button
  id="navSetup"
  onclick="togglePanel('setup')">
    <b>⚡</b>
    Setup
  </button>

  <button
  id="navTables"
  onclick="togglePanel('tables')">
    <b>◉</b>
    Tables
  </button>

  <button
  id="navGuests"
  onclick="togglePanel('guests')">
    <b>♙</b>
    Guests
  </button>

  <button
  id="navLists"
  onclick="togglePanel('lists')">
    <b>☷</b>
    Lists
  </button>

  <button
  id="navVenue"
  onclick="togglePanel('venue')">
    <b>▧</b>
    Venue
  </button>

  <button
  id="navMore"
  onclick="togglePanel('more')">
    <b>•••</b>
    More
  </button>

</nav>


<aside
class="panel"
id="panel">

  <button
  class="panelClose"
  onclick="closePanel()">
    ×
  </button>

  <div id="panelContent"></div>

</aside>


<main class="work">

<div
class="canvas"
id="canvas">

  <div
  class="venueBg"
  id="venueBg">
  </div>

  <div
  class="empty"
  id="empty">

    <div>

      <div style="font-size:34px">
        ♡
      </div>

      <b>
        Your wedding plan
      </b>

      <div style="font-size:12px;margin-top:5px">
        Start with Quick Setup
      </div>

    </div>

  </div>

  <div
  class="layer"
  id="layer">
  </div>

  <div
  class="context"
  id="context">
  </div>

  <div
  class="trash"
  id="trash">
    🗑 Drop to delete
  </div>

  <div
  class="status"
  id="status">
  </div>

</div>

</main>

</div>


<!-- TABLE GUESTS -->

<aside
class="guestPanel"
id="guestPanel">

<div class="guestHeader">

  <div>

    <div
    class="guestTitle"
    id="guestTitle">
      Table
    </div>

    <div
    class="guestCount"
    id="guestCount">
    </div>

  </div>

  <button
  class="secondary"
  onclick="closeGuestPanel()">
    ×
  </button>

</div>


<div class="guestBox">

  <div class="formLabel">
    Επώνυμο / Surname
  </div>

  <input
  id="gSurname"
  class="field"
  placeholder="Γεωργίου">


  <div class="formLabel">
    Όνομα / First name
  </div>

  <input
  id="gFirst"
  class="field"
  placeholder="Γιώργος">


  <div class="formLabel">
    Αριθμός ατόμων
  </div>

  <input
  id="gParty"
  class="field"
  type="number"
  min="1"
  max="20"
  value="1">


  <button
  style="width:100%;margin-top:7px"

    + Add guest

  </button>

</div>


<div
style="font-size:13px;font-weight:800;margin-top:14px">

Guests at this table

</div>


<div id="tableGuestList"></div>

</aside>


<!-- ALPHABETICAL PREVIEW -->

<div
class="overlay"
id="directoryOverlay">

<div class="modal">

  <div class="modalTop">

    <div>

      <h2 style="margin:0">
        Alphabetical Guest Directory
      </h2>

      <div class="hint" style="margin:3px 0 0">
        Surname · Name · People · Table
      </div>

    </div>

    <button
    class="secondary"
    onclick="closeDirectory()">
      ×
    </button>

  </div>

  <div id="directoryContent"></div>

</div>

</div>


<div
id="toast"
style="
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:#222;
color:#fff;
padding:9px 13px;
border-radius:10px;
display:none;
z-index:300">
</div>


<script>

/* ==================================================
DATA
================================================== */

let S={

  venue:null,

  tables:[],

  guests:[],

  objects:[]

};


let selected=null;

let activePanel=null;

let activeGuestTable=null;


let undoStack=[];

let redoStack=[];


let recognition=null;

let voiceDraft=[];


const $=
id=>document.getElementById(id);


const canvas=
$('canvas');


const layer=
$('layer');


const venueBg=
$('venueBg');


const context=
$('context');


const trash=
$('trash');


const mobile=
()=>window.innerWidth<=800;


const uid=()=>{

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return String(
    Date.now()+Math.random()
  );

};


/* ==================================================
SAVE / LOAD
================================================== */

function state(){

  return JSON.stringify(S);

}


function pushHistory(){

  undoStack.push(
    state()
  );


  if(
    undoStack.length>60
  ){

    undoStack.shift();

  }


  redoStack=[];


  updateHistory();

}


function undo(){

  if(
    !undoStack.length
  )return;


  redoStack.push(
    state()
  );


  S=
  JSON.parse(
    undoStack.pop()
  );


  selected=null;


  closeGuestPanel();


  applyVenue();

  render();

  saveOnly();

  updateHistory();

}


function redo(){

  if(
    !redoStack.length
  )return;


  undoStack.push(
    state()
  );


  S=
  JSON.parse(
    redoStack.pop()
  );


  selected=null;


  closeGuestPanel();


  applyVenue();

  render();

  saveOnly();

  updateHistory();

}


function updateHistory(){

  $('undoBtn').disabled=
  !undoStack.length;


  $('redoBtn').disabled=
  !redoStack.length;

}


function saveOnly(){

  try{

    localStorage.setItem(
      'seatly42',
      JSON.stringify(S)
    );

  }catch(e){}


  updateStatus();


  $('savedIndicator')
  .textContent=
  'Saved ✓';

}


function load(){

  try{

    const old=

    localStorage.getItem('seatly42')

    ||

    localStorage.getItem('seatly41')

    ||

    localStorage.getItem('seatly40');


    if(old){

      const data=
      JSON.parse(old);


      S.venue=
      data.venue||null;


      S.tables=
      data.tables||[];


      S.objects=
      data.objects||
      data.objs||
      data.venueObjects||
      [];


      S.guests=

      (data.guests||[])
      .map(guest=>{

        if(
          guest.surname!==undefined
        ){

          return guest;

        }


        const oldName=
        guest.name||'';


        const parts=
        oldName
        .trim()
        .split(/\s+/);


        return{

          id:
          guest.id||uid(),

          surname:
          parts.length>1
          ?parts[parts.length-1]
          :parts[0]||'',

          firstName:
          parts.length>1
          ?parts.slice(0,-1).join(' ')
          :'',

          partySize:
          Number(
            guest.partySize||1
          ),

          tableId:
          guest.tableId||null

        };

      });

    }

  }catch(e){}


  applyVenue();

  render();

  updateHistory();

}


/* ==================================================
TABLE HELPERS
================================================== */

function nextTableNumber(){

  const used=

  S.tables
  .map(
    table=>Number(table.number)
  );


  let n=1;


  while(
    used.includes(n)
  ){

    n++;

  }


  return n;

}


function tableUsedSeats(
tableId,
exclude=null
){

  return S.guests

  .filter(
    guest=>

    guest.tableId===tableId

    &&

    guest.id!==exclude
  )

  .reduce(
    (
      total,
      guest
    )=>

    total+

    Number(
      guest.partySize||1
    ),

    0
  );

}


/* ==================================================
NAV
================================================== */

function setActive(type){

  [
    'Setup',
    'Tables',
    'Guests',
    'Lists',
    'Venue',
    'More'
  ]

  .forEach(name=>{

    $('nav'+name)
    .classList
    .toggle(

      'active',

      name.toLowerCase()===type

    );

  });

}


function closePanel(){

  $('panel')
  .classList
  .remove('open');


  activePanel=null;


  setActive('');

}


function togglePanel(type){

  if(

    mobile()

    &&

    activePanel===type

    &&

    $('panel')
    .classList
    .contains('open')

  ){

    closePanel();

    return;

  }


  activePanel=
  type;


  setActive(type);


  $('panel')
  .classList
  .add('open');


  if(type==='setup'){

    renderSetup();

  }


  if(type==='tables'){

    renderTables();

  }


  if(type==='guests'){

    renderGuestsManager();

  }


  if(type==='lists'){

    renderLists();

  }


  if(type==='venue'){

    renderVenue();

  }


  if(type==='more'){

    renderMore();

  }

}


function afterAction(){

  if(
    mobile()
  ){

    closePanel();

  }

}


/* ==================================================
QUICK SETUP
================================================== */

function renderSetup(){

  $('panelContent')
  .innerHTML=`

  <h2>
    Quick Setup
  </h2>

  <div class="hint">
    Start from your guest count instead of manually calculating tables.
  </div>


  <div class="grid4">

    ${[
      50,

/* ==================================================
RESPONSIVE GRID
================================================== */

function createTableGrid(
qty,
seats
){

  const rect=
  canvas.getBoundingClientRect();


  let scale=1;


  if(qty>=10){

    scale=.82;

  }


  if(qty>=18){

    scale=.68;

  }


  if(qty>=28){

    scale=.56;

  }


  if(qty>=38){

    scale=.48;

  }


  const spacingX=
  105*
  scale;


  const spacingY=
  105*
  scale;


  const usableWidth=
  rect.width-
  25;


  const usableHeight=
  rect.height-
  70;


  let columns=

  Math.max(
    1,
    Math.floor(
      usableWidth/
      spacingX
    )
  );


  columns=

  Math.min(
    columns,
    qty
  );


  let rows=

  Math.ceil(
    qty/
    columns
  );


  while(

    rows*
    spacingY
    >
    usableHeight

    &&

    columns<qty

  ){

    columns++;


    rows=

    Math.ceil(
      qty/
      columns
    );

  }


  const gridWidth=

  (
    columns-1
  )

  *
  spacingX;


  const gridHeight=

  (
    rows-1
  )

  *
  spacingY;


  const startX=

  Math.max(

    5,

    rect.width/2
    -
    gridWidth/2
    -
    51*
    scale

  );


  const startY=

  Math.max(

    45,

    rect.height/2
    -
    gridHeight/2
    -
    51*
    scale

  );


  for(
    let i=0;
    i<qty;
    i++
  ){

    const col=
    i%
    columns;


    const row=
    Math.floor(
      i/
      columns
    );


    S.tables.push({

      id:uid(),

      number:
      nextTableNumber(),

      seats:
      seats,

      x:
      startX+
      col*
      spacingX,

      y:
      startY+
      row*
      spacingY,

      scale:
      scale

    });

  }

}

/* ==================================================
CHAIRS
================================================== */

function createChairs(
el,
count
){

  const n=

  Math.min(
    count,
    16
  );


  const radius=42;


  for(
    let i=0;
    i<n;
    i++
  ){

    const angle=

    2*
    Math.PI*
    i/n

    -

    Math.PI/2;


    const chair=
    document.createElement(
      'div'
    );


    chair.className=
    'chair';


    chair.style.left=

    (
      51+
      Math.cos(angle)*
      radius
      -
      6
    )

    +'px';


    chair.style.top=

    (
      51+
      Math.sin(angle)*
      radius
      -
      6
    )

    +'px';


    el.appendChild(
      chair
    );

  }

}

/* ==================================================
DRAG
================================================== */

function attachDrag(
el,
table
){

  let sx;
  let sy;

  let ox;
  let oy;

  let active=false;

  let before=null;


  el.onpointerdown=e=>{

    e.stopPropagation();


    selected={

      id:table.id,

      kind:'table'

    };


    document
    .querySelectorAll('.table')
    .forEach(
      item=>
      item
      .classList
      .remove('selected')
    );


    el
    .classList
    .add('selected');


    renderContext();


    sx=
    e.clientX;


    sy=
    e.clientY;


    ox=
    table.x;


    oy=
    table.y;


    active=true;


    before=
    state();


    trash.style.display=
    'block';


    try{

      el.setPointerCapture(
        e.pointerId
      );

    }catch(_){}

  };


  el.onpointermove=e=>{

    if(
      !active
    )return;


    table.x=

    ox+
    e.clientX-
    sx;


    table.y=

    oy+
    e.clientY-
    sy;


    const rect=
    canvas
    .getBoundingClientRect();


    table.x=

    Math.max(

      -10,

      Math.min(
        rect.width-40,
        table.x
      )

    );


    table.y=

    Math.max(

      35,

      Math.min(
        rect.height-40,
        table.y
      )

    );


    el.style.left=
    table.x+'px';


    el.style.top=
    table.y+'px';


    const bin=
    trash
    .getBoundingClientRect();


    const over=

    e.clientX>=bin.left

    &&

    e.clientX<=bin.right

    &&

    e.clientY>=bin.top

    &&

    e.clientY<=bin.bottom;


    trash
    .classList
    .toggle(
      'hot',
      over
    );

  };


  el.onpointerup=()=>{

    if(
      !active
    )return;


    active=false;


    const remove=

    trash
    .classList
    .contains('hot');


    trash.style.display=
    'none';


    trash
    .classList
    .remove('hot');


    if(remove){

      undoStack.push(
        before
      );


      redoStack=[];


      deleteTable(
        table.id,
        false
      );


      updateHistory();

      return;

    }


    if(
      before!==
      state()
    ){

      undoStack.push(
        before
      );


      redoStack=[];


      saveOnly();

      updateHistory();

    }

  };

}

function saveTableSettings(){

  const table=

  S.tables.find(
    table=>
    table.id===selected.id
  );


  if(!table)return;


  const number=

  Math.max(
    1,
    +$('ctxNumber').value||1
  );


  const exists=

  S.tables.find(
    other=>

    other.id!==table.id

    &&

    Number(other.number)===
    number
  );


  if(exists){

    toast(
      'Table number already exists'
    );

    return;

  }


  const seats=
  +$('ctxSeats').value;


  const used=
  tableUsedSeats(
    table.id
  );


  if(
    seats<used
  ){

    toast(
      'Not enough seats for current guests'
    );

    return;

  }


  pushHistory();


  table.number=
  number;


  table.seats=
  seats;


  render();

  saveOnly();

  if(!table)return;


  pushHistory();


  table.scale=

      m

function deleteTable(
id,
history=true
){

  if(history){

    pushHistory();

  }


  S.guests
  .forEach(
    guest=>{

      if(
        guest.tableId===id
      ){

        guest.tableId=null;

      }

    }
  );


  S.tables=

  S.tables.filter(
    table=>
    table.id!==id
  );


  selected=null;


  closeGuestPanel();


  render();

  saveOnly();

}

function toggleVoice(){

  if(recognition){

    recognition.stop();

    return;

  }


  const SR=

  window.SpeechRecognition

  ||

  window.webkitSpeechRecognition;


  if(!SR){

    toast(
      'Voice recognition is not available in this browser'
    );

    return;

  }


  recognition=
  new SR();


  recognition.lang=
  'el-GR';


  recognition.continuous=
  true;


  recognition.interimResults=
  false;


  $('voiceStartBtn')
  .textContent=

  '■ Stop listening';


  $('voiceStatus')
  .textContent=

  'Listening…';


  recognition.onresult=e=>{

    for(
      let i=e.resultIndex;
      i<e.results.length;
      i++
    ){

      parseVoiceText(
        e.results[i][0].transcript
      );

    }


    renderVoiceDraft();

  };


  recognition.onerror=()=>{

    toast(
      'Voice could not understand clearly'
    );

  };


  recognition.onend=()=>{

    recognition=null;


    if(
      $('voiceStartBtn')
    ){

      $('voiceStartBtn')
      .textContent=

      '🎙 Voice Import';

    }


    if(
      $('voiceStatus')
    ){

      $('voiceStatus')
      .textContent=

      'Review the preview before adding guests.';

    }

  };


  recognition.start();

}


/*
Expected examples:

Γεωργίου Γιώργος 2 άτομα τραπέζι 1

Αντωνίου Μαρία 3 άτομα τραπέζι 5
*/

function parseVoiceText(
text
){

  const chunks=

  text

  .split(
    /[.;,]+/
  )

  .map(
    item=>item.trim()
  )

  .filter(Boolean);


  chunks
  .forEach(chunk=>{

    const tableMatch=

    chunk.match(
      /(?:τραπέζι|τραπεζι|table)\s*(\d+)/i
    );


    const peopleMatch=

    chunk.match(
      /(\d+)\s*(?:άτομα|ατομα|people|persons?)/i
    );


    const tableNumber=

    tableMatch
    ?Number(tableMatch[1])
    :1;


    const partySize=

    peopleMatch
    ?Number(peopleMatch[1])
    :1;


    let cleaned=

    chunk

    .replace(
      /(?:τραπέζι|τραπεζι|table)\s*\d+/ig,
      ''
    )

    .replace(
      /\d+\s*(?:άτομα|ατομα|people|persons?)/ig,
      ''
    )

    .trim();


    const names=

    cleaned
    .split(/\s+/)
    .filter(Boolean);


    /*
    Default speech format:
    Surname FirstName
    */

    const surname=

    names[0]||'';


    const firstName=

    names
    .slice(1)
    .join(' ');


    if(
      surname
    ){

      voiceDraft.push({

        id:uid(),

        surname,

        firstName,

        partySize,

        tableNumber

      });

    }

  });

}


/* ==================================================
VOICE PREVIEW
================================================== */

function renderVoiceDraft(){

  if(
    !voiceDraft.length
  ){

    $('voiceDraftArea')
    .innerHTML='';

    return;

  }


  $('voiceDraftArea')
  .innerHTML=`

  <div class="voiceBox">

    <h3>
      Voice Preview
    </h3>

    <div class="hint">
      Correct anything before Add All.
    </div>


    ${voiceDraft

    .map(
      (
        guest,
        index
      )=>

      `

      <div class="voicePreviewRow">

        <input
        value="${safeAttr(guest.surname)}"
        onchange="voiceDraft[${index}].surname=this.value">


        <input
        value="${safeAttr(guest.firstName)}"
        onchange="voiceDraft[${index}].firstName=this.value">


        <input
        type="number"
        min="1"
        value="${guest.partySize}"
        onchange="voiceDraft[${index}].partySize=Math.max(1,+this.value||1)">


        <input
        type="number"
        min="1"
        value="${guest.tableNumber}"
        onchange="voiceDraft[${index}].tableNumber=Math.max(1,+this.value||1)">


        <button
        class="danger"
        onclick="removeVoiceDraft(${index})">

          ×

        </button>

      </div>

      `

    )

    .join('')}


    <button
    style="width:100%;margin-top:8px"
    onclick="confirmVoiceGuests()">

      Add All Guests

    </button>


    <button
    class="secondary"
    style="width:100%;margin-top:6px"
    onclick="clearVoiceDraft()">

      Clear Preview

    </button>

  </div>

  `;

}


function removeVoiceDraft(
index
){

  voiceDraft.splice(
    index,
    1
  );


  renderVoiceDraft();

}


function clearVoiceDraft(){

  voiceDraft=[];


  renderVoiceDraft();

}


function confirmVoiceGuests(){

  if(
    !voiceDraft.length
  )return;


  /*
  Validate all guests first.
  */

  const temporaryUsage={};


  S.tables
  .forEach(table=>{

    temporaryUsage[
      table.id
    ]=

    tableUsedSeats(
      table.id
    );

  });


  for(
    const guest
    of voiceDraft
  ){

    const table=

    S.tables.find(
      table=>

      Number(table.number)===
      Number(guest.tableNumber)
    );


    if(!table){

      toast(
        `Table ${guest.tableNumber} not found`
      );

      return;

    }


    const used=

    temporaryUsage[
      table.id
    ]||0;


    if(
      used+
      Number(guest.partySize||1)
      >
      table.seats
    ){

      toast(
        `Not enough seats at Table ${table.number}`
      );

      return;

    }


    temporaryUsage[
      table.id
    ]=

    used+
    Number(
      guest.partySize||1
    );

  }


  pushHistory();


  voiceDraft
  .forEach(guest=>{

    const table=

    S.tables.find(
      table=>

      Number(table.number)===
      Number(guest.tableNumber)
    );


    S.guests.push({

      id:uid(),

      surname:
      guest.surname.trim(),

      firstName:
      guest.firstName.trim(),

      partySize:
      Number(
        guest.partySize||1
      ),

      tableId:
      table.id

    });

  });


  const count=
  voiceDraft.length;


  voiceDraft=[];


  render();

  saveOnly();

  renderGuestsManager();


  toast(
    `${count} guests added`
  );

}


/* ==================================================
EDIT / MOVE / DELETE GUEST
================================================== */

function editGuest(id){

  const guest=

  S.guests.find(
    guest=>
    guest.id===id
  );


  if(!guest)return;


  const surname=

  prompt(
    'Surname',
    guest.surname||''
  );


  if(
    surname===null
    ||
    !surname.trim()
  )return;


  const firstName=

  prompt(
    'First name',
    guest.firstName||''
  );


  if(
    firstName===null
  )return;


  const party=

  prompt(
    'People',
    guest.partySize||1
  );


  if(
    party===null
  )return;


  const table=

  S.tables.find(
    table=>
    table.id===guest.tableId
  );


  const size=

  Math.max(
    1,
    +party||1
  );


  if(table){

    const free=

    table.seats-

    tableUsedSeats(
      table.id,
      guest.id
    );


    if(
      size>
      free
    ){

      toast(
        'Not enough seats'
      );

      return;

    }

  }


  pushHistory();


  guest.surname=
  surname.trim();


  guest.firstName=
  firstName.trim();


  guest.partySize=
  size;


  render();

  saveOnly();


  if(
    activeGuestTable
  ){

    refreshTableGuests();

  }


  if(
    activePanel==='lists'
  ){

    renderLists();

  }

}


function moveGuest(id){

  const guest=

  S.guests.find(
    guest=>
    guest.id===id
  );


  if(!guest)return;


  const current=

  S.tables.find(
    table=>
    table.id===guest.tableId
  );


  const answer=

  prompt(

    'Move to table number',

    current
    ?current.number
    :''

  );


  if(
    answer===null
  )return;


  const table=

  S.tables.find(
    table=>

    Number(table.number)===
    Number(answer)
  );


  if(!table){

    toast(
      'Table not found'
    );

    return;

  }


  const free=

  table.seats-

  tableUsedSeats(
    table.id,
    guest.id
  );


  if(
    guest.partySize>
    free
  ){

    toast(
      'Not enough seats'
    );

    return;

  }


  pushHistory();


  guest.tableId=
  table.id;


  render();

  saveOnly();

  renderLists();

}


function unassignGuest(id){

  const guest=

  S.guests.find(
    guest=>
    guest.id===id
  );


  if(!guest)return;


  pushHistory();


  guest.tableId=null;


  render();

  saveOnly();


  if(
    activeGuestTable
  ){

    refreshTableGuests();

  }

}


function deleteGuest(id){

  pushHistory();


  S.guests=

  S.guests.filter(
    guest=>
    guest.id!==id
  );


  render();

  saveOnly();


  if(
    activePanel==='lists'
  ){

    renderLists();

  }

}


/* ==================================================
LISTS
================================================== */

function renderLists(){

  const cards=

  S.tables

  .slice()

  .sort(
    (a,b)=>
    a.number-b.number
  )

  .map(table=>{

    const guests=

    S.guests

    .filter(
      guest=>
      guest.tableId===table.id
    )

    .sort(
      compareGuests
    );


    return`

    <div class="setupCard">

      <div
      style="display:flex;justify-content:space-between;align-items:center">

        <strong>
          Table ${table.number}
        </strong>

        <span
        style="font-size:11px;color:#777">

          ${tableUsedSeats(table.id)}/${table.seats}

        </span>

      </div>


      ${guests.length

      ?

      guests

      .map(
        guest=>

        `

        <div class="guestRow">

          <div>

            <div class="guestName">

              ${safe(
                guestFullName(
                  guest
                )
              )}

            </div>

            <div class="guestMeta">

              ${guest.partySize}
              people

            </div>

          </div>


          <div class="actions">

            <button
            class="secondary"
            onclick="editGuest('${guest.id}')">

              Edit

            </button>

            <button
            class="secondary"
            onclick="moveGuest('${guest.id}')">

              Move

            </button>

          </div>

        </div>

        `

      )

      .join('')

      :

      `

      <div class="hint"
      style="margin-top:7px">

        No guests

      </div>

      `}

    </div>

    `;

  })

  .join('');


  $('panelContent')
  .innerHTML=`

  <h2>
    Seating Lists
  </h2>

  <div class="hint">
    Every table and every guest.
  </div>


  <button
  style="width:100%"
  onclick="openDirectory()">

    Alphabetical Directory

  </button>


  <div class="section">

    ${cards||
    '<div class="hint">No tables yet.</div>'}

  </div>

  `;

}


/* ==================================================
DIRECTORY
================================================== */

function openDirectory(){

  const guests=

  S.guests

  .slice()

  .sort(
    compareGuests
  );


  const groups={};


  guests
  .forEach(guest=>{

    const letter=

    (
      guest.surname||
      '#'
    )

    .trim()

    .charAt(0)

    .toLocaleUpperCase(
      'el-GR'
    )

    ||

    '#';


    if(
      !groups[letter]
    ){

      groups[letter]=[];

    }


    groups[letter]
    .push(
      guest
    );

  });


  const letters=

  Object.keys(groups)

  .sort(
    (a,b)=>

    a.localeCompare(
      b,
      'el'
    )
  );


  $('directoryContent')
  .innerHTML=

  letters.length

  ?

  letters

  .map(letter=>{

    return`

    <div class="letter">

      ${safe(letter)}

    </div>


    ${groups[letter]

    .map(guest=>{

      const table=

      S.tables.find(
        table=>
        table.id===guest.tableId
      );


      return`

      <div class="directoryRow">

        <strong>

          ${safe(
            guestFullName(
              guest
            )
          )}

        </strong>


        <span>

          ${guest.partySize}
          people

        </span>


        <span>

          Table
          ${table
          ?table.number
          :'—'}

        </span>

      </div>

      `;

    })

    .join('')}

    `;

  })

  .join('')

  :

  '<div class="hint">No guests yet.</div>';


  $('directoryOverlay')
  .classList
  .add('open');

}


function closeDirectory(){

  $('directoryOverlay')
  .classList
  .remove('open');

}

MORE

  $('panelContent')
  .innerHTML=`

  <h2>
    More
  </h2>


  <button
  class="secondary"
  style="width:100%"
  onclick="undo()">

    ↶ Undo

  </button>


  <button
  class="secondary"
  style="width:100%;margin-top:7px"

  <div class="section">

    <button
    class="danger"
    style="width:100%"

    </button>

  <div class="section">

    </button>

  `;

}


function clearTables(){

  if(
    !confirm(
      'Delete all tables? Guests will become unassigned.'
    )
  )return;


  pushHistory();


  S.tables=[];


  S.guests
  .forEach(
    guest=>{

      guest.tableId=null;

    }
  );


  selected=null;


  render();

  saveOnly();

}


function resetEverything(){

  if(
    !confirm(
      'Delete the entire project?'
    )
  )return;


  pushHistory();


  S={

    venue:null,

    tables:[],

    guests:[],

    objects:[]

  };


  selected=null;


  applyVenue();

  render();

  saveOnly();

}


/* ==================================================
CANVAS TAP
================================================== */

canvas.addEventListener(
'pointerdown',
e=>{

  if(
    mobile()
  ){

    closePanel();

  }


  if(
    e.target===canvas
    ||
    e.target===layer
  ){

    selected=null;


    context.style.display=
    'none';


    document
    .querySelectorAll('.table')
    .forEach(
      el=>
      el
      .classList
      .remove('selected')
    );

  }

}
);


/* ==================================================
STATUS
================================================== */

function updateStatus(){

  const people=

  S.guests

  .reduce(
    (
      total,
      guest
    )=>

    total+
    Number(
      guest.partySize||1
    ),

    0
  );


  const seated=

  S.guests

  .filter(
    guest=>
    guest.tableId
  )

  .reduce(
    (
      total,
      guest
    )=>

    total+
    Number(
      guest.partySize||1
    ),

    0
  );


  $('status')
  .textContent=

  `${S.tables.length} tables · ${seated}/${people} people seated`;

}


/* ==================================================
HELPERS
================================================== */

function guestFullName(
guest
){

  return[

    guest.surname||'',

    guest.firstName||''

  ]

  .filter(Boolean)

  .join(' ');

}


function compareGuests(
a,
b
){

  const surname=

  (
    a.surname||''
  )

  .localeCompare(

    b.surname||'',

    'el',

    {
      sensitivity:'base'
    }

  );


  if(
    surname!==0
  ){

    return surname;

  }


  return(

    a.firstName||''

  )

  .localeCompare(

    b.firstName||'',

    'el',

    {
      sensitivity:'base'
    }

  );

}


function safe(text){

  const div=
  document.createElement(
    'div'
  );


  div.textContent=
  text||'';


  return div.innerHTML;

}


function safeAttr(text){

  return String(
    text||''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  );

}


function toast(message){

  const el=
  $('toast');


  el.textContent=
  message;


  el.style.display=
  'block';


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer=

  setTimeout(
    ()=>{

      el.style.display=
      'none';

    },
    1700
  );

}

START
