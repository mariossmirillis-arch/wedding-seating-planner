<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seatly 3.1</title>

<style>

*{
box-sizing:border-box
}

:root{

--bg:#f5f3ef;
--paper:#ffffff;
--ink:#1f1f1f;
--muted:#777;
--line:#e6e0d8;
--soft:#f2eee9;

--green:#def3e4;
--greenBorder:#33764a;

--danger:#a43a32;

}

html,
body{

margin:0;
height:100%;

font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:var(--bg);

color:var(--ink);

}

body{
overflow:hidden
}

button,
input,
select{

font:inherit

}

button{

border:0;

border-radius:10px;

padding:9px 11px;

background:var(--ink);

color:white;

font-weight:700;

cursor:pointer;

}

button.secondary{

background:white;

color:var(--ink);

border:1px solid var(--line);

}

button.soft{

background:var(--soft);

color:var(--ink);

}

button.danger{

background:var(--danger);

}


/* TOP */

.topbar{

height:58px;

background:white;

border-bottom:1px solid var(--line);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 14px;

position:relative;

z-index:100;

}

.logo{

font-size:25px;

font-weight:900;

letter-spacing:-1px;

}

.logo span{

font-weight:400;

}


/* APP */

.app{

height:calc(100vh - 58px);

display:grid;

grid-template-columns:
64px
250px
1fr;

}


/* LEFT TOOLBAR */

.rail{

background:#1f1f1f;

padding:7px 4px;

display:flex;

flex-direction:column;

gap:5px;

z-index:80;

}

.rail button{

height:56px;

background:transparent;

padding:4px;

font-size:9px;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:3px;

}

.rail button b{

font-size:17px;

}

.rail button.active{

background:white;

color:#1f1f1f;

}


/* SIDE PANEL */

.panel{

background:white;

border-right:1px solid var(--line);

padding:14px;

overflow:auto;

position:relative;

z-index:70;

}

.panel h2{

font-size:18px;

margin:0 0 4px;

}

.hint{

font-size:12px;

color:var(--muted);

line-height:1.4;

margin-bottom:12px;

}

.grid2{

display:grid;

grid-template-columns:1fr 1fr;

gap:7px;

}

.field{

width:100%;

padding:10px;

border:1px solid #d8d1c9;

border-radius:10px;

background:white;

}

.section{

border-top:1px solid #eee8e1;

padding-top:11px;

margin-top:11px;

}

.upload{

display:block;

text-align:center;

padding:18px 10px;

border:1.5px dashed #bbb;

border-radius:13px;

background:#faf9f7;

cursor:pointer;

}

.upload input{

display:none;

}

.panelClose{

display:none;

}


/* WORK AREA */

.work{

padding:8px;

background:#ebe8e3;

min-width:0;

}

.canvas{

width:100%;

height:100%;

background:white;

border:1px solid var(--line);

border-radius:16px;

position:relative;

overflow:hidden;

touch-action:none;

box-shadow:
0 10px 28px rgba(0,0,0,.05);

}


/* STAGE */

.stage{

position:absolute;

inset:0;

transform-origin:0 0;

}

.venueBackground{

position:absolute;

inset:0;

background:white center/contain no-repeat;

pointer-events:none;

}

.objectLayer{

position:absolute;

inset:0;

}

.empty{

position:absolute;

inset:0;

display:grid;

place-items:center;

text-align:center;

color:#999;

pointer-events:none;

}


/* OBJECT */

.obj{

position:absolute;

touch-action:none;

user-select:none;

}


/* TABLE */

.table{

width:104px;

height:104px;

display:flex;

align-items:center;

justify-content:center;

cursor:grab;

}

.table.selected{

outline:3px solid rgba(31,31,31,.18);

outline-offset:4px;

}

.tableCore{

width:64px;

height:64px;

border:2px solid #222;

border-radius:50%;

background:white;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

box-shadow:
0 4px 12px rgba(0,0,0,.14);

z-index:2;

}

.tableCore b{

font-size:10px;

}

.tableCore span{

font-size:9px;

color:#666;

margin-top:2px;

}

.table.complete .tableCore{

background:var(--green);

border-color:var(--greenBorder);

}

.chair{

position:absolute;

width:12px;

height:12px;

border:1.3px solid #555;

background:white;

border-radius:3px;

}


/* VENUE ITEMS */

.venueObj{

border:2px dashed #666;

background:rgba(255,255,255,.9);

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

font-size:11px;

font-weight:800;

cursor:grab;

}

.venueObj.selected{

outline:3px solid rgba(31,31,31,.18);

outline-offset:4px;

}


/* CONTEXT TOOLBAR */

.context{

position:absolute;

left:50%;

top:10px;

transform:translateX(-50%);

display:none;

align-items:center;

gap:5px;

background:white;

border:1px solid var(--line);

border-radius:12px;

padding:6px;

z-index:30;

box-shadow:
0 8px 24px rgba(0,0,0,.14);

}

.context input,
.context select{

width:66px;

padding:6px;

border:1px solid var(--line);

border-radius:8px;

}

.context button{

padding:6px 8px;

}


/* ZOOM */

.zoom{

position:absolute;

right:10px;

bottom:10px;

display:flex;

gap:4px;

background:white;

border:1px solid var(--line);

border-radius:11px;

padding:4px;

z-index:25;

}

.zoom button{

padding:6px 9px;

}


/* STATUS */

.status{

position:absolute;

left:10px;

bottom:10px;

background:white;

border:1px solid var(--line);

border-radius:999px;

padding:6px 9px;

font-size:10px;

color:#666;

z-index:25;

}


/* TRASH */

.trash{

position:absolute;

left:50%;

bottom:58px;

transform:translateX(-50%);

display:none;

background:white;

border:2px solid var(--line);

border-radius:999px;

padding:9px 15px;

z-index:35;

font-size:12px;

font-weight:800;

}

.trash.hot{

background:#ffe7e3;

border-color:#b23b30;

}


/* TABLE GUEST PANEL */

.guestPanel{

position:fixed;

top:58px;

right:0;

bottom:0;

width:330px;

background:white;

border-left:1px solid var(--line);

box-shadow:
-10px 0 30px rgba(0,0,0,.12);

z-index:95;

display:none;

padding:16px;

overflow:auto;

}

.guestPanel.open{

display:block;

}

.guestHeader{

display:flex;

align-items:flex-start;

justify-content:space-between;

gap:10px;

margin-bottom:14px;

}

.guestTitle{

font-size:20px;

font-weight:850;

}

.guestCount{

font-size:12px;

color:#777;

margin-top:3px;

}


/* ADD GUEST */

.addGuestBox{

background:#faf9f7;

border:1px solid var(--line);

border-radius:14px;

padding:12px;

}

.addGuestBox label{

display:block;

font-size:11px;

font-weight:700;

margin-bottom:6px;

color:#666;

}

.addGuestActions{

display:grid;

grid-template-columns:1fr auto;

gap:6px;

}


/* VOICE */

.voiceButton{

width:100%;

margin-top:8px;

}

.voiceInfo{

font-size:11px;

color:#777;

margin-top:6px;

line-height:1.4;

}

.voicePreview{

display:none;

background:#faf9f7;

border:1px solid var(--line);

border-radius:12px;

padding:9px;

margin-top:8px;

}

.voiceName{

font-size:12px;

padding:5px 0;

border-bottom:1px solid #eee;

}


/* GUEST LIST */

.guestListTitle{

font-size:13px;

font-weight:800;

margin:15px 0 5px;

}

.guestRow{

display:grid;

grid-template-columns:1fr auto;

gap:7px;

align-items:center;

padding:9px 0;

border-bottom:1px solid #eee;

}

.guestName{

font-size:13px;

font-weight:700;

}

.guestActions{

display:flex;

gap:4px;

}

.guestActions button{

padding:5px 7px;

font-size:11px;

}


/* ALL GUESTS */

.allGuestRow{

display:grid;

grid-template-columns:1fr auto;

gap:6px;

align-items:center;

padding:9px 0;

border-bottom:1px solid #eee;

}

.allGuestRow strong{

font-size:13px;

}

.allGuestRow small{

color:#777;

}


/* MOBILE */

@media(max-width:800px){

.topbar{

height:54px;

}

.app{

height:calc(100vh - 54px);

grid-template-columns:
56px
1fr;

}

.rail{

padding:5px 3px;

}

.rail button{

height:50px;

}

.work{

grid-column:2;

padding:4px;

}

.panel{

position:fixed;

left:56px;

right:0;

bottom:0;

top:auto;

width:auto;

max-height:44vh;

display:none;

border-right:0;

border-top:1px solid var(--line);

border-radius:18px 18px 0 0;

padding:48px 13px 13px;

box-shadow:
0 -10px 30px rgba(0,0,0,.18);

z-index:90;

}

.panel.open{

display:block;

}

.panelClose{

display:block;

position:absolute;

right:10px;

top:8px;

width:34px;

height:34px;

padding:0;

border-radius:50%;

background:var(--soft);

color:#222;

border:1px solid var(--line);

font-size:20px;

}

.context{

max-width:94%;

overflow:auto;

white-space:nowrap;

}

.guestPanel{

top:54px;

left:56px;

right:0;

bottom:0;

width:auto;

border-left:0;

box-shadow:none;

padding:14px;

}

}

</style>
</head>

<script>


let S={

venue:null,

tables:[],

guests:[],

objects:[],

counter:0,

view:{
scale:1,
x:0,
y:0
}

};


let selected=null;

let activePanel=null;

let activeGuestTable=null;

let recognition=null;

let voiceNames=[];


const $=
id=>document.getElementById(id);


const canvas=
$('canvas');


const stage=
$('stage');


const venueBackground=
$('venueBackground');


const objectLayer=
$('objectLayer');


const context=
$('context');


const trash=
$('trash');


const mobile=
()=>window.innerWidth<=800;


const uid=()=>{

if(
window.crypto &&
crypto.randomUUID
){

return crypto.randomUUID();

}

return String(
Date.now()+Math.random()
);

};



/* ==========================
   SAVE / LOAD
========================== */


function save(){

try{

localStorage.setItem(
'seatly31',
JSON.stringify(S)
);

}catch(e){}

updateStatus();

}


function load(){

try{

const old=

localStorage.getItem('seatly31')

||

localStorage.getItem('seatly30')

||

localStorage.getItem('seatly23')

||

localStorage.getItem('seatly2');


if(old){

const data=
JSON.parse(old);


S.venue=
data.venue||null;


S.tables=
data.tables||[];


S.guests=
data.guests||[];


S.objects=
data.objects||
data.objs||
data.venueObjects||
[];


S.counter=
data.counter||0;


S.view=
data.view||
{
scale:1,
x:0,
y:0
};

}

}catch(e){}


applyVenue();

render();

}



/* ==========================
   LEFT PANELS
========================== */


function setActive(type){

[
'Venue',
'Tables',
'Objects',
'Guests'
]

.forEach(name=>{

$('nav'+name)
.classList
.toggle(

'active',

name.toLowerCase()===type

);

});

}


function closePanel(){

$('panel')
.classList
.remove('open');


activePanel=null;


setActive('');

}


function togglePanel(type){

if(

mobile()

&&

activePanel===type

&&

$('panel')
.classList
.contains('open')

){

closePanel();

return;

}


activePanel=
type;


setActive(type);


$('panel')
.classList
.add('open');


if(type==='venue'){

renderVenuePanel();

}


if(type==='tables'){

renderTablesPanel();

}


if(type==='objects'){

renderObjectsPanel();

}


if(type==='guests'){

renderAllGuests();

}

}


function afterPanelAction(){

if(mobile()){

closePanel();

}

}



/* ==========================
   VENUE
========================== */


function renderVenuePanel(){

$('panelContent').innerHTML=`

<h2>
Venue
</h2>

<div class="hint">

Upload your venue plan.

The canvas does not zoom with your fingers.

Use only − / Fit / +.

</div>


<label class="upload">

📷

<br>

<b>

${S.venue
?'Replace venue'
:'Upload venue'}

</b>


<input
id="venueFile"
type="file"
accept="image/*">

</label>


${S.venue

?`

<button
class="secondary"
style="width:100%;margin-top:7px"
onclick="removeVenue()">

Remove venue

</button>

`

:''}

`;


$('venueFile')
.onchange=e=>{

const file=
e.target.files[0];


if(!file)return;


const reader=
new FileReader();


reader.onload=x=>{

S.venue=
x.target.result;


applyVenue();

render();

save();

afterPanelAction();

};


reader.readAsDataURL(file);

};

}


function applyVenue(){

venueBackground.style.backgroundImage=

S.venue

?`url("${S.venue}")`

:'none';

}


function removeVenue(){

S.venue=null;

applyVenue();

render();

save();

renderVenuePanel();

}



/* ==========================
   TABLES
========================== */


function renderTablesPanel(){

$('panelContent').innerHTML=`

<h2>
Tables
</h2>

<div class="hint">

Choose the number of seats.

The table appears immediately.

</div>


<div class="grid2">


<button
class="soft"
onclick="addTable(8)">

8 seats

</button>


<button
class="soft"
onclick="addTable(10)">

10 seats

</button>


<button
class="soft"
onclick="addTable(12)">

12 seats

</button>


<button
class="soft"
onclick="addTable(16)">

16 seats

</button>


</div>


<div class="section">

<b>
Add multiple
</b>


<input
id="tableQty"
class="field"
type="number"
min="1"
max="50"
value="5"
style="margin-top:7px">


<select
id="multipleSeats"
class="field"
style="margin-top:7px">

<option>8</option>

<option selected>
10
</option>

<option>12</option>

<option>16</option>

</select>


<button
style="width:100%;margin-top:7px"
onclick="addMultipleTables()">

Add tables

</button>

</div>

`;

}


function addTable(seats){

S.counter++;


const i=
S.tables.length;


S.tables.push({

id:uid(),

number:S.counter,

seats:seats,

x:
70+
(i%5)*115,

y:
85+
Math.floor(i/5)*110,

scale:1

});


render();

save();

afterPanelAction();

}


function addMultipleTables(){

const qty=

Math.max(

1,

Math.min(

50,

+$('tableQty').value||1

)

);


const seats=
+$('multipleSeats').value;


for(
let i=0;
i<qty;
i++
){

S.counter++;


const index=
S.tables.length;


S.tables.push({

id:uid(),

number:S.counter,

seats:seats,

x:
70+
(index%5)*115,

y:
85+
Math.floor(index/5)*110,

scale:1

});

}


render();

save();

afterPanelAction();

}



/* ==========================
   OBJECTS
========================== */


function renderObjectsPanel(){

$('panelContent').innerHTML=`

<h2>
Venue Objects
</h2>


<div class="hint">

Add only what you need.

</div>


<div class="grid2">


<button
class="soft"
onclick="addObject('Dance Floor',160,160)">

Dance Floor

</button>


<button
class="soft"
onclick="addObject('DJ',110,55)">

DJ

</button>


<button
class="soft"
onclick="addObject('Bar',130,55)">

Bar

</button>


<button
class="soft"
onclick="addObject('Stage',150,65)">

Stage

</button>


</div>

`;

}


function addObject(
label,
width,
height
){

const i=
S.objects.length;


S.objects.push({

id:uid(),

label:label,

width:width,

height:height,

x:
180+
i*25,

y:
160+
i*20,

scale:1

});


render();

save();

afterPanelAction();

}



/* ==========================
   ALL GUESTS
========================== */


function renderAllGuests(){

const rows=

S.guests

.slice()

.sort(
(a,b)=>
a.name.localeCompare(b.name)
)

.map(guest=>{

const table=

S.tables.find(
t=>t.id===guest.tableId
);


return `

<div class="allGuestRow">

<div>

<strong>

${safe(guest.name)}

</strong>

<br>

<small>

${table
?'Table '+table.number
:'Unassigned'}

</small>

</div>


<button
class="secondary"
onclick="editGuestGlobal('${guest.id}')">

Edit

</button>

</div>

`;

})

.join('');


$('panelContent').innerHTML=`

<h2>
All Guests
</h2>

<div class="hint">

Use this mainly to search and review.

Guests are easiest to add by tapping the table itself.

</div>


<input
id="guestSearch"
class="field"
placeholder="Search guest..."
oninput="filterAllGuests(this.value)">


<div
class="section"
id="allGuestsList">

${rows||

'<div class="hint">No guests yet.</div>'}

</div>

`;

}


function filterAllGuests(value){

const q=
value.toLowerCase();


[...$('allGuestsList').children]

.forEach(row=>{

row.style.display=

row.textContent
.toLowerCase()
.includes(q)

?'grid'

:'none';

});

}



/* ==========================
   CHAIRS
========================== */


function createChairs(
element,
count
){

const seats=
Math.min(
count,
16
);


const radius=43;


for(
let i=0;
i<seats;
i++
){

const angle=

2*
Math.PI*
i/seats

-

Math.PI/2;


const chair=
document.createElement('div');


chair.className=
'chair';


chair.style.left=

(
52+
Math.cos(angle)*radius-
6
)

+'px';


chair.style.top=

(
52+
Math.sin(angle)*radius-
6
)

+'px';


element.appendChild(
chair
);

}

}



/* ==========================
   RENDER CANVAS
========================== */


function render(){

objectLayer.innerHTML='';


S.tables.forEach(table=>{

const guestCount=

S.guests.filter(
g=>g.tableId===table.id
).length;


const element=
document.createElement('div');


element.className=

'obj table'

+

(
guestCount===table.seats
?' complete'
:''
)

+

(
selected?.id===table.id
?' selected'
:''
);


element.style.left=
table.x+'px';


element.style.top=
table.y+'px';


element.style.transform=

`scale(${table.scale||1})`;


createChairs(
element,
table.seats
);


const core=
document.createElement('div');


core.className=
'tableCore';


core.innerHTML=

`

<b>
TABLE ${table.number}
</b>

<span>
${guestCount}/${table.seats}
</span>

`;


element.appendChild(
core
);


attachDrag(
element,
table,
'table'
);


objectLayer.appendChild(
element
);

});


S.objects.forEach(item=>{

const element=
document.createElement('div');


element.className=

'obj venueObj'

+

(
selected?.id===item.id
?' selected'
:''
);


element.style.left=
item.x+'px';


element.style.top=
item.y+'px';


element.style.width=
item.width+'px';


element.style.height=
item.height+'px';


element.style.transform=

`scale(${item.scale||1})`;


element.textContent=
item.label;


attachDrag(
element,
item,
'object'
);


objectLayer.appendChild(
element
);

});


$('empty')
.style.display=

(
S.venue

||

S.tables.length

||

S.objects.length
)

?'none'

:'grid';

renderContext();

updateStatus();

}



/* ==========================
   TABLE TAP / DRAG
========================== */


function attachDrag(
element,
item,
kind
){

let startX;

let startY;

let originalX;

let originalY;

let active=false;

let moved=false;


element.onpointerdown=e=>{

e.stopPropagation();


selected={

id:item.id,

kind:kind

};


document
.querySelectorAll('.obj')
.forEach(
x=>x.classList.remove('selected')
);


element
.classList
.add('selected');


renderContext();


startX=
e.clientX;


startY=
e.clientY;


originalX=
item.x;


originalY=
item.y;


active=true;

moved=false;


trash.style.display=
'block';


try{

element.setPointerCapture(
e.pointerId
);

}catch(_){}

};


element.onpointermove=e=>{

if(!active)return;


const dx=
e.clientX-startX;


const dy=
e.clientY-startY;


if(
Math.abs(dx)+
Math.abs(dy)
>6
){

moved=true;

}


item.x=

originalX+

dx/
S.view.scale;


item.y=

originalY+

dy/
S.view.scale;


element.style.left=
item.x+'px';


element.style.top=
item.y+'px';


const rect=
trash.getBoundingClientRect();


const overTrash=

e.clientX>=rect.left

&&

e.clientX<=rect.right

&&

e.clientY>=rect.top

&&

e.clientY<=rect.bottom;


trash.classList.toggle(
'hot',
overTrash
);

};


element.onpointerup=e=>{

if(!active)return;


active=false;


const deleteItem=

trash
.classList
.contains('hot');


trash.style.display=
'none';


trash
.classList
.remove('hot');


if(deleteItem){

deleteCanvasItem(
item.id,
kind
);

return;

}


/*
IMPORTANT:

If user only tapped the table,
open guest panel immediately.
*/

if(
!moved

&&

kind==='table'
){

openTableGuests(
item.id
);

}


save();

};


element.onpointercancel=()=>{

active=false;

trash.style.display=
'none';

trash.classList.remove(
'hot'
);

};

}



/* ==========================
   DELETE CANVAS ITEM
========================== */


function deleteCanvasItem(
id,
kind
){

if(kind==='table'){

S.guests.forEach(
guest=>{

if(
guest.tableId===id
){

guest.tableId=null;

}

});


S.tables=

S.tables.filter(
table=>table.id!==id
);

}

else{

S.objects=

S.objects.filter(
item=>item.id!==id
);

}


if(
activeGuestTable===id
){

closeGuestPanel();

}


selected=null;


render();

save();

}



/* ==========================
   SMALL TABLE TOOLBAR
========================== */


function renderContext(){

if(!selected){

context.style.display=
'none';

return;

}


const item=

selected.kind==='table'

?

S.tables.find(
t=>t.id===selected.id
)

:

S.objects.find(
o=>o.id===selected.id
);


if(!item){

context.style.display=
'none';

selected=null;

return;

}


if(
selected.kind==='table'
){

const guestCount=

S.guests.filter(
g=>g.tableId===item.id
).length;


context.innerHTML=`

<b>
Table
</b>


<input
id="tableNumberField"
type="number"
min="1"
value="${item.number}">


<select id="tableSeatField">

${[8,10,12,16]

.map(
number=>

`<option ${number===item.seats?'selected':''}>
${number}
</option>`

)

.join('')}

</select>


<span>

${guestCount}/${item.seats}

</span>


<button
class="secondary"
onclick="saveTableSettings()">

✓

</button>


<button
onclick="openTableGuests('${item.id}')">

Guests

</button>


<button
class="secondary"
onclick="resizeSelected(.9)">

−

</button>


<button
class="secondary"
onclick="resizeSelected(1.1)">

＋

</button>

`;

}

else{

context.innerHTML=`

<b>

${item.label}

</b>


<button
class="secondary"
onclick="resizeSelected(.9)">

−

</button>


<button
class="secondary"
onclick="resizeSelected(1.1)">

＋

</button>

`;

}


context.style.display=
'flex';

}


function saveTableSettings(){

const table=

S.tables.find(
t=>t.id===selected.id
);


if(!table)return;


const seats=
+$('tableSeatField').value;


const guests=

S.guests.filter(
g=>g.tableId===table.id
).length;


if(
seats<guests
){

toast(

`Table already has ${guests} guests`

);

return;

}


table.number=

Math.max(

1,

+$('tableNumberField').value||1

);


table.seats=
seats;


render();

save();


if(
activeGuestTable===table.id
){

refreshTableGuests();

}

}


function resizeSelected(multiplier){

if(!selected)return;


const list=

selected.kind==='table'

?S.tables

:S.objects;


const item=

list.find(
x=>x.id===selected.id
);


if(!item)return;


item.scale=

Math.max(

.55,

Math.min(

2,

(item.scale||1)
*
multiplier

)

);


render();

save();

}



/* ==========================
   CANVAS TAP
========================== */


canvas.addEventListener(

'pointerdown',

e=>{

if(mobile()){

closePanel();

}


if(

e.target===canvas

||

e.target===stage

||

e.target===objectLayer

){

selected=null;


renderContext();


document
.querySelectorAll('.obj')
.forEach(
x=>x.classList.remove('selected')
);

}

}

);



/* ==========================
   SIMPLE ZOOM
   NO PINCH
========================== */


function applyView(){

stage.style.transform=

`translate(${S.view.x}px,${S.view.y}px) scale(${S.view.scale})`;

}


function fitView(){

S.view={

scale:1,

x:0,

y:0

};


applyView();

save();

}


function zoomIn(){

S.view.scale=

Math.min(

2.5,

S.view.scale*1.15

);


applyView();

save();

}


function zoomOut(){

S.view.scale=

.5,

S.view.scale*.87

);

}



/* ==========================
   TABLE GUEST PANEL
========================== */


function openTableGuests(tableId){

S.tables.find(
t=>t.id===tableId
);


if(!table)return;


activeGuestTable=
tableId;


closePanel();


$('guestPanel')
.classList
.add('open');


refreshTableGuests();


setTimeout(
()=>{

$('newGuestName')
.focus();

},
100
);

}


function closeGuestPanel(){

$('guestPanel')
.classList
.remove('open');


activeGuestTable=null;


voiceNames=[];


$('voicePreview')
.style.display=
'none';

}


function refreshTableGuests(){

const table=

S.tables.find(
t=>t.id===activeGuestTable
);


if(!table){

closeGuestPanel();

return;

}


const guests=

S.guests.filter(
g=>g.tableId===table.id
);


$('guestPanelTitle')
.textContent=

`Table ${table.number}`;


$('guestPanelCount')
.textContent=

`${guests.length} of ${table.seats} seats filled`;


$('tableGuestsList')
.innerHTML=

guests.length

?

guests.map(
guest=>

`

<div class="guestRow">

<div class="guestName">

${safe(guest.name)}

</div>


<div class="guestActions">

<button
class="secondary"
onclick="renameGuest('${guest.id}')">

Edit

</button>


<button
class="danger"
onclick="removeGuest('${guest.id}')">

×

</button>

</div>

</div>

`

).join('')

:

`

<div class="hint">

No guests yet.

Add the first person above.

</div>

`;

}



/* ==========================
   ADD GUEST
========================== */


function addGuestToCurrentTable(){

const table=

S.tables.find(
t=>t.id===activeGuestTable
);


if(!table)return;


const input=
$('newGuestName');


const name=
input.value.trim();


if(!name)return;


const guestCount=

S.guests.filter(
g=>g.tableId===table.id
).length;


if(
guestCount>=table.seats
){

toast(
'Table is full'
);

return;

}


S.guests.push({

id:uid(),

name:name,

tableId:table.id

});


input.value='';


refreshTableGuests();

render();

save();


input.focus();

}


/* ENTER KEY */

$('newGuestName')
.addEventListener(

'keydown',

e=>{

if(
e.key==='Enter'
){

addGuestToCurrentTable();

}

}

);



/* ==========================
   EDIT / REMOVE GUEST
========================== */


function renameGuest(id){

const guest=

S.guests.find(
g=>g.id===id
);


if(!guest)return;


const name=

prompt(

'Surname & Name',

guest.name

);


if(
name===null

||

!name.trim()
){

return;

}


guest.name=
name.trim();


refreshTableGuests();

render();

save();

}


function removeGuest(id){

const guest=

S.guests.find(
g=>g.id===id
);


if(!guest)return;


guest.tableId=null;


refreshTableGuests();

render();

save();

}



/* ==========================
   GLOBAL EDIT
========================== */


function editGuestGlobal(id){

const guest=

S.guests.find(
g=>g.id===id
);


if(!guest)return;


const newName=

prompt(

'Surname & Name',

guest.name

);


if(
newName===null

||

!newName.trim()
){

return;

}


guest.name=
newName.trim();


const currentTable=

S.tables.find(
t=>t.id===guest.tableId
);


const answer=

prompt(

'Table number. Leave empty for Unassigned.',

currentTable
?currentTable.number
:''

);


if(answer===null)return;


let tableId=null;


if(answer.trim()){

const table=

S.tables.find(
t=>String(t.number)===answer.trim()
);


if(!table){

toast(
'Table not found'
);

return;

}


const count=

S.guests.filter(

g=>

g.tableId===table.id

&&

g.id!==guest.id

).length;


if(
count>=table.seats
){

toast(
'Table is full'
);

return;

}


tableId=
table.id;

}


guest.tableId=
tableId;


render();

save();

renderAllGuests();

}



/* ==========================
   VOICE - OPTIONAL
========================== */


function toggleVoice(){

if(recognition){

recognition.stop();

return;

}


const SpeechRecognition=

window.SpeechRecognition

||

window.webkitSpeechRecognition;


if(!SpeechRecognition){

toast(
'Voice is not available in this browser. You can type the names normally.'
);

return;

}


recognition=

new SpeechRecognition();


recognition.lang=
'el-GR';


recognition.continuous=
true;


recognition.interimResults=
false;


$('voiceButton')
.textContent=

'■ Stop listening';


recognition.onresult=e=>{

for(

let i=e.resultIndex;

i<e.results.length;

i++

){

const text=

e.results[i][0]
.transcript;


const names=

text

.split(/[,.]+/)

.map(
x=>x.trim()
)

.filter(Boolean);


voiceNames.push(
...names
);

}


renderVoicePreview();

};


recognition.onerror=()=>{

toast(
'Could not hear clearly. You can type the names instead.'
);

};


recognition.onend=()=>{

recognition=null;


if($('voiceButton')){

$('voiceButton')
.textContent=

'🎙 Speak names';

}

};


recognition.start();

}


function renderVoicePreview(){

const preview=
$('voicePreview');


preview.style.display=
'block';


preview.innerHTML=

voiceNames

.map(
name=>

`

<div class="voiceName">

${safe(name)}

</div>

`

)

.join('')

+

`

<button
style="width:100%;margin-top:8px"
onclick="addVoiceGuests()">

Add ${voiceNames.length} guests

</button>

`;

}


function addVoiceGuests(){

const table=

S.tables.find(
t=>t.id===activeGuestTable
);


if(
!table

||

!voiceNames.length
){

return;

}


const current=

S.guests.filter(
g=>g.tableId===table.id
).length;


const available=

table.seats-current;


if(
available<=0
){

toast(
'Table is full'
);

return;

}


const namesToAdd=

voiceNames.slice(
0,
available
);


namesToAdd.forEach(
name=>{

S.guests.push({

id:uid(),

name:name,

tableId:table.id

});

});


voiceNames=[];


$('voicePreview')
.style.display=
'none';


refreshTableGuests();

render();

save();


if(
namesToAdd.length<voiceNames.length
){

toast(
'Some guests could not be added because the table is full.'
);

}

}



/* ==========================
   STATUS
========================== */


function updateStatus(){

const seated=

S.guests.filter(
g=>g.tableId
).length;


const complete=

S.tables.filter(

table=>

S.guests.filter(
g=>g.tableId===table.id
).length

===

table.seats

).length;


$('status')
.textContent=

`${S.tables.length} tables · ${seated}/${S.guests.length} seated · ${complete} complete`;

}



/* ==========================
   HELPERS
========================== */


function toast(message){

const element=
$('toast');


element.textContent=
message;


element.style.display=
'block';


clearTimeout(
window.toastTimer
);


window.toastTimer=

setTimeout(

()=>{

element.style.display=
'none';

},

1700

);

}


function safe(text){

const div=
document.createElement('div');


div.textContent=
text||'';


return div.innerHTML;

}

   START
