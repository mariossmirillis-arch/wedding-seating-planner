<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seatly 2.2</title>

<style>
*{box-sizing:border-box}

:root{
--ink:#202020;
--paper:#fff;
--bg:#f4f2ee;
--line:#e5dfd7;
--soft:#f1ede8;
--muted:#777;
--green:#dff3e4;
--greenB:#34784a;
--danger:#a83b32
}

html,body{
margin:0;
height:100%;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--ink)
}

body{overflow:hidden}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:9px 11px;
background:var(--ink);
color:#fff;
font-weight:750;
cursor:pointer
}

button.sec{
background:#fff;
color:var(--ink);
border:1px solid var(--line)
}

button.soft{
background:var(--soft);
color:var(--ink)
}

button.danger{background:var(--danger)}

.topbar{
height:58px;
background:#fff;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
position:relative;
z-index:70
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:-1px
}

.logo span{font-weight:400}

.topActions{
display:flex;
gap:6px
}

.app{
height:calc(100vh - 58px);
display:grid;
grid-template-columns:68px 280px 1fr
}

.rail{
background:#202020;
padding:8px 5px;
display:flex;
flex-direction:column;
gap:6px;
z-index:60
}

.railBtn{
height:58px;
background:transparent;
color:#fff;
font-size:10px;
padding:4px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px
}

.railBtn b{font-size:18px}

.railBtn.active{
background:#fff;
color:#202020
}

.panel{
background:#fff;
border-right:1px solid var(--line);
padding:14px;
overflow:auto;
position:relative;
z-index:50
}

.panel h2{
font-size:18px;
margin:0 0 4px
}

.hint{
font-size:12px;
color:var(--muted);
line-height:1.4;
margin-bottom:12px
}

.section{
border-top:1px solid #eee8e1;
padding-top:12px;
margin-top:12px
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.field{
width:100%;
border:1px solid #d6cfc7;
border-radius:10px;
padding:10px;
background:#fff
}

.upload{
display:block;
text-align:center;
padding:20px 10px;
border:1.5px dashed #bbb2a8;
border-radius:14px;
background:#faf9f7;
cursor:pointer
}

.upload input{display:none}

.panelClose{display:none}

.work{
padding:10px;
background:#ebe8e3;
min-width:0;
position:relative
}

.canvas{
width:100%;
height:100%;
background:#fff;
border:1px solid var(--line);
border-radius:16px;
position:relative;
overflow:hidden;
touch-action:none;
box-shadow:0 10px 28px #0001
}

.stage{
position:absolute;
inset:0;
transform-origin:0 0
}

.venueBg{
position:absolute;
inset:0;
background:#fff center/contain no-repeat;
pointer-events:none
}

.objectLayer{
position:absolute;
inset:0
}

.empty{
position:absolute;
inset:0;
display:grid;
place-items:center;
text-align:center;
color:#999;
pointer-events:none
}

.obj{
position:absolute;
touch-action:none;
user-select:none
}

.table{
width:106px;
height:106px;
display:flex;
align-items:center;
justify-content:center;
cursor:grab
}

.table.selected,
.venueObj.selected{
outline:3px solid #2224;
outline-offset:4px
}

.core{
width:66px;
height:66px;
border:2px solid #222;
border-radius:50%;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-shadow:0 4px 12px #0002;
z-index:2
}

.core b{font-size:11px}

.core span{
font-size:9px;
color:#666
}

.table.complete .core{
background:var(--green);
border-color:var(--greenB)
}

.chair{
position:absolute;
width:13px;
height:13px;
border:1.4px solid #555;
background:#fff;
border-radius:3px
}

.venueObj{
border:2px dashed #666;
background:#ffffffe9;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:800;
cursor:grab
}

.context{
position:absolute;
left:50%;
top:10px;
transform:translateX(-50%);
display:none;
align-items:center;
gap:5px;
background:#fff;
border:1px solid var(--line);
border-radius:12px;
padding:6px;
z-index:25;
box-shadow:0 8px 24px #0002
}

.context input,
.context select{
width:76px;
padding:7px;
border:1px solid var(--line);
border-radius:8px
}

.context button{
padding:7px 9px
}

.trash{
position:absolute;
left:50%;
bottom:18px;
transform:translateX(-50%);
display:none;
align-items:center;
gap:7px;
background:#fff;
border:2px solid var(--line);
border-radius:999px;
padding:10px 18px;
z-index:30;
font-size:13px;
font-weight:800
}

.trash.hot{
background:#ffe5e2;
border-color:#b23b30;
color:#9c3027
}

.zoom{
position:absolute;
right:18px;
bottom:18px;
display:flex;
gap:4px;
background:#fff;
border:1px solid var(--line);
border-radius:11px;
padding:5px;
z-index:20
}

.zoom button{
padding:7px 9px
}

.status{
position:absolute;
left:18px;
bottom:18px;
background:#fff;
border:1px solid var(--line);
border-radius:999px;
padding:7px 10px;
z-index:20;
font-size:11px;
color:#666
}

.guestRow{
display:grid;
grid-template-columns:1fr auto;
gap:6px;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee
}

.guestRow .name{
font-size:13px;
font-weight:700
}

.guestRow .meta{
font-size:11px;
color:#777
}

.mini{
padding:6px 8px;
font-size:11px
}

.voiceBox{
display:none;
border:1px solid var(--line);
background:#faf9f7;
border-radius:12px;
padding:9px;
margin-top:8px
}

.voiceRow{
font-size:12px;
padding:6px 0;
border-bottom:1px solid #eee
}

.toast{
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:#202020;
color:#fff;
padding:10px 14px;
border-radius:10px;
display:none;
z-index:100
}

/* MOBILE */

@media(max-width:800px){

.topbar{height:54px}

.topActions .desktopOnly{
display:none
}

.app{
height:calc(100vh - 54px);
grid-template-columns:56px 1fr
}

.rail{
padding:6px 3px
}

.railBtn{
height:52px;
font-size:9px
}

.railBtn b{
font-size:16px
}

.work{
grid-column:2;
padding:5px
}

/*
IMPORTANT:
Το panel στο κινητό είναι bottom sheet.
Δεν μένει κολλημένο αριστερά.
*/
.panel{
position:fixed;
left:56px;
right:0;
bottom:0;
top:auto;
width:auto;
max-height:46vh;
display:none;
border-right:0;
border-top:1px solid var(--line);
border-radius:18px 18px 0 0;
padding:50px 14px 14px;
box-shadow:0 -10px 30px #0003;
z-index:65
}

.panel.open{
display:block
}

.panelClose{
display:block;
position:absolute;
right:10px;
top:9px;
width:34px;
height:34px;
padding:0;
border-radius:50%;
background:var(--soft);
color:#202020;
border:1px solid var(--line);
font-size:20px
}

.context{
max-width:94%;
overflow:auto;
white-space:nowrap
}

.status{
left:8px;
bottom:8px;
max-width:58%;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.zoom{
right:8px;
bottom:8px
}

.trash{
bottom:58px
}

}
</style>
</head>

<body>

<header class="topbar">

<div class="logo">
seat<span>ly</span>
</div>

<div class="topActions">

<button class="sec desktopOnly" onclick="undo()">
↶ Undo
</button>

<button class="sec desktopOnly" onclick="redo()">
↷ Redo
</button>

<button onclick="toast('Finish / Export θα προστεθεί αφού κλειδώσουμε τον editor')">
Finish
</button>

</div>

</header>

<div class="app">

<nav class="rail">

<button
class="railBtn"
id="navVenue"
onclick="togglePanel('venue')">
<b>▧</b>
Venue
</button>

<button
class="railBtn"
id="navTables"
onclick="togglePanel('tables')">
<b>◉</b>
Tables
</button>

<button
class="railBtn"
id="navGuests"
onclick="togglePanel('guests')">
<b>♙</b>
Guests
</button>

<button
class="railBtn"
id="navObjects"
onclick="togglePanel('objects')">
<b>◇</b>
Objects
</button>

</nav>

<aside
class="panel"
id="panel">

<button
class="panelClose"
onclick="closePanel()">
×
</button>

<div id="panelContent"></div>

</aside>

<main class="work">

<div
class="canvas"
id="canvas">

<div
class="stage"
id="stage">

<div
class="venueBg"
id="venueBg">
</div>

<div
class="empty"
id="empty">

<div>

<div style="font-size:32px">
♡
</div>

<b>Your wedding plan</b>

<div style="font-size:12px;margin-top:5px">
Upload a venue plan or add your first table.
</div>

</div>

</div>

<div
class="objectLayer"
id="objectLayer">
</div>

</div>

<div
class="context"
id="context">
</div>

<div
class="trash"
id="trash">
🗑 Drop here to delete
</div>

<div
class="status"
id="status">
</div>

<div class="zoom">

<button
class="sec"
onclick="zoomCenter(.9)">
−
</button>

<button
class="sec"
onclick="fitView()">
Fit
</button>

<button
class="sec"
onclick="zoomCenter(1.1)">
＋
</button>

</div>

</div>

</main>

</div>

<div
class="toast"
id="toast">
</div>

<script>

let S={
venue:null,
tables:[],
guests:[],
venueObjects:[],
counter:0,
view:{
scale:1,
x:0,
y:0
}
};

let selected=null;
let activePanel=null;
let historyStack=[];
let futureStack=[];
let recognition=null;
let voiceDraft=[];

const $=id=>document.getElementById(id);

const canvas=$('canvas');
const stage=$('stage');
const venueBg=$('venueBg');
const objectLayer=$('objectLayer');
const context=$('context');
const trash=$('trash');

const uid=()=>window.crypto&&crypto.randomUUID
?crypto.randomUUID()
:String(Date.now()+Math.random());

function isMobile(){
return window.innerWidth<=800;
}

function snapshot(){
return JSON.stringify(S);
}

function checkpoint(){

historyStack.push(snapshot());

if(historyStack.length>30){
historyStack.shift();
}

futureStack=[];

}

function save(){

try{

localStorage.setItem(
'seatly_2_2',
snapshot()
);

}catch(e){}

updateStatus();

}

function load(){

try{

const saved=
localStorage.getItem('seatly_2_2') ||
localStorage.getItem('seatly2');

if(saved){

S=Object.assign(
S,
JSON.parse(saved)
);

}

}catch(e){}

applyVenue();

render();

if(!isMobile()){
openPanel('venue');
}

}

function undo(){

if(!historyStack.length)return;

futureStack.push(snapshot());

S=JSON.parse(
historyStack.pop()
);

selected=null;

applyVenue();

render();

save();

}

function redo(){

if(!futureStack.length)return;

historyStack.push(snapshot());

S=JSON.parse(
futureStack.pop()
);

selected=null;

applyVenue();

render();

save();

}


/* PANEL */

function setActiveButton(type){

['venue','tables','guests','objects']
.forEach(x=>{

const id=
'nav'+
x[0].toUpperCase()+
x.slice(1);

$(id).classList.toggle(
'active',
x===type
);

});

}

function closePanel(){

$('panel')
.classList
.remove('open');

activePanel=null;

setActiveButton(null);

}

function openPanel(type){

activePanel=type;

setActiveButton(type);

$('panel')
.classList
.add('open');

if(type==='venue'){
renderVenuePanel();
}

if(type==='tables'){
renderTablesPanel();
}

if(type==='guests'){
renderGuestsPanel();
}

if(type==='objects'){
renderObjectsPanel();
}

}

function togglePanel(type){

if(
isMobile() &&
activePanel===type &&
$('panel').classList.contains('open')
){

closePanel();

return;

}

openPanel(type);

}

function closePanelAfterAction(){

if(isMobile()){
closePanel();
}

}


/* VENUE PANEL */

function renderVenuePanel(){

$('panelContent').innerHTML=`

<h2>Venue</h2>

<div class="hint">
Upload your venue plan and then work directly on it.
</div>

<label class="upload">

📷

<br>

<b>
${S.venue
?'Replace venue'
:'Upload venue plan'}
</b>

<input
id="venueInput"
type="file"
accept="image/*">

</label>

${S.venue
?`
<button
class="sec"
style="width:100%;margin-top:8px"
onclick="removeVenue()">
Remove venue
</button>
`
:''}

<div class="section">

<b>Canvas controls</b>

<div
class="hint"
style="margin-top:5px">

Pinch with two fingers on mobile.
Use mouse wheel or Fit / + / − on computer.

</div>

</div>

`;

$('venueInput').onchange=e=>{

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=x=>{

checkpoint();

S.venue=x.target.result;

applyVenue();

render();

save();

closePanelAfterAction();

};

reader.readAsDataURL(file);

};

}


/* TABLE PANEL */

function renderTablesPanel(){

$('panelContent').innerHTML=`

<h2>Tables</h2>

<div class="hint">
Choose seats. The table appears immediately on the canvas.
</div>

<div class="grid2">

<button
class="soft"
onclick="addTable(8)">
8 seats
</button>

<button
class="soft"
onclick="addTable(10)">
10 seats
</button>

<button
class="soft"
onclick="addTable(12)">
12 seats
</button>

<button
class="soft"
onclick="addTable(16)">
16 seats
</button>

</div>

<div class="section">

<b>Add multiple tables</b>

<div
class="grid2"
style="margin-top:7px">

<input
id="bulkQty"
class="field"
type="number"
value="5"
min="1"
max="50">

<select
id="bulkSeats"
class="field">

<option>8</option>

<option selected>
10
</option>

<option>12</option>

<option>16</option>

</select>

</div>

<button
style="width:100%;margin-top:7px"
onclick="addMany()">

Add tables

</button>

</div>

`;

}


/* OBJECTS */

function renderObjectsPanel(){

$('panelContent').innerHTML=`

<h2>Objects</h2>

<div class="hint">
Add only the things that help you understand the space.
</div>

<div class="grid2">

<button
class="soft"
onclick="addObject('Dance Floor',170,170)">
Dance Floor
</button>

<button
class="soft"
onclick="addObject('DJ',120,60)">
DJ
</button>

<button
class="soft"
onclick="addObject('Bar',150,60)">
Bar
</button>

<button
class="soft"
onclick="addObject('Stage',170,70)">
Stage
</button>

</div>

`;

}


/* GUEST PANEL */

function renderGuestsPanel(){

const rows=
S.guests
.map(g=>{

const t=
S.tables.find(
x=>x.id===g.tableId
);

return `

<div class="guestRow">

<div>

<div class="name">
${escapeHtml(g.name)}
</div>

<div class="meta">
${t
?'Table '+t.number
:'Unassigned'}
</div>

</div>

<div>

<button
class="sec mini"
onclick="editGuest('${g.id}')">
Edit
</button>

<button
class="danger mini"
onclick="deleteGuest('${g.id}')">
×
</button>

</div>

</div>

`;

})
.join('');

$('panelContent').innerHTML=`

<h2>Guests</h2>

<div class="hint">
Speak or type. Keep it fast.
</div>

<button
id="micBtn"
style="width:100%;padding:13px"
onclick="toggleMic()">

🎙 Speak guests

</button>

<div
class="voiceBox"
id="voiceBox">
</div>

<div class="section">

<input
id="guestName"
class="field"
placeholder="Name / Όνομα">

<select
id="guestTable"
class="field"
style="margin-top:7px">

${tableOptions()}

</select>

<button
style="width:100%;margin-top:7px"
onclick="addGuestManual()">

Add guest

</button>

</div>

<div class="section">

${rows||
'<div class="hint">No guests yet.</div>'}

</div>

`;

}


/* VENUE */

function applyVenue(){

venueBg.style.backgroundImage=
S.venue
?`url("${S.venue}")`
:'none';

}

function removeVenue(){

checkpoint();

S.venue=null;

applyVenue();

render();

save();

if(activePanel==='venue'){
renderVenuePanel();
}

}


/* ADD TABLE */

function addTable(seats){

checkpoint();

S.counter++;

const i=S.tables.length;

S.tables.push({

id:uid(),

number:S.counter,

seats:seats,

x:80+(i%5)*125,

y:95+Math.floor(i/5)*120,

scale:1,

rotation:0

});

render();

save();

closePanelAfterAction();

}


/* ADD MANY TABLES */

function addMany(){

const qty=
Math.max(
1,
Math.min(
50,
+$('bulkQty').value||1
)
);

const seats=
+$('bulkSeats').value;

checkpoint();

for(let k=0;k<qty;k++){

S.counter++;

const i=S.tables.length;

S.tables.push({

id:uid(),

number:S.counter,

seats:seats,

x:70+(i%5)*125,

y:90+Math.floor(i/5)*120,

scale:1,

rotation:0

});

}

render();

save();

closePanelAfterAction();

}


/* ADD OBJECT */

function addObject(label,w,h){

checkpoint();

const i=
S.venueObjects.length;

S.venueObjects.push({

id:uid(),

label:label,

w:w,

h:h,

x:220+i*28,

y:170+i*22,

scale:1,

rotation:0

});

render();

save();

closePanelAfterAction();

}


/* CREATE CHAIRS */

function createChairs(el,seats){

const n=
Math.min(
seats,
16
);

const radius=45;

for(let i=0;i<n;i++){

const angle=
2*Math.PI*i/n-
Math.PI/2;

const chair=
document.createElement('div');

chair.className='chair';

chair.style.left=
(
53+
Math.cos(angle)*radius-
6.5
)+'px';

chair.style.top=
(
53+
Math.sin(angle)*radius-
6.5
)+'px';

chair.style.transform=
`rotate(${angle*180/Math.PI+90}deg)`;

el.appendChild(chair);

}

}


/* RENDER */

function render(){

objectLayer.innerHTML='';

S.tables.forEach(table=>{

const count=
S.guests.filter(
g=>g.tableId===table.id
).length;

const el=
document.createElement('div');

el.className=
'obj table'+
(count===table.seats
?' complete'
:'')+
(selected?.id===table.id
?' selected'
:'');

el.style.left=
table.x+'px';

el.style.top=
table.y+'px';

el.style.transform=
`scale(${table.scale}) rotate(${table.rotation}deg)`;

createChairs(
el,
table.seats
);

const core=
document.createElement('div');

core.className='core';

core.innerHTML=
`<b>TABLE ${table.number}</b><span>${count}/${table.seats}</span>`;

el.appendChild(core);

attachDrag(
el,
table,
'table'
);

objectLayer.appendChild(el);

});


S.venueObjects.forEach(obj=>{

const el=
document.createElement('div');

el.className=
'obj venueObj'+
(selected?.id===obj.id
?' selected'
:'');

el.style.left=
obj.x+'px';

el.style.top=
obj.y+'px';

el.style.width=
obj.w+'px';

el.style.height=
obj.h+'px';

el.style.transform=
`scale(${obj.scale}) rotate(${obj.rotation}deg)`;

el.textContent=
obj.label;

attachDrag(
el,
obj,
'object'
);

objectLayer.appendChild(el);

});


$('empty').style.display=
(
S.venue ||
S.tables.length ||
S.venueObjects.length
)
?'none'
:'grid';

applyView();

renderContext();

updateStatus();

}


/* DRAG + DELETE */

function attachDrag(el,item,kind){

let startX=0;

let startY=0;

let originX=0;

let originY=0;

let dragging=false;

let moved=false;


el.onpointerdown=e=>{

e.stopPropagation();

selected={
id:item.id,
kind:kind
};

renderContext();

document
.querySelectorAll('.obj')
.forEach(
x=>x.classList.remove('selected')
);

el.classList.add('selected');

startX=e.clientX;

startY=e.clientY;

originX=item.x;

originY=item.y;

dragging=true;

moved=false;

trash.style.display='flex';

try{

el.setPointerCapture(
e.pointerId
);

}catch(_){}

};


el.onpointermove=e=>{

if(!dragging)return;

moved=true;

item.x=
originX+
(e.clientX-startX)/
S.view.scale;

item.y=
originY+
(e.clientY-startY)/
S.view.scale;

el.style.left=
item.x+'px';

el.style.top=
item.y+'px';

const r=
trash.getBoundingClientRect();

const hot=

e.clientX>=r.left &&

e.clientX<=r.right &&

e.clientY>=r.top &&

e.clientY<=r.bottom;

trash.classList.toggle(
'hot',
hot
);

};


el.onpointerup=e=>{

if(!dragging)return;

dragging=false;

const remove=
trash.classList.contains('hot');

trash.style.display='none';

trash.classList.remove('hot');

if(remove){

checkpoint();

if(kind==='table'){

S.guests.forEach(g=>{

if(g.tableId===item.id){

g.tableId=null;

}

});

S.tables=
S.tables.filter(
x=>x.id!==item.id
);

}else{

S.venueObjects=
S.venueObjects.filter(
x=>x.id!==item.id
);

}

selected=null;

render();

save();

return;

}

if(moved){
save();
}

};


el.onpointercancel=()=>{

dragging=false;

trash.style.display='none';

trash.classList.remove('hot');

};

}


/* SELECTED TOOLBAR */

function renderContext(){

if(!selected){

context.style.display='none';

return;

}

const item=

selected.kind==='table'

?S.tables.find(
x=>x.id===selected.id
)

:S.venueObjects.find(
x=>x.id===selected.id
);


if(!item){

selected=null;

context.style.display='none';

return;

}


if(selected.kind==='table'){

const count=
S.guests.filter(
g=>g.tableId===item.id
).length;

context.innerHTML=`

<b>Table</b>

<input
id="ctxNumber"
type="number"
min="1"
value="${item.number}">

<select id="ctxSeats">

${[8,10,12,16]
.map(
n=>
`<option ${n===item.seats?'selected':''}>${n}</option>`
)
.join('')}

</select>

<span
style="font-size:11px;color:#777">

${count}/${item.seats}

</span>

<button
class="sec"
onclick="saveTableContext()">
✓
</button>

<button
class="sec"
onclick="scaleSelected(.9)">
−
</button>

<button
class="sec"
onclick="scaleSelected(1.1)">
＋
</button>

<button
class="sec"
onclick="rotateSelected()">
↻
</button>

`;

}else{

context.innerHTML=`

<b>${item.label}</b>

<button
class="sec"
onclick="scaleSelected(.9)">
−
</button>

<button
class="sec"
onclick="scaleSelected(1.1)">
＋
</button>

<button
class="sec"
onclick="rotateSelected()">
↻
</button>

`;

}

context.style.display='flex';

}


/* SAVE TABLE */

function saveTableContext(){

const table=
S.tables.find(
x=>x.id===selected.id
);

if(!table)return;

const seats=
+$('ctxSeats').value;

const count=
S.guests.filter(
g=>g.tableId===table.id
).length;

if(seats<count){

toast(
'This table already has '+
count+
' guests'
);

return;

}

checkpoint();

table.number=
Math.max(
1,
+$('ctxNumber').value||1
);

table.seats=
seats;

render();

save();

}


/* SCALE */

function scaleSelected(mult){

if(!selected)return;

const list=
selected.kind==='table'
?S.tables
:S.venueObjects;

const item=
list.find(
x=>x.id===selected.id
);

if(!item)return;

checkpoint();

item.scale=
Math.max(
.5,
Math.min(
2.2,
item.scale*mult
)
);

render();

save();

}


/* ROTATE */

function rotateSelected(){

if(!selected)return;

const list=
selected.kind==='table'
?S.tables
:S.venueObjects;

const item=
list.find(
x=>x.id===selected.id
);

if(!item)return;

checkpoint();

item.rotation=
(item.rotation+15)%360;

render();

save();

}


/* TAP CANVAS */

canvas.addEventListener(
'pointerdown',
e=>{

/*
Στο κινητό:
αν πατήσεις στον καμβά,
κλείνει το ανοιχτό menu.
*/

if(isMobile()){
closePanel();
}

if(

e.target===canvas ||

e.target===stage ||

e.target===objectLayer

){

selected=null;

renderContext();

document
.querySelectorAll('.obj')
.forEach(
x=>x.classList.remove('selected')
);

}

}
);


/* VIEW */

function applyView(){

stage.style.transform=

`translate(${S.view.x}px,${S.view.y}px) scale(${S.view.scale})`;

}


/* FIT */

function fitView(){

S.view={
scale:1,
x:0,
y:0
};

applyView();

save();

}


/* ZOOM */

function zoomCenter(mult){

const r=
canvas.getBoundingClientRect();

zoomAround(

r.left+r.width/2,

r.top+r.height/2,

S.view.scale*mult

);

}


function zoomAround(
clientX,
clientY,
newScale
){

const r=
canvas.getBoundingClientRect();

const x=
clientX-r.left;

const y=
clientY-r.top;

const worldX=
(x-S.view.x)/
S.view.scale;

const worldY=
(y-S.view.y)/
S.view.scale;

S.view.scale=
Math.max(
.4,
Math.min(
3,
newScale
)
);

S.view.x=
x-
worldX*S.view.scale;

S.view.y=
y-
worldY*S.view.scale;

applyView();

save();

}


/* COMPUTER MOUSE WHEEL ZOOM */

canvas.addEventListener(
'wheel',
e=>{

if(
e.target.closest('.obj')
)return;

e.preventDefault();

zoomAround(

e.clientX,

e.clientY,

S.view.scale*
(
e.deltaY<0
?1.08
:.92
)

);

},
{
passive:false
}
);


/* MOBILE PINCH */

const pointers=
new Map();

let pinch=null;


canvas.addEventListener(
'pointerdown',
e=>{

if(
e.target.closest('.obj')
)return;

pointers.set(
e.pointerId,
{
x:e.clientX,
y:e.clientY
}
);

if(pointers.size===2){

const pts=
[...pointers.values()];

const distance=
Math.hypot(

pts[0].x-
pts[1].x,

pts[0].y-
pts[1].y

);

const cx=
(
pts[0].x+
pts[1].x
)/2;

const cy=
(
pts[0].y+
pts[1].y
)/2;

const r=
canvas.getBoundingClientRect();

const lx=
cx-r.left;

const ly=
cy-r.top;

pinch={

distance:distance,

scale:S.view.scale,

worldX:
(lx-S.view.x)/
S.view.scale,

worldY:
(ly-S.view.y)/
S.view.scale

};

}

}
);


canvas.addEventListener(
'pointermove',
e=>{

if(
!pointers.has(
e.pointerId
)
)return;

pointers.set(
e.pointerId,
{
x:e.clientX,
y:e.clientY
}
);

if(
pointers.size===2 &&
pinch
){

const pts=
[...pointers.values()];

const distance=
Math.hypot(

pts[0].x-
pts[1].x,

pts[0].y-
pts[1].y

);

const cx=
(
pts[0].x+
pts[1].x
)/2;

const cy=
(
pts[0].y+
pts[1].y
)/2;

const r=
canvas.getBoundingClientRect();

const lx=
cx-r.left;

const ly=
cy-r.top;

S.view.scale=
Math.max(
.4,
Math.min(
3,
pinch.scale*
(
distance/
pinch.distance
)
)
);

S.view.x=
lx-
pinch.worldX*
S.view.scale;

S.view.y=
ly-
pinch.worldY*
S.view.scale;

applyView();

}

}
);


function endPointer(e){

pointers.delete(
e.pointerId
);

if(
pointers.size<2
){

pinch=null;

save();

}

}

canvas.addEventListener(
'pointerup',
endPointer
);

canvas.addEventListener(
'pointercancel',
endPointer
);


/* TABLE OPTIONS */

function tableOptions(current=''){

return

'<option value="">Unassigned</option>'+

S.tables

.slice()

.sort(
(a,b)=>
a.number-b.number
)

.map(
t=>
`<option value="${t.id}" ${current===t.id?'selected':''}>Table ${t.number}</option>`
)

.join('');

}


/* CHECK SEAT */

function tableHasSeat(
tableId,
excludeGuestId=null
){

const table=
S.tables.find(
x=>x.id===tableId
);

if(!table)return false;

const count=
S.guests.filter(

g=>
g.tableId===tableId &&

g.id!==excludeGuestId

).length;

return count<table.seats;

}


/* ADD GUEST */

function addGuestManual(){

const name=
$('guestName')
.value
.trim();

const tableId=
$('guestTable').value||
null;

if(!name)return;

if(
tableId &&
!tableHasSeat(tableId)
){

toast('Table is full');

return;

}

checkpoint();

S.guests.push({

id:uid(),

name:name,

tableId:tableId

});

render();

save();

if(isMobile()){

closePanel();

}else{

renderGuestsPanel();

}

}


/* EDIT GUEST */

function editGuest(id){

const guest=
S.guests.find(
x=>x.id===id
);

if(!guest)return;

const newName=
prompt(
'Guest name',
guest.name
);

if(newName===null)return;

const name=
newName.trim();

if(!name)return;

const currentNumber=

guest.tableId

?(
S.tables.find(
t=>t.id===guest.tableId
)?.number||
''
)

:'';

const answer=
prompt(

'Table number (leave empty for unassigned)',

currentNumber

);

if(answer===null)return;

let tableId=null;

if(answer.trim()){

const table=
S.tables.find(

t=>
String(t.number)
===answer.trim()

);

if(!table){

toast(
'Table not found'
);

return;

}

if(
!tableHasSeat(
table.id,
guest.id
)
){

toast(
'Table is full'
);

return;

}

tableId=
table.id;

}

checkpoint();

guest.name=
name;

guest.tableId=
tableId;

render();

save();

renderGuestsPanel();

}


/* DELETE GUEST */

function deleteGuest(id){

checkpoint();

S.guests=
S.guests.filter(
x=>x.id!==id
);

render();

save();

renderGuestsPanel();

}


/* MICROPHONE */

function toggleMic(){

if(recognition){

recognition.stop();

return;

}

const SR=

window.SpeechRecognition ||

window.webkitSpeechRecognition;

if(!SR){

toast(
'Voice recognition is not supported in this browser.'
);

return;

}

recognition=
new SR();

recognition.lang=
'el-GR';

recognition.continuous=
true;

recognition.interimResults=
false;

$('micBtn').textContent=
'■ Stop listening';

recognition.onresult=e=>{

for(
let i=e.resultIndex;
i<e.results.length;
i++
){

parseVoice(
e.results[i][0].transcript
);

}

};

recognition.onerror=()=>{

toast(
'Try speaking a little slower.'
);

};

recognition.onend=()=>{

recognition=null;

if($('micBtn')){

$('micBtn').textContent=
'🎙 Speak guests';

}

};

recognition.start();

}


/* VOICE PARSER */

function parseVoice(text){

text

.split(/[,.؛;]+/)

.map(
x=>x.trim()
)

.filter(Boolean)

.forEach(part=>{

const match=

part.match(

/(.+?)\s+(?:τραπέζι|τραπεζι|table)\s*(\d+)/i

);

voiceDraft.push(

match

?{
name:match[1].trim(),
table:+match[2]
}

:{
name:part,
table:null
}

);

});

renderVoiceDraft();

}


/* VOICE PREVIEW */

function renderVoiceDraft(){

const box=
$('voiceBox');

if(!box)return;

box.style.display=
'block';

box.innerHTML=

voiceDraft

.map(
v=>
`

<div class="voiceRow">

${escapeHtml(v.name)}

→

${v.table
?'Table '+v.table
:'Unassigned'}

</div>

`
)

.join('')

+

`

<button
style="width:100%;margin-top:8px"
onclick="confirmVoiceGuests()">

Add ${voiceDraft.length} guests

</button>

`;

}


/* CONFIRM VOICE */

function confirmVoiceGuests(){

if(
!voiceDraft.length
)return;

checkpoint();

voiceDraft.forEach(v=>{

let tableId=null;

if(v.table){

const table=
S.tables.find(
x=>x.number===v.table
);

if(
table &&
tableHasSeat(table.id)
){

tableId=
table.id;

}

}

S.guests.push({

id:uid(),

name:v.name,

tableId:tableId

});

});

const count=
voiceDraft.length;

voiceDraft=[];

render();

save();

if(isMobile()){

closePanel();

}else{

renderGuestsPanel();

}

toast(
count+
' guests added'
);

}


/* STATUS */

function updateStatus(){

const seated=
S.guests.filter(
g=>g.tableId
).length;

const complete=

S.tables.filter(

t=>

S.guests.filter(
g=>g.tableId===t.id
).length

===t.seats

).length;

$('status').textContent=

`${S.tables.length} tables · ${seated}/${S.guests.length} seated · ${complete} complete`;

}


/* TOAST */

function toast(message){

const el=
$('toast');

el.textContent=
message;

el.style.display=
'block';

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{

el.style.display=
'none';

},
1700
);

}


/* SAFE TEXT */

function escapeHtml(text){

const d=
document.createElement('div');

d.textContent=
text||'';

return d.innerHTML;

}


/* START */

load();

</script>

</body>
</html>
