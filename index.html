<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seatly 5.2</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{box-sizing:border-box}

:root{
--bg:#ece9e4;
--paper:#fff;
--ink:#202020;
--muted:#777;
--line:#e3ddd5;
--soft:#f5f2ed;
--green:#e4f3e8;
--greenText:#28663c;
--danger:#a63c34;
--dangerSoft:#fff0ee;
--warning:#fff7e8;
}

html,body{
width:100%;
height:100%;
margin:0;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--ink);
}

body{
overflow:hidden;
overscroll-behavior:none;
}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:9px 11px;
background:#222;
color:#fff;
font-weight:750;
cursor:pointer;
}

button.secondary{
background:#fff;
color:#222;
border:1px solid var(--line);
}

button.soft{
background:var(--soft);
color:#222;
border:1px solid #e6dfd7;
}

button.danger{
background:var(--danger);
color:#fff;
}

button.dangerSoft{
background:var(--dangerSoft);
color:var(--danger);
border:1px solid #efc8c4;
}

button:disabled{opacity:.4}


/* TOP */

.topbar{
height:55px;
background:#fff;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
z-index:500;
position:relative;
}

.logo{
font-size:24px;
font-weight:900;
letter-spacing:-1px;
}

.logo span{font-weight:400}

.topRight{
display:flex;
align-items:center;
gap:5px;
}

.saveState{
font-size:10px;
color:#777;
}


/* PROGRESS */

.progress{
height:43px;
background:#fff;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:center;
gap:5px;
padding:4px 7px;
overflow-x:auto;
scrollbar-width:none;
}

.progress::-webkit-scrollbar{display:none}

.progress button{
flex:0 0 auto;
background:#f5f2ed;
color:#666;
border:1px solid #e4ddd5;
border-radius:999px;
padding:6px 10px;
font-size:10px;
white-space:nowrap;
}

.progress button.active{
background:#222;
color:#fff;
border-color:#222;
}

.progress button.done{
background:var(--green);
color:var(--greenText);
border-color:#bfdcc8;
}


/* APP */

.app{
height:calc(100vh - 98px);
display:grid;
grid-template-columns:54px 1fr;
}

.rail{
background:#202020;
padding:4px 2px;
display:flex;
flex-direction:column;
gap:3px;
z-index:300;
}

.rail button{
height:49px;
padding:3px;
background:transparent;
font-size:7px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:2px;
}

.rail button b{font-size:16px}

.rail button.active{
background:#fff;
color:#222;
}


/* WORKSPACE */

.workspace{
min-width:0;
min-height:0;
display:flex;
flex-direction:column;
overflow:hidden;
}


/* TOOLBAR */

.toolbar{
height:57px;
background:#fff;
border-bottom:1px solid var(--line);
display:none;
align-items:center;
overflow-x:auto;
overflow-y:hidden;
gap:5px;
padding:6px;
scrollbar-width:none;
z-index:250;
}

.toolbar::-webkit-scrollbar{display:none}

.toolbar.show{display:flex}

.toolbar button{
flex:0 0 auto;
height:43px;
font-size:10px;
white-space:nowrap;
}

.toolObject{
min-width:72px;
background:#f5f2ed!important;
color:#222!important;
border:1px solid #e4ddd5!important;
}

.toolObject span{
display:block;
font-size:14px;
}

.toolObject small{
display:block;
font-size:8px;
font-weight:800;
}

.toolName{
flex:0 0 auto;
padding:7px 10px;
border:1px solid #ddd6ce;
border-radius:10px;
background:#fff;
min-width:100px;
}

.toolName b{
display:block;
font-size:10px;
}

.toolName small{
font-size:8px;
color:#777;
}

.divider{
flex:0 0 auto;
width:1px;
height:32px;
background:#ddd5cd;
margin:0 2px;
}


/* CANVAS */

.canvasArea{
flex:1;
min-height:0;
background:#e8e5e0;
padding:5px;
display:flex;
align-items:stretch;
justify-content:center;
overflow:hidden;
}

.canvas{
position:relative;
width:min(100%,1500px);
height:100%;
background:#fff;
border:1px solid var(--line);
border-radius:13px;
overflow:hidden;
touch-action:none;
box-shadow:0 7px 25px rgba(0,0,0,.07);
}

.venueBg{
position:absolute;
inset:0;
z-index:1;
background:#fff center/contain no-repeat;
pointer-events:none;
}

.objectLayer,
.tableLayer{
position:absolute;
inset:0;
pointer-events:none;
}

.objectLayer{z-index:5}
.tableLayer{z-index:10}

.objectLayer.active,
.tableLayer.active{
pointer-events:auto;
}

.objectLayer.active .canvasObject,
.tableLayer.active .canvasObject{
pointer-events:auto;
}

.empty{
position:absolute;
inset:0;
display:grid;
place-items:center;
text-align:center;
pointer-events:none;
color:#999;
z-index:2;
}

.canvasObject{
position:absolute;
touch-action:none;
user-select:none;
-webkit-user-select:none;
transform-origin:center center;
}


/* VENUE OBJECTS */

.venueObject{
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:rgba(255,255,255,.95);
border:1px solid #777;
border-radius:9px;
font-size:10px;
font-weight:850;
box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.venueObject.editing{
border:2px dashed #222;
box-shadow:0 0 0 3px rgba(0,0,0,.08);
}

.dancefloor{
background:
linear-gradient(
45deg,
#fafafa 25%,
#ececec 25%,
#ececec 50%,
#fafafa 50%,
#fafafa 75%,
#ececec 75%
);
background-size:24px 24px;
border-style:solid;
}

.djbox{
background:#262626;
color:#fff;
}

.bar{background:#f3ece4}

.entrance{
background:#fff;
border-style:double;
}


/* OBJECT FLOATING CONTROLS */

.objectControls{
position:absolute;
top:-37px;
left:50%;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:4px;
z-index:120;
white-space:nowrap;
}

.objectControls button{
padding:5px 7px;
font-size:9px;
border-radius:999px;
box-shadow:0 5px 13px rgba(0,0,0,.13);
}

.objectControls .deleteBtn{
background:var(--danger);
}

.resizeHandle{
position:absolute;
width:22px;
height:22px;
right:-11px;
bottom:-11px;
border-radius:50%;
background:#fff;
border:2px solid #222;
z-index:121;
box-shadow:0 3px 10px rgba(0,0,0,.2);
touch-action:none;
}

.resizeHandle:after{
content:"";
position:absolute;
width:7px;
height:7px;
background:#222;
border-radius:50%;
left:5.5px;
top:5.5px;
}


/* TABLE */

.table{
width:82px;
height:82px;
display:flex;
align-items:center;
justify-content:center;
}

.table.editing{
outline:2px dashed #222;
outline-offset:3px;
}

.tableCore{
width:48px;
height:48px;
border:2px solid #222;
border-radius:50%;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:2;
box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.tableCore b{font-size:8px}

.tableCore span{
font-size:8px;
color:#666;
margin-top:2px;
}

.table.full .tableCore{
background:#e2f3e6;
border-color:#39794d;
}

.chair{
position:absolute;
width:9px;
height:9px;
background:#fff;
border:1px solid #555;
border-radius:3px;
}


/* STATUS */

.status{
position:absolute;
left:8px;
bottom:8px;
z-index:50;
background:#fff;
border:1px solid var(--line);
border-radius:999px;
padding:6px 9px;
font-size:9px;
color:#666;
pointer-events:none;
}


/* SHEET */

.sheet{
position:fixed;
top:98px;
right:0;
bottom:0;
width:390px;
background:#fff;
z-index:600;
border-left:1px solid var(--line);
box-shadow:-10px 0 30px rgba(0,0,0,.13);
padding:15px;
overflow:auto;
display:none;
}

.sheet.open{display:block}

.sheetTop{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:8px;
margin-bottom:12px;
}

.sheetTop h2{
margin:0;
font-size:20px;
}

.sheetClose{
width:34px;
height:34px;
padding:0;
border-radius:50%;
}

.hint{
font-size:12px;
color:#777;
line-height:1.45;
margin:5px 0 12px;
}

.section{
border-top:1px solid #eee7df;
margin-top:12px;
padding-top:12px;
}

.card{
border:1px solid var(--line);
border-radius:13px;
background:#faf9f7;
padding:11px;
margin-top:8px;
}

.card.warning{
background:var(--warning);
}

.cardTitle{
font-size:14px;
font-weight:850;
}

.meta{
font-size:10px;
color:#777;
margin-top:3px;
}

.field{
width:100%;
padding:10px;
border:1px solid #d8d1c9;
border-radius:10px;
background:#fff;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.wide{
width:100%;
margin-top:8px;
}


/* GUEST */

.guestRow{
display:grid;
grid-template-columns:1fr auto;
gap:7px;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee;
}

.guestName{
font-size:13px;
font-weight:750;
}

.guestMeta{
font-size:10px;
color:#777;
}

.rowActions{
display:flex;
gap:4px;
}

.rowActions button{
font-size:9px;
padding:5px 6px;
}


/* SUMMARY */

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.summaryCard{
border:1px solid var(--line);
border-radius:12px;
background:#faf9f7;
padding:10px;
}

.summaryNumber{
font-size:23px;
font-weight:900;
}

.summaryLabel{
font-size:9px;
color:#777;
}


/* DOWNLOAD */

.downloadChoice{
border:1px solid var(--line);
border-radius:15px;
background:#faf9f7;
padding:14px;
margin-top:10px;
}

.downloadIcon{font-size:28px}


/* OVERLAY */

.overlay{
position:fixed;
inset:0;
z-index:900;
background:rgba(0,0,0,.5);
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.overlay.open{display:flex}

.modal{
width:min(1000px,100%);
max-height:94vh;
overflow:auto;
background:#fff;
border-radius:18px;
padding:18px;
}

.modalTop{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:8px;
}


/* CHART */

.chartControls{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin:12px 0;
}

.chart{
background:#fff;
color:#111;
width:100%;
min-height:900px;
padding:44px;
border:1px solid #ddd;
margin-top:14px;
}

.chartWelcome{
text-align:center;
font-family:Georgia,serif;
font-style:italic;
font-size:64px;
}

.chartSmall{
text-align:center;
font-size:10px;
letter-spacing:4px;
margin-top:24px;
}

.chartNames{
text-align:center;
font-family:Georgia,serif;
font-size:29px;
letter-spacing:4px;
margin-top:7px;
}

.chartDate{
text-align:center;
font-size:10px;
letter-spacing:3px;
margin-top:8px;
}

.chartFind{
text-align:center;
font-family:Georgia,serif;
font-style:italic;
font-size:26px;
margin:26px 0 32px;
}

.chartColumns{
columns:4;
column-gap:34px;
}

.chartGroup{
break-inside:avoid;
margin-bottom:18px;
}

.chartLetter{
font-family:Georgia,serif;
font-size:24px;
margin-bottom:6px;
}

.chartPerson{
display:flex;
align-items:flex-end;
gap:4px;
font-family:Georgia,serif;
font-size:10px;
line-height:1.65;
}

.chartDots{
flex:1;
height:10px;
border-bottom:1px dotted #777;
}

.chartTable{
min-width:18px;
text-align:right;
}


/* VENUE EXPORT */

.venueExport{
position:relative;
width:1600px;
height:1000px;
background:#fff;
overflow:hidden;
}

.venueExportBg{
position:absolute;
inset:0;
background:#fff center/contain no-repeat;
}

.exportObject{
position:absolute;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
border:2px solid #444;
background:#fff;
transform-origin:center center;
}

.exportObject.djbox{
background:#222;
color:#fff;
}

.exportTable{
position:absolute;
width:75px;
height:75px;
border:2px solid #222;
border-radius:50%;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:850;
transform-origin:center center;
}


/* MOBILE */

@media(max-width:800px){

.progress{
justify-content:flex-start;
}

.sheet{
left:54px;
right:0;
width:auto;
border-left:0;
}

.table{
width:72px;
height:72px;
}

.tableCore{
width:42px;
height:42px;
}

.tableCore b,
.tableCore span{
font-size:7px;
}

.chartControls{
grid-template-columns:1fr;
}

.chartColumns{
columns:2;
}

}


/* EXPORT MODE */

.chart.exportMode{
width:1500px!important;
min-height:2100px!important;
padding:90px!important;
border:0!important;
}

.chart.exportMode .chartWelcome{
font-size:95px;
}

.chart.exportMode .chartNames{
font-size:42px;
}

.chart.exportMode .chartFind{
font-size:38px;
}

.chart.exportMode .chartPerson{
font-size:15px;
}

.chart.exportMode .chartLetter{
font-size:32px;
}

</style>
</head>

<script>

/* =====================================================
STATE
===================================================== */

const STORAGE_KEY='seatly52';

let S={

version:52,

venueImage:null,

venueLocked:false,

tablesLocked:false,

objects:[],

tables:[],

guests:[],

chart:{
couple:'',
date:'',
welcome:'Welcome',
find:'Please find your seat',
columns:4
}

};

let currentStep=1;

let selected=null;

let currentGuestTable=null;

let undoStack=[];
let redoStack=[];


const $=id=>document.getElementById(id);

const canvas=$('canvas');

const objectLayer=$('objectLayer');

const tableLayer=$('tableLayer');


/* =====================================================
UTILS
===================================================== */

function uid(){

if(
window.crypto &&
crypto.randomUUID
){
return crypto.randomUUID();
}

return String(
Date.now()+Math.random()
);

}

function clamp(value,min,max){

return Math.max(
min,
Math.min(max,value)
);

}

function pctX(px){

return(
px/
Math.max(canvas.clientWidth,1)
)*100;

}

function pctY(px){

return(
px/
Math.max(canvas.clientHeight,1)
)*100;

}

function pxX(percent){

return(
Number(percent||0)/100
)*
canvas.clientWidth;

}

function pxY(percent){

return(
Number(percent||0)/100
)*
canvas.clientHeight;

}


/* =====================================================
SAVE
===================================================== */

function save(){

try{

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(S)
);

$('saveState').textContent=
'Saved ✓';

return true;

}catch(error){

$('saveState').textContent=
'Save failed';

return false;

}

}


/* =====================================================
UNDO REDO
===================================================== */

function snapshot(){

return JSON.stringify(S);

}

function remember(){

undoStack.push(
snapshot()
);

if(
undoStack.length>80
){
undoStack.shift();
}

redoStack=[];

updateUndoButtons();

}

function undo(){

if(!undoStack.length)return;

redoStack.push(
snapshot()
);

S=
JSON.parse(
undoStack.pop()
);

selected=null;

applyVenue();

renderAll();

save();

refreshUI();

updateUndoButtons();

}

function redo(){

if(!redoStack.length)return;

undoStack.push(
snapshot()
);

S=
JSON.parse(

);

===================================================== */

function load(){

try{

const old=
localStorage.getItem(STORAGE_KEY)
||
localStorage.getItem('seatly51')
||
localStorage.getItem('seatly50');

if(old){

S={
...S,
...JSON.parse(old),
version:52
};

}

}catch(error){}


if(!Array.isArray(S.objects)){
S.objects=[];
}

if(!Array.isArray(S.tables)){
S.tables=[];
}

if(!Array.isArray(S.guests)){
S.guests=[];
}


S.objects.forEach(
object=>{

if(object.rotation===undefined){
object.rotation=0;
}

}
);


S.tables.forEach(
table=>{

if(table.rotation===undefined){
table.rotation=0;
}

}
);


requestAnimationFrame(
()=>{

applyVenue();

currentStep=
S.tablesLocked
?3
:S.venueLocked
?2
:1;

renderAll();

refreshUI();

save();

updateUndoButtons();

}
);

}

/* =====================================================
CHAIRS
===================================================== */

function createChairs(
element,
seats
){

const count=
Math.min(
Number(seats),
16
);

const center=41;

const radius=34;

for(let i=0;i<count;i++){

const angle=
2*Math.PI*i/count
-
Math.PI/2;

const chair=
document.createElement(
'div'
);

chair.className=
'chair';

chair.style.left=
(
center+
Math.cos(angle)*
radius-
4.5
)
+'px';

chair.style.top=
(
center+
Math.sin(angle)*
radius-
4.5
)
+'px';

element.appendChild(chair);

}

}


/* =====================================================
TAP / DRAG
===================================================== */

function attachInteraction(
element,
item,
kind
){

let downX=0;
let downY=0;

let originalX=0;
let originalY=0;

let dragging=false;

let before='';

let pointerId=null;


element.addEventListener(
'pointerdown',
event=>{

if(
event.target.closest(
'.objectControls'
)
||
event.target.closest(
'.resizeHandle'
)
)
return;


event.preventDefault();

event.stopPropagation();


const selectedNow=
selected?.kind===kind
&&
selected.id===item.id;


if(!selectedNow){

selected={
kind,
id:item.id
};

renderAll();

renderToolbar();

return;

}


pointerId=
event.pointerId;

downX=
event.clientX;

downY=
event.clientY;

originalX=
pxX(item.xPct);

originalY=
pxY(item.yPct);

before=
snapshot();

try{

element.setPointerCapture(
event.pointerId
);

}catch(error){}

}
);


element.addEventListener(
'pointermove',
event=>{

if(
pointerId!==event.pointerId
)return;


const distance=
Math.hypot(
event.clientX-downX,
event.clientY-downY
);


if(
distance<5
&&
!dragging
)
return;


dragging=true;


const rect=
canvas.getBoundingClientRect();


let width=
element.offsetWidth;

let height=
element.offsetHeight;


if(kind==='table'){

width*=
Number(item.scale||1);

height*=
Number(item.scale||1);

}


let x=
originalX+
event.clientX-
downX;


let y=
originalY+
event.clientY-
downY;


x=
clamp(
x,
0,
Math.max(
0,
rect.width-width
)
);


y=
clamp(
y,
0,
Math.max(
0,
rect.height-height
)
);


item.xPct=
pctX(x);


item.yPct=
pctY(y);


element.style.left=
item.xPct+'%';


element.style.top=
item.yPct+'%';

}
);


element.addEventListener(
'pointerup',
event=>{

if(
pointerId!==event.pointerId
)
return;


if(
dragging
&&
before!==snapshot()
){

undoStack.push(before);

redoStack=[];

save();

updateUndoButtons();

}


pointerId=null;

dragging=false;

before='';


renderToolbar();

}
);

}

FLOATING OBJECT CONTROLS

)

);


const handle=

);

event=>{

);

}


/* =====================================================
RESIZE HANDLE
===================================================== */

function startResizeHandle(
event,
item,
kind,
element
){

const startX=
event.clientX;


const before=
snapshot();


const startWidth=
element.getBoundingClientRect().width;


const move=
moveEvent=>{

moveEvent.preventDefault();


const delta=
moveEvent.clientX-
startX;


if(kind==='object'){

const newWidth=
Math.max(
40,
startWidth+
delta
);


const ratio=
element.offsetHeight/
element.offsetWidth;


const newHeight=
newWidth*
ratio;


item.widthPct=
clamp(
pctX(newWidth),
5,
70
);


item.heightPct=
clamp(
pctY(newHeight),
4,
65
);

}


if(kind==='table'){

item.scale=
clamp(
(
startWidth+
delta
)
/
82,
.35,
1.8
);

}


renderAll();

renderToolbar();

};


const up=
()=>{

document.removeEventListener(
'pointermove',
move
);


if(
before!==snapshot()
){

undoStack.push(before);

redoStack=[];

save();

updateUndoButtons();

}

};


document.addEventListener(
'pointermove',
move,
{
passive:false
}
);


document.addEventListener(
'pointerup',
up,
{
once:true
}
);

}

function addManualGuest(){

const surname=
$('guestSurname')
.value
.trim();


const firstName=
$('guestFirst')
.value
.trim();


const partySize=
Math.max(
1,
Number(
$('guestParty').value||1
)
);


const tableNumber=
Number(
$('guestTable').value
);


const table=
S.tables.find(
table=>
Number(table.number)===
tableNumber
);

'Add surname'
);

}

'Table not found'
);

remember();

firstName,

partySize,

table.id

save();

const surname=
$('tableSurname')
.value
.trim();


const firstName=
$('tableFirst')
.value

/* =====================================================

===================================================== */

function guestRows(
guests,
assignable
){

if(!guests.length){

return`

<div class="hint">
None.
</div>

`;

}


return guests

.slice()

.sort(
compareGuests
)

.map(
guest=>{

const table=
S.tables.find(
table=>
table.id===guest.tableId
);


return`

<div class="guestRow">

<div>

<div class="guestName">

${safe(
guestFullName(
guest
)
)}

</div>

<div class="guestMeta">

${guest.partySize}
people ·

${table
?'Table '+table.number
:'Unassigned'}

</div>

</div>


<div class="rowActions">

${assignable

?`

<button
class="secondary"
onclick="assignGuest('${guest.id}')">

Assign

</button>

`

:''}


<button
class="danger"
onclick="deleteGuest('${guest.id}')">

Delete

</button>

</div>

</div>

`;

}
)

.join('');

}


/* =====================================================

===================================================== */

function assignGuest(id){

const guest=
S.guests.find(
guest=>
guest.id===id
);


if(!guest)return;


const answer=
prompt(
'Table number'
);


if(answer===null)return;


const table=
S.tables.find(
table=>
Number(table.number)===
Number(answer)
);


if(!table){

toast(
'Table not found'
);

return;

}


remember();


guest.tableId=
table.id;


renderAll();

save();

renderGuestsSheet();

}


function deleteGuest(id){

remember();


S.guests=
S.guests.filter(
guest=>
guest.id!==id
);


renderAll();

save();

renderGuestsSheet();

}


function deleteGuestList(){

if(
!confirm(
'Delete entire guest list?'
)
)return;


remember();


S.guests=[];


renderAll();

save();

renderGuestsSheet();

}

/* =====================================================
STATS SORTING
===================================================== */

function stats(){

const seats=
S.tables.reduce(
(sum,table)=>
sum+
Number(table.seats||0),
0
);


const people=
S.guests.reduce(
(sum,guest)=>
sum+
Number(guest.partySize||1),
0
);


const seated=
S.guests

.filter(
guest=>
guest.tableId
)

.reduce(
(sum,guest)=>
sum+
Number(guest.partySize||1),
0
);


return{

tables:
S.tables.length,

seats,

people,

seated,

unassigned:
people-seated,

free:
Math.max(
0,
seats-seated
)

};

}


function updateStatus(){

const s=
stats();


$('status')
.textContent=

`${s.tables} tables · ${s.seated}/${s.people} people · ${s.free} free`;

}


function tableUsedSeats(
tableId
){

return S.guests

.filter(
guest=>
guest.tableId===tableId
)

.reduce(
(sum,guest)=>
sum+
Number(guest.partySize||1),
0
);

}


function compareGuests(a,b){

return guestFullName(a)
.localeCompare(
guestFullName(b),
'el'
);

}

function renderVenueExport(){

const holder=
$('venuePreview');


const box=
document.createElement(
'div'
);


box.id=
'venueExport';


box.className=
'venueExport';


const bg=
document.createElement(
'div'
);


bg.className=
'venueExportBg';


bg.style.backgroundImage=
S.venueImage
?`url("${S.venueImage}")`
:'none';


box.appendChild(bg);


S.objects.forEach(
object=>{

const el=
document.createElement(
'div'
);


el.className=
`exportObject ${object.type}`;


el.style.left=
object.xPct+'%';


el.style.top=
object.yPct+'%';


el.style.width=
object.widthPct+'%';


el.style.height=
object.heightPct+'%';


el.style.transform=
`rotate(${object.rotation||0}deg)`;


el.textContent=
object.label;


box.appendChild(el);

}
);


S.tables.forEach(
table=>{

const el=
document.createElement(
'div'
);


el.className=
'exportTable';


el.style.left=
table.xPct+'%';


el.style.top=
table.yPct+'%';


el.style.transform=
`scale(${table.scale||1}) rotate(${table.rotation||0}deg)`;


el.textContent=
`T${table.number}`;


box.appendChild(el);

}
);


holder.innerHTML='';

holder.appendChild(box);

}

/* =====================================================
TEXT
===================================================== */

function guestFullName(
guest
){

return[
guest.surname||'',
guest.firstName||''
]

.filter(Boolean)
.join(' ');

}


function safe(text){

const div=
document.createElement(
'div'
);

div.textContent=
text||'';

return div.innerHTML;

}


/* =====================================================
TOAST
===================================================== */

function toast(message){

const el=
$('toast');

el.textContent=
message;

el.style.display=
'block';

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{

el.style.display='none';

},
1800
);

}
