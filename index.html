<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seatly 5.0</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg:#efede9;
  --paper:#fff;
  --ink:#202020;
  --muted:#747474;
  --line:#e3ddd5;
  --soft:#f5f2ed;
  --green:#e4f3e8;
  --greenText:#25633b;
  --warning:#fff7e8;
  --danger:#a64038;
  --dangerSoft:#fff0ee;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
}

body{
  overflow:hidden;
  overscroll-behavior:none;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
  padding:9px 11px;
  font-weight:750;
  cursor:pointer;
}

button.secondary{
  background:#fff;
  color:#222;
  border:1px solid var(--line);
}

button.soft{
  background:var(--soft);
  color:#222;
  border:1px solid #e7e0d7;
}

button.success{
  background:var(--green);
  color:var(--greenText);
  border:1px solid #bfdcc7;
}

button.danger{
  background:var(--danger);
  color:#fff;
}

button.dangerSoft{
  background:var(--dangerSoft);
  color:var(--danger);
  border:1px solid #edcbc6;
}

button:disabled{
  opacity:.4;
}


/* =====================================================
TOP
===================================================== */

.topbar{
  height:56px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  z-index:300;
  position:relative;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  font-weight:400;
}

.topRight{
  display:flex;
  gap:5px;
  align-items:center;
}

.saveState{
  font-size:10px;
  color:#777;
}

.saveState.error{
  color:var(--danger);
  font-weight:800;
}


/* =====================================================
PROGRESS
===================================================== */

.progressBar{
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  overflow-x:auto;
  padding:4px 7px;
  background:#fff;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}

.progressBar::-webkit-scrollbar{
  display:none;
}

.progressBtn{
  flex:0 0 auto;
  white-space:nowrap;
  border-radius:999px;
  padding:7px 11px;
  font-size:10px;
  background:#f5f2ed;
  color:#666;
  border:1px solid #e5ded5;
}

.progressBtn.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

.progressBtn.done{
  background:var(--green);
  color:var(--greenText);
  border-color:#bedbc5;
}


/* =====================================================
APP
===================================================== */

.app{
  height:calc(100vh - 101px);
  display:grid;
  grid-template-columns:58px 1fr;
}

.rail{
  background:#202020;
  padding:5px 3px;
  display:flex;
  flex-direction:column;
  gap:4px;
  z-index:200;
}

.rail button{
  height:51px;
  padding:3px;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-size:7px;
}

.rail button b{
  font-size:16px;
}

.rail button.active{
  background:#fff;
  color:#222;
}


/* =====================================================
WORK AREA
===================================================== */

.workspace{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.toolStrip{
  min-height:58px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:none;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:stretch;
  z-index:160;
}

.toolStrip.show{
  display:grid;
}

.toolScroll{
  min-width:0;
  display:flex;
  gap:6px;
  align-items:center;
  padding:6px 7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.toolScroll::-webkit-scrollbar{
  display:none;
}

.toolActions{
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px;
  border-left:1px solid var(--line);
  background:#fff;
}

.toolItem{
  flex:0 0 auto;
  min-width:76px;
  height:44px;
  padding:5px 8px;
  background:#f6f3ef;
  color:#222;
  border:1px solid #e4ddd5;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  touch-action:none;
  user-select:none;
}

.toolItem strong{
  font-size:9px;
}

.toolItem span{
  font-size:13px;
}

.toolDivider{
  width:1px;
  height:34px;
  flex:0 0 auto;
  background:#e3ddd5;
  margin:0 2px;
}

.selectedLabel{
  flex:0 0 auto;
  min-width:105px;
  padding:6px 8px;
  border:1px solid #d9d2ca;
  border-radius:10px;
  background:#fff;
}

.selectedLabel b{
  display:block;
  font-size:10px;
}

.selectedLabel small{
  display:block;
  color:#777;
  font-size:8px;
  margin-top:1px;
}


/* =====================================================
CANVAS
===================================================== */

.canvasArea{
  flex:1;
  min-height:0;
  padding:6px;
  background:#e8e5e0;
  display:flex;
  justify-content:center;
  align-items:stretch;
  overflow:hidden;
}

.canvas{
  width:min(100%,1500px);
  height:100%;
  position:relative;
  overflow:hidden;
  border-radius:14px;
  border:1px solid var(--line);
  background:#fff;
  touch-action:none;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.venueBg{
  position:absolute;
  inset:0;
  z-index:1;
  background:#fff center/contain no-repeat;
  pointer-events:none;
}

.objectLayer{
  position:absolute;
  inset:0;
  z-index:5;
}

.tableLayer{
  position:absolute;
  inset:0;
  z-index:10;
}

.emptyState{
  position:absolute;
  inset:0;
  z-index:2;
  display:grid;
  place-items:center;
  text-align:center;
  pointer-events:none;
  color:#999;
}

.emptyState b{
  color:#777;
}

.canvasObj{
  position:absolute;
  user-select:none;
  touch-action:none;
  transform-origin:top left;
}


/* =====================================================
VENUE OBJECT
===================================================== */

.venueObject{
  border:2px dashed #555;
  border-radius:10px;
  background:rgba(255,255,255,.95);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:850;
  font-size:10px;
  cursor:grab;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.venueObject.selected{
  outline:3px solid rgba(0,0,0,.16);
  outline-offset:3px;
}

.venueObject.locked{
  border-style:solid;
  cursor:pointer;
}

.dancefloor{
  border-style:solid;
  background:
  linear-gradient(
    45deg,
    #fafafa 25%,
    #ececec 25%,
    #ececec 50%,
    #fafafa 50%,
    #fafafa 75%,
    #ececec 75%
  );
  background-size:24px 24px;
}

.djbox{
  background:#292929;
  color:#fff;
  border-color:#111;
}

.bar{
  background:#f4eee8;
}

.entrance{
  background:#fff;
  border-style:double;
}


/* =====================================================
TABLES
===================================================== */

.table{
  width:82px;
  height:82px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
}

.table.selected{
  outline:3px solid rgba(0,0,0,.16);
  outline-offset:3px;
}

.table.locked{
  cursor:pointer;
}

.tableCore{
  width:48px;
  height:48px;
  border:2px solid #222;
  border-radius:50%;
  background:#fff;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.tableCore b{
  font-size:8px;
}

.tableCore span{
  font-size:8px;
  color:#666;
  margin-top:2px;
}

.table.full .tableCore{
  background:#e2f3e6;
  border-color:#37784c;
}

.chair{
  width:9px;
  height:9px;
  position:absolute;
  background:#fff;
  border:1px solid #555;
  border-radius:3px;
}


/* =====================================================
DRAG GHOST
===================================================== */

.dragGhost{
  position:fixed;
  z-index:9999;
  pointer-events:none;
  padding:9px 12px;
  background:#222;
  color:#fff;
  border-radius:10px;
  font-size:11px;
  font-weight:800;
  transform:translate(-50%,-50%);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}


/* =====================================================
DROP INDICATOR
===================================================== */

.dropHint{
  position:absolute;
  inset:8px;
  pointer-events:none;
  border:2px dashed transparent;
  border-radius:12px;
  z-index:50;
}

.dropHint.active{
  border-color:#777;
  background:rgba(255,255,255,.15);
}


/* =====================================================
TRASH
===================================================== */

.trash{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  display:none;
  z-index:80;
  background:#fff;
  border:2px solid var(--line);
  border-radius:999px;
  padding:8px 15px;
  font-size:10px;
  font-weight:850;
}

.trash.hot{
  background:#ffe8e4;
  border-color:#b64136;
}


/* =====================================================
STATUS
===================================================== */

.status{
  position:absolute;
  bottom:8px;
  left:8px;
  z-index:40;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 9px;
  font-size:9px;
  color:#666;
}


/* =====================================================
POPOVER
===================================================== */

.popover{
  position:fixed;
  top:111px;
  left:72px;
  width:min(320px,calc(100vw - 88px));
  max-height:65vh;
  overflow:auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  z-index:500;
  display:none;
  box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.popover.open{
  display:block;
}

.popTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.popTop h3{
  margin:0;
  font-size:15px;
}


/* =====================================================
SHEET
===================================================== */

.sheet{
  position:fixed;
  top:101px;
  right:0;
  bottom:0;
  width:390px;
  background:#fff;
  border-left:1px solid var(--line);
  box-shadow:-10px 0 30px rgba(0,0,0,.12);
  z-index:220;
  display:none;
  overflow:auto;
  padding:16px;
}

.sheet.open{
  display:block;
}

.sheetTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.sheetTop h2{
  margin:0;
  font-size:21px;
}

.sheetClose{
  width:34px;
  height:34px;
  padding:0;
  border-radius:50%;
}

.hint{
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
  margin:5px 0 12px;
}

.section{
  border-top:1px solid #eee8e1;
  padding-top:12px;
  margin-top:12px;
}

.field{
  width:100%;
  padding:10px;
  border:1px solid #d8d1c9;
  border-radius:10px;
  background:#fff;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px;
  background:#faf9f7;
  margin-top:8px;
}

.card.warning{
  background:var(--warning);
  border-color:#ead39e;
}

.cardTitle{
  font-size:14px;
  font-weight:850;
}

.meta{
  font-size:11px;
  color:#777;
  margin-top:3px;
}

.wide{
  width:100%;
  margin-top:8px;
}


/* =====================================================
GUESTS
===================================================== */

.guestRow{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:7px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.guestName{
  font-size:13px;
  font-weight:750;
}

.guestMeta{
  font-size:10px;
  color:#777;
}

.rowActions{
  display:flex;
  gap:4px;
}

.rowActions button{
  padding:5px 6px;
  font-size:9px;
}

.voiceBox{
  border:1px solid var(--line);
  border-radius:14px;
  background:#faf9f7;
  padding:11px;
  margin-top:10px;
}

.voiceBox.listening{
  background:#fff0ee;
  border-color:#efc8c3;
}

.voicePreviewRow{
  display:grid;
  grid-template-columns:1fr 1fr 52px 58px auto;
  gap:4px;
  margin-top:5px;
}

.voicePreviewRow input{
  width:100%;
  padding:6px;
  border:1px solid var(--line);
  border-radius:7px;
  font-size:10px;
}


/* =====================================================
SUMMARY
===================================================== */

.summaryGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.summaryCard{
  border:1px solid var(--line);
  border-radius:13px;
  background:#faf9f7;
  padding:11px;
}

.summaryNumber{
  font-size:24px;
  font-weight:900;
}

.summaryLabel{
  color:#777;
  font-size:9px;
}


/* =====================================================
DOWNLOAD
===================================================== */

.downloadChoice{
  border:1px solid var(--line);
  border-radius:15px;
  background:#faf9f7;
  padding:14px;
  margin-top:10px;
}

.downloadChoiceIcon{
  font-size:28px;
}


/* =====================================================
OVERLAY
===================================================== */

.overlay{
  position:fixed;
  inset:0;
  z-index:700;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.overlay.open{
  display:flex;
}

.modal{
  width:min(1000px,100%);
  max-height:94vh;
  overflow:auto;
  border-radius:18px;
  background:#fff;
  padding:18px;
}

.modalTop{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
}


/* =====================================================
ALPHABETICAL CHART
===================================================== */

.chartControls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin:12px 0;
}

.chart{
  width:100%;
  min-height:900px;
  margin-top:14px;
  padding:44px;
  background:#fff;
  border:1px solid #ddd;
  color:#111;
}

.chartWelcome{
  text-align:center;
  font-family:Georgia,serif;
  font-style:italic;
  font-size:64px;
  line-height:1;
}

.chartSmall{
  text-align:center;
  margin-top:24px;
  letter-spacing:4px;
  font-size:10px;
}

.chartNames{
  text-align:center;
  font-family:Georgia,serif;
  font-size:29px;
  letter-spacing:4px;
  margin-top:7px;
}

.chartDate{
  text-align:center;
  font-size:10px;
  letter-spacing:3px;
  margin-top:8px;
}

.chartFind{
  text-align:center;
  font-family:Georgia,serif;
  font-size:26px;
  font-style:italic;
  margin:26px 0 32px;
}

.chartColumns{
  columns:4;
  column-gap:34px;
}

.chartGroup{
  break-inside:avoid;
  margin-bottom:18px;
}

.chartLetter{
  font-family:Georgia,serif;
  font-size:24px;
  margin-bottom:6px;
}

.chartPerson{
  display:flex;
  align-items:flex-end;
  gap:4px;
  font-family:Georgia,serif;
  font-size:10px;
  line-height:1.65;
}

.chartPersonName{
  white-space:nowrap;
}

.chartDots{
  flex:1;
  height:10px;
  border-bottom:1px dotted #777;
}

.chartTable{
  min-width:18px;
  text-align:right;
}


/* =====================================================
VENUE EXPORT
===================================================== */

.venueExport{
  width:1600px;
  height:1000px;
  position:relative;
  background:#fff;
  overflow:hidden;
}

.venueExportBg{
  position:absolute;
  inset:0;
  background:#fff center/contain no-repeat;
}

.exportVenueObject{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:16px;
  font-weight:800;
  border:2px solid #444;
  background:#fff;
}

.exportVenueObject.djbox{
  background:#222;
  color:#fff;
}

.exportTable{
  position:absolute;
  width:76px;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #222;
  border-radius:50%;
  background:#fff;
  font-size:13px;
  font-weight:900;
}


/* =====================================================
EXPORT MODE
===================================================== */

.chart.exportMode{
  width:1500px!important;
  min-height:2100px!important;
  padding:95px!important;
  border:0!important;
}

.chart.exportMode .chartWelcome{
  font-size:96px;
}

.chart.exportMode .chartNames{
  font-size:42px;
}

.chart.exportMode .chartFind{
  font-size:38px;
}

.chart.exportMode .chartLetter{
  font-size:32px;
}

.chart.exportMode .chartPerson{
  font-size:15px;
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:800px){

  .saveState{
    display:none;
  }

  .topbar{
    height:54px;
  }

  .progressBar{
    height:42px;
    justify-content:flex-start;
  }

  .app{
    height:calc(100vh - 96px);
    grid-template-columns:52px 1fr;
  }

  .rail button{
    height:48px;
  }

  .toolStrip{
    min-height:57px;
  }

  .toolActions button{
    padding:7px 8px;
    font-size:9px;
  }

  .toolItem{
    min-width:70px;
    height:42px;
  }

  .canvasArea{
    padding:4px;
  }

  .canvas{
    border-radius:11px;
  }

  .sheet{
    top:96px;
    left:52px;
    width:auto;
    border-left:0;
    box-shadow:none;
  }

  .popover{
    top:104px;
    left:60px;
    width:calc(100vw - 70px);
  }

  .table{
    width:72px;
    height:72px;
  }

  .tableCore{
    width:42px;
    height:42px;
  }

  .tableCore b,
  .tableCore span{
    font-size:7px;
  }

  .chartControls{
    grid-template-columns:1fr;
  }

  .chart{
    padding:22px;
    min-height:700px;
  }

  .chartWelcome{
    font-size:44px;
  }

  .chartColumns{
    columns:2;
  }

  .voicePreviewRow{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>

<body>

<header class="topbar">

  <div class="logo">
    seat<span>ly</span>
  </div>

  <div class="topRight">

    <span
      id="saveState"
      class="saveState">
      Saved ✓
    </span>

    <button
      id="undoBtn"
      class="secondary"
      onclick="undo()">
      ↶
    </button>

    <button
      id="redoBtn"
      class="secondary"
      onclick="redo()">
      ↷
    </button>

  </div>

</header>


<div class="progressBar">

  <button
    id="progress1"
    class="progressBtn"
    onclick="goStep(1)">
    1 Venue
  </button>

  <button
    id="progress2"
    class="progressBtn"
    onclick="goStep(2)">
    2 Tables
  </button>

  <button
    id="progress3"
    class="progressBtn"
    onclick="goStep(3)">
    3 Guests
  </button>

  <button
    id="progress4"
    class="progressBtn"
    onclick="goStep(4)">
    4 Review
  </button>

  <button
    id="progress5"
    class="progressBtn"
    onclick="goStep(5)">
    5 Download
  </button>

</div>


<div class="app">

<nav class="rail">

  <button
    id="rail1"
    onclick="goStep(1)">
    <b>▧</b>
    Venue
  </button>

  <button
    id="rail2"
    onclick="goStep(2)">
    <b>◉</b>
    Tables
  </button>

  <button
    id="rail3"
    onclick="goStep(3)">
    <b>♙</b>
    Guests
  </button>

  <button
    id="rail4"
    onclick="goStep(4)">
    <b>✓</b>
    Review
  </button>

  <button
    id="rail5"
    onclick="goStep(5)">
    <b>↓</b>
    Download
  </button>

/* =====================================================
UTIL
===================================================== */

function uid(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){
    return crypto.randomUUID();
  }

  return String(
    Date.now()+Math.random()
  );

}

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}

function pctX(px){

  return(
    px/
    Math.max(
      canvas.clientWidth,
      1
    )
  )*100;

}

function pctY(px){

  return(
    px/
    Math.max(
      canvas.clientHeight,
      1
    )
  )*100;

}

function pxX(percent){

  return(
    Number(percent||0)/100

}

function pxY(percent){

  return(
    Number(percent||0)/100

}


/* =====================================================

===================================================== */

function save(){

    localStorage.setItem(

      'error'

    return true;

  }catch(error){

      'error'
    );

    return false;

  }

}


/* =====================================================

function snapshot(){

    undoStack.length>80

    undoStack.shift();

  redoStack=[];

  updateUndo();

}

    snapshot()

  JSON.parse(
    undoStack.pop()

}

  );

    redoStack.pop()
  );

  selected=null;

  renderAll();

  save();

  updateUndo();

      refreshVisibleUI();

      save();

/* =====================================================
MIGRATION
===================================================== */

function migrateOldCoordinates(){

  const w=
  canvas.clientWidth||1;

  const h=
  canvas.clientHeight||1;


  S.objects.forEach(
    object=>{

      if(
        object.xPct===undefined
      ){

        object.xPct=
        clamp(
          Number(object.x||0)
          /
          w
          *
          100,
          0,
          95
        );

      }

      if(
        object.yPct===undefined
      ){

        object.yPct=
        clamp(
          Number(object.y||0)
          /
          h
          *
          100,
          0,
          95
        );

      }

      if(
        object.widthPct===undefined
      ){

        object.widthPct=
        clamp(
          Number(object.width||140)
          /
          w
          *
          100,
          6,
          60
        );

      }

      if(
        object.heightPct===undefined
      ){

        object.heightPct=
        clamp(
          Number(object.height||70)
          /
          h
          *
          100,
          5,
          60
        );

      }

      if(
        object.locked===undefined
      ){

        object.locked=
        Boolean(
          S.venueLocked
        );

      }

    }
  );


  S.tables.forEach(
    table=>{

      if(
        table.xPct===undefined
      ){

        table.xPct=
        clamp(
          Number(table.x||0)
          /
          w
          *
          100,
          0,
          95
        );

      }

      if(
        table.yPct===undefined
      ){

        table.yPct=
        clamp(
          Number(table.y||0)
          /
          h
          *
          100,
          0,
          95
        );

      }

      if(
        table.locked===undefined
      ){

        table.locked=
        Boolean(
          S.tablesLocked
        );

      }

    }
  );

}

/* =====================================================
PALETTE DRAG
===================================================== */

function beginPaletteDrag(
  event,
  type
){

  event.preventDefault();

  const startX=
  event.clientX;

  const startY=
  event.clientY;

  let moved=false;

  let ghost=null;


  const move=
  eventMove=>{

    const distance=
    Math.hypot(
      eventMove.clientX-startX,
      eventMove.clientY-startY
    );


    if(
      distance>8
      &&
      !moved
    ){

      moved=true;

      ghost=
      document.createElement(
        'div'
      );

      ghost.className=
      'dragGhost';

      ghost.textContent=
      paletteLabel(type);

      document.body.appendChild(
        ghost
      );

    }


    if(
      moved
      &&
      ghost
    ){

      ghost.style.left=
      eventMove.clientX+'px';

      ghost.style.top=
      eventMove.clientY+'px';


      const rect=
      canvas.getBoundingClientRect();

      const inside=

      eventMove.clientX>=rect.left
      &&
      eventMove.clientX<=rect.right
      &&
      eventMove.clientY>=rect.top
      &&
      eventMove.clientY<=rect.bottom;


      dropHint
      .classList
      .toggle(
        'active',
        inside
      );

    }

  };


  const up=
  eventUp=>{

    document.removeEventListener(
      'pointermove',
      move
    );

    document.removeEventListener(
      'pointerup',
      up
    );


    dropHint.classList.remove(
      'active'
    );


    if(
      ghost
    ){
      ghost.remove();
    }


    if(
      moved
    ){

      const rect=
      canvas.getBoundingClientRect();

      const inside=

      eventUp.clientX>=rect.left
      &&
      eventUp.clientX<=rect.right
      &&
      eventUp.clientY>=rect.top
      &&
      eventUp.clientY<=rect.bottom;


      if(inside){

        addPaletteItemAt(
          type,
          eventUp.clientX-rect.left,
          eventUp.clientY-rect.top
        );

      }

    }else{

      addPaletteItemAt(
        type,
        canvas.clientWidth/2,
        canvas.clientHeight/2
      );

    }

  };


  document.addEventListener(
    'pointermove',
    move,
    {
      passive:false
    }
  );


  document.addEventListener(
    'pointerup',
    up,
    {
      once:true
    }
  );

}

function paletteLabel(type){

  const labels={

    dancefloor:'Dance Floor',

    djbox:'DJ Box',

    bar:'Bar',

    entrance:'Entrance',

    table8:'8 Seat Table',

    table10:'10 Seat Table',

    table12:'12 Seat Table',

    table16:'16 Seat Table'

  };

  return labels[type]||type;

}

function addPaletteItemAt(
  type,
  x,
  y
){

  if(
    type.startsWith('table')
  ){

    const seats=
    Number(
      type.replace(
        'table',
        ''
      )
    );

    addTableAt(
      seats,
      x,
      y
    );

    return;

  }


  const configs={

    dancefloor:{
      label:'Dance Floor',
      type:'dancefloor',
      widthPct:28,
      heightPct:20
    },

    djbox:{
      label:'DJ Box',
      type:'djbox',
      widthPct:15,
      heightPct:7
    },

    bar:{

$('venueUpload')

  'change',
  event=>{

    event.target.files[0];

      file,
      1800,
      .82
    )

    .then(
      image=>{

        remember();

        S.venueImage=
        image;

        renderAll();

        if(
          !save()
        ){

          toast(
            'Image too large to save'
          );

        }

    )

    .catch(

        toast(
          'Could not open image'
        );

      }
    );


    event.target.value='';

  }
);

function compressImage(
  file,
  maxDimension,
  quality
){

  return new Promise(
    (resolve,reject)=>{

      const reader=
      new FileReader();


      reader.onload=
      event=>{

        const image=
        new Image();


        image.onload=
        ()=>{

          let width=
          image.width;

          let height=
          image.height;


          const largest=
          Math.max(
            width,
            height
          );


          if(
            largest>
            maxDimension
          ){

            const ratio=
            maxDimension/
            largest;

            width=
            Math.round(
              width*
              ratio
            );

            height=
            Math.round(
              height*
              ratio
            );

          }


          const c=
          document.createElement(
            'canvas'
          );

          c.width=
          width;

          c.height=
          height;


          c.getContext('2d')
          .drawImage(
            image,
            0,
            0,
            width,
            height
          );


          resolve(
            c.toDataURL(
              'image/jpeg',
              quality
            )
          );

        };


        image.onerror=
        reject;


        image.src=
        event.target.result;

      };


      reader.onerror=
      reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

function createResponsiveGrid(
  quantity,
  seats
){

  const rect=
  canvas.getBoundingClientRect();


  let scale=.74;

  if(quantity>=10)scale=.64;
  if(quantity>=18)scale=.55;
  if(quantity>=28)scale=.46;
  if(quantity>=38)scale=.39;


  const base=
  (
    isMobile()
    ?72
    :82
  )
  *
  scale;


  const gap=12;


  let columns=
  Math.max(
    1,
    Math.floor(
      (
        rect.width-20
      )
      /
      (
        base+gap
      )
    )
  );


  columns=
  Math.min(
    columns,
    quantity
  );


  let rows=
  Math.ceil(
    quantity/
    columns
  );


  while(
    rows*
    (base+gap)
    >
    rect.height-70
    &&
    columns<quantity
  ){

    columns++;

    rows=
    Math.ceil(
      quantity/
      columns
    );

  }


  const totalWidth=
  (columns-1)*
  (base+gap);


  const totalHeight=
  (rows-1)*
  (base+gap);


  const startX=
  Math.max(
    8,
    rect.width/2
    -
    totalWidth/2
    -
    base/2
  );


  const startY=
  Math.max(
    35,
    rect.height/2
    -
    totalHeight/2
    -
    base/2
  );


  for(
    let i=0;
    i<quantity;
    i++
  ){

    const column=
    i%
    columns;


    const row=
    Math.floor(
      i/
      columns
    );


    S.tables.push({

      id:uid(),

      number:
      nextTableNumber(),

      seats,

      scale,

      xPct:
      pctX(
        startX+
        column*
        (base+gap)
      ),

      yPct:
      pctY(
        startY+
        row*
        (base+gap)
      ),

      locked:false

    });

  }

}

  .remove('open');

/* =====================================================
OBJECT/TABLE CANVAS DRAG
===================================================== */

function attachCanvasDrag(
  element,
  item,
  kind
){

  let startX=0;

  let startY=0;

  let originalX=0;

  let originalY=0;

  let before='';

  let active=false;


  element.addEventListener(
    'pointerdown',
    event=>{

      event.preventDefault();

      event.stopPropagation();


      selected={
        kind,
        id:item.id
      };


      renderToolbar();


      if(
        item.locked
      ){

        renderAll();

        renderToolbar();

        return;

      }


      startX=
      event.clientX;

      startY=
      event.clientY;


      originalX=
      pxX(
        item.xPct
      );


      originalY=
      pxY(
        item.yPct
      );


      before=
      snapshot();

      active=true;


      trash.style.display=
      'block';


      try{

        element.setPointerCapture(
          event.pointerId
        );

      }catch(error){}

    }
  );


  element.addEventListener(
    'pointermove',
    event=>{

      if(!active)return;


      event.preventDefault();


      const canvasRect=
      canvas.getBoundingClientRect();


      let width=
      element.offsetWidth;


      let height=
      element.offsetHeight;


      if(
        kind==='table'
      ){

        const scale=
        Number(
          item.scale||1
        );

        width*=
        scale;

        height*=
        scale;

      }


      let x=

      originalX
      +
      event.clientX
      -
      startX;


      let y=

      originalY
      +
      event.clientY
      -
      startY;


      x=
      clamp(
        x,
        0,
        Math.max(
          0,
          canvasRect.width-
          width
        )
      );


      y=
      clamp(
        y,
        0,
        Math.max(
          0,
          canvasRect.height-
          height
        )
      );


      item.xPct=
      pctX(x);


      item.yPct=
      pctY(y);


      element.style.left=
      item.xPct+'%';


      element.style.top=
      item.yPct+'%';


      const bin=
      trash.getBoundingClientRect();


      const over=

      event.clientX>=bin.left
      &&
      event.clientX<=bin.right
      &&
      event.clientY>=bin.top
      &&
      event.clientY<=bin.bottom;


      trash.classList.toggle(
        'hot',
        over
      );

    }
  );


  element.addEventListener(
    'pointerup',
    event=>{

      if(!active)return;


      active=false;


      try{

        element.releasePointerCapture(
          event.pointerId
        );

      }catch(error){}


      const remove=
      trash.classList.contains(
        'hot'
      );


      trash.style.display=
      'none';


      trash.classList.remove(
        'hot'
      );


      if(remove){

        undoStack.push(
          before
        );

        redoStack=[];


        if(
          kind==='object'
        ){

          S.objects=
          S.objects.filter(
            object=>
            object.id!==item.id
          );

        }else{

          S.tables=
          S.tables.filter(
            table=>
            table.id!==item.id
          );


          S.guests.forEach(
            guest=>{

              if(
                guest.tableId===item.id
              ){

                guest.tableId=null;

              }

            }
          );

        }


        selected=null;


        renderAll();

        save();

        renderToolbar();

        updateUndo();

        return;

      }


      if(
        before!==snapshot()
      ){

        undoStack.push(
          before
        );

        redoStack=[];

        save();

        updateUndo();

      }


      renderToolbar();

    }
  );


  element.addEventListener(
    'pointercancel',
    ()=>{

      active=false;

      trash.style.display=
      'none';

      trash.classList.remove(
        'hot'
      );

    }
  );

}

  tableLayer.innerHTML='';


  S.objects.forEach(
    object=>{

      const element=
      document.createElement(
        'div'
      );


      element.className=

      `canvasObj venueObject ${object.type||''}`

      +

      (
        object.locked
        ?' locked'
        :''
      )

      +

      (
        selected?.kind==='object'
        &&
        selected.id===object.id
        ?' selected'
        :''
      );


      element.style.left=
      object.xPct+'%';


      element.style.top=
      object.yPct+'%';


      element.style.width=
      object.widthPct+'%';


      element.style.height=
      object.heightPct+'%';


      element.textContent=
      object.label;


      if(
        currentStep===1
      ){

        attachCanvasDrag(
          element,
          object,
          'object'
        );

      }


      objectLayer.appendChild(
        element
      );

    }
  );


  S.tables.forEach(
    table=>{

      const occupied=
      tableUsedSeats(
        table.id
      );


      const element=
      document.createElement(
        'div'
      );


      element.className=

      'canvasObj table'

      +

      (
        occupied===table.seats
        ?' full'
        :''
      )

      +

      (
        table.locked
        ?' locked'
        :''
      )

      +

      (
        selected?.kind==='table'
        &&
        selected.id===table.id
        ?' selected'
        :''
      );


      element.style.left=
      table.xPct+'%';


      element.style.top=
      table.yPct+'%';


      element.style.transform=
      `scale(${table.scale||1})`;


      createChairs(
        element,
        table.seats
      );


      const core=
      document.createElement(
        'div'
      );


      core.className=
      'tableCore';


      core.innerHTML=`

      <b>
        TABLE ${table.number}
      </b>

      <span>
        ${occupied}/${table.seats}
      </span>

      `;


      element.appendChild(
        core
      );


      if(
        currentStep===2
      ){

        attachCanvasDrag(
          element,
          table,
          'table'
        );

      }


      if(
        currentStep===3
      ){

        element.addEventListener(
          'pointerup',
          event=>{

            event.stopPropagation();

            openTableGuests(
              table.id
            );

          }
        );

      }


      tableLayer.appendChild(
        element
      );

    }

/* =====================================================
CHAIRS
===================================================== */

function createChairs(
  element,
  seats
){

  const count=
  Math.min(
    Number(seats),
    16
  );


  const center=
  isMobile()
  ?36
  :41;


  const radius=
  isMobile()
  ?29
  :34;


  for(
    let i=0;
    i<count;
    i++
  ){

    const angle=

    2*
    Math.PI*
    i/count

    -

    Math.PI/2;


    const chair=
    document.createElement(
      'div'
    );


    chair.className=
    'chair';


    chair.style.left=

    (
      center
      +
      Math.cos(angle)*
      radius
      -
      4.5
    )

    +'px';


    chair.style.top=

    (
      center
      +
      Math.sin(angle)*
      radius
      -
      4.5
    )

    +'px';


    element.appendChild(
      chair
    );

  }

}

function assignGuest(
  id
){

  const guest=
  S.guests.find(
    guest=>
    guest.id===id
  );


  if(!guest)return;


  const answer=
  prompt(
    'Table number'
  );


  if(
    answer===null
  )return;


  const table=
  S.tables.find(
    table=>
    Number(table.number)===
    Number(answer)
  );


  if(!table){

    toast(
      'Table not found'
    );

    return;

  }


  const free=

  table.seats

  -

  tableUsedSeats(
    table.id
  );


  if(
    guest.partySize>free
  ){

    toast(
      'Not enough seats'
    );

    return;

  }


  remember();

  guest.tableId=
  table.id;

  renderAll();

  save();

  renderGuestsSheet();

}

function editGuest(
  id
){

  const guest=
  S.guests.find(
    guest=>
    guest.id===id
  );


  if(!guest)return;


  const surname=
  prompt(
    'Surname',
    guest.surname
  );


  if(
    surname===null
  )return;


  const first=
  prompt(
    'First name',
    guest.firstName
  );


  if(
    first===null
  )return;


  const people=
  prompt(
    'People',
    guest.partySize
  );


  if(
    people===null
  )return;


  const currentTable=
  S.tables.find(
    table=>
    table.id===guest.tableId
  );


  const tableNo=
  prompt(
    'Table number — leave empty for Unassigned',
    currentTable
    ?currentTable.number
    :''
  );


  if(
    tableNo===null
  )return;


  let tableId=null;


  if(
    tableNo.trim()
  ){

    const target=
    S.tables.find(
      table=>
      Number(table.number)===
      Number(tableNo)
    );


    if(!target){

      toast(
        'Table not found'
      );

      return;

    }


    tableId=
    target.id;

  }


  remember();


  guest.surname=
  surname.trim();


  guest.firstName=
  first.trim();


  guest.partySize=
  Math.max(
    1,
    Number(people)||1
  );


  guest.tableId=
  tableId;


  renderAll();

  save();


  if(
    currentGuestTable
  ){

    openTableGuests(
      currentGuestTable
    );

  }else{

    renderGuestsSheet();

  }

}

function deleteGuest(
  id
){

  const guest=
  S.guests.find(
    guest=>
    guest.id===id
  );


  if(!guest)return;


  if(
    !confirm(
      `Delete ${guestFullName(guest)}?`
    )
  )return;


  remember();


  S.guests=
  S.guests.filter(
    guest=>
    guest.id!==id
  );


  renderAll();

  save();


  if(
    currentGuestTable
  ){

    openTableGuests(
      currentGuestTable
    );

  }else{

    renderGuestsSheet();

  }

}

function deleteGuestList(){

  if(
    !S.guests.length
  ){

    toast(
      'Guest list is empty'
    );

    return;

  }


  if(
    !confirm(
      'Delete the entire guest list?'
    )
  )return;


  remember();

  S.guests=[];

  renderAll();

  save();

  renderGuestsSheet();

}

function renderGuestSearch(
  value
){

  const holder=
  $('guestSearchResults');

  if(!holder)return;


  const query=
  normalizeText(
    value
  );


  if(!query){

    holder.innerHTML='';

    return;

  }


  const matches=
  S.guests

  .filter(
    guest=>{

      const table=
      S.tables.find(
        table=>
        table.id===guest.tableId
      );


      return normalizeText(

        guest.surname+
        ' '+
        guest.firstName+
        ' '+
        (
          table
          ?table.number
          :''
        )

      )

      .includes(
        query
      );

    }
  )

  .slice(
    0,
    30
  );


  holder.innerHTML=
  guestRows(
    matches,
    false
  );

}

function toggleVoice(){

  if(
    voiceRecognition
  ){

    voiceRecognition.stop();

    return;

  }


  const Speech=

  window.SpeechRecognition

  ||

  window.webkitSpeechRecognition;


  if(!Speech){

    toast(
      'Voice unavailable'
    );

    return;

  }


  voiceRecognition=
  new Speech();


  voiceRecognition.lang=
  'el-GR';


  voiceRecognition.continuous=
  true;


  voiceRecognition.interimResults=
  false;


  $('voiceButton')
  .textContent=
  '■ Stop Microphone';


  $('voiceStatus')
  .textContent=
  'Listening…';


  $('voiceBox')
  .classList
  .add(
    'listening'
  );


  voiceRecognition.onresult=
  event=>{

    for(
      let i=event.resultIndex;
      i<event.results.length;
      i++
    ){

      parseVoiceLine(
        event.results[i][0].transcript
      );

    }


    renderVoicePreview();

  };


  voiceRecognition.onend=
  ()=>{

    voiceRecognition=null;


    const button=
    $('voiceButton');


    if(button){

      button.textContent=
      '🎙 Start Microphone';

    }


    const box=
    $('voiceBox');


    if(box){

      box.classList.remove(
        'listening'
      );

    }

  };


  voiceRecognition.onerror=
  ()=>{

    toast(
      'Voice recognition error'
    );

  };


  voiceRecognition.start();

}

function parseVoiceLine(
  raw
){

  const text=
  replaceGreekNumbers(
    raw
  );


  const tableMatch=
  text.match(
    /(?:τραπέζι|τραπεζι|table)\s*(\d+)/i
  );


  const peopleMatch=
  text.match(
    /(\d+)\s*(?:άτομα|ατομα|people|persons?)/i
  );


  const tableNumber=
  tableMatch
  ?Number(tableMatch[1])
  :1;


  const partySize=
  peopleMatch
  ?Number(peopleMatch[1])
  :1;


  const clean=
  text

  .replace(
    /(?:τραπέζι|τραπεζι|table)\s*\d+/ig,
    ''
  )

  .replace(
    /\d+\s*(?:άτομα|ατομα|people|persons?)/ig,
    ''
  )

  .replace(
    /[,.;]+/g,
    ' '
  )

  .trim();


  const names=
  clean
  .split(/\s+/)
  .filter(Boolean);


  if(
    !names.length
  )return;


  voiceDraft.push({

    surname:
    names[0],

    firstName:
    names
    .slice(1)
    .join(' '),

    partySize,

    tableNumber

  });

}

function replaceGreekNumbers(
  text
){

  const map={

    ενα:1,
    μια:1,
    δυο:2,
    τρεις:3,
    τρια:3,
    τεσσερα:4,
    πεντε:5,
    εξι:6,
    επτα:7,
    εφτα:7,
    οκτω:8,
    οχτω:8,
    εννεα:9,
    δεκα:10

  };


  return text.replace(

    /\b(ένα|ενα|μια|μία|δύο|δυο|τρεις|τρία|τρια|τέσσερα|τεσσερα|πέντε|πεντε|έξι|εξι|επτά|εφτά|επτα|εφτα|οκτώ|οχτώ|οκτω|οχτω|εννέα|εννεα|δέκα|δεκα)\b/gi,

    match=>
    String(
      map[
        normalizeBasic(
          match
        )
      ]
      ||
      match
    )

  );

}

function renderVoicePreview(){

  const holder=
  $('voicePreview');

  if(!holder)return;


  if(
    !voiceDraft.length
  ){

    holder.innerHTML='';

    return;

  }


  holder.innerHTML=

  voiceDraft

  .map(
    (guest,index)=>`

    <div class="voicePreviewRow">

      <input
        value="${safeAttribute(guest.surname)}"
        onchange="
          voiceDraft[${index}].surname=this.value">

      <input
        value="${safeAttribute(guest.firstName)}"
        onchange="
          voiceDraft[${index}].firstName=this.value">

      <input
        type="number"
        min="1"
        value="${guest.partySize}"
        onchange="
          voiceDraft[${index}].partySize=Math.max(1,+this.value||1)">

      <input
        type="number"
        min="1"
        value="${guest.tableNumber}"
        onchange="
          voiceDraft[${index}].tableNumber=Math.max(1,+this.value||1)">

      <button
        class="danger"
        onclick="
          voiceDraft.splice(${index},1);
          renderVoicePreview()">

        ×

      </button>

    </div>

    `
  )

  .join('')

  +

  `

  <button
    class="wide"
    onclick="saveVoiceGuests()">

    Add All Guests

  </button>

  `;

}

function saveVoiceGuests(){

  if(
    !voiceDraft.length
  )return;


  for(
    const guest of voiceDraft
  ){

    const table=
    S.tables.find(
      table=>
      Number(table.number)===
      Number(guest.tableNumber)
    );


    if(!table){

      toast(
        `Table ${guest.tableNumber} not found`
      );

      return;

    }

  }


  remember();


  voiceDraft.forEach(
    guest=>{

      const table=
      S.tables.find(
        table=>
        Number(table.number)===
        Number(guest.tableNumber)
      );


      S.guests.push({

        id:uid(),

        surname:
        guest.surname.trim(),

        firstName:
        guest.firstName.trim(),

        partySize:
        Number(
          guest.partySize||1
        ),

        tableId:
        table.id

      });

    }
  );


  voiceDraft=[];


  renderAll();

  save();

  renderGuestsSheet();

}

  new Blob(
    [
      JSON.stringify(
        S,
        null,

$('backupRestore')
.addEventListener(
  'change',
  event=>{

    const file=
    event.target.files[0];

    if(!file)return;


    const reader=
    new FileReader();


    reader.onload=
    ()=>{

      try{

        const data=
        JSON.parse(
          reader.result
        );


        if(
          !Array.isArray(data.tables)
          ||
          !Array.isArray(data.guests)
        ){

          throw new Error();

        }


        remember();


        S={
          ...S,
          ...data,
          version:50
        };


        migrateOldCoordinates();

        applyVenue();

        renderAll();

        save();

        toast(
          'Backup restored'
        );


        renderMoreSheet();

      }catch(error){

        toast(
          'Invalid Seatly backup'
        );

      }

    };


    reader.readAsText(
      file
    );


    event.target.value='';

  }
);

function stats(){

  const seats=
  S.tables.reduce(
    (sum,table)=>
    sum+
    Number(table.seats||0),
    0
  );


  const people=
  S.guests.reduce(
    (sum,guest)=>
    sum+
    Number(guest.partySize||1),
    0
  );


  const seated=
  S.guests

  .filter(
    guest=>
    guest.tableId
  )

  .reduce(
    (sum,guest)=>
    sum+
    Number(guest.partySize||1),
    0
  );


  return{

    tables:
    S.tables.length,

    seats,

    people,

    seated,

    unassigned:
    people-
    seated,

    free:
    Math.max(
      0,
      seats-
      seated
    )

  };

}

  const s=
  stats();


  $('status')
  .textContent=

  `${s.tables} tables · ${s.seated}/${s.people} people · ${s.free} free`;

}


/* =====================================================
ALPHABET
===================================================== */

function normalizeBasic(
  text
){

  return String(
    text||''
  )

  .normalize('NFD')

  .replace(
    /[\u0300-\u036f]/g,
    ''
  )

  .toLocaleLowerCase(
    'el-GR'
  )

  .trim();

}

function normalizeText(
  text
){

  return normalizeBasic(
    text
  )

  .toLocaleUpperCase(
    'el-GR'
  );

}

const greekAlphabet=[

  'Α','Β','Γ','Δ',
  'Ε','Ζ','Η','Θ',
  'Ι','Κ','Λ','Μ',
  'Ν','Ξ','Ο','Π',
  'Ρ','Σ','Τ','Υ',
  'Φ','Χ','Ψ','Ω'

];

function alphabetLetter(
  surname
){

  const clean=
  normalizeText(
    surname
  );


  return clean
  ?clean.charAt(0)
  :'#';

}

function compareLetters(
  a,
  b
){

  const ai=
  greekAlphabet.indexOf(a);


  const bi=
  greekAlphabet.indexOf(b);


  if(
    ai>=0
    &&
    bi>=0
  )return ai-bi;


  if(ai>=0)return-1;

  if(bi>=0)return 1;


  return a.localeCompare(
    b,
    'el'
  );

}

function compareGuests(
  a,
  b
){

  const surname=

  normalizeText(
    a.surname
  )

  .localeCompare(
    normalizeText(
      b.surname
    ),
    'el'
  );


  if(
    surname!==0
  )return surname;


  return normalizeText(
    a.firstName
  )

  .localeCompare(
    normalizeText(
      b.firstName
    ),
    'el'
  );

}

function tableUsedSeats(
  tableId
){

  return S.guests

  .filter(
    guest=>
    guest.tableId===tableId
  )

  .reduce(
    (sum,guest)=>
    sum+
    Number(
      guest.partySize||1
    ),
    0
  );

}

function possibleDuplicate(
  surname,
  firstName
){

  const target=
  normalizeText(
    surname+
    ' '+
    firstName
  );


  return S.guests.some(
    guest=>

    normalizeText(
      guest.surname+
      ' '+
      guest.firstName
    )

    ===

    target

  );

}


/* =====================================================
CHART
===================================================== */

function openChart(){

  $('chartOverlay')
  .classList
  .add('open');


  $('chartCouple').value=
  S.chart.couple||'';


  $('chartDate').value=
  S.chart.date||'';


  $('chartWelcome').value=
  S.chart.welcome||
  'Welcome';

  S.chart.find||

  String(
    S.chart.columns||4
  );


  renderChart();

}

function closeChart(){

  $('chartOverlay')
  .classList
  .remove('open');

}

function renderChart(){

  S.chart={

    couple:
    $('chartCouple')?.value||'',

    date:
    $('chartDate')?.value||'',

    welcome:
    $('chartWelcome')?.value||
    'Welcome',

    find:
    $('chartFind')?.value||
    'Please find your seat',

    columns:
    Number(
      $('chartColumns')?.value||4
    )

  };


  save();


  const guests=
  S.guests

  .filter(
    guest=>
    guest.tableId
  )

  .slice()

  .sort(
    compareGuests
  );


  const groups={};


  guests.forEach(
    guest=>{

      const letter=
      alphabetLetter(
        guest.surname
      );


      if(
        !groups[letter]
      ){

        groups[letter]=[];

      }


      groups[letter]
      .push(
        guest
      );

    }
  );


  const letters=
  Object.keys(
    groups
  )

  .sort(
    compareLetters
  );


  const list=

  letters.length

  ?letters

  .map(
    letter=>`

    <div class="chartGroup">

      <div class="chartLetter">

        ${safe(letter)}

      </div>

      ${
        groups[letter]

        .map(
          guest=>{

            const table=
            S.tables.find(
              table=>
              table.id===guest.tableId
            );


            return`

            <div class="chartPerson">

              <span class="chartPersonName">

                ${safe(
                  guestFullName(
                    guest
                  )
                )}

                ${
                  guest.partySize>1
                  ?` (${guest.partySize})`
                  :''
                }

              </span>

              <span class="chartDots"></span>

              <span class="chartTable">

                ${
                  table
                  ?table.number
                  :'—'
                }

              </span>

            </div>

            `;

          }
        )

        .join('')
      }

    </div>

    `
  )

  .join('')

  :`

  <div
    style="
      text-align:center;
      margin-top:80px">

    No guests assigned yet.

  </div>

  `;


  $('chart')
  .innerHTML=`

  <div class="chartWelcome">

    ${safe(
      S.chart.welcome
    )}

  </div>

  <div class="chartSmall">
    TO THE WEDDING OF
  </div>

  <div class="chartNames">

    ${safe(
      S.chart.couple||
      'YOUR NAMES'
    )}

  </div>

  <div class="chartDate">

    ${safe(
      S.chart.date
    )}

  </div>

  <div class="chartFind">

    ${safe(
      S.chart.find
    )}

  </div>

  <div
    class="chartColumns"
    style="
      columns:${S.chart.columns}">

    ${list}

  </div>

  `;

}

async function downloadChartPDF(){

  renderChart();


  const element=
  $('chart');


  element.classList.add(
    'exportMode'
  );


  try{

    const output=
    await html2canvas(
      element,
      {
        scale:2,
        backgroundColor:'#fff',
        useCORS:true
      }
    );


    const image=
    output.toDataURL(
      'image/jpeg',
      .97
    );


    const{
      jsPDF
    }=
    window.jspdf;


    const pdf=
    new jsPDF({

      orientation:'portrait',

      unit:'mm',

      format:'a2'

    });


    const pageWidth=
    pdf.internal
    .pageSize
    .getWidth();


    const pageHeight=
    pdf.internal
    .pageSize
    .getHeight();


    const ratio=
    output.width/
    output.height;


    let width=
    pageWidth;


    let height=
    width/
    ratio;


    if(
      height>
      pageHeight
    ){

      height=
      pageHeight;

      width=
      height*
      ratio;

    }


    pdf.addImage(

      image,

      'JPEG',

      (
        pageWidth-
        width
      )/2,

      0,

      width,

      height

    );


    pdf.save(
      'seatly-alphabetical-chart.pdf'
    );

  }catch(error){

    toast(
      'PDF download failed'
    );

  }


  element.classList.remove(
    'exportMode'
  );

}

/* =====================================================
GENERAL
===================================================== */

function guestFullName(
  guest
){

  return[

    guest.surname||'',

    guest.firstName||''

  ]

  .filter(Boolean)

  .join(' ');

}

function safe(
  text
){

  const element=
  document.createElement(
    'div'
  );


  element.textContent=
  text||'';


  return element.innerHTML;

}

function safeAttribute(
  text
){

  return String(
    text||''
  )

  .replace(/&/g,'&amp;')

  .replace(/"/g,'&quot;')

  .replace(/</g,'&lt;')

  .replace(/>/g,'&gt;');

}

function downloadBlob(
  blob,
  name
){

  const url=
  URL.createObjectURL(
    blob
  );


  const link=
  document.createElement(
    'a'
  );


  link.href=
  url;


  link.download=
  name;


  link.click();


  setTimeout(
    ()=>{

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}

function toast(
  message
){

  const element=
  $('toast');


  element.textContent=
  message;


  element.style.display=
  'block';


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer=
  setTimeout(
    ()=>{

      element.style.display=
      'none';

    },
    1800
  );

}
