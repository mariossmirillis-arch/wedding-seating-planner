<!doctype html>
<html lang="el">

<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seatly 4.0</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#f5f3ef;
  --paper:#ffffff;
  --ink:#202020;
  --muted:#777;
  --line:#e5dfd7;
  --soft:#f1ede8;
  --green:#dff3e4;
  --greenBorder:#34784a;
  --danger:#a43a32;
}

html,
body{
  margin:0;
  height:100%;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--ink);
}

body{
  overflow:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  border-radius:10px;
  padding:9px 11px;
  background:var(--ink);
  color:white;
  font-weight:700;
  cursor:pointer;
}

button.secondary{
  background:white;
  color:var(--ink);
  border:1px solid var(--line);
}

button.soft{
  background:var(--soft);
  color:var(--ink);
}

button.danger{
  background:var(--danger);
}

button:disabled{
  opacity:.4;
}

/* TOP BAR */

.topbar{
  height:58px;
  background:white;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:relative;
  z-index:100;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  font-weight:400;
}

.topActions{
  display:flex;
  gap:6px;
}

/* APP */

.app{
  height:calc(100vh - 58px);
  display:grid;
  grid-template-columns:
    66px
    265px
    1fr;
}

/* LEFT TOOLBAR */

.rail{
  background:#202020;
  padding:7px 4px;
  display:flex;
  flex-direction:column;
  gap:5px;
  z-index:80;
}

.rail button{
  height:56px;
  background:transparent;
  padding:4px;
  font-size:9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.rail button b{
  font-size:17px;
}

.rail button.active{
  background:white;
  color:#202020;
}

/* SIDE PANEL */

.panel{
  background:white;
  border-right:1px solid var(--line);
  padding:14px;
  overflow:auto;
  position:relative;
  z-index:70;
}

.panel h2{
  font-size:18px;
  margin:0 0 4px;
}

.panel h3{
  font-size:14px;
  margin:0 0 8px;
}

.hint{
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
  margin-bottom:12px;
}

.section{
  border-top:1px solid #eee8e1;
  padding-top:11px;
  margin-top:11px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.field{
  width:100%;
  padding:10px;
  border:1px solid #d8d1c9;
  border-radius:10px;
  background:white;
}

.upload{
  display:block;
  text-align:center;
  padding:18px 10px;
  border:1.5px dashed #bbb;
  border-radius:13px;
  background:#faf9f7;
  cursor:pointer;
}

.upload input{
  display:none;
}

.panelClose{
  display:none;
}

/* WORKSPACE */

.work{
  padding:8px;
  background:#ebe8e3;
  min-width:0;
}

/*
  FIXED CANVAS
  No zoom.
  No pan.
*/
.canvas{
  width:100%;
  height:100%;
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  position:relative;
  overflow:hidden;
  touch-action:none;
  box-shadow:0 10px 28px rgba(0,0,0,.05);
}

.venueBackground{
  position:absolute;
  inset:0;
  background:white center/contain no-repeat;
  pointer-events:none;
}

.objectLayer{
  position:absolute;
  inset:0;
}

.empty{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  color:#999;
  pointer-events:none;
}

/* OBJECTS */

.obj{
  position:absolute;
  touch-action:none;
  user-select:none;
}

/* TABLE */

.table{
  width:102px;
  height:102px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
}

.table.selected{
  outline:3px solid rgba(32,32,32,.18);
  outline-offset:4px;
}

.tableCore{
  width:62px;
  height:62px;
  border:2px solid #222;
  border-radius:50%;
  background:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.14);
  z-index:2;
}

.tableCore b{
  font-size:10px;
}

.tableCore span{
  font-size:9px;
  color:#666;
  margin-top:2px;
}

.table.complete .tableCore{
  background:var(--green);
  border-color:var(--greenBorder);
}

.chair{
  position:absolute;
  width:12px;
  height:12px;
  border:1.3px solid #555;
  background:white;
  border-radius:3px;
}

/* VENUE OBJECT */

.venueObj{
  border:2px dashed #666;
  background:rgba(255,255,255,.9);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:800;
  cursor:grab;
}

.venueObj.selected{
  outline:3px solid rgba(32,32,32,.18);
  outline-offset:4px;
}

/* CONTEXT TOOLBAR */

.context{
  position:absolute;
  left:50%;
  top:10px;
  transform:translateX(-50%);
  display:none;
  align-items:center;
  gap:5px;
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:6px;
  z-index:35;
  box-shadow:0 8px 24px rgba(0,0,0,.14);
}

.context input,
.context select{
  width:67px;
  padding:6px;
  border:1px solid var(--line);
  border-radius:8px;
}

.context button{
  padding:6px 8px;
}

/* TRASH */

.trash{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:none;
  background:white;
  border:2px solid var(--line);
  border-radius:999px;
  padding:9px 15px;
  z-index:40;
  font-size:12px;
  font-weight:800;
}

.trash.hot{
  background:#ffe7e3;
  border-color:#b23b30;
}

/* STATUS */

.status{
  position:absolute;
  left:10px;
  bottom:10px;
  background:white;
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
  color:#666;
  z-index:25;
}

/* TABLE GUEST PANEL */

.guestPanel{
  position:fixed;
  top:58px;
  right:0;
  bottom:0;
  width:350px;
  background:white;
  border-left:1px solid var(--line);
  box-shadow:-10px 0 30px rgba(0,0,0,.12);
  z-index:95;
  display:none;
  padding:16px;
  overflow:auto;
}

.guestPanel.open{
  display:block;
}

.guestHeader{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.guestTitle{
  font-size:21px;
  font-weight:850;
}

.guestCount{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.guestForm{
  background:#faf9f7;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}

.formLabel{
  font-size:11px;
  font-weight:750;
  color:#666;
  margin-bottom:5px;
}

.formRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.partyRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:6px;
  margin-top:6px;
}

.partyRow input{
  min-width:0;
}

.guestListTitle{
  font-size:13px;
  font-weight:800;
  margin:15px 0 5px;
}

.guestRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.guestName{
  font-size:13px;
  font-weight:700;
}

.guestMeta{
  font-size:11px;
  color:#777;
  margin-top:2px;
}

.guestActions{
  display:flex;
  gap:4px;
}

.guestActions button{
  padding:5px 7px;
  font-size:10px;
}

/* TABLE LISTS */

.tableCard{
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px;
  margin-bottom:9px;
  background:#faf9f7;
}

.tableCardHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.tableCardHeader strong{
  font-size:14px;
}

.tableCardMeta{
  font-size:11px;
  color:#777;
  margin-top:2px;
}

.listGuest{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  align-items:center;
  padding:7px 0;
  border-top:1px solid #eee;
}

.listGuestName{
  font-size:12px;
  font-weight:650;
}

.listGuestMeta{
  font-size:10px;
  color:#777;
}

.listActions{
  display:flex;
  gap:4px;
}

.listActions button{
  padding:5px 6px;
  font-size:10px;
}

/* PREVIEW */

.previewOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:200;
}

.previewOverlay.open{
  display:flex;
}

.previewCard{
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
}

.previewTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.previewTitle{
  font-size:24px;
  font-weight:900;
}

.letterBlock{
  margin-bottom:18px;
}

.letterTitle{
  font-size:22px;
  font-weight:900;
  border-bottom:2px solid #222;
  padding-bottom:5px;
  margin-bottom:5px;
}

.previewGuest{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:12px;
  padding:7px 0;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.previewGuest strong{
  font-weight:700;
}

.previewGuest span{
  color:#555;
}

/* MOBILE */

@media(max-width:800px){

  .topbar{
    height:54px;
  }

  .topActions .desktopOnly{
    display:none;
  }

  .app{
    height:calc(100vh - 54px);
    grid-template-columns:
      56px
      1fr;
  }

  .rail{
    padding:5px 3px;
  }

  .rail button{
    height:50px;
  }

  .work{
    grid-column:2;
    padding:4px;
  }

  .panel{
    position:fixed;
    left:56px;
    right:0;
    bottom:0;
    top:auto;
    width:auto;
    max-height:48vh;
    display:none;
    border-right:0;
    border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    padding:48px 13px 13px;
    box-shadow:0 -10px 30px rgba(0,0,0,.18);
    z-index:90;
  }

  .panel.open{
    display:block;
  }

  .panelClose{
    display:block;
    position:absolute;
    right:10px;
    top:8px;
    width:34px;
    height:34px;
    padding:0;
    border-radius:50%;
    background:var(--soft);
    color:#222;
    border:1px solid var(--line);
    font-size:20px;
  }

  .context{
    max-width:94%;
    overflow:auto;
    white-space:nowrap;
  }

  .guestPanel{
    top:54px;
    left:56px;
    right:0;
    bottom:0;
    width:auto;
    border-left:0;
    box-shadow:none;
    padding:14px;
  }

  .previewCard{
    padding:15px;
  }

  .previewGuest{
    grid-template-columns:1fr;
    gap:2px;
  }

}

</style>
</head>

<body>

<header class="topbar">

  <div class="logo">
    seat<span>ly</span>
  </div>

  <div class="topActions">

    <button
    class="secondary desktopOnly"
    id="undoButton"
    onclick="undo()">
      ↶ Undo
    </button>

    <button
    class="secondary desktopOnly"
    id="redoButton"
    onclick="redo()">
      ↷ Redo
    </button>

    <button onclick="toast('Finish / Export θα προστεθεί μετά')">
      Finish
    </button>

  </div>

</header>


<div class="app">

<nav class="rail">

  <button
  id="navVenue"
  onclick="togglePanel('venue')">
    <b>▧</b>
    Venue
  </button>

  <button
  id="navTables"
  onclick="togglePanel('tables')">
    <b>◉</b>
    Tables
  </button>

  <button
  id="navObjects"
  onclick="togglePanel('objects')">
    <b>◇</b>
    Objects
  </button>

  <button
  id="navLists"
  onclick="togglePanel('lists')">
    <b>☷</b>
    Lists
  </button>

  <button
  id="navMore"
  onclick="togglePanel('more')">
    <b>•••</b>
    More
  </button>

</nav>


<aside
class="panel"
id="panel">

  <button
  class="panelClose"
  onclick="closePanel()">
    ×
  </button>

  <div id="panelContent"></div>

</aside>


<main class="work">

<div
class="canvas"
id="canvas">

  <div
  class="venueBackground"
  id="venueBackground">
  </div>

  <div
  class="empty"
  id="empty">

    <div>

      <div style="font-size:34px">
        ♡
      </div>

      <b>
        Your wedding plan
      </b>

      <div
      style="font-size:12px;margin-top:5px">
        Upload a venue or add your first table.
      </div>

    </div>

  </div>

  <div
  class="objectLayer"
  id="objectLayer">
  </div>

  <div
  class="context"
  id="context">
  </div>

  <div
  class="trash"
  id="trash">
    🗑 Drop to delete
  </div>

  <div
  class="status"
  id="status">
  </div>

</div>

</main>

</div>


<!-- TABLE GUEST PANEL -->

<aside
class="guestPanel"
id="guestPanel">

<div class="guestHeader">

  <div>

    <div
    class="guestTitle"
    id="guestPanelTitle">
      Table
    </div>

    <div
    class="guestCount"
    id="guestPanelCount">
    </div>

  </div>

  <button
  class="secondary"
  onclick="closeGuestPanel()">
    ×
  </button>

</div>


<div class="guestForm">

  <div class="formLabel">
    Επώνυμο / Surname
  </div>

  <input
  id="guestSurname"
  class="field"
  placeholder="π.χ. Γεωργίου">


  <div
  class="formLabel"
  style="margin-top:8px">
    Όνομα / First name
  </div>

  <input
  id="guestFirstName"
  class="field"
  placeholder="π.χ. Γιώργος">


  <div
  class="formLabel"
  style="margin-top:8px">
    Αριθμός ατόμων / Party size
  </div>

  <div class="partyRow">

    <input
    id="guestPartySize"
    class="field"
    type="number"
    min="1"
    max="20"
    value="1">

    <button
    onclick="addGuestToCurrentTable()">
      + Add
    </button>

  </div>

</div>


<div class="guestListTitle">
  Guests at this table
</div>

<div id="tableGuestsList"></div>

</aside>


<!-- ALPHABETICAL PREVIEW -->

<div
class="previewOverlay"
id="previewOverlay">

  <div class="previewCard">

    <div class="previewTop">

      <div>

        <div class="previewTitle">
          Guest Directory
        </div>

        <div class="hint" style="margin:2px 0 0">
          Alphabetical by surname
        </div>

      </div>

      <button
      class="secondary"
      onclick="closePreview()">
        ×
      </button>

    </div>

    <div id="previewContent"></div>

  </div>

</div>


<div
id="toast"
style="
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:#222;
color:white;
padding:9px 13px;
border-radius:10px;
display:none;
z-index:250">
</div>


<script>

/* ==================================================
   DATA
================================================== */

let S={

  venue:null,

  tables:[],

  guests:[],

  objects:[]

};


let selected=null;

let activePanel=null;

let activeGuestTable=null;


/* UNDO / REDO */

let undoStack=[];

let redoStack=[];


/* DOM */

const $=
id=>document.getElementById(id);


const canvas=
$('canvas');


const venueBackground=
$('venueBackground');


const objectLayer=
$('objectLayer');


const context=
$('context');


const trash=
$('trash');


const mobile=
()=>window.innerWidth<=800;


/* UNIQUE ID */

const uid=()=>{

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return String(
    Date.now()+Math.random()
  );

};


/* ==================================================
   STATE / HISTORY
================================================== */

function cloneState(){

  return JSON.stringify(S);

}


function pushHistory(){

  undoStack.push(
    cloneState()
  );


  if(
    undoStack.length>50
  ){

    undoStack.shift();

  }


  redoStack=[];


  updateUndoButtons();

}


function undo(){

  if(
    !undoStack.length
  ){

    return;

  }


  redoStack.push(
    cloneState()
  );


  S=
  JSON.parse(
    undoStack.pop()
  );


  selected=null;


  closeGuestPanel();


  applyVenue();

  render();

  saveOnly();


  updateUndoButtons();

}


function redo(){

  if(
    !redoStack.length
  ){

    return;

  }


  undoStack.push(
    cloneState()
  );


  S=
  JSON.parse(
    redoStack.pop()
  );


  selected=null;


  closeGuestPanel();


  applyVenue();

  render();

  saveOnly();


  updateUndoButtons();

}


function updateUndoButtons(){

  if(
    $('undoButton')
  ){

    $('undoButton').disabled=
    !undoStack.length;

  }


  if(
    $('redoButton')
  ){

    $('redoButton').disabled=
    !redoStack.length;

  }

}


/* SAVE */

function saveOnly(){

  try{

    localStorage.setItem(
      'seatly40',
      JSON.stringify(S)
    );

  }catch(e){}


  updateStatus();

}


function commitChange(){

  saveOnly();

}


function load(){

  try{

    const old=

    localStorage.getItem('seatly40')

    ||

    localStorage.getItem('seatly32')

    ||

    localStorage.getItem('seatly31')

    ||

    localStorage.getItem('seatly30');


    if(old){

      const data=
      JSON.parse(old);


      S.venue=
      data.venue||null;


      S.tables=
      data.tables||[];


      S.objects=
      data.objects||
      data.objs||
      data.venueObjects||
      [];


      /*
      Convert older guest format
      if needed.
      */

      S.guests=
      (data.guests||[])
      .map(guest=>{

        if(
          guest.surname!==undefined
        ){

          return guest;

        }


        const oldName=
        guest.name||'';


        const parts=
        oldName
        .trim()
        .split(/\s+/);


        return {

          id:
          guest.id||
          uid(),

          surname:
          parts.length>1
          ?parts[parts.length-1]
          :parts[0]||'',

          firstName:
          parts.length>1
          ?parts.slice(0,-1).join(' ')
          :'',

          partySize:
          1,

          tableId:
          guest.tableId||null

        };

      });

    }

  }catch(e){}


  applyVenue();

  render();

  updateUndoButtons();

}


/* ==================================================
   SMART TABLE NUMBERING
================================================== */

function nextTableNumber(){

  const used=

  S.tables
  .map(
    table=>Number(table.number)
  )
  .filter(
    number=>number>0
  );


  let number=1;


  while(
    used.includes(number)
  ){

    number++;

  }


  return number;

}


/* ==================================================
   PANEL
================================================== */

function setActive(type){

  [
    'Venue',
    'Tables',
    'Objects',
    'Lists',
    'More'
  ]

  .forEach(name=>{

    $('nav'+name)
    .classList
    .toggle(
      'active',
      name.toLowerCase()===type
    );

  });

}


function closePanel(){

  $('panel')
  .classList
  .remove('open');


  activePanel=null;


  setActive('');

}


function togglePanel(type){

  if(

    mobile()

    &&

    activePanel===type

    &&

    $('panel')
    .classList
    .contains('open')

  ){

    closePanel();

    return;

  }


  activePanel=
  type;


  setActive(type);


  $('panel')
  .classList
  .add('open');


  if(type==='venue'){

    renderVenuePanel();

  }


  if(type==='tables'){

    renderTablesPanel();

  }


  if(type==='objects'){

    renderObjectsPanel();

  }


  if(type==='lists'){

    renderListsPanel();

  }


  if(type==='more'){

/* SINGLE TABLE — CENTER */

function addTable(seats){

  pushHistory();


  const rect=
  canvas.getBoundingClientRect();


  const existing=
  S.tables.length;


  const offset=
  (existing%5)*12;


  const x=

  Math.max(
    8,
    rect.width/2
    -
    51
    +
    offset
  );


  const y=

  Math.max(
    45,
    rect.height/2
    -
    51
    +
    offset
  );


  S.tables.push({

    id:uid(),

    number:
    nextTableNumber(),

    seats:
    seats,

    x:
    x,

    y:
    y,

    scale:1

  });


  render();

  commitChange();

  afterPanelAction();

}


/* MULTIPLE TABLES — RESPONSIVE CENTERED GRID */

function addMultipleTables(){

  const qty=

  Math.max(

    1,

    Math.min(

      50,

      +$('multipleQty').value||1

    )

  );


  const seats=
  +$('multipleSeats').value;


  pushHistory();


  const rect=
  canvas.getBoundingClientRect();


  const canvasWidth=
  rect.width;


  const canvasHeight=
  rect.height;


  /*
  Slightly smaller initial size
  if many tables are added.
  */

  let defaultScale=1;


  if(qty>10){

    defaultScale=.8;

  }


  if(qty>20){

    defaultScale=.65;

  }


  const spacingX=
  108*defaultScale;


  const spacingY=
  108*defaultScale;


  const safeWidth=
  Math.max(
    120,
    canvasWidth-30
  );


  const maxColumns=

  Math.max(

    1,

    Math.floor(
      safeWidth/
      spacingX
    )

  );


  const columns=

  Math.min(
    qty,
    Math.min(
      maxColumns,
      5
    )
  );


  const rows=

  Math.ceil(
    qty/
    columns
  );


  const gridWidth=

  (
    columns-1
  )

  *

  spacingX;


  const gridHeight=

  (
    rows-1
  )

  *

  spacingY;


  let startX=

  canvasWidth/2

  -

  gridWidth/2

  -

  51;


  let startY=

  canvasHeight/2

  -

  gridHeight/2

  -

  51;


  startX=
  Math.max(
    8,
    startX
  );


  startY=
  Math.max(
    45,
    startY
  );


  for(
    let i=0;
    i<qty;
    i++
  ){

    const column=
    i%columns;


    const row=
    Math.floor(
      i/columns
    );


    S.tables.push({

      id:uid(),

      number:
      nextTableNumber(),

      seats:
      seats,

      x:
      startX+
      column*
      spacingX,

      y:
      startY+
      row*
      spacingY,

      scale:
      defaultScale

    });

  }


  render();

  commitChange();

  afterPanelAction();

}

/* ==================================================
   CHAIRS
================================================== */

function createChairs(
element,
count
){

  const seats=

  Math.min(
    count,
    16
  );


  const radius=42;


  for(
    let i=0;
    i<seats;
    i++
  ){

    const angle=

    2*
    Math.PI*
    i/seats

    -

    Math.PI/2;


    const chair=
    document.createElement(
      'div'
    );


    chair.className=
    'chair';


    chair.style.left=

    (
      51+
      Math.cos(angle)*
      radius
      -
      6
    )

    +'px';


    chair.style.top=

    (
      51+
      Math.sin(angle)*
      radius
      -
      6
    )

    +'px';


    element.appendChild(
      chair
    );

  }

}


/* ==================================================
   PARTY SIZE
================================================== */

function tableUsedSeats(
tableId,
excludeGuestId=null
){

  return S.guests

  .filter(
    guest=>

    guest.tableId===tableId

    &&

    guest.id!==excludeGuestId
  )

  .reduce(
    (
      total,
      guest
    )=>

    total+

    Math.max(
      1,
      Number(
        guest.partySize
      )||1
    ),

    0
  );

}

/* ==================================================
   DRAG
================================================== */

function attachDrag(
element,
item,
kind
){

  let startX;
  let startY;

  let originalX;
  let originalY;

  let active=false;

  let moved=false;

  let snapshotBeforeDrag=null;


  element.onpointerdown=e=>{

    e.stopPropagation();


    selected={

      id:item.id,

      kind:kind

    };


    document
    .querySelectorAll('.obj')
    .forEach(
      el=>
      el.classList.remove(
        'selected'
      )
    );


    element
    .classList
    .add(
      'selected'
    );


    renderContext();


    startX=
    e.clientX;


    startY=
    e.clientY;


    originalX=
    item.x;


    originalY=
    item.y;


    snapshotBeforeDrag=
    cloneState();


    active=true;

    moved=false;


    trash.style.display=
    'block';


    try{

      element.setPointerCapture(
        e.pointerId
      );

    }catch(_){}

  };


  element.onpointermove=e=>{

    if(
      !active
    )return;


    const dx=
    e.clientX-startX;


    const dy=
    e.clientY-startY;


    if(
      Math.abs(dx)+
      Math.abs(dy)
      >4
    ){

      moved=true;

    }


    item.x=
    originalX+
    dx;


    item.y=
    originalY+
    dy;


    /*
    Keep objects reachable
    inside the fixed canvas.
    */

    const rect=
    canvas.getBoundingClientRect();


    item.x=

    Math.max(

      -20,

      Math.min(
        rect.width-40,
        item.x
      )

    );


    item.y=

    Math.max(

      35,

      Math.min(
        rect.height-40,
        item.y
      )

    );


    element.style.left=
    item.x+'px';


    element.style.top=
    item.y+'px';


    const trashRect=
    trash
    .getBoundingClientRect();


    const overTrash=

    e.clientX>=
    trashRect.left

    &&

    e.clientX<=
    trashRect.right

    &&

    e.clientY>=
    trashRect.top

    &&

    e.clientY<=
    trashRect.bottom;


    trash
    .classList
    .toggle(
      'hot',
      overTrash
    );

  };


  element.onpointerup=()=>{

    if(
      !active
    )return;


    active=false;


    const shouldDelete=

    trash
    .classList
    .contains(
      'hot'
    );


    trash.style.display=
    'none';


    trash
    .classList
    .remove(
      'hot'
    );


    if(
      shouldDelete
    ){

      if(
        snapshotBeforeDrag
      ){

        undoStack.push(
          snapshotBeforeDrag
        );

        redoStack=[];

      }


      deleteCanvasItem(
        item.id,
        kind,
        false
      );


      updateUndoButtons();

      return;

    }


    if(
      moved
      &&
      snapshotBeforeDrag
    ){

      undoStack.push(
        snapshotBeforeDrag
      );


      if(
        undoStack.length>50
      ){

        undoStack.shift();

      }


      redoStack=[];


      saveOnly();

      updateUndoButtons();

    }

  };


  element.onpointercancel=()=>{

    active=false;


    trash.style.display=
    'none';


    trash
    .classList
    .remove(
      'hot'
    );

  };

}

/* ==================================================
   TABLE SETTINGS
================================================== */

function saveTableSettings(){

  const table=

  S.tables.find(
    table=>
    table.id===selected.id
  );


  if(!table)return;


  const number=

  Math.max(

    1,

    +$('tableNumberInput').value
    ||1

  );


  const duplicate=

  S.tables.find(
    other=>

    other.id!==table.id

    &&

    Number(other.number)===
    number
  );


  if(
    duplicate
  ){

    toast(
      'That table number already exists'
    );

    return;

  }


  const seats=
  +$('tableSeatsInput').value;


  const used=
  tableUsedSeats(
    table.id
  );


  if(
    seats<used
  ){

    toast(
      `This table already has ${used} people`
    );

    return;

  }


  pushHistory();


  table.number=
  number;


  table.seats=
  seats;


  render();

  commitChange();


  if(
    activeGuestTable===
    table.id
  ){

    refreshTableGuests();

  }


  if(
    activePanel==='lists'
  ){

    renderListsPanel();

  }

}


/* ==================================================
   RESIZE
================================================== */

function resizeSelected(
multiplier
){

  if(
    !selected
  )return;


  const list=

  selected.kind==='table'

  ?S.tables

  :S.objects;


  const item=

  list.find(
    item=>
    item.id===selected.id
  );


  if(!item)return;


  pushHistory();


  item.scale=

  Math.max(

    .55,

    Math.min(

      1.8,

      (item.scale||1)
      *
      multiplier

    )

  );


  render();

  commitChange();

}

/* ==================================================
   ADD GUEST
================================================== */

function addGuestToCurrentTable(){

  const table=

  S.tables.find(
    table=>
    table.id===activeGuestTable
  );


  if(!table)return;


  const surname=

  $('guestSurname')
  .value
  .trim();


  const firstName=

  $('guestFirstName')
  .value
  .trim();


  const partySize=

  Math.max(

    1,

    Math.min(

      20,

      +$('guestPartySize').value
      ||1

    )

  );


  if(
    !surname
  ){

    toast(
      'Add a surname'
    );

    return;

  }


  const used=

  tableUsedSeats(
    table.id
  );


  if(
    used+
    partySize
    >
    table.seats
  ){

    toast(
      `Only ${table.seats-used} seats are available`
    );

    return;

  }


  pushHistory();


  S.guests.push({

    id:uid(),

    surname:
    surname,

    firstName:
    firstName,

    partySize:
    partySize,

    tableId:
    table.id

  });


  $('guestSurname').value='';

  $('guestFirstName').value='';

  $('guestPartySize').value=1;


  refreshTableGuests();

  render();

  commitChange();


  $('guestSurname')
  .focus();

}


/* ==================================================
   EDIT GUEST
================================================== */

function editGuest(id){

  const guest=

  S.guests.find(
    guest=>
    guest.id===id
  );


  if(!guest)return;


  const surname=

  prompt(
    'Surname',
    guest.surname||''
  );


  if(
    surname===null
    ||
    !surname.trim()
  ){

    return;

  }


  const firstName=

  prompt(
    'First name',
    guest.firstName||''
  );


  if(
    firstName===null
  ){

    return;

  }


  const partyAnswer=

  prompt(
    'Number of people',
    guest.partySize||1
  );


  if(
    partyAnswer===null
  ){

    return;

  }


  const partySize=

  Math.max(

    1,

    Math.min(

      20,

      +partyAnswer||1

    )

  );


  const table=

  S.tables.find(
    table=>
    table.id===guest.tableId
  );


  if(
    table
  ){

    const usedWithout=

    tableUsedSeats(
      table.id,
      guest.id
    );


    if(
      usedWithout+
      partySize
      >
      table.seats
    ){

      toast(
        'Not enough seats at this table'
      );

      return;

    }

  }


  pushHistory();


  guest.surname=
  surname.trim();


  guest.firstName=
  firstName.trim();


  guest.partySize=
  partySize;


  render();

  commitChange();


  if(
    activeGuestTable
  ){

    refreshTableGuests();

  }


  if(
    activePanel==='lists'
  ){

    renderListsPanel();

  }

}


/* ==================================================
   MOVE GUEST
================================================== */

function moveGuest(id){

  const guest=

  S.guests.find(
    guest=>
    guest.id===id
  );


  if(!guest)return;


  const currentTable=

  S.tables.find(
    table=>
    table.id===guest.tableId
  );


  const answer=

  prompt(

    'Move to table number. Leave empty for Unassigned.',

    currentTable
    ?currentTable.number
    :''

  );


  if(
    answer===null
  ){

    return;

  }


  if(
    !answer.trim()
  ){

    pushHistory();


    guest.tableId=null;


    render();

    commitChange();


    if(
      activePanel==='lists'
    ){

      renderListsPanel();

    }


    return;

  }


  const table=

  S.tables.find(
    table=>
    String(table.number)===
    answer.trim()
  );


  if(!table){

    toast(
      'Table not found'
    );

    return;

  }


  const used=

  tableUsedSeats(
    table.id,
    guest.id
  );


  if(
    used+
    guest.partySize
    >
    table.seats
  ){

    toast(
      'Not enough seats at that table'
    );

    return;

  }


  pushHistory();


  guest.tableId=
  table.id;


  render();

  commitChange();


  if(
    activePanel==='lists'
  ){

    renderListsPanel();

  }

}


/* ==================================================
   UNASSIGN
================================================== */

function unassignGuest(id){

  const guest=

  S.guests.find(
    guest=>
    guest.id===id
  );


  if(!guest)return;


  pushHistory();


  guest.tableId=null;


  render();

  commitChange();


  if(
    activeGuestTable
  ){

    refreshTableGuests();

  }


  if(
    activePanel==='lists'
  ){

    renderListsPanel();

  }

}


/* ==================================================
   DELETE GUEST COMPLETELY
================================================== */

function deleteGuest(id){

  pushHistory();


  S.guests=

  S.guests.filter(
    guest=>
    guest.id!==id
  );


  render();

  commitChange();


  if(
    activeGuestTable
  ){

    refreshTableGuests();

  }


  if(
    activePanel==='lists'
  ){

    renderListsPanel();

  }

}


/* ==================================================
   LISTS
================================================== */

function renderListsPanel(){

  const cards=

  S.tables

  .slice()

  .sort(
    (a,b)=>
    a.number-b.number
  )

  .map(table=>{

    const guests=

    S.guests

    .filter(
      guest=>
      guest.tableId===table.id
    )

    .sort(
      compareGuests
    );


    const people=

    tableUsedSeats(
      table.id
    );


    const guestRows=

    guests.length

    ?

    guests.map(
      guest=>

      `

      <div class="listGuest">

        <div>

          <div class="listGuestName">

            ${safe(
              fullGuestName(
                guest
              )
            )}

          </div>

          <div class="listGuestMeta">

            ${guest.partySize}
            ${guest.partySize===1
            ?'person'
            :'people'}

          </div>

        </div>


        <div class="listActions">

          <button
          class="secondary"
          onclick="editGuest('${guest.id}')">

            Edit

          </button>

          <button
          class="secondary"
          onclick="moveGuest('${guest.id}')">

            Move

          </button>

          <button
          class="danger"
          onclick="deleteGuest('${guest.id}')">

            ×

          </button>

        </div>

      </div>

      `

    )

    .join('')

    :

    `

    <div class="hint"
    style="margin:7px 0 0">

      No guests yet.

    </div>

    `;


    return `

    <div
    class="tableCard"
    data-search="
    table ${table.number}
    ${guests
      .map(
        guest=>
        fullGuestName(
          guest
        )
      )
      .join(' ')
    }
    ">

      <div class="tableCardHeader">

        <div>

          <strong>
            Table ${table.number}
          </strong>

          <div class="tableCardMeta">

            ${people}/${table.seats}
            people

          </div>

        </div>

        <button
        class="secondary"
        onclick="openTableGuests('${table.id}')">

          Open

        </button>

      </div>

      ${guestRows}

    </div>

    `;

  })

  .join('');


  const unassigned=

  S.guests
  .filter(
    guest=>
    !guest.tableId
  );


  const unassignedHtml=

  unassigned.length

  ?

  `

  <div class="section">

    <h3>
      Unassigned Guests
    </h3>

    ${unassigned

    .sort(
      compareGuests
    )

    .map(
      guest=>

      `

      <div class="listGuest">

        <div>

          <div class="listGuestName">

            ${safe(
              fullGuestName(
                guest
              )
            )}

          </div>

          <div class="listGuestMeta">

            ${guest.partySize}
            ${guest.partySize===1
            ?'person'
            :'people'}

          </div>

        </div>

        <div class="listActions">

          <button
          class="secondary"
          onclick="editGuest('${guest.id}')">

            Edit

          </button>

          <button
          class="secondary"
          onclick="moveGuest('${guest.id}')">

            Assign

          </button>

        </div>

      </div>

      `

    )

    .join('')}

  </div>

  `

  :'';


  $('panelContent')
  .innerHTML=`

  <h2>
    Seating Lists
  </h2>

  <div class="hint">
    Review every table and every guest.
  </div>

  <input
  id="listSearch"
  class="field"
  placeholder="Search surname, name or table..."
  oninput="filterLists(this.value)">


  <button
  style="width:100%;margin-top:7px"
  onclick="openAlphabeticalPreview()">

    Alphabetical Preview

  </button>


  <div class="section">

    ${cards||
    '<div class="hint">No tables yet.</div>'}

  </div>


  ${unassignedHtml}

  `;

}


function filterLists(value){

  const query=
  value
  .toLowerCase();


  document
  .querySelectorAll(
    '.tableCard'
  )

  .forEach(card=>{

    card.style.display=

    card
    .dataset
    .search
    .toLowerCase()
    .includes(query)

    ?'block'

    :'none';

  });

}


/* ==================================================
   ALPHABETICAL PREVIEW
================================================== */

function openAlphabeticalPreview(){

  const assigned=

  S.guests

  .filter(
    guest=>
    guest.tableId
  )

  .slice()

  .sort(
    compareGuests
  );


  const groups={};


  assigned
  .forEach(guest=>{

    const letter=

    firstLetter(
      guest.surname
    );


    if(
      !groups[letter]
    ){

      groups[letter]=[];

    }


    groups[letter]
    .push(
      guest
    );

  });


  const letters=

  Object
  .keys(groups)

  .sort(
    (a,b)=>
    a.localeCompare(
      b,
      'el'
    )
  );


  const html=

  letters.length

  ?

  letters

  .map(letter=>{

    const rows=

    groups[letter]

    .map(guest=>{

      const table=

      S.tables.find(
        table=>
        table.id===guest.tableId
      );


      return `

      <div class="previewGuest">

        <strong>

          ${safe(
            fullGuestName(
              guest
            )
          )}

        </strong>

        <span>

          ${guest.partySize}
          ${guest.partySize===1
          ?'person'
          :'people'}

        </span>

        <span>

          Table
          ${table
          ?table.number
          :'—'}

        </span>

      </div>

      `;

    })

    .join('');


    return `

    <div class="letterBlock">

      <div class="letterTitle">

        ${safe(letter)}

      </div>

      ${rows}

    </div>

    `;

  })

  .join('')

  :

  `

  <div class="hint">
    No assigned guests yet.
  </div>

  `;


  $('previewContent')
  .innerHTML=
  html;


  $('previewOverlay')
  .classList
  .add('open');

}


function closePreview(){

  $('previewOverlay')
  .classList
  .remove('open');

}


/* ==================================================
   STATUS
================================================== */

function updateStatus(){

  const seatedPeople=

  S.guests

  .filter(
    guest=>
    guest.tableId
  )

  .reduce(
    (
      total,
      guest
    )=>

    total+
    Number(
      guest.partySize||1
    ),

    0
  );


  const totalPeople=

  S.guests

  .reduce(
    (
      total,
      guest
    )=>

    total+
    Number(
      guest.partySize||1
    ),

    0
  );


  const completeTables=

  S.tables

  .filter(
    table=>

    tableUsedSeats(
      table.id
    )

    ===

    table.seats
  )

  .length;


  $('status')
  .textContent=

  `${S.tables.length} tables · ${seatedPeople}/${totalPeople} people seated · ${completeTables} complete`;

}


/* ==================================================
   GUEST HELPERS
================================================== */

function fullGuestName(
guest
){

  return [

    guest.surname||'',

    guest.firstName||''

  ]

  .filter(Boolean)

  .join(' ');

}


function compareGuests(
a,
b
){

  const surnameCompare=

  (
    a.surname||''
  )

  .localeCompare(

    b.surname||'',

    'el',

    {
      sensitivity:'base'
    }

  );


  if(
    surnameCompare!==0
  ){

    return surnameCompare;

  }


  return (

    a.firstName||''

  )

  .localeCompare(

    b.firstName||'',

    'el',

    {
      sensitivity:'base'
    }

  );

}


function firstLetter(text){

  const clean=

  (
    text||''
  )

  .trim();


  if(
    !clean
  ){

    return '#';

  }


  return clean
  .charAt(0)
  .toLocaleUpperCase(
    'el-GR'
  );

}


/* ==================================================
   TOAST
================================================== */

function toast(message){

  const element=
  $('toast');


  element.textContent=
  message;


  element.style.display=
  'block';


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer=

  setTimeout(
    ()=>{

      element.style.display=
      'none';

    },
    1700
  );

}


/* SAFE HTML */

function safe(text){

  const div=
  document.createElement(
    'div'
  );


  div.textContent=
  text||'';


  return div.innerHTML;

}
