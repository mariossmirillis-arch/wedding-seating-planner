<style>

button,

/* =========================
TOP
========================= */

/* =========================

========================= */

/* =========================

========================= */

0 12px 30px rgba(0,0,0,.08);

}

.venueBg{

position:absolute;

inset:0;

background:
#fff
center
/
contain
no-repeat;

pointer-events:none;

}

inset:0;

}

.empty{

/* =========================

/* =========================
OVERLAY

.overlay{

position:fixed;

54px

0 -10px 30px rgba(0,0,0,.18);

</style>

<script>


/* =========================
DATA
========================= */

let S={

venue:null,

tables:[],

guests:[],

objects:[]

};


let selected=null;

let activePanel=null;

let activeGuestTable=null;


let undoStack=[];

let redoStack=[];


let recognition=null;

let voiceDraft=[];


const $=
id=>document.getElementById(id);


const canvas=
$('canvas');


const layer=
$('layer');


const venueBg=
$('venueBg');


const context=
$('context');


const trash=
$('trash');


const mobile=
()=>window.innerWidth<=800;


const uid=()=>{

if(
window.crypto &&
crypto.randomUUID
){

return crypto.randomUUID();

}

return String(
Date.now()+Math.random()
);

};



/* =========================
HISTORY
========================= */

function state(){

return JSON.stringify(S);

}


function pushHistory(){

undoStack.push(
state()
);


if(
undoStack.length>60
){

undoStack.shift();

}


redoStack=[];


updateHistory();

}


function undo(){

if(
!undoStack.length
)return;


redoStack.push(
state()
);


S=
JSON.parse(
undoStack.pop()
);


selected=null;


closeGuestPanel();


applyVenue();

render();

saveOnly();

updateHistory();


if(
activePanel==='lists'
){

renderLists();

}

}


function redo(){

if(
!redoStack.length
)return;


undoStack.push(
state()
);


S=
JSON.parse(
redoStack.pop()
);


selected=null;


closeGuestPanel();


applyVenue();

render();

saveOnly();

updateHistory();


if(
activePanel==='lists'
){

renderLists();

}

}


function updateHistory(){

$('undoBtn').disabled=
!undoStack.length;


$('redoBtn').disabled=
!redoStack.length;

}


/* =========================
SAVE
========================= */

function saveOnly(){

try{

localStorage.setItem(
'seatly43',
JSON.stringify(S)
);

}catch(e){}


updateStatus();


$('savedIndicator')
.textContent=
'Saved ✓';

}


/* =========================
LOAD
========================= */

function load(){

try{

const old=

localStorage.getItem('seatly43')

||

localStorage.getItem('seatly42')

||

localStorage.getItem('seatly41')

||

localStorage.getItem('seatly40');


if(old){

const data=
JSON.parse(old);


S.venue=
data.venue||null;


S.tables=
data.tables||[];


S.objects=
data.objects||
data.objs||
data.venueObjects||
[];


S.guests=

(data.guests||[])

.map(guest=>{

if(
guest.surname!==undefined
){

return{

id:
guest.id||uid(),

surname:
guest.surname||'',

firstName:
guest.firstName||'',

partySize:
Math.max(
1,
Number(
guest.partySize||1
)
),

tableId:
guest.tableId||null

};

}


const oldName=

guest.name||'';


const parts=

oldName
.trim()
.split(/\s+/);


return{

id:
guest.id||uid(),

surname:
parts.length>1
?parts[parts.length-1]
:parts[0]||'',

firstName:
parts.length>1
?parts.slice(0,-1).join(' ')
:'',

partySize:1,

tableId:
guest.tableId||null

};

});

}

}catch(e){}


applyVenue();

render();

updateHistory();

}



/* =========================
TABLE HELPERS
========================= */

function nextTableNumber(){

const used=

S.tables
.map(
table=>
Number(table.number)
);


let n=1;


while(
used.includes(n)
){

n++;

}


return n;

}


function tableUsedSeats(
tableId,
exclude=null
){

return S.guests

.filter(
guest=>

guest.tableId===tableId

&&

guest.id!==exclude
)

.reduce(

(
total,
guest
)=>

total+
Number(
guest.partySize||1
),

0

);

}



/* =========================
NAVIGATION
========================= */

function setActive(type){

[
'Setup',
'Tables',
'Guests',
'Lists',
'Venue',
'More'
]

.forEach(name=>{

$('nav'+name)
.classList
.toggle(

'active',

name.toLowerCase()===type

);

});

}


function closePanel(){

$('panel')
.classList
.remove('open');


activePanel=null;


setActive('');

}


function togglePanel(type){

if(

mobile()

&&

activePanel===type

&&

$('panel')
.classList
.contains('open')

){

closePanel();

return;

}


activePanel=
type;


setActive(type);


$('panel')
.classList
.add('open');


if(
type==='setup'
){

renderSetup();

}


if(
type==='tables'
){

renderTables();

}


if(
type==='guests'
){

renderGuestsManager();

}


if(
type==='lists'
){

renderLists();

}


if(
type==='venue'
){

renderVenue();

}


if(
type==='more'
){

renderMore();

}

}


function afterAction(){

if(
mobile()
){

closePanel();

}

}



/* =========================
QUICK SETUP
========================= */

function renderSetup(){

$('panelContent')
.innerHTML=`

<h2>
Quick Setup
</h2>


<div class="hint">

Choose the approximate number of guests
and Seatly calculates the tables.

</div>


<div class="grid4">

${[
50,
100,
150,
200,
250,
300,
350,
400
]

.map(
guests=>

`

<button
class="presetBtn"
onclick="showSetupOptions(${guests})">

${guests}

</button>

`

)

.join('')}

</div>



<div class="section">

<h3>
Custom Guests
</h3>

/* =========================
TABLE GRID
========================= */

function createTableGrid(
qty,
seats
){

const rect=
canvas.getBoundingClientRect();


let scale=1;


if(
qty>=10
){

scale=.82;

}


if(
qty>=18
){

scale=.68;

}


if(
qty>=28
){

scale=.56;

}


if(
qty>=38
){

scale=.48;

}


const spacingX=
105*
scale;


const spacingY=
105*
scale;


const usableWidth=
rect.width-
20;


const usableHeight=
rect.height-
65;


let columns=

Math.max(

1,

Math.floor(
usableWidth/
spacingX
)

);


columns=

Math.min(
columns,
qty
);


let rows=

Math.ceil(
qty/
columns
);


while(

rows*
spacingY
>
usableHeight

&&

columns<
qty

){

columns++;


rows=

Math.ceil(
qty/
columns
);

}


const width=

(columns-1)
*
spacingX;


const height=

(rows-1)
*
spacingY;


const startX=

Math.max(

5,

rect.width/2
-
width/2
-
51*
scale

);


const startY=

Math.max(

40,

rect.height/2
-
height/2
-
51*
scale

);


for(
let i=0;
i<qty;
i++
){

const col=
i%
columns;


const row=
Math.floor(
i/
columns
);


S.tables.push({

id:uid(),

number:
nextTableNumber(),

seats:
seats,

x:
startX+
col*
spacingX,

y:
startY+
row*
spacingY,

scale:
scale

});

}

}

/* =========================
DRAG
========================= */

function attachDrag(
el,
table
){

let sx;

let sy;

let ox;

let oy;

let active=false;

let before=null;


el.onpointerdown=e=>{

e.stopPropagation();


selected={

id:table.id,

kind:'table'

};


document
.querySelectorAll('.table')
.forEach(
item=>
item
.classList
.remove('selected')
);


el
.classList
.add('selected');


renderContext();


sx=
e.clientX;


sy=
e.clientY;


ox=
table.x;


oy=
table.y;


active=true;


before=
state();


trash.style.display=
'block';


try{

el.setPointerCapture(
e.pointerId
);

}catch(_){}

};


el.onpointermove=e=>{

if(
!active
)return;


table.x=

ox+
e.clientX-
sx;


table.y=

oy+
e.clientY-
sy;


const rect=
canvas
.getBoundingClientRect();


table.x=

Math.max(

-10,

Math.min(
rect.width-
40,
table.x
)

);


table.y=

Math.max(

35,

Math.min(
rect.height-
40,
table.y
)

);


el.style.left=
table.x+'px';


el.style.top=
table.y+'px';


const bin=
trash
.getBoundingClientRect();


const over=

e.clientX>=bin.left

&&

e.clientX<=bin.right

&&

e.clientY>=bin.top

&&

e.clientY<=bin.bottom;


trash
.classList
.toggle(
'hot',
over
);

};


el.onpointerup=()=>{

if(
!active
)return;


active=false;


const remove=

trash
.classList
.contains(
'hot'
);


trash.style.display=
'none';


trash
.classList
.remove('hot');


if(remove){

undoStack.push(
before
);


redoStack=[];


deleteTable(
table.id,
false
);


updateHistory();


return;

}


if(
before!==state()
){

undoStack.push(
before
);


redoStack=[];


saveOnly();

updateHistory();

}

};

}

.textContent=

}



/* =========================
PARSE VOICE
========================= */

function parseVoiceText(
text
){

const chunks=

text

.split(
/[.;,]+/
)

.map(
item=>
item.trim()
)

.filter(Boolean);


chunks
.forEach(chunk=>{

const tableMatch=

chunk.match(
/(?:τραπέζι|τραπεζι|table)\s*(\d+)/i
);


const peopleMatch=

chunk.match(
/(\d+)\s*(?:άτομα|ατομα|people|persons?)/i
);


const tableNumber=

tableMatch
?Number(tableMatch[1])
:1;


const partySize=

peopleMatch
?Number(peopleMatch[1])
:1;


let cleaned=

chunk

.replace(
/(?:τραπέζι|τραπεζι|table)\s*\d+/ig,
''
)

.replace(
/\d+\s*(?:άτομα|ατομα|people|persons?)/ig,
''
)

.trim();


const names=

cleaned
.split(/\s+/)
.filter(Boolean);


const surname=

names[0]||'';


const firstName=

names
.slice(1)
.join(' ');


if(
surname
){

voiceDraft.push({

id:uid(),

surname,

firstName,

partySize,

tableNumber

});

}

});

}

voiceDraft[${index}].partySize=Math.max(1,+this.value||1)
">


<input
type="number"
min="1"
value="${guest.tableNumber}"
onchange="
voiceDraft[${index}].tableNumber=Math.max(1,+this.value||1)
">


<button
class="danger"
onclick="removeVoiceDraft(${index})">

×

</button>


</div>

`

)

.join('')}


<button
style="width:100%;margin-top:8px"
onclick="confirmVoiceGuests()">

Add All Guests

</button>


<button
class="secondary"
style="width:100%;margin-top:6px"
onclick="clearVoiceDraft()">

Clear Preview

</button>


</div>

`;

}


function removeVoiceDraft(
index
){

voiceDraft.splice(
index,
1
);


renderVoiceDraft();

}


function clearVoiceDraft(){

voiceDraft=[];


renderVoiceDraft();

}



/* =========================
CONFIRM VOICE
========================= */

function confirmVoiceGuests(){

if(
!voiceDraft.length
)return;


const usage={};


S.tables
.forEach(
table=>{

usage[
table.id
]=
tableUsedSeats(
table.id
);

}
);


for(
const guest
of voiceDraft
){

const table=

S.tables.find(
table=>

Number(table.number)===
Number(guest.tableNumber)
);


if(!table){

toast(
`Table ${guest.tableNumber} not found`
);

return;

}


const used=

usage[
table.id
]||0;


if(
used+
Number(
guest.partySize||1
)
>
table.seats
){

toast(
`Not enough seats at Table ${table.number}`
);

return;

}


usage[
table.id
]=

used+
Number(
guest.partySize||1
);

}


pushHistory();


voiceDraft
.forEach(
guest=>{

const table=

S.tables.find(
table=>

Number(table.number)===
Number(guest.tableNumber)
);


S.guests.push({

id:uid(),

surname:
guest.surname.trim(),

firstName:
guest.firstName.trim(),

partySize:
Number(
guest.partySize||1
),

tableId:
table.id

});

}
);


const count=
voiceDraft.length;


voiceDraft=[];


render();

saveOnly();

renderGuestsManager();


toast(
`${count} guests added`
);

}



/* =========================
EDIT GUEST
========================= */

function editGuest(id){

const guest=

S.guests.find(
guest=>
guest.id===id
);


if(!guest)return;


const surname=

prompt(
'Surname',
guest.surname||''
);


if(
surname===null
||
!surname.trim()
){

return;

}


const firstName=

prompt(
'First name',
guest.firstName||''
);


if(
firstName===null
){

return;

}


const people=

prompt(
'Number of people',
guest.partySize||1
);


if(
people===null
){

return;

}


const partySize=

Math.max(
1,
+people||1
);


const currentTable=

S.tables.find(
table=>
table.id===guest.tableId
);


const tableAnswer=

prompt(

'Table number',

currentTable
?currentTable.number
:''

);


if(
tableAnswer===null
){

return;

}


let tableId=null;


if(
tableAnswer.trim()
){

const table=

S.tables.find(
table=>

Number(table.number)===
Number(tableAnswer)
);


if(!table){

toast(
'Table not found'
);

return;

}


const free=

table.seats-

tableUsedSeats(
table.id,
guest.id
);


if(
partySize>
free
){

toast(
'Not enough seats at that table'
);

return;

}


tableId=
table.id;

}


pushHistory();


guest.surname=
surname.trim();


guest.firstName=
firstName.trim();


guest.partySize=
partySize;


guest.tableId=
tableId;


render();

saveOnly();


if(
activeGuestTable
){

refreshTableGuests();

}


if(
activePanel==='lists'
){

renderLists();

}


if(
$('directoryOverlay')
.classList
.contains('open')
){

openDirectory();

}

}



/* =========================
DELETE ONE GUEST
========================= */

function confirmDeleteGuest(id){

const guest=

S.guests.find(
guest=>
guest.id===id
);


if(!guest)return;


const yes=

confirm(

`Delete ${guestFullName(guest)} from the guest list?`

);


if(!yes)return;


deleteGuest(
id
);

}


function deleteGuest(id){

pushHistory();


S.guests=

S.guests.filter(
guest=>
guest.id!==id
);


render();

saveOnly();


if(
activeGuestTable
){

refreshTableGuests();

}


if(
activePanel==='lists'
){

renderLists();

}


if(
$('directoryOverlay')
.classList
.contains('open')
){

openDirectory();

}

}



/* =========================
DELETE ALL GUESTS
========================= */

function clearGuestList(){

if(
!S.guests.length
){

toast(
'Guest list is already empty'
);

return;

}


const yes=

confirm(

`Delete all ${S.guests.length} guest entries?`

);


if(!yes)return;


pushHistory();


S.guests=[];


voiceDraft=[];


render();

saveOnly();


if(
activeGuestTable
){

refreshTableGuests();

}


if(
activePanel==='guests'
){

renderGuestsManager();

}


if(
activePanel==='lists'
){

renderLists();

}


if(
$('directoryOverlay')
.classList
.contains('open')
){

openDirectory();

}


toast(
'Guest list deleted — Undo is available'
);

}



/* =========================
LISTS
========================= */

function renderLists(){

const cards=

S.tables

.slice()

.sort(
(a,b)=>
a.number-b.number
)

.map(table=>{

const guests=

S.guests

.filter(
guest=>
guest.tableId===table.id
)

.sort(
compareGuests
);


return`

<div class="setupCard">

<div
style="
display:flex;
justify-content:space-between;
align-items:center">

<div>

<strong>
Table ${table.number}
</strong>


<div
style="
font-size:11px;
color:#777">

${tableUsedSeats(table.id)}/${table.seats}
people

</div>

</div>


<button
class="secondary"
onclick="openTableGuests('${table.id}')">

Open

</button>

</div>


${guests.length

?

guests

.map(
guest=>

`

<div class="guestRow">

<div>

<div
class="guestName"
onclick="confirmDeleteGuest('${guest.id}')">

${safe(
guestFullName(
guest
)
)}

</div>


<div class="guestMeta">

${guest.partySize}
${guest.partySize===1
?'person'
:'people'}

</div>

</div>


<div class="actions">

<button
class="secondary"
onclick="editGuest('${guest.id}')">

Edit

</button>


<button
class="danger"
onclick="confirmDeleteGuest('${guest.id}')">

Delete

</button>

</div>


</div>

`

)

.join('')

:

`

<div
class="hint"
style="margin-top:7px">

No guests

</div>

`}


</div>

`;

})

.join('');


const unassigned=

S.guests

.filter(
guest=>
!guest.tableId
)

.sort(
compareGuests
);


$('panelContent')
.innerHTML=`

<h2>
Seating Lists
</h2>


<div class="hint">

Every table and every guest.

Tap a guest name or Delete to remove them.

</div>


<button
style="width:100%"
onclick="openDirectory()">

Alphabetical Directory

</button>


<button
class="dangerSoft"
style="width:100%;margin-top:7px"
onclick="clearGuestList()">

Delete Entire Guest List

</button>



<div class="section">

${cards||

'<div class="hint">No tables yet.</div>'}

</div>



${unassigned.length

?`

<div class="section">

<h3>
Unassigned Guests
</h3>


${unassigned

.map(
guest=>

`

<div class="guestRow">

<div>

<div
class="guestName"
onclick="confirmDeleteGuest('${guest.id}')">

${safe(
guestFullName(
guest
)
)}

</div>


<div class="guestMeta">

${guest.partySize}
people

</div>

</div>


<div class="actions">

<button
class="secondary"
onclick="editGuest('${guest.id}')">

Edit

</button>


<button
class="danger"
onclick="confirmDeleteGuest('${guest.id}')">

Delete

</button>

</div>


</div>

`

)

.join('')}


</div>

`

:''}

`;

}



/* =========================
DIRECTORY
========================= */

function openDirectory(){

const guests=

S.guests

.slice()

.sort(
compareGuests
);


const groups={};


guests
.forEach(
guest=>{

const letter=

(
guest.surname||
'#'
)

.trim()

.charAt(0)

.toLocaleUpperCase(
'el-GR'
)

||

'#';


if(
!groups[
letter
]
){

groups[
letter
]=[];

}


groups[
letter
]
.push(
guest
);

}
);


const letters=

Object
.keys(
groups
)

.sort(
(a,b)=>

a.localeCompare(
b,
'el'
)
);


$('directoryContent')
.innerHTML=

letters.length

?

letters

.map(
letter=>{

return`

<div class="letter">

${safe(
letter
)}

</div>


${groups[
letter
]

.map(
guest=>{

const table=

S.tables.find(
table=>
table.id===guest.tableId
);


return`

<div class="directoryRow">


<div
class="directoryName"
onclick="confirmDeleteGuest('${guest.id}')">

${safe(
guestFullName(
guest
)
)}

</div>


<span>

${guest.partySize}
${guest.partySize===1
?'person'
:'people'}

</span>


<span>

Table
${table
?table.number
:'—'}

</span>


<button
class="danger"
style="
font-size:10px;
padding:5px 7px"
onclick="confirmDeleteGuest('${guest.id}')">

Delete

</button>


</div>

`;

}
)

.join('')}

`;

}
)

.join('')

:

`

<div class="hint">

No guests yet.

</div>

`;


$('directoryOverlay')
.classList
.add('open');

}


function closeDirectory(){

$('directoryOverlay')
.classList
.remove('open');

}



/* =========================
MORE
========================= */

function renderMore(){

$('panelContent')
.innerHTML=`

<h2>
More
</h2>


<button
class="secondary"
style="width:100%"
onclick="undo()">

↶ Undo

</button>


<button
class="secondary"
style="width:100%;margin-top:7px"
onclick="redo()">

↷ Redo

</button>



<div class="section">

<button
class="dangerSoft"
style="width:100%"
onclick="clearGuestList()">

Delete Guest List

</button>

</div>



<div class="section">

<button
class="danger"
style="width:100%"
onclick="clearTables()">

Clear Tables

</button>

</div>



<div class="section">

<button
class="danger"
style="width:100%"
onclick="resetEverything()">

Reset Everything

</button>

</div>

`;

}



/* =========================
CLEAR TABLES
========================= */

function clearTables(){

if(
!S.tables.length
){

toast(
'No tables to delete'
);

return;

}


const yes=

confirm(

'Delete all tables? Guests will remain saved but become unassigned.'

);


if(!yes)return;


pushHistory();


S.tables=[];


S.guests
.forEach(
guest=>{

guest.tableId=null;

}
);


selected=null;


closeGuestPanel();


render();

saveOnly();


if(
activePanel==='lists'
){

renderLists();

}

}



/* =========================
RESET EVERYTHING
========================= */

function resetEverything(){

const yes=

confirm(

'Delete venue, tables and the entire guest list?'

);


if(!yes)return;


pushHistory();


S={

venue:null,

tables:[],

guests:[],

objects:[]

};


voiceDraft=[];


selected=null;


closeGuestPanel();


applyVenue();

render();

saveOnly();


if(
activePanel==='more'
){

renderMore();

}

}



/* =========================
EMPTY CANVAS TAP
========================= */

canvas.addEventListener(

'pointerdown',

e=>{

if(
mobile()
){

closePanel();

}


if(

e.target===canvas

||

e.target===layer

){

selected=null;


context.style.display=
'none';


document
.querySelectorAll('.table')
.forEach(
el=>
el
.classList
.remove('selected')
);

}

}

);



/* =========================
STATUS
========================= */

function updateStatus(){

const totalPeople=

S.guests

.reduce(

(
total,
guest
)=>

total+
Number(
guest.partySize||1
),

0

);


const seatedPeople=

S.guests

.filter(
guest=>
guest.tableId
)

.reduce(

(
total,
guest
)=>

total+
Number(
guest.partySize||1
),

0

);


$('status')
.textContent=

`${S.tables.length} tables · ${S.guests.length} guest entries · ${seatedPeople}/${totalPeople} people seated`;

}



/* =========================
HELPERS
========================= */

function guestFullName(
guest
){

return[

guest.surname||'',

guest.firstName||''

]

.filter(Boolean)

.join(' ');

}


function compareGuests(
a,
b
){

const surname=

(
a.surname||''
)

.localeCompare(

b.surname||'',

'el',

{
sensitivity:'base'
}

);


if(
surname!==0
){

return surname;

}


return(

a.firstName||''

)

.localeCompare(

b.firstName||'',

'el',

{
sensitivity:'base'
}

);

}


function safe(text){

const div=
document.createElement(
'div'
);


div.textContent=
text||'';


return div.innerHTML;

}


function safeAttr(text){

return String(
text||''
)

.replace(
/&/g,
'&amp;'
)

.replace(
/"/g,
'&quot;'
)

.replace(
/</g,
'&lt;'
)

.replace(
/>/g,
'&gt;'
);

}


function toast(message){

const el=
$('toast');


el.textContent=
message;


el.style.display=
'block';


clearTimeout(
window.toastTimer
);


window.toastTimer=

setTimeout(

()=>{

el.style.display=
'none';

},

1800

);

}



/* =========================
START
========================= */

load();

</script>

</body>

</html>
