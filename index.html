<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seatly 3.0</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#f5f3ef;
--paper:#fff;
--ink:#1f1f1f;
--muted:#777;
--line:#e6e0d8;
--soft:#f2eee9;
--green:#dff3e4;
--greenB:#33764a;
--danger:#a43a32;
}

html,body{
margin:0;
height:100%;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--ink)
}

body{overflow:hidden}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:9px 11px;
background:#1f1f1f;
color:#fff;
font-weight:750;
cursor:pointer
}

button.sec{
background:#fff;
color:var(--ink);
border:1px solid var(--line)
}

button.soft{
background:var(--soft);
color:var(--ink)
}

button.danger{
background:var(--danger)
}

/* TOP */

.topbar{
height:58px;
background:#fff;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
position:relative;
z-index:100
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:-1px
}

.logo span{
font-weight:400
}

/* APP */

.app{
height:calc(100vh - 58px);
display:grid;
grid-template-columns:64px 260px 1fr
}

/* LEFT TOOLBAR */

.rail{
background:#1f1f1f;
padding:7px 4px;
display:flex;
flex-direction:column;
gap:5px;
z-index:80
}

.rail button{
height:56px;
background:transparent;
padding:4px;
font-size:9px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px
}

.rail button b{
font-size:17px
}

.rail button.active{
background:#fff;
color:#1f1f1f
}

/* PANEL */

.panel{
background:#fff;
border-right:1px solid var(--line);
padding:14px;
overflow:auto;
position:relative;
z-index:70
}

.panel h2{
font-size:18px;
margin:0 0 4px
}

.hint{
font-size:12px;
color:var(--muted);
line-height:1.4;
margin-bottom:12px
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.field{
width:100%;
padding:9px;
border:1px solid #d8d1c9;
border-radius:10px;
background:#fff
}

.upload{
display:block;
text-align:center;
padding:18px 10px;
border:1.5px dashed #bbb;
border-radius:13px;
background:#faf9f7
}

.upload input{
display:none
}

.section{
border-top:1px solid #eee8e1;
padding-top:11px;
margin-top:11px
}

.panelClose{
display:none
}

/* CANVAS */

.work{
padding:8px;
background:#ebe8e3;
min-width:0
}

.canvas{
width:100%;
height:100%;
background:#fff;
border:1px solid var(--line);
border-radius:16px;
position:relative;
overflow:hidden;
touch-action:none;
box-shadow:0 10px 28px #0001
}

.stage{
position:absolute;
inset:0;
transform-origin:0 0
}

.venueBg{
position:absolute;
inset:0;
background:#fff center/contain no-repeat;
pointer-events:none
}

.objectLayer{
position:absolute;
inset:0
}

.empty{
position:absolute;
inset:0;
display:grid;
place-items:center;
text-align:center;
color:#999;
pointer-events:none
}

/* TABLES */

.obj{
position:absolute;
touch-action:none;
user-select:none
}

.table{
width:104px;
height:104px;
display:flex;
align-items:center;
justify-content:center;
cursor:grab
}

.table.selected,
.vobj.selected{
outline:3px solid #2224;
outline-offset:4px
}

.core{
width:64px;
height:64px;
border:2px solid #222;
border-radius:50%;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-shadow:0 4px 12px #0002;
z-index:2
}

.core b{
font-size:10px
}

.core span{
font-size:9px;
color:#666
}

.table.complete .core{
background:var(--green);
border-color:var(--greenB)
}

.chair{
position:absolute;
width:12px;
height:12px;
border:1.3px solid #555;
background:#fff;
border-radius:3px
}

/* OBJECTS */

.vobj{
border:2px dashed #666;
background:#ffffffe8;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:800;
cursor:grab
}

/* TABLE TOOLBAR */

.context{
position:absolute;
left:50%;
top:10px;
transform:translateX(-50%);
display:none;
align-items:center;
gap:5px;
background:#fff;
border:1px solid var(--line);
border-radius:12px;
padding:6px;
z-index:30;
box-shadow:0 8px 24px #0002
}

.context input,
.context select{
width:70px;
padding:6px;
border:1px solid var(--line);
border-radius:8px
}

.context button{
padding:6px 8px
}

/* ZOOM */

.zoom{
position:absolute;
right:10px;
bottom:10px;
display:flex;
gap:4px;
background:#fff;
border:1px solid var(--line);
border-radius:11px;
padding:4px;
z-index:25
}

.zoom button{
padding:6px 8px
}

/* STATUS */

.status{
position:absolute;
left:10px;
bottom:10px;
background:#fff;
border:1px solid var(--line);
border-radius:999px;
padding:6px 9px;
font-size:10px;
color:#666;
z-index:25
}

/* TRASH */

.trash{
position:absolute;
left:50%;
bottom:58px;
transform:translateX(-50%);
display:none;
background:#fff;
border:2px solid var(--line);
border-radius:999px;
padding:9px 15px;
z-index:35;
font-size:12px;
font-weight:800
}

.trash.hot{
background:#ffe7e3;
border-color:#b23b30
}

/* GUEST PANEL */

.guestSheet{
position:fixed;
right:0;
top:58px;
bottom:0;
width:320px;
background:#fff;
border-left:1px solid var(--line);
box-shadow:-10px 0 30px #0002;
z-index:95;
display:none;
padding:16px;
overflow:auto
}

.guestSheet.open{
display:block
}

.guestSheet h2{
margin:0 0 3px
}

.sheetTop{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px
}

.guestRow{
display:grid;
grid-template-columns:1fr auto;
gap:6px;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee
}

.guestRow .name{
font-size:13px;
font-weight:700
}

.guestRow button{
padding:5px 7px;
font-size:11px
}

.voicePreview{
display:none;
background:#faf9f7;
border:1px solid var(--line);
border-radius:10px;
padding:8px;
margin-top:8px
}

.voiceItem{
font-size:12px;
padding:5px 0;
border-bottom:1px solid #eee
}

/* MOBILE */

@media(max-width:800px){

.topbar{
height:54px
}

.app{
height:calc(100vh - 54px);
grid-template-columns:56px 1fr
}

.rail{
padding:5px 3px
}

.rail button{
height:50px
}

.work{
grid-column:2;
padding:4px
}

.panel{
position:fixed;
left:56px;
right:0;
bottom:0;
top:auto;
width:auto;
max-height:44vh;
display:none;
border-right:0;
border-top:1px solid var(--line);
border-radius:18px 18px 0 0;
padding:48px 13px 13px;
box-shadow:0 -10px 30px #0003;
z-index:90
}

.panel.open{
display:block
}

.panelClose{
display:block;
position:absolute;
right:10px;
top:8px;
width:34px;
height:34px;
padding:0;
border-radius:50%;
background:var(--soft);
color:#222;
border:1px solid var(--line);
font-size:20px
}

.context{
max-width:94%;
overflow:auto;
white-space:nowrap
}

.guestSheet{
top:54px;
left:56px;
right:0;
bottom:0;
width:auto;
border-left:0;
box-shadow:none
}

}
</style>
</head>

<body>

<header class="topbar">

<div class="logo">
seat<span>ly</span>
</div>

<button onclick="toast('Finish / Export θα προστεθεί μετά')">
Finish
</button>

</header>


<div class="app">

<nav class="rail">

<button id="navVenue" onclick="togglePanel('venue')">
<b>▧</b>
Venue
</button>

<button id="navTables" onclick="togglePanel('tables')">
<b>◉</b>
Tables
</button>

<button id="navObjects" onclick="togglePanel('objects')">
<b>◇</b>
Objects
</button>

<button id="navGuests" onclick="togglePanel('guests')">
<b>♙</b>
All Guests
</button>

</nav>


<aside class="panel" id="panel">

<button class="panelClose" onclick="closePanel()">
×
</button>

<div id="panelContent"></div>

</aside>


<main class="work">

<div class="canvas" id="canvas">

<div class="stage" id="stage">

<div class="venueBg" id="venueBg"></div>

<div class="empty" id="empty">

<div>

<div style="font-size:32px">
♡
</div>

<b>Your wedding plan</b>

<div style="font-size:12px;margin-top:4px">
Upload a venue or add your first table.
</div>

</div>

</div>

<div class="objectLayer" id="objectLayer"></div>

</div>


<div class="context" id="context"></div>


<div class="trash" id="trash">
🗑 Drop to delete
</div>


<div class="status" id="status"></div>


<div class="zoom">

<button class="sec" onclick="zoomOut()">
−
</button>

<button class="sec" onclick="fitView()">
Fit
</button>

<button class="sec" onclick="zoomIn()">
＋
</button>

</div>

</div>

</main>

</div>


<!-- TABLE GUESTS -->

<aside class="guestSheet" id="guestSheet">

<div class="sheetTop">

<div>

<h2 id="guestSheetTitle">
Table
</h2>

<div
class="hint"
id="guestSheetMeta">
</div>

</div>

<button
class="sec"
onclick="closeGuestSheet()">
×
</button>

</div>


<input
id="tableGuestName"
class="field"
placeholder="Guest name / Όνομα">


<button
style="width:100%;margin-top:7px"
onclick="addGuestToSelectedTable()">

+ Add guest

</button>


<button
id="micBtn"
class="soft"
style="width:100%;margin-top:7px"
onclick="toggleMic()">

🎙 Speak names

</button>


<div
class="voicePreview"
id="voicePreview">
</div>


<div class="section">

<div id="tableGuestList"></div>

</div>

</aside>


<div
id="toast"
style="
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:#222;
color:#fff;
padding:9px 13px;
border-radius:10px;
display:none;
z-index:120">
</div>


<script>

let S={

venue:null,

tables:[],

guests:[],

objs:[],

counter:0,

view:{
scale:1,
x:0,
y:0
}

};


let selected=null;

let activePanel=null;

let selectedTableForGuests=null;

let recognition=null;

let voiceDraft=[];


const $=
id=>document.getElementById(id);


const canvas=$('canvas');

const stage=$('stage');

const venueBg=$('venueBg');

const objectLayer=$('objectLayer');

const context=$('context');

const trash=$('trash');


const uid=()=>{

if(
window.crypto &&
crypto.randomUUID
){

return crypto.randomUUID();

}

return String(
Date.now()+Math.random()
);

};


const mobile=()=>innerWidth<=800;


/* SAVE */

function save(){

try{

localStorage.setItem(
'seatly30',
JSON.stringify(S)
);

}catch(e){}

updateStatus();

}


/* LOAD OLD DATA TOO */

function load(){

try{

let x=

localStorage.getItem('seatly30')

||

localStorage.getItem('seatly23')

||

localStorage.getItem('seatly_2_2')

||

localStorage.getItem('seatly2');


if(x){

S=Object.assign(
S,
JSON.parse(x)
);

}

}catch(e){}

applyVenue();

render();

}


/* NAVIGATION */

function setActive(type){

[
'Venue',
'Tables',
'Objects',
'Guests'
]

.forEach(x=>{

$('nav'+x)
.classList
.toggle(

'active',

x.toLowerCase()===type

);

});

}


function closePanel(){

$('panel')
.classList
.remove('open');

activePanel=null;

setActive('');

}


function togglePanel(type){

if(

mobile()

&&

activePanel===type

&&

$('panel')
.classList
.contains('open')

){

closePanel();

return;

}


activePanel=type;

setActive(type);

$('panel')
.classList
.add('open');


if(type==='venue'){

renderVenuePanel();

}

if(type==='tables'){

renderTablesPanel();

}

if(type==='objects'){

renderObjectsPanel();

}

if(type==='guests'){

renderAllGuestsPanel();

}

}


function afterAction(){

if(mobile()){

closePanel();

}

}


/* VENUE */

function renderVenuePanel(){

$('panelContent').innerHTML=`

<h2>Venue</h2>

<div class="hint">

Upload your venue plan.

The background stays fixed.

Zoom only with − / Fit / +.

</div>


<label class="upload">

📷

<br>

<b>

${S.venue
?'Replace venue'
:'Upload venue'}

</b>


<input
id="venueInput"
type="file"
accept="image/*">

</label>


${S.venue

?`

<button
class="sec"
style="width:100%;margin-top:7px"
onclick="removeVenue()">

Remove venue

</button>

`

:''}

`;


$('venueInput')
.onchange=e=>{

let f=
e.target.files[0];

if(!f)return;


let r=
new FileReader();


r.onload=x=>{

S.venue=
x.target.result;

applyVenue();

render();

save();

afterAction();

};


r.readAsDataURL(f);

};

}


function applyVenue(){

venueBg.style.backgroundImage=

S.venue

?`url("${S.venue}")`

:'none';

}


function removeVenue(){

S.venue=null;

applyVenue();

render();

save();

renderVenuePanel();

}


/* TABLES */

function renderTablesPanel(){

$('panelContent').innerHTML=`

<h2>Tables</h2>

<div class="hint">

Choose a table size.

The menu closes immediately.

</div>


<div class="grid2">

<button
class="soft"
onclick="addTable(8)">
8 seats
</button>


<button
class="soft"
onclick="addTable(10)">
10 seats
</button>


<button
class="soft"
onclick="addTable(12)">
12 seats
</button>


<button
class="soft"
onclick="addTable(16)">
16 seats
</button>

</div>


<div class="section">

<b>Add multiple</b>


<input
id="qty"
class="field"
type="number"
min="1"
max="50"
value="5"
style="margin-top:6px">


<select
id="bulkSeats"
class="field"
style="margin-top:6px">

<option>8</option>

<option selected>
10
</option>

<option>12</option>

<option>16</option>

</select>


<button
style="width:100%;margin-top:6px"
onclick="addMany()">

Add tables

</button>

</div>

`;

}


/* OBJECTS */

function renderObjectsPanel(){

$('panelContent').innerHTML=`

<h2>Objects</h2>

<div class="hint">
Only the essentials.
</div>


<div class="grid2">

<button
class="soft"
onclick="addObj('Dance Floor',160,160)">
Dance Floor
</button>


<button
class="soft"
onclick="addObj('DJ',110,55)">
DJ
</button>


<button
class="soft"
onclick="addObj('Bar',130,55)">
Bar
</button>


<button
class="soft"
onclick="addObj('Stage',150,65)">
Stage
</button>

</div>

`;

}


/* ALL GUESTS */

function renderAllGuestsPanel(){

let rows=

S.guests

.map(g=>{

let t=

S.tables.find(
x=>x.id===g.tableId
);


return `

<div class="guestRow">

<div>

<div class="name">
${esc(g.name)}
</div>

<div
class="hint"
style="margin:0">

${t
?'Table '+t.number
:'Unassigned'}

</div>

</div>


<div>

<button
class="sec"
onclick="editGuest('${g.id}')">

Edit

</button>

</div>

</div>

`;

})

.join('');


$('panelContent').innerHTML=`

<h2>All Guests</h2>

<div class="hint">

Search and review.

Add guests mainly from each table.

</div>


<input
id="guestSearch"
class="field"
placeholder="Search..."
oninput="filterGuestRows(this.value)">


<div
class="section"
id="allGuestRows">

${rows

||

'<div class="hint">No guests yet.</div>'}

</div>

`;

}


function filterGuestRows(q){

q=
q.toLowerCase();


[...$('allGuestRows').children]

.forEach(r=>{

r.style.display=

r.textContent
.toLowerCase()
.includes(q)

?'grid'

:'none';

});

}


/* ADD TABLE */

function addTable(seats){

S.counter++;


let i=
S.tables.length;


S.tables.push({

id:uid(),

number:S.counter,

seats:seats,

x:
70+
(i%5)*115,

y:
85+
Math.floor(i/5)*110,

scale:1,

rotation:0

});


render();

save();

afterAction();

}


/* MULTIPLE TABLES */

function addMany(){

let n=

Math.max(

1,

Math.min(

50,

+$('qty').value||1

)

);


let s=
+$('bulkSeats').value;


for(
let k=0;
k<n;
k++
){

S.counter++;


let i=
S.tables.length;


S.tables.push({

id:uid(),

number:S.counter,

seats:s,

x:
70+
(i%5)*115,

y:
85+
Math.floor(i/5)*110,

scale:1,

rotation:0

});

}


render();

save();

afterAction();

}


/* OBJECT */

function addObj(
label,
w,
h
){

let i=
S.objs.length;


S.objs.push({

id:uid(),

label:label,

w:w,

h:h,

x:
180+
i*25,

y:
160+
i*20,

scale:1,

rotation:0

});


render();

save();

afterAction();

}


/* CHAIRS */

function chairs(
el,
n
){

n=
Math.min(
n,
16
);


let r=43;


for(
let i=0;
i<n;
i++
){

let a=

2*
Math.PI*
i/n

-

Math.PI/2;


let c=
document.createElement('div');


c.className=
'chair';


c.style.left=

(
52+
Math.cos(a)*r-
6
)

+'px';


c.style.top=

(
52+
Math.sin(a)*r-
6
)

+'px';


el.appendChild(c);

}

}


/* RENDER */

function render(){

objectLayer.innerHTML='';


S.tables.forEach(t=>{

let count=

S.guests.filter(
g=>g.tableId===t.id
).length;


let e=
document.createElement('div');


e.className=

'obj table'

+

(
count===t.seats
?' complete'
:''
)

+

(
selected?.id===t.id
?' selected'
:''
);


e.style.left=
t.x+'px';


e.style.top=
t.y+'px';


e.style.transform=

`scale(${t.scale}) rotate(${t.rotation}deg)`;


chairs(
e,
t.seats
);


let c=
document.createElement('div');


c.className=
'core';


c.innerHTML=

`<b>TABLE ${t.number}</b><span>${count}/${t.seats}</span>`;


e.appendChild(c);


attachDrag(
e,
t,
'table'
);


objectLayer.appendChild(e);

});


S.objs.forEach(o=>{

let e=
document.createElement('div');


e.className=

'obj vobj'

+

(
selected?.id===o.id
?' selected'
:''
);


e.style.left=
o.x+'px';


e.style.top=
o.y+'px';


e.style.width=
o.w+'px';


e.style.height=
o.h+'px';


e.style.transform=

`scale(${o.scale}) rotate(${o.rotation}deg)`;


e.textContent=
o.label;


attachDrag(
e,
o,
'obj'
);


objectLayer.appendChild(e);

});


$('empty').style.display=

(
S.venue

||

S.tables.length

||

S.objs.length
)

?'none'

:'grid';


applyView();

renderContext();

updateStatus();

}


/* DRAG TABLE */

function attachDrag(
el,
item,
kind
){

let sx;

let sy;

let ox;

let oy;

let on=false;


el.onpointerdown=e=>{

e.stopPropagation();


selected={

id:item.id,

kind:kind

};


renderContext();


document
.querySelectorAll('.obj')
.forEach(
x=>x.classList.remove('selected')
);


el.classList.add(
'selected'
);


sx=e.clientX;

sy=e.clientY;

ox=item.x;

oy=item.y;

on=true;


trash.style.display=
'block';


try{

el.setPointerCapture(
e.pointerId
);

}catch(_){}

};


el.onpointermove=e=>{

if(!on)return;


item.x=

ox+

(e.clientX-sx)

/

S.view.scale;


item.y=

oy+

(e.clientY-sy)

/

S.view.scale;


el.style.left=
item.x+'px';


el.style.top=
item.y+'px';


let r=
trash.getBoundingClientRect();


let hot=

e.clientX>=r.left

&&

e.clientX<=r.right

&&

e.clientY>=r.top

&&

e.clientY<=r.bottom;


trash.classList.toggle(
'hot',
hot
);

};


el.onpointerup=()=>{

if(!on)return;


on=false;


let hot=

trash
.classList
.contains('hot');


trash.style.display=
'none';


trash
.classList
.remove('hot');


if(hot){

if(kind==='table'){

S.guests.forEach(g=>{

if(
g.tableId===item.id
){

g.tableId=null;

}

});


S.tables=

S.tables.filter(
x=>x.id!==item.id
);

}

else{

S.objs=

S.objs.filter(
x=>x.id!==item.id
);

}


selected=null;


closeGuestSheet();

render();

}


save();

};


el.onpointercancel=()=>{

on=false;

trash.style.display=
'none';

};

}


/* TABLE TOOLBAR */

function renderContext(){

if(!selected){

context.style.display=
'none';

return;

}


let item=

selected.kind==='table'

?

S.tables.find(
x=>x.id===selected.id
)

:

S.objs.find(
x=>x.id===selected.id
);


if(!item){

selected=null;

context.style.display=
'none';

return;

}


if(
selected.kind==='table'
){

let n=

S.guests.filter(
g=>g.tableId===item.id
).length;


context.innerHTML=`

<b>Table</b>


<input
id="ctxNum"
type="number"
value="${item.number}">


<select id="ctxSeats">

${[8,10,12,16]

.map(

x=>

`<option ${x===item.seats?'selected':''}>${x}</option>`

)

.join('')}

</select>


<span>

${n}/${item.seats}

</span>


<button
class="sec"
onclick="saveCtx()">

✓

</button>


<button
class="sec"
onclick="openGuestSheet('${item.id}')">

Guests

</button>


<button
class="sec"
onclick="resizeSel(.9)">

−

</button>


<button
class="sec"
onclick="resizeSel(1.1)">

＋

</button>

`;

}

else{

context.innerHTML=`

<b>
${item.label}
</b>


<button
class="sec"
onclick="resizeSel(.9)">
−
</button>


<button
class="sec"
onclick="resizeSel(1.1)">
＋
</button>

`;

}


context.style.display=
'flex';

}


/* SAVE TABLE */

function saveCtx(){

let t=

S.tables.find(
x=>x.id===selected.id
);


let seats=
+$('ctxSeats').value;


let count=

S.guests.filter(
g=>g.tableId===t.id
).length;


if(
seats<count
){

return toast(

'This table already has '

+

count

+

' guests'

);

}


t.number=

Math.max(

1,

+$('ctxNum').value||1

);


t.seats=
seats;


render();

save();

}


/* RESIZE */

function resizeSel(m){

let a=

selected.kind==='table'

?

S.tables

:

S.objs;


let o=

a.find(
x=>x.id===selected.id
);


o.scale=

Math.max(

.5,

Math.min(

2.2,

o.scale*m

)

);


render();

save();

}


/* TAP EMPTY CANVAS */

canvas.addEventListener(

'pointerdown',

e=>{

if(mobile()){

closePanel();

}


if(

e.target===canvas

||

e.target===stage

||

e.target===objectLayer

){

selected=null;


renderContext();


document
.querySelectorAll('.obj')
.forEach(
x=>x.classList.remove('selected')
);

}

}

);


/* ==================================================
   SIMPLE ZOOM
   NO PINCH
   ================================================== */

function applyView(){

stage.style.transform=

`translate(${S.view.x}px,${S.view.y}px) scale(${S.view.scale})`;

}


function fitView(){

S.view={

scale:1,

x:0,

y:0

};


applyView();

save();

}


function zoomIn(){

S.view.scale=

Math.min(

2.5,

S.view.scale*1.15

);


applyView();

save();

}


function zoomOut(){

S.view.scale=

Math.max(

.5,

S.view.scale*.87

);


applyView();

save();

}


/* ==================================================
   GUESTS INSIDE TABLE
   ================================================== */

function openGuestSheet(tableId){

selectedTableForGuests=
tableId;


let t=

S.tables.find(
x=>x.id===tableId
);


if(!t)return;


$('guestSheetTitle')
.textContent=

'Table '+t.number;


refreshGuestSheet();


$('guestSheet')
.classList
.add('open');

}


function closeGuestSheet(){

$('guestSheet')
.classList
.remove('open');


selectedTableForGuests=null;


voiceDraft=[];

}


/* REFRESH TABLE GUESTS */

function refreshGuestSheet(){

let t=

S.tables.find(
x=>x.id===selectedTableForGuests
);


if(!t)return;


let gs=

S.guests.filter(
g=>g.tableId===t.id
);


$('guestSheetMeta')
.textContent=

`${gs.length}/${t.seats} guests`;


$('tableGuestList')
.innerHTML=

gs.length

?

gs.map(g=>`

<div class="guestRow">

<div class="name">

${esc(g.name)}

</div>


<div>

<button
class="sec"
onclick="renameTableGuest('${g.id}')">

Edit

</button>


<button
class="danger"
onclick="removeGuestFromTable('${g.id}')">

×

</button>

</div>

</div>

`).join('')

:

'<div class="hint">No guests yet.</div>';

}


/* ADD GUEST DIRECTLY TO TABLE */

function addGuestToSelectedTable(){

let t=

S.tables.find(
x=>x.id===selectedTableForGuests
);


let name=

$('tableGuestName')
.value
.trim();


if(
!t ||
!name
){

return;

}


let count=

S.guests.filter(
g=>g.tableId===t.id
).length;


if(
count>=t.seats
){

return toast(
'Table is full'
);

}


S.guests.push({

id:uid(),

name:name,

tableId:t.id

});


$('tableGuestName').value='';


refreshGuestSheet();

render();

save();

}


/* EDIT GUEST */

function renameTableGuest(id){

let g=

S.guests.find(
x=>x.id===id
);


let n=

prompt(
'Guest name',
g.name
);


if(
n===null ||
!n.trim()
){

return;

}


g.name=
n.trim();


refreshGuestSheet();

render();

save();

}


/* REMOVE FROM TABLE */

function removeGuestFromTable(id){

let g=

S.guests.find(
x=>x.id===id
);


if(!g)return;


g.tableId=null;


refreshGuestSheet();

render();

save();

}


/* EDIT FROM ALL GUESTS */

function editGuest(id){

let g=

S.guests.find(
x=>x.id===id
);


let n=

prompt(
'Guest name',
g.name
);


if(
n===null ||
!n.trim()
){

return;

}


g.name=
n.trim();


render();

save();

renderAllGuestsPanel();

}


/* ==================================================
   VOICE INPUT
   ================================================== */

function toggleMic(){

if(recognition){

recognition.stop();

return;

}


let SR=

window.SpeechRecognition

||

window.webkitSpeechRecognition;


if(!SR){

return toast(
'Voice recognition is not supported here.'
);

}


recognition=
new SR();


recognition.lang=
'el-GR';


recognition.continuous=
true;


recognition.interimResults=
false;


$('micBtn')
.textContent=

'■ Stop listening';


recognition.onresult=e=>{

for(

let i=e.resultIndex;

i<e.results.length;

i++

){

let words=

e.results[i][0]
.transcript

.split(/[,.]+/)

.map(
x=>x.trim()
)

.filter(Boolean);


voiceDraft.push(
...words
);

}


renderVoicePreview();

};


recognition.onend=()=>{

recognition=null;


if($('micBtn')){

$('micBtn')
.textContent=

'🎙 Speak names';

}

};


recognition.start();

}


/* VOICE PREVIEW */

function renderVoicePreview(){

$('voicePreview')
.style.display=

'block';


$('voicePreview')
.innerHTML=

voiceDraft

.map(

x=>

`<div class="voiceItem">${esc(x)}</div>`

)

.join('')

+

`

<button
style="width:100%;margin-top:7px"
onclick="confirmVoiceNames()">

Add ${voiceDraft.length} guests

</button>

`;

}


/* ADD VOICE NAMES */

function confirmVoiceNames(){

let t=

S.tables.find(
x=>x.id===selectedTableForGuests
);


if(
!t ||
!voiceDraft.length
){

return;

}


let free=

t.seats

-

S.guests.filter(
g=>g.tableId===t.id
).length;


voiceDraft

.slice(
0,
free
)

.forEach(name=>{

S.guests.push({

id:uid(),

name:name,

tableId:t.id

});

});


voiceDraft=[];


$('voicePreview')
.style.display=

'none';


refreshGuestSheet();

render();

save();

}


/* STATUS */

function updateStatus(){

let seated=

S.guests.filter(
g=>g.tableId
).length;


let full=

S.tables.filter(

t=>

S.guests.filter(
g=>g.tableId===t.id
).length

===

t.seats

).length;


$('status')
.textContent=

`${S.tables.length} tables · ${seated}/${S.guests.length} seated · ${full} complete`;

}


/* TOAST */

function toast(m){

let t=
$('toast');


t.textContent=
m;


t.style.display=
'block';


clearTimeout(
window.tt
);


window.tt=

setTimeout(

()=>t.style.display='none',

1600

);

}


/* SAFE TEXT */

function esc(s){

let d=

document.createElement(
'div'
);


d.textContent=
s||'';


return d.innerHTML;

}


/* START */

load();

</script>

</body>
</html>
