<!doctype html>
<html lang="el">
<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seatly 4.8</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{box-sizing:border-box}

:root{
--bg:#f3f1ed;
--paper:#fff;
--ink:#202020;
--muted:#777;
--line:#e5dfd7;
--soft:#f3efe9;
--success:#e3f2e7;
--successText:#28663c;
--warning:#fff6e7;
--danger:#a43a32;
--dangerSoft:#fff0ee;
}

html,body{
margin:0;
width:100%;
height:100%;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--ink);
}

body{overflow:hidden}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:9px 11px;
background:#222;
color:#fff;
font-weight:700;
cursor:pointer;
}

button.secondary{
background:#fff;
color:#222;
border:1px solid var(--line);
}

button.soft{
background:var(--soft);
color:#222;
}

button.success{
background:var(--success);
color:var(--successText);
border:1px solid #bfdac6;
}

button.danger{
background:var(--danger);
color:#fff;
}

button.dangerSoft{
background:var(--dangerSoft);
color:var(--danger);
border:1px solid #efc8c3;
}

button:disabled{
opacity:.35;
cursor:default;
}

/* TOP */

.topbar{
height:58px;
background:#fff;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
position:relative;
z-index:200;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:-1px;
}

.logo span{font-weight:400}

.topRight{
display:flex;
align-items:center;
gap:5px;
}

.saveState{
font-size:11px;
color:#777;
}

.saveState.error{
color:var(--danger);
font-weight:800;
}

/* STEPS */

.steps{
height:48px;
background:#fff;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:center;
gap:6px;
padding:5px 10px;
overflow:auto;
position:relative;
z-index:190;
}

.stepBtn{
background:#f5f2ed;
color:#666;
border:1px solid #e4ddd5;
border-radius:999px;
padding:7px 12px;
font-size:11px;
white-space:nowrap;
}

.stepBtn.active{
background:#222;
color:#fff;
border-color:#222;
}

.stepBtn.done{
background:var(--success);
color:var(--successText);
border-color:#bedbc6;
}

/* APP */

.app{
height:calc(100vh - 106px);
display:grid;
grid-template-columns:58px 290px 1fr;
}

/* LEFT */

.rail{
background:#202020;
padding:6px 4px;
display:flex;
flex-direction:column;
gap:6px;
z-index:100;
}

.rail button{
height:57px;
background:transparent;
padding:4px;
font-size:8px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
}

.rail button b{font-size:17px}

.rail button.active{
background:#fff;
color:#222;
}

/* PANEL */

.panel{
background:#fff;
border-right:1px solid var(--line);
padding:14px;
overflow:auto;
position:relative;
z-index:90;
}

.panelClose{display:none}

.panel h2{
font-size:19px;
margin:0 0 4px;
}

.panel h3{
font-size:14px;
margin:0 0 7px;
}

.hint{
font-size:12px;
color:var(--muted);
line-height:1.45;
margin-bottom:12px;
}

.section{
border-top:1px solid #eee8e1;
padding-top:12px;
margin-top:12px;
}

.field{
width:100%;
padding:10px;
border:1px solid #d8d1c9;
border-radius:10px;
background:#fff;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.grid4{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.primaryWide{
width:100%;
padding:12px;
margin-top:9px;
}

.stepHeader{
display:flex;
gap:8px;
align-items:center;
margin-bottom:5px;
}

.stepNumber{
width:29px;
height:29px;
border-radius:50%;
background:#222;
color:#fff;
display:grid;
place-items:center;
font-size:12px;
font-weight:900;
}

.card{
border:1px solid var(--line);
border-radius:14px;
padding:11px;
background:#faf9f7;
margin-top:8px;
}

.cardTitle{
font-size:14px;
font-weight:850;
}

.meta{
font-size:11px;
color:#777;
margin-top:2px;
}

.warning{
background:var(--warning);
border-color:#ecd5a7;
}

.quickButton{
background:#f5f2ed;
color:#222;
border:1px solid #e1dad2;
padding:12px 5px;
}

.quickRow{
display:grid;
grid-template-columns:1fr auto;
gap:8px;
align-items:center;
padding:9px 0;
border-top:1px solid #eee7df;
}

/* WORKSPACE */

.work{
background:#eae7e2;
padding:7px;
min-width:0;
min-height:0;
overflow:hidden;
display:flex;
align-items:stretch;
justify-content:center;
}

.canvas{
position:relative;
width:min(100%,1400px);
height:100%;
background:#fff;
border:1px solid var(--line);
border-radius:16px;
overflow:hidden;
touch-action:none;
box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.venueBg{
position:absolute;
inset:0;
background:#fff center/contain no-repeat;
pointer-events:none;
z-index:1;
}

.objectLayer{
position:absolute;
inset:0;
z-index:5;
}

.tableLayer{
position:absolute;
inset:0;
z-index:10;
}

.empty{
position:absolute;
inset:0;
display:grid;
place-items:center;
text-align:center;
color:#999;
pointer-events:none;
z-index:2;
}

.obj{
position:absolute;
touch-action:none;
user-select:none;
transform-origin:top left;
}

/* VENUE OBJECTS */

.venueObject{
border:2px dashed #555;
background:rgba(255,255,255,.93);
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:10px;
font-weight:850;
cursor:grab;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.venueObject.selected{
outline:3px solid rgba(0,0,0,.15);
outline-offset:3px;
}

.dancefloor{
border-style:solid;
background:
linear-gradient(
45deg,
#fafafa 25%,
#ececec 25%,
#ececec 50%,
#fafafa 50%,
#fafafa 75%,
#ececec 75%
);
background-size:24px 24px;
}

.djbox{
background:#292929;
color:#fff;
border-color:#111;
}

.bar{background:#f3ece4}
.entrance{background:#fff;border-style:double}

/* TABLES */

.table{
width:82px;
height:82px;
display:flex;
align-items:center;
justify-content:center;
cursor:grab;
}

.table.selected{
outline:3px solid rgba(0,0,0,.15);
outline-offset:3px;
}

.core{
width:48px;
height:48px;
border:2px solid #222;
border-radius:50%;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-shadow:0 4px 12px rgba(0,0,0,.13);
z-index:2;
}

.core b{font-size:8px}

.core span{
font-size:8px;
color:#666;
margin-top:2px;
}

.table.full .core{
background:#e1f2e5;
border-color:#3c7d50;
}

.chair{
position:absolute;
width:9px;
height:9px;
background:#fff;
border:1.1px solid #555;
border-radius:3px;
}

/* CONTEXT */

.context{
position:absolute;
left:50%;
top:8px;
transform:translateX(-50%);
display:none;
align-items:center;
gap:5px;
background:#fff;
border:1px solid var(--line);
border-radius:12px;
padding:5px;
z-index:60;
box-shadow:0 8px 22px rgba(0,0,0,.14);
max-width:96%;
overflow:auto;
}

.context input,.context select{
width:62px;
padding:6px;
border:1px solid var(--line);
border-radius:8px;
}

.context button{
font-size:11px;
padding:6px 7px;
}

/* TRASH */

.trash{
position:absolute;
left:50%;
bottom:12px;
transform:translateX(-50%);
display:none;
background:#fff;
border:2px solid var(--line);
border-radius:999px;
padding:8px 15px;
font-size:11px;
font-weight:850;
z-index:70;
}

.trash.hot{
background:#ffe7e3;
border-color:#b23b30;
}

/* STATUS */

.status{
position:absolute;
left:8px;
bottom:8px;
background:#fff;
border:1px solid var(--line);
border-radius:999px;
padding:6px 9px;
font-size:10px;
color:#666;
z-index:30;
}

/* GUEST DRAWER */

.guestDrawer{
position:fixed;
top:106px;
right:0;
bottom:0;
width:390px;
background:#fff;
border-left:1px solid var(--line);
box-shadow:-10px 0 30px rgba(0,0,0,.12);
z-index:130;
display:none;
padding:15px;
overflow:auto;
}

.guestDrawer.open{display:block}

.drawerTop{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:8px;
margin-bottom:12px;
}

.drawerTitle{
font-size:21px;
font-weight:850;
}

.drawerMeta{
font-size:12px;
color:#777;
}

.formLabel{
font-size:11px;
font-weight:750;
color:#666;
margin:8px 0 4px;
}

.guestRow{
display:grid;
grid-template-columns:1fr auto;
gap:7px;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee;
}

.guestName{
font-size:13px;
font-weight:700;
}

.guestMeta{
font-size:11px;
color:#777;
}

.actions{
display:flex;
gap:4px;
}

.actions button{
font-size:10px;
padding:5px 6px;
}

/* VOICE */

.voiceBox{
border:1px solid var(--line);
border-radius:14px;
background:#faf9f7;
padding:11px;
margin-top:8px;
}

.voiceListening{
background:#fff1ef;
border-color:#efc5bf;
}

.voiceRow{
display:grid;
grid-template-columns:1fr 1fr 60px 65px auto;
gap:5px;
margin-top:6px;
}

.voiceRow input{
width:100%;
padding:7px;
border:1px solid var(--line);
border-radius:8px;
}

/* REVIEW */

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.summaryCard{
background:#faf9f7;
border:1px solid var(--line);
border-radius:13px;
padding:11px;
}

.summaryNumber{
font-size:24px;
font-weight:900;
}

.summaryLabel{
font-size:10px;
color:#777;
}

.reviewTable{
border:1px solid var(--line);
border-radius:12px;
padding:10px;
margin-top:8px;
}

.reviewTableHeader{
display:flex;
justify-content:space-between;
gap:8px;
align-items:center;
}

.reviewGuest{
font-size:11px;
padding:3px 0;
color:#555;
}

/* DOWNLOAD */

.downloadChoice{
border:1px solid var(--line);
border-radius:15px;
padding:14px;
background:#faf9f7;
margin-top:10px;
}

.downloadIcon{
font-size:28px;
margin-bottom:5px;
}

/* OVERLAY */

.overlay{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:18px;
background:rgba(0,0,0,.5);
z-index:300;
}

.overlay.open{display:flex}

.modal{
width:min(1000px,100%);
max-height:94vh;
overflow:auto;
background:#fff;
border-radius:18px;
padding:20px;
}

.modalTop{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
}

/* CHART */

.chartControls{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin:12px 0;
}

.chart{
background:#fff;
color:#111;
width:100%;
min-height:900px;
padding:44px;
border:1px solid #ddd;
margin-top:15px;
}

.chartWelcome{
text-align:center;
font-family:Georgia,serif;
font-size:64px;
font-style:italic;
line-height:1;
}

.chartSmall{
text-align:center;
font-size:10px;
letter-spacing:4px;
margin-top:24px;
}

.chartNames{
text-align:center;
font-family:Georgia,serif;
font-size:29px;
letter-spacing:4px;
margin-top:7px;
}

.chartDate{
text-align:center;
font-size:10px;
letter-spacing:3px;
margin-top:8px;
}

.chartFind{
text-align:center;
font-family:Georgia,serif;
font-size:26px;
font-style:italic;
margin:26px 0 32px;
}

.chartColumns{
columns:4;
column-gap:34px;
}

.chartGroup{
break-inside:avoid;
margin-bottom:18px;
}

.chartLetter{
font-family:Georgia,serif;
font-size:24px;
margin-bottom:6px;
}

.chartPerson{
display:flex;
align-items:flex-end;
gap:4px;
font-family:Georgia,serif;
font-size:10px;
line-height:1.65;
}

.chartPersonName{white-space:nowrap}

.chartDots{
border-bottom:1px dotted #777;
flex:1;
height:10px;
}

.chartTable{
min-width:18px;
text-align:right;
}

/* VENUE DOWNLOAD */

.venueExport{
position:relative;
width:1400px;
height:900px;
background:#fff;
overflow:hidden;
}

.venueExportBg{
position:absolute;
inset:0;
background:#fff center/contain no-repeat;
}

.venueExportObj{
position:absolute;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-weight:800;
font-family:Arial,sans-serif;
}

.venueExportTable{
position:absolute;
width:70px;
height:70px;
border:2px solid #222;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:800;
background:#fff;
}

/* EXPORT */

.exportMode{
width:1400px!important;
min-height:1980px!important;
padding:90px!important;
border:0!important;
}

.exportMode .chartWelcome{font-size:92px}
.exportMode .chartNames{font-size:40px}
.exportMode .chartFind{font-size:35px}
.exportMode .chartLetter{font-size:32px}
.exportMode .chartPerson{font-size:15px}

/* MOBILE */

@media(max-width:800px){

.topbar{
height:56px;
padding:0 7px;
}

.logo{font-size:21px}
.saveState{display:none}

.steps{
height:43px;
justify-content:flex-start;
padding:4px 7px;
}

.stepBtn{
font-size:9px;
padding:6px 9px;
}

.app{
height:calc(100vh - 99px);
grid-template-columns:54px 1fr;
}

.rail{padding:4px 2px}

.rail button{
height:51px;
font-size:7px;
}

.work{
grid-column:2;
padding:4px;
}

.canvas{border-radius:12px}

.panel{
position:fixed;
left:54px;
right:0;
bottom:0;
top:auto;
width:auto;
max-height:61vh;
display:none;
border-right:0;
border-top:1px solid var(--line);
border-radius:18px 18px 0 0;
padding:46px 12px 12px;
box-shadow:0 -10px 30px rgba(0,0,0,.18);
z-index:120;
}

.panel.open{display:block}

.panelClose{
display:block;
position:absolute;
right:9px;
top:7px;
width:34px;
height:34px;
padding:0;
border-radius:50%;
background:var(--soft);
color:#222;
border:1px solid var(--line);
font-size:20px;
}

.guestDrawer{
top:99px;
left:54px;
right:0;
width:auto;
border-left:0;
}

.table{
width:72px;
height:72px;
}

.core{
width:42px;
height:42px;
}

.core b,.core span{font-size:7px}

.voiceRow{
grid-template-columns:1fr 1fr;
}

.chartControls{
grid-template-columns:1fr;
}

.chart{
padding:22px;
min-height:700px;
}

.chartWelcome{font-size:44px}
.chartColumns{columns:2}

}

</style>

</head>

<body>

<header class="topbar">

<div class="logo">
seat<span>ly</span>
</div>

<div class="topRight">

<span
class="saveState"
id="saveState">
Saved ✓
</span>

<button
class="secondary"
id="undoBtn"
onclick="undo()">
↶
</button>

<button
class="secondary"
id="redoBtn"
onclick="redo()">
↷
</button>

<button onclick="goStep(5)">
Download
</button>

</div>

</header>


<div class="steps">

<button
id="step1"
class="stepBtn"
onclick="goStep(1)">
1 Venue
</button>

<button
id="step2"
class="stepBtn"
onclick="goStep(2)">
2 Tables
</button>

<button
id="step3"
class="stepBtn"
onclick="goStep(3)">
3 Guests
</button>

<button
id="step4"
class="stepBtn"
onclick="goStep(4)">
4 Review
</button>

<button
id="step5"
class="stepBtn"
onclick="goStep(5)">
5 Download
</button>

</div>


<div class="app">

<nav class="rail">

<button
id="rail1"
onclick="goStep(1)">
<b>▧</b>
Venue
</button>

<button
id="rail2"
onclick="goStep(2)">
<b>◉</b>
Tables
</button>

<button
id="rail3"
onclick="goStep(3)">
<b>♙</b>
Guests
</button>

<button
id="rail4"
onclick="goStep(4)">
<b>✓</b>
Review
</button>

<button
id="rail5"
onclick="goStep(5)">
<b>↓</b>
Download
</button>

</nav>


<aside
class="panel"
id="panel">

<button
class="panelClose"
onclick="closePanel()">
×
</button>

<div id="panelContent"></div>

</aside>


<main class="work">

<div
class="canvas"
id="canvas">

<div
class="venueBg"
id="venueBg">
</div>

<div
class="empty"
id="empty">

<div>

<div style="font-size:34px">
♡
</div>

<b>
Create your seating plan
</b>

<div style="font-size:12px;margin-top:5px">
Start with Step 1
</div>

</div>

</div>

<div
class="objectLayer"
id="objectLayer">
</div>

<div
class="tableLayer"
id="tableLayer">
</div>

<div
class="context"
id="context">
</div>

<div
class="trash"
id="trash">
🗑 Drop to delete
</div>

<div
class="status"
id="status">
</div>

</div>

</main>

</div>


<!-- GUEST DRAWER -->

<aside
class="guestDrawer"
id="guestDrawer">

<div class="drawerTop">

<div>

<div
class="drawerTitle"
id="drawerTitle">
Table
</div>

<div
class="drawerMeta"
id="drawerMeta">
</div>

</div>

<button
class="secondary"
onclick="closeGuestDrawer()">
×
</button>

</div>


<div class="card">

<div class="formLabel">
Surname
</div>

<input
id="tableSurname"
class="field"
placeholder="Γεωργίου">

<div class="formLabel">
First name
</div>

<input
id="tableFirst"
class="field"
placeholder="Γιώργος">

<div class="formLabel">
People
</div>

<input
id="tableParty"
class="field"
type="number"
min="1"
max="20"
value="1">

<button
class="primaryWide"
onclick="addGuestToCurrentTable()">
+ Add Guest
</button>

</div>

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
margin-top:14px">

<strong style="font-size:13px">
Guests
</strong>

<button
class="dangerSoft"
style="font-size:10px;padding:5px 7px"
onclick="clearCurrentTableGuests()">
Clear
</button>

</div>

<div id="currentTableGuests"></div>

</aside>


<!-- CHART -->

<div
class="overlay"
id="chartOverlay">

<div class="modal">

<div class="modalTop">

<div>

<h2 style="margin:0">
Alphabetical Seating Chart
</h2>

<div
class="hint"
style="margin:2px 0 0">
Α–Ω · Guest · Table
</div>

</div>

<button
class="secondary"
onclick="closeChart()">
×
</button>

</div>

<div class="chartControls">

<input
id="chartCouple"
class="field"
placeholder="MARIOS & MARIA"
oninput="renderChart()">

<input
id="chartDate"
class="field"
placeholder="19.09.2026"
oninput="renderChart()">

<input
id="chartWelcome"
class="field"
value="Welcome"
oninput="renderChart()">

<input
id="chartFind"
class="field"
value="Please find your seat"
oninput="renderChart()">

<select
id="chartColumns"
class="field"
onchange="renderChart()">

<option value="2">
2 columns
</option>

<option value="3">
3 columns
</option>

<option value="4" selected>
4 columns
</option>

<option value="5">
5 columns
</option>

</select>

<select
id="chartStyle"
class="field"

function uid(){

function clamp(value,min,max){

function compressImage(file,maxSize,quality){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=
event=>{

const image=
new Image();

image.onload=
()=>{

let width=
image.width;

let height=
image.height;

const max=
Math.max(
width,
height
);

if(
max>maxSize
){

const ratio=
maxSize/max;

width=
Math.round(
width*ratio
);

height=
Math.round(
height*ratio
);

}

const c=
document.createElement('canvas');

c.width=
width;

c.height=
height;

c.getContext('2d')
.drawImage(
image,
0,
0,
width,
height
);

resolve(
c.toDataURL(
'image/jpeg',
quality
)
);

};

image.onerror=
reject;

image.src=
event.target.result;

};

reader.onerror=
reject;

reader.readAsDataURL(
file
);

}
);

}

function createGrid(qty,seats){

const rect=
canvas.getBoundingClientRect();

let scale=.74;

if(qty>=10)scale=.64;
if(qty>=18)scale=.55;
if(qty>=28)scale=.47;
if(qty>=38)scale=.40;

const size=
(
mobile()
?72
:82
)
*
scale;

const gap=12;

let columns=
Math.max(
1,
Math.floor(
(rect.width-25)/
(size+gap)
)
);

columns=
Math.min(
columns,
qty
);

let rows=
Math.ceil(
qty/
columns
);

while(
rows*(size+gap)
>
rect.height-70
&&
columns<qty
){

columns++;

rows=
Math.ceil(
qty/columns
);

}

const gridWidth=
(columns-1)*
(size+gap);

const gridHeight=
(rows-1)*
(size+gap);

const startX=
Math.max(
8,
rect.width/2
-
gridWidth/2
-
size/2
);

const startY=
Math.max(
38,
rect.height/2
-
gridHeight/2
-
size/2
);

for(
let i=0;
i<qty;
i++
){

const column=
i%columns;

const row=
Math.floor(
i/columns
);

S.tables.push({

id:uid(),

number:
nextTableNumber(),

seats,

scale,

xPct:
xToPercent(
startX+
column*
(size+gap)
),

yPct:
yToPercent(
startY+
row*
(size+gap)
)

});

}

}


function nextTableNumber(){

const numbers=
S.tables
.map(
table=>
Number(table.number)
);

let number=1;

while(
numbers.includes(number)
){
number++;
}

return number;

}


function findFreePosition(){

const rect=
canvas.getBoundingClientRect();

const base=
mobile()
?72
:82;

const step=
base*.8+12;

for(
let y=42;
y<rect.height-base;
y+=step
){

for(
let x=10;
x<rect.width-base;
x+=step
){

const blocked=
S.tables
.some(
table=>{

const tx=
percentToX(
table.xPct
);

const ty=
percentToY(
table.yPct
);

return(
Math.abs(tx-x)<base*.6
&&
Math.abs(ty-y)<base*.6
);

}
);

if(!blocked){

return{
xPct:xToPercent(x),
yPct:yToPercent(y)
};

}

}

}

return{
xPct:45,
yPct:45
};

}

function toggleVoice(){

voiceRecognition

if(!Speech){

voiceRecognition.onresult=
event=>{

i<event.results.length;
i++

parseVoice(
event.results[i][0].transcript
);

()=>{

$('voiceStatus');

if(status){

'Review the preview below.';
}

const box=
$('voiceBox');

if(box){
box.classList.remove(
'voiceListening'
);
}

};


voiceRecognition.start();

}


function parseVoice(raw){

const text=
replaceGreekNumbers(raw);

const tableMatch=
text.match(
/(?:τραπέζι|τραπεζι|table)\s*(\d+)/i
);

const peopleMatch=
text.match(
/(\d+)\s*(?:άτομα|ατομα|people|persons?)/i
);

const tableNumber=
tableMatch
?Number(tableMatch[1])
:1;

const partySize=
peopleMatch
?Number(peopleMatch[1])
:1;

let clean=
text

.replace(
/(?:τραπέζι|τραπεζι|table)\s*\d+/ig,
''
)

.replace(
/\d+\s*(?:άτομα|ατομα|people|persons?)/ig,
''
)

.replace(
/[,.;]+/g,
' '
)

.trim();

const names=
clean
.split(/\s+/)
.filter(Boolean);

if(!names.length)return;

voiceDraft.push({

id:uid(),

surname:
names[0]||'',

firstName:
names.slice(1).join(' '),

partySize,

tableNumber

});

}


function replaceGreekNumbers(text){

const map={

'ένα':1,
'ενα':1,
'μια':1,
'μία':1,
'δύο':2,
'δυο':2,
'τρεις':3,
'τρία':3,
'τρια':3,
'τέσσερα':4,
'τεσσερα':4,
'πέντε':5,
'πεντε':5,
'έξι':6,
'εξι':6,
'επτά':7,
'εφτά':7,
'επτα':7,
'εφτα':7,
'οκτώ':8,
'οχτώ':8,
'οκτω':8,
'οχτω':8,
'εννέα':9,
'εννεα':9,
'δέκα':10,
'δεκα':10

};

return text.replace(
/\b(ένα|ενα|μια|μία|δύο|δυο|τρεις|τρία|τρια|τέσσερα|τεσσερα|πέντε|πεντε|έξι|εξι|επτά|εφτά|επτα|εφτα|οκτώ|οχτώ|οκτω|οχτω|εννέα|εννεα|δέκα|δεκα)\b/gi,
match=>
String(
map[
normalizeBasic(match)
]
||
match
)
);

}

.some(
guest=>

guest.id!==exclude

normalizeText(
guest.surname+

guest.firstName
)

key

);

Number(

columns;

currentColumn+1

columns;

-

/* DRAG */

function attachDrag(
element,
item,
kind
){

let startX;
let startY;

let originalX;
let originalY;

let active=false;

let before=null;


element.onpointerdown=
event=>{

event.stopPropagation();

selected={
id:item.id,
kind
};

document
.querySelectorAll('.obj')
.forEach(
item=>
item.classList.remove(
'selected'
)
);

element.classList.add(
'selected'
);

renderContext();

startX=
event.clientX;

startY=
event.clientY;

originalX=
percentToX(
item.xPct
);

originalY=
percentToY(
item.yPct
);

before=
snapshot();

active=true;

trash.style.display=
'block';

try{

element.setPointerCapture(
event.pointerId
);

}catch(error){}

};


element.onpointermove=
event=>{

if(!active)return;

const rect=
canvas.getBoundingClientRect();

const scale=
Number(
item.scale||1
);

const visualWidth=
element.offsetWidth*
scale;

const visualHeight=
element.offsetHeight*
scale;

let x=
originalX+
event.clientX-
startX;

let y=
originalY+
event.clientY-
startY;

x=
clamp(
x,
0,
Math.max(
0,
rect.width-
visualWidth
)
);

y=
clamp(
y,
0,
Math.max(
0,
rect.height-
visualHeight
)
);

item.xPct=
xToPercent(x);

item.yPct=
yToPercent(y);

element.style.left=
item.xPct+'%';

element.style.top=
item.yPct+'%';

const bin=
trash
.getBoundingClientRect();

const over=
event.clientX>=bin.left
&&
event.clientX<=bin.right
&&
event.clientY>=bin.top
&&
event.clientY<=bin.bottom;

trash
.classList
.toggle(
'hot',
over
);

};


element.onpointerup=
()=>{

if(!active)return;

active=false;

const remove=
trash
.classList
.contains(
'hot'
);

trash.style.display=
'none';

trash
.classList
.remove(
'hot'
);

if(remove){

undoStack.push(
before
);

redoStack=[];

deleteCanvasItem(
item.id,
kind,
false
);

updateUndoButtons();

return;

}

if(
before!==snapshot()
){

undoStack.push(
before
);

redoStack=[];

save();

updateUndoButtons();

}

};

}

const number=

1,
Number(
$('contextNumber').value||1

);

S.tables.find(
other=>
other.id!==table.id
&&
Number(other.number)===

);

if(!item)return;

remember();

item.scale=
clamp(
Number(
item.scale||1
)
*
multiplier,
.3,
2
);

render();

save();

}


function deleteCanvasItem(
id,
kind,
history=true
){

if(history){
remember();
}

if(
kind==='table'
){

S.tables=
S.tables.filter(
table=>
table.id!==id
);

S.guests
.forEach(
guest=>{

if(
guest.tableId===id
){
guest.tableId=null;
}

}
);

}else{

S.objects=
S.objects.filter(
object=>
object.id!==id
);

}

selected=null;

context.style.display='none';

render();

save();

renderPanel();

}


/* CAPACITY */

function tableUsedSeats(
tableId,
excludeGuestId=null
){

return S.guests

.filter(
guest=>
guest.tableId===tableId
&&
guest.id!==excludeGuestId
)

.reduce(
(sum,guest)=>
sum+
Number(
guest.partySize||1
),
0
);

}


/* ALPHABET */

function normalizeBasic(text){

return String(
text||''
)

.normalize('NFD')

.replace(
/[\u0300-\u036f]/g,
''
)

.toLocaleLowerCase(
'el-GR'
)

.trim();

}


function normalizeText(text){

return normalizeBasic(text)
.toLocaleUpperCase(
'el-GR'
);

}


const greekAlphabet=[
'Α','Β','Γ','Δ',
'Ε','Ζ','Η','Θ',
'Ι','Κ','Λ','Μ',
'Ν','Ξ','Ο','Π',
'Ρ','Σ','Τ','Υ',
'Φ','Χ','Ψ','Ω'
];


function alphabetLetter(surname){

const clean=
normalizeText(
surname
);

if(!clean)return'#';

return clean.charAt(0);

}


function compareLetters(a,b){

const ai=
greekAlphabet
.indexOf(a);

const bi=
greekAlphabet
.indexOf(b);

if(
ai>=0
&&
bi>=0
){
return ai-bi;
}

if(ai>=0)return-1;
if(bi>=0)return 1;

return a.localeCompare(
b,
'el'
);

}


function compareGuests(a,b){

const surname=
normalizeText(
a.surname
)
.localeCompare(
normalizeText(
b.surname
),
'el'
);

if(
surname!==0
){
return surname;
}

return normalizeText(
a.firstName
)
.localeCompare(
normalizeText(
b.firstName
),
'el'
);

}


/* STATUS */

function updateStatus(){

const s=
stats();

$('status')
.textContent=
`${s.tables} tables · ${s.seated}/${s.people} people · ${s.free} free`;

}


/* TEXT */

function guestName(guest){

return[
guest.surname||'',
guest.firstName||''
]
.filter(Boolean)
.join(' ');

}


function safe(text){

const element=
document.createElement(
'div'
);

element.textContent=
text||'';

return element.innerHTML;

}


function safeAttribute(text){

return String(
text||''
)

.replace(/&/g,'&amp;')
.replace(/"/g,'&quot;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;');

}


function escapeXML(text){

return String(
text||''
)

.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&apos;');

}


/* DOWNLOAD */

function downloadBlob(blob,name){

const url=
URL.createObjectURL(
blob
);

const a=
document.createElement(
'a'
);

a.href=
url;

a.download=
name;

a.click();

setTimeout(
()=>{

URL.revokeObjectURL(
url
);

},
1000
);

}


/* DESELECT */

canvas
.addEventListener(
'pointerdown',
event=>{

if(
mobile()
){
closePanel();
}

if(
event.target===canvas
||
event.target===objectLayer
||
event.target===tableLayer
){

selected=null;

context.style.display='none';

document
.querySelectorAll('.obj')
.forEach(
element=>
element.classList.remove(
'selected'
)
);

}

}
);


/* RESIZE */

window
.addEventListener(
'resize',
()=>{

render();

}
);


/* TOAST */

function toast(message){

const el=
$('toast');

el.textContent=
message;

el.style.display=
'block';

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{

el.style.display='none';

},
1900
);

}


/* START */

load();

</script>
