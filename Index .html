<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f2ee;color:#202020;overflow:hidden}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:9px 11px;background:#202020;color:#fff;font-weight:700;cursor:pointer}.sec{background:#fff;color:#202020;border:1px solid #ddd7cf}.soft{background:#efebe6;color:#202020}.danger{background:#a33a31}.top{height:58px;background:#fff;border-bottom:1px solid #e4ded6;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.logo{font-size:25px;font-weight:900}.logo span{font-weight:400}.app{height:calc(100vh - 58px);display:grid;grid-template-columns:68px 276px 1fr}.rail{background:#202020;padding:8px 5px;display:flex;flex-direction:column;gap:6px}.rail button{height:58px;background:transparent;font-size:10px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.rail button b{font-size:19px}.rail button.active{background:#fff;color:#202020}.panel{background:#fff;border-right:1px solid #e4ded6;padding:14px;overflow:auto}.panel h2{margin:0 0 4px;font-size:18px}.hint{font-size:12px;color:#777;line-height:1.4;margin-bottom:12px}.section{border-top:1px solid #eee8e1;padding-top:12px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{width:100%;border:1px solid #d8d1c9;border-radius:10px;padding:10px;background:#fff}.upload{display:block;text-align:center;padding:20px 10px;border:1.5px dashed #bbb2a8;border-radius:14px;background:#faf9f7;cursor:pointer}.upload input{display:none}.wrap{padding:10px;background:#ebe8e3;position:relative;min-width:0}.canvas{width:100%;height:100%;background:#fff;border:1px solid #e2dcd4;border-radius:16px;position:relative;overflow:hidden;touch-action:none}.stage{position:absolute;inset:0;transform-origin:0 0}.venue{position:absolute;inset:0;background:#fff center/contain no-repeat;pointer-events:none}.objects{position:absolute;inset:0}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#999;pointer-events:none}.obj{position:absolute;touch-action:none;user-select:none}.table{width:106px;height:106px;display:flex;align-items:center;justify-content:center;cursor:grab}.table.selected,.vobj.selected{outline:3px solid #2224;outline-offset:4px}.core{width:66px;height:66px;border:2px solid #222;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 12px #0002;z-index:2}.core b{font-size:11px}.core span{font-size:9px;color:#666}.complete .core{background:#dff3e4;border-color:#34784a}.chair{position:absolute;width:13px;height:13px;border:1.4px solid #555;background:#fff;border-radius:3px}.vobj{border:2px dashed #666;background:#ffffffe8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:grab}.context{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:none;align-items:center;gap:5px;background:#fff;border:1px solid #ddd7cf;border-radius:12px;padding:6px;z-index:20}.context input,.context select{width:78px;padding:7px;border:1px solid #ddd7cf;border-radius:8px}.context button{padding:7px 9px}.trash{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:none;align-items:center;gap:7px;background:#fff;border:2px solid #ddd7cf;border-radius:999px;padding:10px 18px;z-index:25;font-size:13px;font-weight:800}.trash.hot{background:#ffe5e2;border-color:#b23b30;color:#9c3027}.zoom{position:absolute;right:18px;bottom:18px;display:flex;gap:4px;background:#fff;border:1px solid #ddd7cf;border-radius:11px;padding:5px;z-index:16}.zoom button{padding:7px 9px}.status{position:absolute;left:18px;bottom:18px;background:#fff;border:1px solid #ddd7cf;border-radius:999px;padding:7px 10px;z-index:16;font-size:11px;color:#666}.guest{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.guest .name{font-size:13px;font-weight:700}.guest .meta{font-size:11px;color:#777}.mini{padding:6px 8px;font-size:11px}.voiceBox{display:none;border:1px solid #e3ddd5;background:#faf9f7;border-radius:12px;padding:9px;margin-top:8px}.voiceRow{font-size:12px;padding:6px 0;border-bottom:1px solid #eee}.panelClose{display:none}@media(max-width:800px){
body{overflow:hidden}
.app{height:calc(100vh - 58px);grid-template-columns:56px 1fr}
.rail{padding:6px 3px;z-index:45}
.rail button{height:52px;font-size:9px}
.panel{
 position:fixed;
 left:56px;
 right:0;
 top:auto;
 bottom:0;
 width:auto;
 height:auto;
 max-height:46vh;
 border-right:0;
 border-top:1px solid #e4ded6;
 border-radius:18px 18px 0 0;
 z-index:44;
 display:none;
 box-shadow:0 -10px 28px #0002;
 padding:18px 14px 14px;
}
.panel.open{display:block}
.panelClose{
 display:block!important;
 position:absolute;
 right:10px;
 top:8px;
 width:34px;
 height:34px;
 border-radius:50%;
 padding:0;
 background:#efebe6;
 color:#202020;
 border:1px solid #ddd7cf;
 font-size:20px;
 line-height:30px;
 z-index:2;
}
.wrap{grid-column:2;padding:5px}
.context{max-width:94%;overflow:auto}
.status{left:8px;bottom:8px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{right:8px;bottom:8px}
.trash{bottom:58px}
}
</style>
</head>
<body>
<header class="top"><div class="logo">seat<span>ly</span></div><div><button class="sec" onclick="undo()">↶</button> <button class="sec" onclick="redo()">↷</button> <button onclick="toast('Finish / Export θα προστεθεί μετά το test του editor')">Finish</button></div></header>
<div class="app">
<nav class="rail"><button id="navVenue" onclick="openPanel('venue')"><b>▧</b>Venue</button><button id="navTables" onclick="openPanel('tables')"><b>◉</b>Tables</button><button id="navGuests" onclick="openPanel('guests')"><b>♙</b>Guests</button><button id="navObjects" onclick="openPanel('objects')"><b>◇</b>Objects</button></nav>
<aside class="panel" id="panel"><button class="panelClose" id="panelClose" onclick="closePanel()">×</button><div id="panelContent"></div></aside>
<main class="wrap"><div class="canvas" id="canvas"><div class="stage" id="stage"><div class="venue" id="venue"></div><div class="empty" id="empty"><div><div style="font-size:32px">♡</div><b>Your wedding plan</b><div style="font-size:12px;margin-top:5px">Upload a venue plan or add a table.</div></div></div><div class="objects" id="objects"></div></div><div class="context" id="context"></div><div class="trash" id="trash">🗑 Drop here to delete</div><div class="status" id="status"></div><div class="zoom"><button class="sec" onclick="zoomCenter(.9)">−</button><button class="sec" onclick="fitView()">Fit</button><button class="sec" onclick="zoomCenter(1.1)">＋</button></div></div></main>
</div>
<div id="toast" style="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#202020;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:100"></div>
<script>
let S={venue:null,tables:[],guests:[],venueObjects:[],counter:0,view:{scale:1,x:0,y:0}},selected=null,H=[],F=[],rec=null,voice=[];const $=x=>document.getElementById(x),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),canvas=$('canvas'),stage=$('stage'),objects=$('objects'),venue=$('venue'),context=$('context'),trash=$('trash');
function snap(){return JSON.stringify(S)}function checkpoint(){H.push(snap());if(H.length>30)H.shift();F=[]}function save(){try{localStorage.setItem('seatly2',snap())}catch(e){}statusUpdate()}function load(){try{let x=localStorage.getItem('seatly2');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}applyVenue();render();openPanel('venue')}function undo(){if(!H.length)return;F.push(snap());S=JSON.parse(H.pop());selected=null;applyVenue();render();save()}function redo(){if(!F.length)return;H.push(snap());S=JSON.parse(F.pop());selected=null;applyVenue();render();save()}
let currentPanel=null;
function closePanel(){
 panel.classList.remove('open');
 currentPanel=null;
 ['venue','tables','guests','objects'].forEach(x=>$('nav'+x[0].toUpperCase()+x.slice(1)).classList.remove('active'));
}
function closeMobilePanel(){if(window.innerWidth<=800)closePanel()}
function openPanel(t){
 if(window.innerWidth<=800 && currentPanel===t && panel.classList.contains('open')){closePanel();return}
 currentPanel=t;
 ['venue','tables','guests','objects'].forEach(x=>$('nav'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===t));
 panel.classList.add('open');
 if(t==='venue')venuePanel();
 if(t==='tables')tablesPanel();
 if(t==='guests')guestsPanel();
 if(t==='objects')objectsPanel();
}
function venuePanel(){panelContent.innerHTML=`<h2>Venue</h2><div class="hint">Upload once, then work directly on the canvas.</div><label class="upload">📷<br><b>${S.venue?'Replace venue':'Upload venue'}</b><input id="venueInput" type="file" accept="image/*"></label>${S.venue?'<button class="sec" style="width:100%;margin-top:8px" onclick="removeVenue()">Remove venue</button>':''}`;$('venueInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{checkpoint();S.venue=x.target.result;applyVenue();render();save();closePanel()};r.readAsDataURL(f)}}
function tablesPanel(){panelContent.innerHTML=`<h2>Tables</h2><div class="hint">Add, drag and drop into the bin to delete.</div><div class="grid"><button class="soft" onclick="addTable(8)">8 seats</button><button class="soft" onclick="addTable(10)">10 seats</button><button class="soft" onclick="addTable(12)">12 seats</button><button class="soft" onclick="addTable(16)">16 seats</button></div><div class="section"><input id="qty" class="field" type="number" value="5" min="1" max="50"><select id="seats" class="field" style="margin-top:7px"><option>8</option><option selected>10</option><option>12</option><option>16</option></select><button style="width:100%;margin-top:7px" onclick="addMany()">Add multiple</button></div>`}
function objectsPanel(){panelContent.innerHTML=`<h2>Objects</h2><div class="grid"><button class="soft" onclick="addObj('Dance Floor',170,170)">Dance Floor</button><button class="soft" onclick="addObj('DJ',120,60)">DJ</button><button class="soft" onclick="addObj('Bar',150,60)">Bar</button><button class="soft" onclick="addObj('Stage',170,70)">Stage</button></div>`}
function guestsPanel(){let rows=S.guests.map(g=>{let t=S.tables.find(x=>x.id===g.tableId);return `<div class="guest"><div><div class="name">${esc(g.name)}</div><div class="meta">${t?'Table '+t.number:'Unassigned'}</div></div><div><button class="sec mini" onclick="editGuest('${g.id}')">Edit</button> <button class="danger mini" onclick="delGuest('${g.id}')">×</button></div></div>`}).join('');panelContent.innerHTML=`<h2>Guests</h2><div class="hint">Speak or type.</div><button id="micBtn" style="width:100%;padding:13px" onclick="toggleMic()">🎙 Speak guests</button><div class="voiceBox" id="voiceBox"></div><div class="section"><input id="manualName" class="field" placeholder="Name / Όνομα"><select id="manualTable" class="field" style="margin-top:7px">${tableOpts()}</select><button style="width:100%;margin-top:7px" onclick="manualGuest()">Add guest</button></div><div class="section">${rows||'<div class="hint">No guests yet.</div>'}</div>`}
function applyVenue(){venue.style.backgroundImage=S.venue?`url("${S.venue}")`:'none'}function removeVenue(){checkpoint();S.venue=null;applyVenue();render();save();venuePanel()}
function addTable(n){checkpoint();S.counter++;let i=S.tables.length;S.tables.push({id:uid(),number:S.counter,seats:n,x:80+(i%5)*125,y:95+Math.floor(i/5)*120,scale:1,rotation:0});render();save();closeMobilePanel()}
function addMany(){let n=Math.max(1,Math.min(50,+qty.value||1)),s=+seats.value;checkpoint();for(let k=0;k<n;k++){S.counter++;let i=S.tables.length;S.tables.push({id:uid(),number:S.counter,seats:s,x:70+(i%5)*125,y:90+Math.floor(i/5)*120,scale:1,rotation:0})}render();save();closeMobilePanel()}
function addObj(label,w,h){checkpoint();let i=S.venueObjects.length;S.venueObjects.push({id:uid(),label,w,h,x:220+i*28,y:170+i*22,scale:1,rotation:0});render();save();closeMobilePanel()}
function chairs(el,n){n=Math.min(n,16);let r=45;for(let i=0;i<n;i++){let a=2*Math.PI*i/n-Math.PI/2,c=document.createElement('div');c.className='chair';c.style.left=(53+Math.cos(a)*r-6.5)+'px';c.style.top=(53+Math.sin(a)*r-6.5)+'px';c.style.transform=`rotate(${a*180/Math.PI+90}deg)`;el.appendChild(c)}}
function render(){objects.innerHTML='';S.tables.forEach(t=>{let c=S.guests.filter(g=>g.tableId===t.id).length,e=document.createElement('div');e.className='obj table'+(c===t.seats?' complete':'')+(selected?.id===t.id?' selected':'');e.style.left=t.x+'px';e.style.top=t.y+'px';e.style.transform=`scale(${t.scale}) rotate(${t.rotation}deg)`;chairs(e,t.seats);let q=document.createElement('div');q.className='core';q.innerHTML=`<b>TABLE ${t.number}</b><span>${c}/${t.seats}</span>`;e.appendChild(q);interact(e,t,'table');objects.appendChild(e)});S.venueObjects.forEach(o=>{let e=document.createElement('div');e.className='obj vobj'+(selected?.id===o.id?' selected':'');e.style.left=o.x+'px';e.style.top=o.y+'px';e.style.width=o.w+'px';e.style.height=o.h+'px';e.style.transform=`scale(${o.scale}) rotate(${o.rotation}deg)`;e.textContent=o.label;interact(e,o,'object');objects.appendChild(e)});empty.style.display=(S.venue||S.tables.length||S.venueObjects.length)?'none':'grid';applyView();renderContext();statusUpdate()}
function interact(el,item,kind){let sx,sy,ox,oy,drag=false;el.onpointerdown=e=>{e.stopPropagation();selected={id:item.id,kind};renderContext();document.querySelectorAll('.obj').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');sx=e.clientX;sy=e.clientY;ox=item.x;oy=item.y;drag=true;trash.style.display='flex';try{el.setPointerCapture(e.pointerId)}catch(_){}};el.onpointermove=e=>{if(!drag)return;item.x=ox+(e.clientX-sx)/S.view.scale;item.y=oy+(e.clientY-sy)/S.view.scale;el.style.left=item.x+'px';el.style.top=item.y+'px';let r=trash.getBoundingClientRect();trash.classList.toggle('hot',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)};el.onpointerup=()=>{if(!drag)return;drag=false;let hot=trash.classList.contains('hot');trash.style.display='none';trash.classList.remove('hot');if(hot){checkpoint();if(kind==='table'){S.guests.forEach(g=>{if(g.tableId===item.id)g.tableId=null});S.tables=S.tables.filter(x=>x.id!==item.id)}else S.venueObjects=S.venueObjects.filter(x=>x.id!==item.id);selected=null;render();save();return}save()};el.onpointercancel=()=>{drag=false;trash.style.display='none';trash.classList.remove('hot')}}
function renderContext(){if(!selected){context.style.display='none';return}let item=selected.kind==='table'?S.tables.find(x=>x.id===selected.id):S.venueObjects.find(x=>x.id===selected.id);if(!item){selected=null;context.style.display='none';return}if(selected.kind==='table'){let c=S.guests.filter(g=>g.tableId===item.id).length;context.innerHTML=`<b>Table</b><input id="ctxNum" type="number" min="1" value="${item.number}"><select id="ctxSeats">${[8,10,12,16].map(n=>`<option ${n===item.seats?'selected':''}>${n}</option>`).join('')}</select><span style="font-size:11px;color:#777">${c}/${item.seats}</span><button class="sec" onclick="applyTable()">✓</button><button class="sec" onclick="scaleSel(.9)">−</button><button class="sec" onclick="scaleSel(1.1)">＋</button><button class="sec" onclick="rotateSel()">↻</button>`}else context.innerHTML=`<b>${item.label}</b><button class="sec" onclick="scaleSel(.9)">−</button><button class="sec" onclick="scaleSel(1.1)">＋</button><button class="sec" onclick="rotateSel()">↻</button>`;context.style.display='flex'}
function applyTable(){let t=S.tables.find(x=>x.id===selected.id);if(!t)return;let ns=+ctxSeats.value,c=S.guests.filter(g=>g.tableId===t.id).length;if(ns<c)return toast('This table already has '+c+' guests');checkpoint();t.number=Math.max(1,+ctxNum.value||1);t.seats=ns;render();save()}function scaleSel(m){let a=selected.kind==='table'?S.tables:S.venueObjects,o=a.find(x=>x.id===selected.id);if(!o)return;checkpoint();o.scale=Math.max(.5,Math.min(2.2,o.scale*m));render();save()}function rotateSel(){let a=selected.kind==='table'?S.tables:S.venueObjects,o=a.find(x=>x.id===selected.id);if(!o)return;checkpoint();o.rotation=(o.rotation+15)%360;render();save()}
canvas.onpointerdown=e=>{
 if(window.innerWidth<=800)closePanel();
 if(e.target===canvas||e.target===stage||e.target===objects){
  selected=null;
  renderContext();
  document.querySelectorAll('.obj').forEach(x=>x.classList.remove('selected'));
 }
}
function applyView(){stage.style.transform=`translate(${S.view.x}px,${S.view.y}px) scale(${S.view.scale})`}function fitView(){S.view={scale:1,x:0,y:0};applyView();save()}function zoomCenter(m){let r=canvas.getBoundingClientRect();zoomAround(r.left+r.width/2,r.top+r.height/2,S.view.scale*m)}function zoomAround(cx,cy,z){let r=canvas.getBoundingClientRect(),x=cx-r.left,y=cy-r.top,wx=(x-S.view.x)/S.view.scale,wy=(y-S.view.y)/S.view.scale;S.view.scale=Math.max(.4,Math.min(3,z));S.view.x=x-wx*S.view.scale;S.view.y=y-wy*S.view.scale;applyView();save()}canvas.addEventListener('wheel',e=>{if(e.target.closest('.obj'))return;e.preventDefault();zoomAround(e.clientX,e.clientY,S.view.scale*(e.deltaY<0?1.08:.92))},{passive:false});
let P=new Map(),G=null;canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.obj'))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});if(P.size===2){let p=[...P.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2,r=canvas.getBoundingClientRect(),lx=cx-r.left,ly=cy-r.top;G={d,s:S.view.scale,wx:(lx-S.view.x)/S.view.scale,wy:(ly-S.view.y)/S.view.scale}}});canvas.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});if(P.size===2&&G){let p=[...P.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2,r=canvas.getBoundingClientRect(),lx=cx-r.left,ly=cy-r.top;S.view.scale=Math.max(.4,Math.min(3,G.s*d/G.d));S.view.x=lx-G.wx*S.view.scale;S.view.y=ly-G.wy*S.view.scale;applyView()}});function pend(e){P.delete(e.pointerId);if(P.size<2){G=null;save()}}canvas.addEventListener('pointerup',pend);canvas.addEventListener('pointercancel',pend);
function tableOpts(){return '<option value="">Unassigned</option>'+S.tables.slice().sort((a,b)=>a.number-b.number).map(t=>`<option value="${t.id}">Table ${t.number}</option>`).join('')}function hasSeat(id,exclude){let t=S.tables.find(x=>x.id===id);return t&&S.guests.filter(g=>g.tableId===id&&g.id!==exclude).length<t.seats}function manualGuest(){let n=manualName.value.trim(),id=manualTable.value||null;if(!n)return;if(id&&!hasSeat(id))return toast('Table is full');checkpoint();S.guests.push({id:uid(),name:n,tableId:id});render();save();if(window.innerWidth<=800)closePanel();else guestsPanel()}function editGuest(id){let g=S.guests.find(x=>x.id===id),n=prompt('Guest name',g.name);if(n===null)return;n=n.trim();if(!n)return;let cur=g.tableId?(S.tables.find(t=>t.id===g.tableId)?.number||''):'';let x=prompt('Table number (empty = unassigned)',cur);if(x===null)return;let tid=null;if(x.trim()){let t=S.tables.find(t=>String(t.number)===x.trim());if(!t)return toast('Table not found');if(!hasSeat(t.id,g.id))return toast('Table is full');tid=t.id}checkpoint();g.name=n;g.tableId=tid;render();save();guestsPanel()}function delGuest(id){checkpoint();S.guests=S.guests.filter(x=>x.id!==id);render();save();guestsPanel()}
function toggleMic(){if(rec){rec.stop();return}let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice recognition is not supported here. Use Type instead.');rec=new SR();rec.lang='el-GR';rec.continuous=true;rec.interimResults=false;micBtn.textContent='■ Stop listening';rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)voiceParse(e.results[i][0].transcript)};rec.onerror=()=>toast('Try speaking a little slower.');rec.onend=()=>{rec=null;if($('micBtn'))micBtn.textContent='🎙 Speak guests'};rec.start()}function voiceParse(text){text.split(/[,.؛;]+/).map(x=>x.trim()).filter(Boolean).forEach(p=>{let m=p.match(/(.+?)\s+(?:τραπέζι|τραπεζι|table)\s*(\d+)/i);voice.push(m?{name:m[1].trim(),table:+m[2]}:{name:p,table:null})});voiceRender()}function voiceRender(){voiceBox.style.display='block';voiceBox.innerHTML=voice.map(v=>`<div class="voiceRow">${esc(v.name)} → ${v.table?'Table '+v.table:'Unassigned'}</div>`).join('')+`<button style="width:100%;margin-top:8px" onclick="voiceConfirm()">Add ${voice.length} guests</button>`}function voiceConfirm(){if(!voice.length)return;checkpoint();voice.forEach(v=>{let tid=null;if(v.table){let t=S.tables.find(x=>x.number===v.table);if(t&&hasSeat(t.id))tid=t.id}S.guests.push({id:uid(),name:v.name,tableId:tid})});voice=[];render();save();guestsPanel();toast('Guests added')}
function statusUpdate(){let seated=S.guests.filter(g=>g.tableId).length,full=S.tables.filter(t=>S.guests.filter(g=>g.tableId===t.id).length===t.seats).length;status.textContent=`${S.tables.length} tables · ${seated}/${S.guests.length} seated · ${full} complete`}function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1700)}function esc(s){let d=document.createElement('div');d.textContent=s||'';return d.innerHTML}load();
</script>
</body></html>
